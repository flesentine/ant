name: H5 estimator-policy final validation
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate exact frozen estimator state
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_parameter_estimation_v1.json)" = "1322c259153d12877a7b78190cb9e2603acb8882"
          test "$(git hash-object hypotheses/h5_origin_referenced_search_v1.draft.json)" = "c4f729f04cc737d7a2fa68f1a1e4059ca336da3e"
          test "$(git hash-object reports/h5_estimator_policy_audit_v1.json)" = "abfea92095fd2d29d6966cac3cbcf9d18f187c13"
          test "$(git hash-object reference/poissonnier2026_open_arena_measurement_policy_v1.json)" = "fd2718cf9351b655340eacd868adc536301a83a4"
          test "$(git hash-object reference/poissonnier2026_open_arena_measurement_geometry_v1.json)" = "af0ec6fbacf83b915dd78cb3a822609c126dc1e7"
          test "$(git hash-object reference/poissonnier2026_h2_estimation_targets.json)" = "07e2b8cf2dddbfcb152f0bd6d3031d473e0901b3"
          test "$(git hash-object reports/h2_parameter_estimation_500x60_v1.json)" = "342f7a5af7c1ed71a8bdb7ff14becf38d24daa88"
          test "$(git hash-object reports/h3_parameter_estimation_500x60_v1.json)" = "1d5c1b88ca9b425e927d761bc3ff1e5bad5bd5f3"
          test "$(git hash-object reports/h4_parameter_estimation_500x60_v1.json)" = "8619b96bb3a02e78b905320ac96585bec08b2918"
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('hypotheses/h5_parameter_estimation_v1.json','utf8'));
          const d=JSON.parse(fs.readFileSync('hypotheses/h5_origin_referenced_search_v1.draft.json','utf8'));
          const a=JSON.parse(fs.readFileSync('reports/h5_estimator_policy_audit_v1.json','utf8'));
          if(p.status!=='development_estimation_policy_frozen_before_persistent_H5_runtime_implementation_or_parameter_search') throw new Error('policy status drift');
          if(d.firewall.H5_estimator_policy_frozen!==true||d.firewall.H5_estimator_policy_still_unfrozen!==false) throw new Error('draft estimator freeze mismatch');
          if(d.firewall.H5_reference_parameter_search_allowed!==false||d.firewall.parameter_search_allowed!==false) throw new Error('search unexpectedly allowed');
          if(d.current_stage.estimator_policy!=='fully_frozen'||d.current_stage.persistent_H5_runtime!=='absent'||d.current_stage.synthetic_estimator_qualification!=='pending') throw new Error('stage mismatch');
          if(a.firewall.estimator_policy_frozen!==true||a.firewall.reference_parameter_search_allowed!==false) throw new Error('audit firewall mismatch');
          const b=p.search_protocol.high_resolution_budget;
          if(b.H5_null_candidates_per_fold!==500||b.H5_common_candidates_per_fold_total!==500||b.H5_history_candidates_per_fold_total!==500||b.training_trials_per_condition_per_candidate!==60||b.heldout_evaluation_trials_per_condition!==120||b.folds!==6) throw new Error('budget drift');
          if(p.search_protocol.root_seed!==990000) throw new Error('seed drift');
          if(p.cross_validation.primary_history_modulation_guard.indexOf('5 of 6')<0||p.cross_validation.exact_null_guard.indexOf('5 of 6')<0) throw new Error('own promotion guards drift');
          for(const k of ['H2_guard','H3_guard','H4_guard']) if(p.comparator_policy[k].indexOf('4 of 6')<0) throw new Error('cross-family guard drift '+k);
          if(p.nested_scientific_models.H5_common_search.H5_effect!=='alpha_search_200=alpha_search_1000=alpha_common') throw new Error('common submodel drift');
          if(p.nested_scientific_models.H5_null.H5_effect!=='alpha_search_200=alpha_search_1000=0') throw new Error('null drift');
          if(p.synthetic_estimator_qualification.required_after_runtime_implementation_before_any_reference_parameter_search!==true) throw new Error('qualification requirement missing');
          if(p.authorization_after_freeze.reference_parameter_search!=='still forbidden until persistent runtime and estimator pass the required synthetic qualification') throw new Error('authorization drift');
          const hp=p.estimated_parameters.baseline_turn_concentration;
          if(JSON.stringify(hp.bounds)!=='[0,20]'||hp.numerical_rule.indexOf('0.027434842249657063')<0) throw new Error('kappa safety drift');
          console.log(JSON.stringify({status:'passed',budget:b,current_stage:d.current_stage}));
          NODE
          if grep -R -n -E 'biology_h5_search|alpha_search_200|alpha_search_1000|kappa_search|search_kappa' src models experiments states apparatus scoring observations; then
            echo 'Persistent H5 runtime unexpectedly present before implementation stage' >&2
            exit 1
          fi

      - name: Deterministic search-mapping audit
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('hypotheses/h5_parameter_estimation_v1.json','utf8'));
          const halton=(index,base)=>{let f=1,r=0,i=index;while(i>0){f/=base;r+=f*(i%base);i=Math.floor(i/base);}return r;};
          const logmap=(u,lo,hi)=>Math.exp(Math.log(lo)+u*(Math.log(hi)-Math.log(lo));
          const linear=(u,lo,hi)=>lo+u*(hi-lo);
          const nulls=[],commons=[],hist=[];
          for(let i=1;i<=500;i++){
            const n={i,ell0:logmap(halton(i,2),5,150),kappa:linear(halton(i,3),0,20),q:halton(i,5)};nulls.push(n);
            if(i<=499)commons.push({...n,alpha_common:halton(i,7)});
            if(i<=498){const u7=halton(i,7),u11=halton(i,11);hist.push({...n,alpha200:Math.max(u7,u11),alpha1000:Math.min(u7,u11)});}
          }
          const minK=Math.min(...nulls.map(x=>x.kappa)),maxK=Math.max(...nulls.map(x=>x.kappa));
          if(Math.abs(minK-0.027434842249657063)>1e-15||Math.abs(maxK-19.945130315500684)>1e-15) throw new Error('kappa support mismatch');
          if(hist.some(x=>x.alpha1000>x.alpha200||x.alpha1000<0||x.alpha200>1)) throw new Error('alpha monotonicity failed');
          for(let i=0;i<498;i++)for(const k of ['ell0','kappa','q'])if(hist[i][k]!==commons[i][k]||hist[i][k]!==nulls[i][k])throw new Error('nuisance pairing failed');
          const selectedNull={ell0:22,kappa:2,q:.4};
          const nullAnchor={...selectedNull,alpha_common:0,alpha200:0,alpha1000:0};
          const selectedCommon={ell0:24,kappa:3,q:.5,alpha_common:.35};
          const commonAnchor={ell0:selectedCommon.ell0,kappa:selectedCommon.kappa,q:selectedCommon.q,alpha200:selectedCommon.alpha_common,alpha1000:selectedCommon.alpha_common};
          if(commonAnchor.alpha200!==commonAnchor.alpha1000)throw new Error('common anchor not equal');
          const out={status:'passed',candidate_counts:{null_halton:nulls.length,common_halton:commons.length,history_halton:hist.length,total_with_anchors:{null:500,common:500,history:500}},kappa:{min:minK,max:maxK},anchors:{nullAnchor,commonAnchor}};
          fs.writeFileSync('/tmp/h5-estimator-policy-node.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE

      - name: Y-maze-free regression gate
        run: |
          set -euo pipefail
          for f in tests/boundary-timing.test.js tests/determinism.test.js tests/experiment-definition.test.js tests/h3-reorientation.test.js tests/integrity-firewall.test.js tests/measurement-geometry-policy.test.js tests/measurement.test.js tests/open-arena-protocol.test.js tests/rng-streams.test.js tests/state-integrity.test.js; do node "$f"; done

      - name: Start Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..100}; do if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then exit 0; fi; sleep .2; done
          cat /tmp/chrome.log || true
          exit 1

      - name: Chromium estimator-policy contract replay
        run: |
          set -euo pipefail
          cat >/tmp/h5-estimator-policy-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0],ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!AntLabIntegrity&&!!AntLabCore"))break;await sleep(100);}
          const report=await evalv(`(async()=>{
            const j=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json();},clone=x=>JSON.parse(JSON.stringify(x));
            const policy=await j('./hypotheses/h5_parameter_estimation_v1.json'),draft=await j('./hypotheses/h5_origin_referenced_search_v1.draft.json'),audit=await j('./reports/h5_estimator_policy_audit_v1.json');
            if(policy.status!=='development_estimation_policy_frozen_before_persistent_H5_runtime_implementation_or_parameter_search'||draft.current_stage.estimator_policy!=='fully_frozen'||audit.firewall.reference_parameter_search_allowed!==false)throw new Error('browser policy state mismatch');
            const halton=(index,base)=>{let f=1,r=0,i=index;while(i>0){f/=base;r+=f*(i%base);i=Math.floor(i/base);}return r;};
            let minK=Infinity,maxK=-Infinity,mono=true;
            for(let i=1;i<=500;i++){const k=halton(i,3)*20;minK=Math.min(minK,k);maxK=Math.max(maxK,k);if(i<=498){const a=halton(i,7),b=halton(i,11);if(Math.min(a,b)>Math.max(a,b))mono=false;}}
            if(Math.abs(minK-0.027434842249657063)>1e-15||Math.abs(maxK-19.945130315500684)>1e-15||!mono)throw new Error('browser Halton mapping mismatch');
            const geometry=await j('./reference/poissonnier2026_open_arena_measurement_geometry_v1.json'),mp=await j('./reference/poissonnier2026_open_arena_measurement_policy_v1.json');
            const h2=await j('./reports/h2_parameter_estimation_500x60_v1.json'),h3=await j('./reports/h3_parameter_estimation_500x60_v1.json'),h4=await j('./reports/h4_parameter_estimation_500x60_v1.json');
            if(h2.folds.length!==6||h3.folds.length!==6||h4.folds.length!==6)throw new Error('browser comparator fold count mismatch');
            for(const f of h2.folds)if(!f.H2)throw new Error('missing H2 candidate');
            for(const f of h3.folds)if(!f.H3_context)throw new Error('missing H3 candidate');
            for(const f of h4.folds)if(!f.H4_context?.fit?.candidate)throw new Error('missing H4 candidate');
            const app0=await j('./apparatus/poissonnier2026_open_arena.json'),short0=await j('./experiments/open_arena_short_control.json'),long0=await j('./experiments/open_arena_long_control.json'),model0=await j('./models/lasius_niger_locomotion_h3_v1.json'),state=await j('./states/naive_outbound_v1.json'),obs0=await j('./observations/poissonnier2026_tracking_25fps.json'),scoring=await j('./scoring/open_arena_first_border_v1.json');
            model0.reorientation_gate.effect.max_hazard_reduction_fraction=0;
            const colonies=[0,7,16,20,21,27],folds={};let pairs=0,mismatches=0;
            const apply=(exp0,row)=>{const exp=clone(exp0),app=clone(app0),obs=clone(obs0),model=clone(model0);exp.model=model.id;app.world.width=row.arena_width_mm;app.world.height=row.arena_height_mm;const rect=app.geometry.primitives.find(p=>p.type==='rect');rect.width=row.arena_width_mm;rect.height=row.arena_height_mm;app.entry_points.default={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};app.entry_points.center={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};exp.protocol.entry_state.position_jitter_mm=0;obs.metric_definitions.central_zone_fraction.center_y_mm=row.entry_reference_y_mm;obs.metric_definitions.central_zone_fraction.half_width_mm=10;return{experiment:exp,model,apparatus:app,state:clone(state),observation:obs,scoring:clone(scoring)};};
            const sig=(sum,sim)=>JSON.stringify({o:sum.observed_metrics.ants[0],events:sim.events.filter(e=>e.type==='h3_reorientation').map(e=>[e.time,e.angle_rad,e.x,e.y])});
            for(let fi=0;fi<colonies.length;fi++){const held=colonies[fi],pool=geometry.rows.filter(r=>r.colony!==held).sort((a,b)=>a.ant_id-b.ant_id);if(pool.some(r=>r.colony===held))throw new Error('heldout geometry leak');let fp=0;
              for(let q=0;q<2;q++){const seed=990000+fi*10000+q,gr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,mp.geometry_sampler.rng_stream_name)),row=pool[Math.min(pool.length-1,Math.floor(gr.next()*pool.length))];const bs=apply(short0,row),bl=apply(long0,row),ss=new AntLabIntegrity.Simulation(bs,seed),sl=new AntLabIntegrity.Simulation(bl,seed),a=ss.runUntilComplete(bs.experiment.duration_s,AntLabIntegrity.FIXED_DT),b=sl.runUntilComplete(bl.experiment.duration_s,AntLabIntegrity.FIXED_DT);pairs++;fp++;if(sig(a,ss)!==sig(b,sl))mismatches++;}
              folds[held]={pool_n:pool.length,pairs:fp};
            }
            if(mismatches)throw new Error('H3-null short/long neutrality mismatch');
            return{status:'passed',kappa_support:{min:minK,max:maxK},comparator_folds:{H2:h2.folds.length,H3:h3.folds.length,H4:h4.folds.length},pairs,neutrality_mismatches:mismatches,folds};
          })()`);
          const forbidden=requests.filter(u=>/neutral_y_maze|\/y_maze|\/y-maze/i.test(u));
          if(exceptions.length||consoleErrors.length||forbidden.length)throw new Error('browser firewall failure');
          report.browser={exceptions:0,console_errors:0,ymaze_requests:0};
          fs.writeFileSync('/tmp/h5-estimator-policy-browser.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/h5-estimator-policy-browser.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: h5-estimator-policy-final-validation
          path: |
            /tmp/h5-estimator-policy-node.json
            /tmp/h5-estimator-policy-browser.json
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
