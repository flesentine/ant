name: P2 v0.3.3j mechanism-selection audit
on:
  push:
    branches: [v0.3.3j-p2-mechanism-selection-freeze]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact P2 selection chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p2_painted_trail_mechanism_v1.json)" = "70f51e5cab5db0024947ed71cf760590089f8aea"
          test "$(git hash-object hypotheses/p2_painted_trail_candidate_class_evidence_v1.json)" = "f7eb9fe38f8955c0227501e2d257ff32a40eaf74"
          test "$(git hash-object hypotheses/p1_response_estimation_result_freeze_v1.json)" = "1d99ebfaa378aeb1b98963f63b3a513a616a6617"
          test "$(git hash-object reports/p1_response_estimation_500x60_v1.json)" = "561aca4a14346ebb4f062f30d0438d3115784172"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test "$(git hash-object models/lasius_niger_painted_trail_p1_v1.json)" = "73873fd6763838423ca27648136bb0b9ff062817"
          test ! -e src/p2.js
          test ! -e models/lasius_niger_painted_trail_p2_v1.json
          test ! -e tools/run-p2-estimation.js
          test ! -e hypotheses/p2_response_estimation_v1.json
          test ! -e hypotheses/p2_highres_authorization_v1.json
      - name: Run full H0-H5 plus P1 suite
        run: ./tests/run-tests.sh
      - name: Pure specification sanity check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p2-v033j-audit
          node - <<'NODE'
          const fs=require('fs'),core=require('./src/sim-core.js');
          const m=JSON.parse(fs.readFileSync('hypotheses/p2_painted_trail_mechanism_v1.json','utf8'));
          function hash32(x){
            x|=0;
            x=(x+0x9e3779b9)|0;
            x=Math.imul(x^(x>>>16),0x21f0aaad);
            x=Math.imul(x^(x>>>15),0x735a2d97);
            return (x^(x>>>15))>>>0;
          }
          function responseSeed(worldSeed,antId){
            return hash32((worldSeed>>>0)^Math.imul(antId+1,0x27d4eb2d)^0x6c8e9cf5)>>>0||1;
          }
          const s0=responseSeed(12345,0),s1=responseSeed(12345,1);
          if(!s0||!s1||s0===s1)throw new Error('response seed namespace collision in sanity panel');
          const u0=new core.RNG(s0).next(),u1=new core.RNG(s1).next();
          if(!(u0>=0&&u0<1&&u1>=0&&u1<1))throw new Error('response RNG uniform invalid');
          const engaged=(u,p)=>u>=p;
          if(engaged(u0,0)!==true||engaged(u0,1)!==false)throw new Error('p_lapse endpoint semantics invalid');
          const T=c=>Math.max(0,c)/(1+Math.max(0,c));
          const omega=(E,k,lc,rc)=>Number(E)*k*(T(rc)-T(lc));
          if(omega(false,4,0.2,0.8)!==0)throw new Error('lapse gate must zero steering');
          if(Math.abs(omega(true,4,0.5,0.5))>1e-15)throw new Error('equal bilateral response must yield zero steering');
          if(!(omega(true,4,0.2,0.8)>0))throw new Error('right>left must yield positive steering');
          if(!(omega(true,4,0.8,0.2)<0))throw new Error('left>right must yield negative steering');
          const out={
            status:'passed',
            mechanism:m.mechanism.mechanism_id,
            selected:m.selected_candidate_class.class_id,
            response_seed_ant0:s0,
            response_seed_ant1:s1,
            response_u_ant0:u0,
            response_u_ant1:u1,
            p_lapse_engineering_anchor:m.engineering_only_reachability_values.p_lapse,
            new_simulation:false,
            p2_runtime_exists:false,
            response_target_access:false,
            ymaze_access:false
          };
          fs.writeFileSync('/tmp/p2-v033j-audit/specification.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          NODE
      - name: Real Chromium selection/firewall check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/p2-v033j-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/p2-v033j-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p2-v033j-chrome --remote-debugging-port=9222 about:blank >/tmp/p2-v033j-chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep .2; done
          cat >/tmp/p2-v033j-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabIntegrity"))break;await new Promise(r=>setTimeout(r,50));}
          const state=await evalv("(async()=>{const m=await (await fetch('./hypotheses/p2_painted_trail_mechanism_v1.json')).json();const e=await (await fetch('./hypotheses/p2_painted_trail_candidate_class_evidence_v1.json')).json();return{id:m.id,status:m.status,selected:m.selected_candidate_class.class_id,b:m.selected_candidate_class.candidate_B_status,p:m.engineering_only_reachability_values.p_lapse,impl:m.implementation_gate.implementation_authorized_by_this_record,newSim:m.implementation_gate.new_simulation_executed_at_this_freeze,target:m.estimation_firewall.raw_response_target_access_authorized,ymaze:m.global_firewall.Y_maze_access,evidenceSelection:e.selection_firewall.candidate_class_selected};})()");
          if(state.id!=='P2_painted_trail_mechanism_v1'||state.status!=='prospective_mechanism_selected_and_frozen_before_implementation_or_new_simulation')throw new Error('browser P2 mechanism record drift');
          if(state.selected!=='P2_candidate_A_transient_response_engagement'||state.b!=='not_selected_retained_for_future_independent_hypothesis_only'||state.p!==0.2)throw new Error('browser P2 selection drift');
          if(state.impl!==false||state.newSim!==false||state.target!==false||state.ymaze!==false)throw new Error('browser P2 selection firewall drift');
          const targetReq=requests.filter(u=>u.includes('poissonnier2026_pheromone_response_targets.json'));
          const yreq=requests.filter(u=>/y[_-]?maze/i.test(u));
          const p2ExecReq=requests.filter(u=>/\/(?:src\/p2\.js|tools\/run-p2-estimation\.js|models\/lasius_niger_painted_trail_p2_v1\.json|hypotheses\/p2_(?:response_estimation|highres_authorization)_v1\.json)/.test(u));
          if(exceptions.length||consoleErrors.length||targetReq.length||yreq.length||p2ExecReq.length)throw new Error('browser firewall failure');
          const out={status:'passed',exceptions:0,console_errors:0,response_target_requests:0,ymaze_requests:0,p2_executable_surface_requests:0,selected:state.selected,candidate_B_selected:false,p_lapse_engineering_anchor:state.p,implementation_authorized:false,new_simulation:false};
          fs.writeFileSync('/tmp/p2-v033j-audit/browser.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));ws.close();
          NODE
          node /tmp/p2-v033j-browser.mjs
      - name: Upload P2 mechanism-selection audit
        uses: actions/upload-artifact@v4
        with:
          name: p2-v033j-mechanism-selection-audit
          path: /tmp/p2-v033j-audit
          retention-days: 30
