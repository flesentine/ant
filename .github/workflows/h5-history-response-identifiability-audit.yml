name: H5 history-response final validation
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact frozen history decision
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_origin_referenced_search_v1.draft.json)" = "8d42fb0323114d55e98d808913cc0b3ad1fd6614"
          test "$(git hash-object reports/h5_history_response_choice_audit_v1.json)" = "37d5e0a28f2ed75cc45297ca19d0ed66db45cad6"
          test "$(git hash-object reports/h5_radial_gate_choice_audit_v1.json)" = "66f0d0204979a17ade267b41c387ed872679115a"
          test "$(git hash-object reports/h5_effect_scope_choice_audit_v1.json)" = "d56f1ab242125773905b922e0686e0cceb22bb7e"
          test "$(git hash-object reports/h5_temporal_drive_choice_audit_v1.json)" = "0ec424889ee4c9745af30f70cca7c8b7152bb490"
          test "$(git hash-object reports/h5_biological_origin_choice_audit_v1.json)" = "2378fa54ad4174141f213ed44be3c283706975de"
          node <<'NODE'
          const fs=require('fs'),d=JSON.parse(fs.readFileSync('hypotheses/h5_origin_referenced_search_v1.draft.json','utf8')),r=JSON.parse(fs.readFileSync('reports/h5_history_response_choice_audit_v1.json','utf8'));
          if(d.firewall.mechanism_not_frozen!==true||d.firewall.parameter_search_allowed!==false)throw new Error('freeze/search firewall');
          if(d.history_response_decision.selected_representation!=='observed_level_effective_search_amplitudes')throw new Error('history representation');
          if(JSON.stringify(d.history_response_decision.supported_recent_constrained_travel_mm)!=='[200,1000]')throw new Error('history support');
          if(d.firewall.H5_history_response_frozen_to_observed_level_effective_amplitudes!==true)throw new Error('history freeze');
          if(d.firewall.H5_lambda_search_parameter_forbidden!==true||d.firewall.H5_separate_rho_search_parameter_forbidden!==true)throw new Error('raw history parameter firewall');
          if(d.firewall.H5_unsupported_history_interpolation_or_extrapolation_forbidden!==true)throw new Error('domain firewall');
          if(d.firewall.H5_common_origin_search_alone_not_sufficient_for_history_modulation_claim!==true)throw new Error('common-search claim firewall');
          if(r.nested_scientific_submodels.future_estimator_requirement.indexOf('common-search comparator')<0)throw new Error('future comparator requirement missing');
          if(d.biological_origin_decision.selected_origin!=='central_physical_entry_reference'||d.temporal_drive_decision.selected_profile!=='constant_over_observed_arena_traversal'||d.effect_scope_decision.selected_scope!=='conditional_reorientation_direction_only'||d.radial_gate_decision.selected_gate!=='boundary_normalized_linear')throw new Error('prior freeze drift');
          if(d.firewall.ymaze_access!==false||r.firewall.ymaze_access!==false)throw new Error('Y-maze firewall');
          if(!d.pre_freeze_questions.some(q=>q.includes('search-direction component')))throw new Error('remaining concentration question not explicit');
          NODE
          if grep -R -n -E 'h5Diag|biology_h5_search|alpha_search_200|alpha_search_1000|lambda_search_mm|rho_search|history_retention' src models experiments states apparatus scoring observations; then
            echo 'Persistent H5 runtime unexpectedly present' >&2
            exit 1
          fi
      - name: Y-maze-free regression gate
        run: |
          set -euo pipefail
          for f in tests/boundary-timing.test.js tests/determinism.test.js tests/experiment-definition.test.js tests/h3-reorientation.test.js tests/integrity-firewall.test.js tests/measurement-geometry-policy.test.js tests/measurement.test.js tests/open-arena-protocol.test.js tests/rng-streams.test.js tests/state-integrity.test.js; do node "$f"; done
      - name: Start Chromium
        run: |
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..100}; do if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then exit 0; fi; sleep .2; done
          cat /tmp/chrome.log; exit 1
      - name: Chromium history-domain and clean baseline validation
        run: |
          cat >/tmp/h5-history-final.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms)),tabs=await(await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0],ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));}),evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!AntLabIntegrity&&!!AntLabCore"))break;await sleep(100);}
          const report=await evalv(`(async()=>{
            const alpha=(L,a200,a1000)=>{if(L===200)return a200;if(L===1000)return a1000;throw new Error('unsupported H5-v1 history '+L);};
            const checks={L200:alpha(200,.6,.3),L1000:alpha(1000,.6,.3),null200:alpha(200,0,0),null1000:alpha(1000,0,0),monotone_ok:.3<=.6};let unsupported=false;try{alpha(600,.6,.3);}catch(e){unsupported=true;}if(!unsupported)throw new Error('unsupported history accepted');
            const j=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json();},clone=x=>JSON.parse(JSON.stringify(x));
            const geometry=await j('./reference/poissonnier2026_open_arena_measurement_geometry_v1.json'),policy=await j('./reference/poissonnier2026_open_arena_measurement_policy_v1.json'),app0=await j('./apparatus/poissonnier2026_open_arena.json'),expS=await j('./experiments/open_arena_short_control.json'),expL=await j('./experiments/open_arena_long_control.json'),model0=await j('./models/lasius_niger_locomotion_h3_v1.json'),state=await j('./states/naive_outbound_v1.json'),obs0=await j('./observations/poissonnier2026_tracking_25fps.json'),scoring=await j('./scoring/open_arena_first_border_v1.json');model0.reorientation_gate.effect.max_hazard_reduction_fraction=0;
            const colonies=[0,7,16,20,21,27],folds={};let sims=0;
            for(let fi=0;fi<colonies.length;fi++){const held=colonies[fi],pool=geometry.rows.filter(r=>r.colony!==held).sort((a,b)=>a.ant_id-b.ant_id);for(let i=0;i<2;i++){const seed=990000+fi*10000+i,rr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,policy.geometry_sampler.rng_stream_name)),row=pool[Math.min(pool.length-1,Math.floor(rr.next()*pool.length))];for(const exp0 of [expS,expL]){const exp=clone(exp0),app=clone(app0),obs=clone(obs0),model=clone(model0);const L=exp.protocol.state_facts.recent_constrained_travel_mm;alpha(L,.6,.3);exp.model=model.id;app.world.width=row.arena_width_mm;app.world.height=row.arena_height_mm;const rect=app.geometry.primitives.find(p=>p.type==='rect');rect.width=row.arena_width_mm;rect.height=row.arena_height_mm;app.entry_points.default={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};app.entry_points.center={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};exp.protocol.entry_state.position_jitter_mm=0;obs.metric_definitions.central_zone_fraction.center_y_mm=row.entry_reference_y_mm;obs.metric_definitions.central_zone_fraction.half_width_mm=10;const sim=new AntLabIntegrity.Simulation({experiment:exp,model,apparatus:app,state,observation:obs,scoring},seed);sim.runUntilComplete(exp.duration_s,AntLabIntegrity.FIXED_DT);sims++;}}folds[held]={pool_n:pool.length,simulations:4};}
            return{status:'passed',history_checks:checks,unsupported_L600_rejected:unsupported,clean_baseline_simulations:sims,folds};
          })()`);
          const forbidden=requests.filter(u=>/neutral_y_maze|\/y_maze|\/y-maze/i.test(u));if(exceptions.length||consoleErrors.length||forbidden.length)throw new Error('browser firewall failure');report.browser={exceptions:0,console_errors:0,ymaze_requests:0};fs.writeFileSync('/tmp/h5-history-final.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/h5-history-final.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: h5-history-response-final-validation
          path: |
            /tmp/h5-history-final.json
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
