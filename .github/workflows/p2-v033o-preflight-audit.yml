name: P2 v0.3.3o execution-gate preflight audit
on:
  push:
    branches: [v0.3.3o-p2-official-highres-execution]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact one-shot execution-gate chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/p2-v033o-official-highres.yml)" = "467aa7fc56bd7e843a68ad03e7d57c4a174efc2f"
          test "$(git hash-object hypotheses/p2_highres_execution_precondition_v1.json)" = "a0bf279649df4be906f74dc96b53f6c2106071bf"
          test "$(git hash-object hypotheses/p2_highres_authorization_v1.json)" = "de361b15b9600bd92a35baf30fa71c2a7c61003c"
          test "$(git hash-object hypotheses/p2_response_estimation_v1.json)" = "eaa74df19f3fdc1a59dec5f0b3b2efefba3f89ce"
          test "$(git hash-object tools/run-p2-estimation.js)" = "38d66d28e94d2f532e9c8a20bd6553d6d11be8a6"
          test "$(git hash-object reports/p2_estimator_qualification_v1.json)" = "9f4d15875b35773b41696987abd1cc4721435bc2"
          test "$(git hash-object hypotheses/p2_estimator_qualification_result_freeze_v1.json)" = "1d46b594cb154a93c2e321fb67d399acdd821993"
          test "$(git hash-object reference/poissonnier2026_pheromone_response_targets.json)" = "81910c5bd3ec7b1f7728c2c9f100b0e8a6db29ed"
          test ! -e reports/p2_response_estimation_1000x60_v1.json
          test ! -e reports/p2_response_estimation_execution_provenance_v1.json

          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const wf=fs.readFileSync('.github/workflows/p2-v033o-official-highres.yml','utf8');
          const p=JSON.parse(fs.readFileSync('hypotheses/p2_highres_execution_precondition_v1.json','utf8'));
          if(!/^name: P2 v0\.3\.3o official high-resolution response execution/m.test(wf))throw new Error('workflow name drift');
          if(!/on:\n  push:\n    branches: \[main\]\n    paths:\n      - '\.github\/workflows\/p2-v033o-official-highres\.yml'/.test(wf))throw new Error('workflow trigger drift');
          if(/\bpull_request\s*:/.test(wf)||/\bworkflow_dispatch\s*:/.test(wf))throw new Error('workflow must not have PR/manual trigger');
          const executionLine=wf.split('\n').filter(x=>x.trim()==='node tools/run-p2-estimation.js --mode highres --out reports/p2_response_estimation_1000x60_v1.json');
          if(executionLine.length!==1)throw new Error('official executable command must appear exactly once');
          if(p.execution_workflow_git_blob_sha!==cp.execFileSync('git',['hash-object','.github/workflows/p2-v033o-official-highres.yml'],{encoding:'utf8'}).trim())throw new Error('precondition workflow pin drift');
          if(p.authorization_main_commit!=='a2f5c3dc2a10aad30e796c3f866a382b31cc6210'||p.permanent_main_workflow.run_id!==34189072667||p.permanent_main_workflow.conclusion!=='success')throw new Error('green authorization checkpoint drift');
          if(p.official_execution_still_unrun_at_freeze!==true)throw new Error('execution precondition no longer says unrun');
          console.log(JSON.stringify({main_only:true,manual_trigger:false,pull_request_trigger:false,official_command_occurrences:executionLine.length,official_search_executed:false}));
          NODE

      - name: Run full permanent regression suite
        run: ./tests/run-tests.sh

      - name: Prove review branch cannot execute official highres
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p2-v033o-audit
          rm -f /tmp/p2-v033o-audit/review-branch-result.json
          set +e
          node tools/run-p2-estimation.js --mode highres --out /tmp/p2-v033o-audit/review-branch-result.json >/tmp/p2-v033o-review-highres.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "not effective until merged to main" /tmp/p2-v033o-review-highres.log
          test ! -e /tmp/p2-v033o-audit/review-branch-result.json
          node - <<'NODE'
          const fs=require('fs'),est=require('./tools/run-p2-estimation.js');
          const p=require('./hypotheses/p2_response_estimation_v1.json');
          let blocked=false;
          try{est.loadReferenceTarget(process.cwd(),p,{branchName:'v0.3.3o-p2-official-highres-execution'});}catch(e){blocked=/not effective until merged to main/.test(String(e));}
          if(!blocked)throw new Error('review-branch semantic target loader was not blocked');
          const out={status:'passed',review_branch_highres_rejected:true,review_branch_target_semantics_blocked:true,official_search_executed:false};
          fs.writeFileSync('/tmp/p2-v033o-audit/review-branch.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          NODE

      - name: Real Chromium execution-gate firewall check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/p2-v033o-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/p2-v033o-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p2-v033o-chrome --remote-debugging-port=9222 about:blank >/tmp/p2-v033o-chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep .2; done
          cat >/tmp/p2-v033o-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabIntegrity"))break;await new Promise(r=>setTimeout(r,50));}
          const state=await evalv("(async()=>{const p=await(await fetch('./hypotheses/p2_highres_execution_precondition_v1.json')).json();const a=await(await fetch('./hypotheses/p2_highres_authorization_v1.json')).json();const q=await(await fetch('./reports/p2_estimator_qualification_v1.json')).json();return{pid:p.id,pstatus:p.status,main:p.authorization_main_commit,run:p.permanent_main_workflow.run_id,wf:p.execution_workflow_git_blob_sha,unrun:p.official_execution_still_unrun_at_freeze,command:p.authorized_command_exact,aid:a.id,authorized:a.high_resolution_response_search_authorized,effective:a.effective_when_merged_to_main,P1:a.P1_official_result_semantic_access_authorized,candidateB:a.Candidate_B_authorized,canonical:a.canonical_promotion_authorized,ymaze:a.ymaze_access_authorized,q:q.status};})()");
          if(state.pid!=='P2_high_resolution_execution_precondition_v1'||state.pstatus!=='authorization_merged_and_permanent_main_ci_green_before_official_execution')throw new Error('browser precondition drift');
          if(state.main!=='a2f5c3dc2a10aad30e796c3f866a382b31cc6210'||state.run!==34189072667||state.wf!=='467aa7fc56bd7e843a68ad03e7d57c4a174efc2f'||state.unrun!==true)throw new Error('browser execution checkpoint drift');
          if(state.aid!=='P2_high_resolution_authorization_v1'||state.authorized!==true||state.effective!==true||state.q!=='passed')throw new Error('browser authorization/qualification drift');
          if(state.P1!==false||state.candidateB!==false||state.canonical!==false||state.ymaze!==false)throw new Error('browser firewall drift');
          const targetReq=requests.filter(u=>u.includes('poissonnier2026_pheromone_response_targets.json'));
          const yreq=requests.filter(u=>/y[_-]?maze/i.test(u));
          const p1ResultReq=requests.filter(u=>u.includes('p1_response_estimation_500x60_v1.json'));
          const officialResultReq=requests.filter(u=>u.includes('p2_response_estimation_1000x60_v1.json'));
          if(exceptions.length||consoleErrors.length||targetReq.length||yreq.length||p1ResultReq.length||officialResultReq.length)throw new Error('browser execution-gate network firewall failure');
          const out={status:'passed',exceptions:exceptions.length,console_errors:consoleErrors.length,response_target_requests:targetReq.length,ymaze_requests:yreq.length,p1_result_requests:p1ResultReq.length,official_p2_result_requests:officialResultReq.length,official_search_executed:false};
          fs.writeFileSync('/tmp/p2-v033o-audit/browser.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));ws.close();
          NODE
          node /tmp/p2-v033o-browser.mjs

      - name: Upload execution-gate preflight audit
        uses: actions/upload-artifact@v4
        with:
          name: p2-v033o-execution-gate-preflight-audit
          path: /tmp/p2-v033o-audit
          retention-days: 30
