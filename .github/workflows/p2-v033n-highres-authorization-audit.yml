name: P2 v0.3.3n highres authorization audit
on:
  push:
    branches: [v0.3.3n-p2-highres-authorization]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact P2 authorization chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p2_highres_authorization_v1.json)" = "de361b15b9600bd92a35baf30fa71c2a7c61003c"
          test "$(git hash-object hypotheses/p2_response_estimation_v1.json)" = "eaa74df19f3fdc1a59dec5f0b3b2efefba3f89ce"
          test "$(git hash-object tools/run-p2-estimation.js)" = "38d66d28e94d2f532e9c8a20bd6553d6d11be8a6"
          test "$(git hash-object reports/p2_estimator_qualification_v1.json)" = "9f4d15875b35773b41696987abd1cc4721435bc2"
          test "$(git hash-object hypotheses/p2_estimator_qualification_result_freeze_v1.json)" = "1d46b594cb154a93c2e321fb67d399acdd821993"
          test "$(git hash-object src/p2.js)" = "f91a2f7ede1b8119acc1fd57ac94a9718d074e15"
          test "$(git hash-object models/lasius_niger_painted_trail_p2_v1.json)" = "7d3eecc44cb2eaf727249083a6fcfa21986fd475"
          test "$(git hash-object reference/poissonnier2026_pheromone_response_targets.json)" = "81910c5bd3ec7b1f7728c2c9f100b0e8a6db29ed"
          test ! -e reports/p2_response_estimation_1000x60_v1.json
      - name: Run full H0-H5 plus P1/P2 suite
        run: ./tests/run-tests.sh
      - name: Re-run reference-free qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p2-v033n-audit
          node tools/run-p2-estimation.js --mode qualification --trials 2 --out /tmp/p2-v033n-audit/qualification.json
          node - <<'NODE'
          const q=require('/tmp/p2-v033n-audit/qualification.json');
          if(q.status!=='passed'||q.reference_outcomes_accessed!==false||q.response_target_semantics_loaded!==false||q.P1_official_result_semantics_loaded!==false||q.ymaze_accessed!==false)throw new Error('qualification firewall drift');
          if(Object.values(q.checks).some(v=>v!==true))throw new Error('qualification check drift');
          console.log(JSON.stringify({status:q.status,checks:Object.keys(q.checks).length,target_semantics:q.response_target_semantics_loaded,P1_result_semantics:q.P1_official_result_semantics_loaded,ymaze:q.ymaze_accessed}));
          NODE
      - name: Prove authorization review branch cannot execute highres
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/p2-v033n-audit/unauthorized-review.json
          set +e
          node tools/run-p2-estimation.js --mode highres --out /tmp/p2-v033n-audit/unauthorized-review.json >/tmp/p2-v033n-highres.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "not effective until merged to main" /tmp/p2-v033n-highres.log
          test ! -e /tmp/p2-v033n-audit/unauthorized-review.json
          node - <<'NODE'
          const fs=require('fs'),est=require('./tools/run-p2-estimation.js');
          const p=require('./hypotheses/p2_response_estimation_v1.json');
          const a=require('./hypotheses/p2_highres_authorization_v1.json');
          if(a.effective_when_merged_to_main!==true||a.high_resolution_response_search_authorized!==true)throw new Error('authorization state drift');
          let blocked=false;
          try{est.loadReferenceTarget(process.cwd(),p,{branchName:'v0.3.3n-p2-highres-authorization'});}catch(e){blocked=/not effective until merged to main/.test(String(e));}
          if(!blocked)throw new Error('review branch semantic target loader was not blocked');
          const effective=est.assertHighResolutionAuthorized(process.cwd(),null,{branchName:'main'});
          if(effective.id!=='P2_high_resolution_authorization_v1')throw new Error('main effectiveness contract drift');
          const out={status:'passed',review_branch_highres_rejected:true,review_branch_target_semantics_blocked:true,main_effectiveness_contract:true,official_search_executed:false};
          fs.writeFileSync('/tmp/p2-v033n-audit/authorization.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          NODE
      - name: Real Chromium authorization and network firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/p2-v033n-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/p2-v033n-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p2-v033n-chrome --remote-debugging-port=9222 about:blank >/tmp/p2-v033n-chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep .2; done
          cat >/tmp/p2-v033n-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabIntegrity"))break;await new Promise(r=>setTimeout(r,50));}
          const state=await evalv("(async()=>{const a=await(await fetch('./hypotheses/p2_highres_authorization_v1.json')).json();const p=await(await fetch('./hypotheses/p2_response_estimation_v1.json')).json();const q=await(await fetch('./reports/p2_estimator_qualification_v1.json')).json();return{aid:a.id,status:a.status,effective:a.effective_when_merged_to_main,authorized:a.high_resolution_response_search_authorized,policy:a.policy_git_blob_sha,estimator:a.estimator_git_blob_sha,qualification:a.qualification_report.git_blob_sha,oneShot:/exactly one official execution/i.test(a.official_execution_rule),targetScope:a.response_target_semantic_access_scope,P1:a.P1_official_result_semantic_access_authorized,candidateB:a.Candidate_B_authorized,canonical:a.canonical_promotion_authorized,ymaze:a.ymaze_access_authorized,policyStatus:p.status,qualificationStatus:q.status};})()");
          if(state.aid!=='P2_high_resolution_authorization_v1'||state.status!=='qualified_estimator_authorized_for_frozen_high_resolution_response_search'||state.effective!==true||state.authorized!==true)throw new Error('browser authorization drift');
          if(state.policy!=='eaa74df19f3fdc1a59dec5f0b3b2efefba3f89ce'||state.estimator!=='38d66d28e94d2f532e9c8a20bd6553d6d11be8a6'||state.qualification!=='9f4d15875b35773b41696987abd1cc4721435bc2'||state.oneShot!==true)throw new Error('browser authorization provenance drift');
          if(state.P1!==false||state.candidateB!==false||state.canonical!==false||state.ymaze!==false||state.qualificationStatus!=='passed')throw new Error('browser authorization firewall drift');
          const targetReq=requests.filter(u=>u.includes('poissonnier2026_pheromone_response_targets.json'));
          const yreq=requests.filter(u=>/y[_-]?maze/i.test(u));
          const p1ResultReq=requests.filter(u=>u.includes('p1_response_estimation_500x60_v1.json'));
          const officialOutputReq=requests.filter(u=>u.includes('p2_response_estimation_1000x60_v1.json'));
          if(exceptions.length||consoleErrors.length||targetReq.length||yreq.length||p1ResultReq.length||officialOutputReq.length)throw new Error('browser authorization network firewall failure');
          const out={status:'passed',exceptions:exceptions.length,console_errors:consoleErrors.length,response_target_requests:targetReq.length,ymaze_requests:yreq.length,p1_result_requests:p1ResultReq.length,official_p2_result_requests:officialOutputReq.length,authorization_effective_only_on_main:state.effective,official_search_executed:false};
          fs.writeFileSync('/tmp/p2-v033n-audit/browser.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));ws.close();
          NODE
          node /tmp/p2-v033n-browser.mjs
      - name: Upload P2 authorization audit
        uses: actions/upload-artifact@v4
        with:
          name: p2-v033n-highres-authorization-audit
          path: /tmp/p2-v033n-audit
          retention-days: 30
