name: P4 v0.3.4e final Chromium audit

on:
  push:
    branches:
      - v0.3.4e-p4-estimator-qualification
    paths:
      - .github/workflows/p4-v034e-final-chromium-audit.yml

permissions:
  contents: write

concurrency:
  group: p4-v034e-final-chromium-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact qualified estimator pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p4_response_estimation_v1.json)" = "2d0bdfaba74ad08f8424870f37a48399428ae8b7"
          test "$(git hash-object hypotheses/p4_estimator_implementation_authorization_v1.json)" = "e8f26731412d8693a5596da4374de932745b9392"
          test "$(git hash-object tools/p4-estimation-core.js)" = "4d985cd7258fc26eb06be75f09bdac4b92325ff0"
          test "$(git hash-object tools/run-p4-estimation.js)" = "e57b554c0ad56a0034f4f79ec8090d3e863e3d11"
          test "$(git hash-object reports/p4_estimator_qualification_v1.json)" = "33cf1216ade03b0f25ddf643cdc28fd5c3df0010"
          test "$(git hash-object src/p4.js)" = "bf7d5781bd69ec4568450ebbd3bdc284897b6f61"
          test "$(git hash-object src/p3.js)" = "4010b19fd7a1b713a4b8d25b6a693d3ee0a581b8"
          test "$(git hash-object index.html)" = "75698249c34de27b0fd370daa8f1f488796add05"
          test ! -e hypotheses/p4_highres_authorization_v1.json
          ./tests/run-tests.sh

      - name: Build browser audit pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          audit=r'''
          <pre id="auditResult">PENDING</pre>
          <script>
          (async()=>{
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const result={error:null};
            try{
              for(let i=0;i<100&&document.getElementById('runStatus').textContent==='LOADING';i++) await sleep(50);
              const snap=()=>({
                status:document.getElementById('runStatus').textContent,
                model:document.getElementById('modelId').textContent,
                simTime:document.getElementById('simTime').textContent,
                experiment:document.getElementById('experimentSelect').value,
                note:document.getElementById('protocolNote').textContent,
                playText:document.getElementById('playBtn').textContent
              });
              result.title=document.title;
              result.initial=snap();
              document.getElementById('stepBtn').click();
              await sleep(100);
              result.afterStep=snap();
              document.getElementById('playBtn').click();
              await sleep(350);
              result.duringRun=snap();
              if(document.getElementById('runStatus').textContent==='RUNNING') document.getElementById('playBtn').click();
              await sleep(80);
              const sel=document.getElementById('experimentSelect');
              sel.value='open_arena_long_control.json';
              sel.dispatchEvent(new Event('change',{bubbles:true}));
              for(let i=0;i<50&&!document.getElementById('protocolNote').textContent.includes('1000 mm');i++) await sleep(50);
              result.afterLongSwitch=snap();
            }catch(e){result.error=String(e&&e.stack||e);}
            document.getElementById('auditResult').textContent=JSON.stringify(result);
          })();
          </script>
          '''
          Path('p4-canonical-audit.tmp.html').write_text(html.replace('</body>',audit+'</body>'))
          Path('p4-parity-audit.tmp.html').write_text(r'''<!doctype html><meta charset="utf-8"><title>P4 parity audit</title>
          <pre id="result">PENDING</pre>
          <script src="./src/sim-core.js"></script>
          <script src="./src/measurement.js"></script>
          <script src="./src/h3.js"></script>
          <script src="./src/integrity.js"></script>
          <script src="./src/p1.js"></script>
          <script src="./src/p4.js"></script>
          <script>
          (async()=>{
            const out={error:null,cases:[]};
            const add=(name,pass,detail)=>out.cases.push({name,pass:!!pass,detail});
            try{
              const p4=globalThis.AntLabP4;
              if(!p4)throw new Error('AntLabP4 missing');
              const near=(a,b,t=1e-12)=>Math.abs(a-b)<=t;
              let g=p4.gatedRelativeSignal(.10,.15,.25);
              add('threshold_boundary_off',g.detected===false&&g.signal===0&&near(g.sum,.25),g);
              g=p4.gatedRelativeSignal(.10,.16,.25);
              add('just_above_detects_right',g.detected===true&&g.signal>0,g);
              g=p4.gatedRelativeSignal(.40,.40,.25);
              add('equal_above_threshold_zero_turn',g.detected===true&&g.signal===0,g);
              const a=p4.gatedRelativeSignal(.10,.40,.25).signal,b=p4.gatedRelativeSignal(.40,.10,.25).signal;
              add('left_right_antisymmetry',near(a,-b),{a,b});
              const s1=p4.gatedRelativeSignal(.20,.60,.25).signal,s2=p4.gatedRelativeSignal(.40,1.20,.25).signal;
              add('above_threshold_scale_invariance',near(s1,s2),{s1,s2});
              const low=p4.gatedRelativeSignal(.02,.08,.25),high=p4.gatedRelativeSignal(.08,.32,.25);
              add('scale_crossing_detection_boundary',low.detected===false&&high.detected===true,{low,high});
              const z=p4.gatedRelativeSignal(.10,.40,0);
              add('theta_zero_matches_ungated_weber',z.detected===true&&near(z.signal,(.40-.10)/(.40+.10)),z);
              const model=await fetch('./models/lasius_niger_painted_trail_p4_v1.json').then(r=>r.json());
              const cfg=p4.paintedTrailResponseConfig(model);
              add('frozen_config_values',cfg.sigma===8&&cfg.kappa===4&&cfg.theta===.25&&cfg.radius===10,{sigma:cfg.sigma,kappa:cfg.kappa,theta:cfg.theta,radius:cfg.radius});
              add('frozen_quadrature',cfg.radialBins===4&&cfg.angularBins===8&&cfg.samplesPerSector===32,{radialBins:cfg.radialBins,angularBins:cfg.angularBins,samplesPerSector:cfg.samplesPerSector});
              const pts=p4.sectorSamplePoints(100,100,0,cfg);
              add('sector_sample_cardinality',pts.left.length===32&&pts.right.length===32,{left:pts.left.length,right:pts.right.length});
            }catch(e){out.error=String(e&&e.stack||e);}
            out.passed=out.error===null&&out.cases.length===10&&out.cases.every(x=>x.pass);
            document.getElementById('result').textContent=JSON.stringify(out);
          })();
          </script>''')
          PY

      - name: Run Chromium canonical and P4 parity audits
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --version | tee /tmp/p4-chrome-version.txt
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/p4-server-out.txt 2>/tmp/p4-server.log &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/p4-canonical-audit.tmp.html >/tmp/p4-canonical-dom.html 2>/tmp/p4-canonical-chrome.err
          cp /tmp/p4-server.log /tmp/p4-canonical-server.log
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/p4-parity-audit.tmp.html >/tmp/p4-parity-dom.html 2>/tmp/p4-parity-chrome.err
          python3 - <<'PY'
          import json,re,html,hashlib,subprocess
          from pathlib import Path
          def pre(path,ident):
              s=Path(path).read_text(errors='replace')
              m=re.search(r'<pre id="%s">(.*?)</pre>'%re.escape(ident),s,re.S)
              if not m: raise SystemExit('missing '+ident+' in '+path)
              return json.loads(html.unescape(m.group(1)))
          canon=pre('/tmp/p4-canonical-dom.html','auditResult')
          parity=pre('/tmp/p4-parity-dom.html','result')
          if canon.get('error'): raise SystemExit(canon['error'])
          if parity.get('error') or not parity.get('passed'): raise SystemExit('P4 parity failed: '+json.dumps(parity))
          assert canon['title']=='ANTLAB H5'
          assert canon['initial']['status']=='PAUSED'
          assert canon['initial']['model']=='lasius_niger_locomotion_v1'
          assert canon['initial']['simTime']=='0.0 s'
          assert canon['afterStep']['simTime']=='1.0 s'
          assert canon['duringRun']['status']=='RUNNING'
          assert canon['afterLongSwitch']['experiment']=='open_arena_long_control.json'
          assert canon['afterLongSwitch']['status']=='PAUSED'
          assert canon['afterLongSwitch']['model']=='lasius_niger_locomotion_v1'
          assert '1000 mm' in canon['afterLongSwitch']['note']
          log=Path('/tmp/p4-canonical-server.log').read_text(errors='replace')
          reqs=re.findall(r'"GET ([^ ]+) HTTP/',log)
          forbidden={
            'response_target':sum('poissonnier2026_pheromone_response_targets' in x for x in reqs),
            'p4_runtime':sum('/src/p4.js' in x for x in reqs),
            'p4_estimator_core':sum('p4-estimation-core' in x for x in reqs),
            'p4_estimator_runner':sum('run-p4-estimation' in x for x in reqs),
            'p1_result':sum('p1_response_estimation_' in x for x in reqs),
            'p2_result':sum('p2_response_estimation_' in x for x in reqs),
            'p3_result':sum('p3_response_estimation_' in x for x in reqs),
            'p4_highres_authorization':sum('p4_highres_authorization' in x for x in reqs),
          }
          if any(forbidden.values()): raise SystemExit('canonical forbidden request(s): '+json.dumps(forbidden))
          report={
            'schema_version':1,
            'audit_id':'P4_estimator_browser_firewall_audit_v1',
            'status':'passed',
            'scientific_evidence':False,
            'tested_git_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'browser':Path('/tmp/p4-chrome-version.txt').read_text().strip(),
            'qualified_blobs':{
              'policy':'2d0bdfaba74ad08f8424870f37a48399428ae8b7',
              'implementation_authorization':'e8f26731412d8693a5596da4374de932745b9392',
              'estimator_core':'4d985cd7258fc26eb06be75f09bdac4b92325ff0',
              'estimator_runner':'e57b554c0ad56a0034f4f79ec8090d3e863e3d11',
              'qualification_report':'33cf1216ade03b0f25ddf643cdc28fd5c3df0010',
              'p4_runtime':'bf7d5781bd69ec4568450ebbd3bdc284897b6f61',
              'canonical_index':'75698249c34de27b0fd370daa8f1f488796add05'
            },
            'canonical_app':canon,
            'canonical_requests':reqs,
            'canonical_forbidden_request_counts':forbidden,
            'P4_browser_parity':{
              'cases':len(parity['cases']),
              'passed':parity['passed'],
              'results':parity['cases']
            },
            'response_target_semantics_loaded':False,
            'P1_official_result_semantics_loaded':False,
            'P2_official_result_semantics_loaded':False,
            'P3_official_result_semantics_loaded':False,
            'high_resolution_search_executed':False,
            'ymaze_accessed_by_P4_estimator':False
          }
          Path('reports/p4_estimator_browser_audit_v1.json').write_text(json.dumps(report,indent=2)+'\n')
          b=Path('reports/p4_estimator_browser_audit_v1.json').read_bytes()
          gitblob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          sha=hashlib.sha256(b).hexdigest()
          print(json.dumps({'status':'passed','browser':report['browser'],'parity_cases':len(parity['cases']),'canonical_requests':len(reqs),'forbidden_requests':sum(forbidden.values()),'bytes':len(b),'git_blob':gitblob,'sha256':sha}))
          PY

      - name: Commit exact browser audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/p4_estimator_browser_audit_v1.json
          test "$(git diff --cached --name-only | wc -l)" = "1"
          git diff --cached --name-only | grep -Fx reports/p4_estimator_browser_audit_v1.json
          git commit -m "Materialize P4 estimator Chromium audit"
          git push origin HEAD:v0.3.4e-p4-estimator-qualification

      - name: Upload browser audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: p4-v034e-final-chromium-audit
          retention-days: 90
          if-no-files-found: error
          path: |
            reports/p4_estimator_browser_audit_v1.json
            /tmp/p4-canonical-dom.html
            /tmp/p4-parity-dom.html
            /tmp/p4-canonical-server.log
            /tmp/p4-chrome-version.txt
