name: H5 estimator qualification audit
on:
  push:
    branches: [h5-estimator-implementation-v1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen H5 estimator inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_parameter_estimation_v1.json)" = "ead45bacff89bf626deaaf3238a5c363b74279d1"
          test "$(git hash-object src/h5.js)" = "b43f8e9fcaa4b2cc9981ed4f2922a833cc1a3177"
          test "$(git hash-object models/lasius_niger_locomotion_h5_v1.json)" = "ee2e5570f6d43cd91317fd38299b70bde32f191a"
          test "$(git hash-object src/integrity.js)" = "f23c68a6955832b70eeb3bd3e6893d71a3759018"
          test "$(git hash-object src/sim-core.js)" = "24777aac3577d442893e4779d70aee4e27761fe8"
          test "$(git hash-object tools/run-h4-estimation.js)" = "d417c62a4ef4f97c338a1da2f1ff10f49e18c175"
          node --check tools/run-h5-estimation.js
      - name: Run full H0-H5 regression suite
        run: ./tests/run-tests.sh
      - name: Run reference-free H5 synthetic qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h5-estimator-audit
          node tools/run-h5-estimation.js --mode qualification --trials 3 --out /tmp/h5-estimator-audit/qualification.json | tee /tmp/h5-estimator-audit/qualification.log
          node - <<'NODE'
          const q=require('/tmp/h5-estimator-audit/qualification.json');
          if(q.status!=='passed')throw new Error('qualification failed');
          if(q.reference_outcomes_accessed!==false||q.reference_files_semantically_loaded!==false||q.ymaze_accessed!==false||q.scientific_evidence!==false)throw new Error('qualification crossed a scientific firewall');
          if(!Object.values(q.checks).every(Boolean))throw new Error('not every qualification check passed');
          NODE
      - name: Verify high-resolution search remains locked
        shell: bash
        run: |
          set -euo pipefail
          if node tools/run-h5-estimation.js --mode highres --out /tmp/h5-estimator-audit/should-not-exist.json >/tmp/h5-estimator-audit/highres.stdout 2>/tmp/h5-estimator-audit/highres.stderr; then
            echo "high-resolution unexpectedly ran" >&2
            exit 1
          fi
          grep -qi "not authorized" /tmp/h5-estimator-audit/highres.stderr
          test ! -e /tmp/h5-estimator-audit/should-not-exist.json
      - name: Run low-resolution H5 execution smoke
        shell: bash
        run: |
          set -euo pipefail
          node tools/run-h5-estimation.js --mode smoke --candidates 8 --trials 4 --eval-trials 8 --seed 1110000 --out /tmp/h5-estimator-audit/smoke.json | tee /tmp/h5-estimator-audit/smoke.log
          node - <<'NODE'
          const r=require('/tmp/h5-estimator-audit/smoke.json');
          if(r.status!=='execution_path_smoke_only_not_evidence'||r.scientific_evidence!==false)throw new Error('smoke mislabeled');
          if(r.ymaze_accessed!==false||r.moving_speed_used_for_fit!==false||r.moving_distance_used_for_fit!==false||r.straightness_used_for_fit!==false||r.raw_heading_diagnostics_used_for_fit!==false)throw new Error('smoke crossed fit firewall');
          if(r.search.H5_null_candidates_per_fold!==8||r.search.H5_context_candidates_per_fold_total!==8)throw new Error('unexpected smoke budget');
          NODE
      - name: Build selected-candidate Node parity reference
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h5e=require('./tools/run-h5-estimation.js');
          const h5=require('./src/h5.js');
          const {loadBundle,readJson}=require('./tools/load-bundle.js');
          const smoke=require('/tmp/h5-estimator-audit/smoke.json');
          const base=readJson('./models/lasius_niger_locomotion_h5_v1.json');
          const f=smoke.folds[0];
          function inflate(c,kind){
            return {
              angular_sigma_rad_sqrt_s:c.angular_sigma_rad_sqrt_s,
              q:c.q,
              lambda_commitment_mm:c.lambda_commitment_mm==null?500:c.lambda_commitment_mm,
              tau_commitment_s:c.tau_commitment_s==null?5:c.tau_commitment_s,
              kappa_restore_per_s:kind==='null'?0:(c.kappa_restore_per_s??0)
            };
          }
          const selected=[
            {kind:'null',candidate:inflate(f.H5_null.fit.candidate,'null')},
            {kind:'context',candidate:inflate(f.H5_context.fit.candidate,'context')}
          ];
          const cases=[];
          for(const sel of selected){
            const model=h5e.configuredModel(base,sel.candidate);
            for(const experiment of ['open_arena_short_control.json','open_arena_long_control.json']){
              for(const seed of [1910000,1910001]){
                const b=loadBundle(experiment,{modelId:model.id});
                b.model=JSON.parse(JSON.stringify(model));b.observation.record_trajectories=false;
                const sim=new h5.Simulation(b,seed);
                h5e.applySharedEntryTransition(sim,seed,sel.candidate.q);
                const sx=sim.ants[0].x,sy=sim.ants[0].y;
                const s=sim.runUntilComplete(b.experiment.duration_s,0.02),a=sim.ants[0],l=s.latent_states[0],o=s.observed_metrics.ants[0],ex=o.exit_coordinate_mm;
                cases.push({
                  kind:sel.kind,candidate:sel.candidate,experiment,seed,
                  x:a.x,y:a.y,heading:a.heading,completedAt:a.completedAt,distance:a.distanceTravelled,rng:a.rng.state,
                  speedFactor:a.speedFactor,pauseRemaining:a.pauseRemaining,reference:l.h5_heading_reference_rad,
                  commitment:l.heading_commitment_current,time:o.time_to_arena_edge_s??b.experiment.duration_s,
                  zone:o.central_zone_fraction??0,beeline:ex?Math.hypot(ex.x-sx,ex.y-sy):0,
                  edge:h5e.exitEdge(ex,sim.apparatus.world.width,sim.apparatus.world.height)
                });
              }
            }
          }
          fs.writeFileSync('/tmp/h5-estimator-audit/node-parity.json',JSON.stringify(cases,null,2));
          NODE
      - name: Replay selected estimator candidates in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/h5-estimator-audit/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/h5-estimator-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/h5-estimator-chrome --remote-debugging-port=9222 about:blank >/tmp/h5-estimator-audit/chrome.log 2>&1 &
          for i in {1..100}; do
            curl -fsS http://127.0.0.1:9222/json/version >/tmp/h5-estimator-audit/chrome-version.json 2>/dev/null && break
            sleep .2
          done
          curl -fsS http://127.0.0.1:9222/json/version >/tmp/h5-estimator-audit/chrome-version.json
          cat >/tmp/h5-estimator-audit/browser.mjs <<'NODE'
          import fs from 'node:fs';
          const refs=JSON.parse(fs.readFileSync('/tmp/h5-estimator-audit/node-parity.json','utf8'));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<100;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabH5"))break;await new Promise(r=>setTimeout(r,50));}
          const policy=await evalv("(async()=>await (await fetch('./hypotheses/h5_parameter_estimation_v1.json')).json())()");
          if(policy.estimator_implementation_gate.high_resolution_search_authorized!==false)throw new Error('frozen policy unexpectedly authorizes highres');
          const browser=await evalv(`(async()=>{
            const json=async p=>(await fetch(p)).json(),cases=${JSON.stringify(refs.map(r=>({kind:r.kind,candidate:r.candidate,experiment:r.experiment,seed:r.seed})))},out=[];
            for(const c of cases){
              const experiment=await json('./experiments/'+c.experiment);experiment.model='lasius_niger_locomotion_h5_v1';
              const [model,apparatus,state,observation,scoring]=await Promise.all([json('./models/lasius_niger_locomotion_h5_v1.json'),json('./apparatus/'+experiment.apparatus+'.json'),json('./states/'+experiment.state+'.json'),json('./observations/'+experiment.observation+'.json'),json('./scoring/'+experiment.scoring+'.json')]);
              model.movement.angular_sigma_rad_sqrt_s=c.candidate.angular_sigma_rad_sqrt_s;
              model.heading_restoration.initialization.lambda_commitment_mm=c.candidate.lambda_commitment_mm;
              model.heading_restoration.decay.tau_commitment_s=c.candidate.tau_commitment_s;
              model.heading_restoration.effect.kappa_restore_per_s=c.candidate.kappa_restore_per_s;
              observation.record_trajectories=false;
              const sim=new AntLabH5.Simulation({experiment,model,apparatus,state,observation,scoring},c.seed);
              const rr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(c.seed,'h2_estimation_entry_transition_v1'));
              if(rr.next()>c.candidate.q)sim.ants[0].heading=rr.next()*2*Math.PI-Math.PI;
              const sx=sim.ants[0].x,sy=sim.ants[0].y,s=sim.runUntilComplete(experiment.duration_s,0.02),a=sim.ants[0],l=s.latent_states[0],o=s.observed_metrics.ants[0],ex=o.exit_coordinate_mm;
              const edge=ex?Object.entries({left:Math.abs(ex.x),right:Math.abs(ex.x-sim.apparatus.world.width),top:Math.abs(ex.y),bottom:Math.abs(ex.y-sim.apparatus.world.height)}).sort((a,b)=>a[1]-b[1])[0][0]:'timeout';
              out.push({kind:c.kind,candidate:c.candidate,experiment:c.experiment,seed:c.seed,x:a.x,y:a.y,heading:a.heading,completedAt:a.completedAt,distance:a.distanceTravelled,rng:a.rng.state,speedFactor:a.speedFactor,pauseRemaining:a.pauseRemaining,reference:l.h5_heading_reference_rad,commitment:l.heading_commitment_current,time:o.time_to_arena_edge_s??experiment.duration_s,zone:o.central_zone_fraction??0,beeline:ex?Math.hypot(ex.x-sx,ex.y-sy):0,edge});
            }
            return out;
          })()`);
          const near=(a,b,t=2e-10)=>{if(Math.abs(a-b)>t)throw new Error('numeric mismatch '+a+' '+b);};
          if(browser.length!==refs.length)throw new Error('case count mismatch');
          for(let i=0;i<refs.length;i++){
            const a=refs[i],b=browser[i];
            for(const k of ['kind','experiment','seed','rng','edge'])if(a[k]!==b[k])throw new Error(k+' mismatch '+a[k]+' '+b[k]);
            for(const k of ['x','y','heading','completedAt','distance','speedFactor','pauseRemaining','reference','commitment','time','zone','beeline'])near(a[k],b[k]);
          }
          const yreq=requests.filter(u=>/y[_-]?maze|ymaze/i.test(u));
          if(yreq.length)throw new Error('Y-maze request '+JSON.stringify(yreq));
          if(exceptions.length)throw new Error('exceptions '+JSON.stringify(exceptions));
          if(consoleErrors.length)throw new Error('console errors '+JSON.stringify(consoleErrors));
          const report={status:'passed',cases:browser.length,selected_candidate_kinds:[...new Set(browser.map(x=>x.kind))],exceptions:0,console_errors:0,ymaze_requests:0};
          fs.writeFileSync('/tmp/h5-estimator-audit/browser-result.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));ws.close();
          NODE
          node /tmp/h5-estimator-audit/browser.mjs
      - name: Upload H5 estimator qualification audit
        uses: actions/upload-artifact@v4
        with:
          name: h5-estimator-qualification-audit
          path: /tmp/h5-estimator-audit
          retention-days: 7
