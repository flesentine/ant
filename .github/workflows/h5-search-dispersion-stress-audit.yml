name: H5 search-dispersion stress audit
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate frozen preconditions
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_origin_referenced_search_v1.draft.json)" = "bda80f89f78a89d9cd7e051ef9ac85a276c37c2d"
          test "$(git hash-object reports/h5_history_response_choice_audit_v1.json)" = "37d5e0a28f2ed75cc45297ca19d0ed66db45cad6"
          test "$(git hash-object src/h3.js)" = "9bb8fc966a5aa4d4173f9bda2020c6d9cd9368f1"
          test "$(git hash-object models/lasius_niger_locomotion_h3_v1.json)" = "fe33c31facfcabb7ddeb9a7bedf71ac248ad8e84"
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('hypotheses/h5_origin_referenced_search_v1.draft.json','utf8'));
          if(d.firewall.mechanism_not_frozen!==true||d.firewall.parameter_search_allowed!==false) throw new Error('H5 freeze/search firewall drift');
          if(d.candidate_mechanism.reorientation_effect.search_component.indexOf('reuse the same concentration')<0) throw new Error('expected pre-freeze dispersion default missing');
          if(d.firewall.ymaze_access!==false) throw new Error('Y-maze firewall drift');
          NODE
          if grep -R -n -E 'biology_h5_search|alpha_search_200|alpha_search_1000|search_concentration|search_kappa|kappa_search' src models experiments states apparatus scoring observations; then
            echo 'Persistent H5 runtime unexpectedly present before mechanism freeze' >&2
            exit 1
          fi
          cp src/h3.js /tmp/h3-original.js

      - name: Baseline Y-maze-free regressions
        run: |
          set -euo pipefail
          for f in tests/boundary-timing.test.js tests/determinism.test.js tests/experiment-definition.test.js tests/h3-reorientation.test.js tests/integrity-firewall.test.js tests/measurement-geometry-policy.test.js tests/measurement.test.js tests/open-arena-protocol.test.js tests/rng-streams.test.js tests/state-integrity.test.js; do
            node "$f"
          done

      - name: Von Mises numerical and moment audit
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const core=require('./src/sim-core.js');
          const h3=require('./src/h3.js');
          const ks=[0,1e-12,1e-8,1e-6,0.25,0.5,1,2,4,8,20,50,100,200,500,1000,10000,1e6];
          const rows={}, failures=[];
          for(const k of ks){
            const rng=new core.RNG(123456789 + Math.round(Math.log10(k+1)*10000));
            const n=k>20?20000:100000;
            let cc=0,ss=0,maxAbs=0,bad=0,completed=0,error=null;
            try{
              for(let i=0;i<n;i++){
                const a=h3.sampleVonMises(rng,k);
                if(!Number.isFinite(a)||a < -Math.PI-1e-12 || a > Math.PI+1e-12){bad++;continue;}
                cc+=Math.cos(a);ss+=Math.sin(a);maxAbs=Math.max(maxAbs,Math.abs(a));completed++;
              }
            }catch(e){error=String(e && e.message || e);failures.push({kappa:k,completed,error});}
            rows[k]={requested:n,completed,bad,error,mean_cos:completed?cc/completed:null,mean_sin:completed?ss/completed:null,resultant:completed?Math.hypot(cc/completed,ss/completed):null,max_abs_angle:maxAbs};
            if(k<=20 && (error||bad||completed!==n))throw new Error('VM sampler failed inside frozen H3 kappa domain at '+k+': '+JSON.stringify(rows[k]));
          }
          const A2=rows[2].mean_cos;
          const pullMatched={};
          for(const k of [0.5,1,4,8,20]){
            const Ak=rows[k].mean_cos;
            const scale=Ak>0?A2/Ak:Infinity;
            pullMatched[k]={moment_scale_from_k2:scale,alpha200:.6*scale,alpha1000:.3*scale,feasible:.6*scale<=1};
          }
          const norm=a=>{while(a<=-Math.PI)a+=2*Math.PI;while(a>Math.PI)a-=2*Math.PI;return a;};
          let branchMax=0,rotationMax=0;
          const rng=new core.RNG(987654321);
          for(let i=0;i<10000;i++){
            const a=h3.sampleVonMises(rng,2);
            branchMax=Math.max(branchMax,Math.abs(norm(Math.PI+a)-norm(-Math.PI+a)));
            const b=-2.1 + 4.2*(i/9999),phi=.731;
            rotationMax=Math.max(rotationMax,Math.abs(norm(norm(b+phi+a)-norm(b+a))-phi));
          }
          // modulo-aware branch error
          const branchModulo=[];
          const rng2=new core.RNG(11223344);
          for(let i=0;i<10000;i++){const a=h3.sampleVonMises(rng2,2);branchModulo.push(Math.abs(norm(norm(Math.PI+a)-norm(-Math.PI+a))));}
          const out={
            status:'passed',
            baseline_kappa:2,
            moments:rows,
            pull_matched_alpha_examples:pullMatched,
            symmetry:{
              max_abs_mean_sin_frozen_domain:Math.max(...[0,.25,.5,1,2,4,8,20].map(k=>Math.abs(rows[k].mean_sin))),
              pi_representation_max_modulo_error:Math.max(...branchModulo),
              rotation_max_error:rotationMax
            },
            structural_identity:"For a von Mises search component centered on the origin bearing, its first circular moment toward the origin is A1(kappa). The origin-oriented first-moment contribution is therefore proportional to alpha_history * R * A1(kappa), creating an intrinsic amplitude-dispersion tradeoff when only aggregate trajectory summaries are fitted.",
            frozen_H3_kappa_domain:[0,20],
            out_of_domain_convergence_failures:failures,
            interpretation_guard:'No biological target outcomes used; failures above kappa=20 are out-of-domain stress findings.'
          };
          fs.writeFileSync('/tmp/h5-dispersion-vm.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE

      - name: Install temporary direction-only H5 diagnostic hook
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='src/h3.js';
          let s=fs.readFileSync(p,'utf8'),before=s;
          s=s.replace(
            "ant.h3AngleRng = new core.RNG(angleSeed);",
            "ant.h3AngleRng = new core.RNG(angleSeed);\n    ant.h5DiagChoiceRng = new core.RNG(streamSeed(seed, 'biology_h5_search_choice:' + ant.id));\n    ant.h5DiagAngleRng = new core.RNG(streamSeed(seed, 'biology_h5_search_angle:' + ant.id));"
          );
          s=s.replace(
            "ant.heading = core.normalizeAngle(ant.heading + angle);",
            "const baselineHeading = core.normalizeAngle(ant.heading + angle);\n      ant.heading = baselineHeading;\n      let h5DiagSearchUsed = false;\n      if (sim.__h5diag) {\n        const choice = ant.h5DiagChoiceRng.next();\n        const searchAngle = sampleVonMises(ant.h5DiagAngleRng, Number(sim.__h5diag.searchKappa));\n        const dx = Number(sim.__h5diag.originX) - ant.x;\n        const dy = Number(sim.__h5diag.originY) - ant.y;\n        const r = Math.hypot(dx,dy);\n        let radial=0;\n        if(r>0){\n          const ux=(-dx)/r,uy=(-dy)/r,ox=Number(sim.__h5diag.originX),oy=Number(sim.__h5diag.originY),W=Number(sim.__h5diag.worldW),H=Number(sim.__h5diag.worldH),c=[];\n          if(ux>0)c.push((W-ox)/ux);else if(ux<0)c.push((0-ox)/ux);if(uy>0)c.push((H-oy)/uy);else if(uy<0)c.push((0-oy)/uy);\n          const de=Math.min(...c.filter(t=>t>=0&&Number.isFinite(t)));radial=Math.max(0,Math.min(1,r/de));\n        }\n        const w=Math.max(0,Math.min(1,Number(sim.__h5diag.alpha)*radial));\n        if(choice<w&&r>0){const bearing=Math.atan2(dy,dx);ant.heading=core.normalizeAngle(bearing+searchAngle);h5DiagSearchUsed=true;}\n      }"
          );
          s=s.replace(
            "sim.events.push({ time: sim.time + elapsed, type: 'h3_reorientation', ant: ant.id, sequence: ant.h3TurnCount, angle_rad: angle, x: ant.x, y: ant.y });",
            "sim.events.push({ time: sim.time + elapsed, type: 'h3_reorientation', ant: ant.id, sequence: ant.h3TurnCount, angle_rad: angle, x: ant.x, y: ant.y, h5_diag_search_used: h5DiagSearchUsed });"
          );
          if(s===before)throw new Error('diagnostic patch failed');
          fs.writeFileSync(p,s);
          NODE
          node --check src/h3.js

      - name: Node dispersion-amplitude confounding matrix
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const geom=require('./tools/poissonnier2026-measurement-geometry.js');
          const {Simulation,FIXED_DT,streamSeed}=require('./src/integrity.js');
          const core=require('./src/sim-core.js');
          const h3=require('./src/h3.js');
          const {loadBundle}=require('./tools/load-bundle.js');
          const {geometry}=geom.loadFrozenMeasurementGeometry(process.cwd());

          const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
          const cos=(a,b)=>{const da=Math.hypot(...a),db=Math.hypot(...b);return da&&db?a.reduce((s,x,i)=>s+x*b[i],0)/(da*db):null;};
          const fitScale=(a,b)=>{const den=a.reduce((s,x)=>s+x*x,0),k=den?a.reduce((s,x,i)=>s+x*b[i],0)/den:0,p=a.map(x=>k*x),sse=p.reduce((s,x,i)=>s+(b[i]-x)**2,0),m=b.reduce((s,x)=>s+x,0)/b.length,sst=b.reduce((s,x)=>s+(x-m)**2,0);return{scale:k,r2:sst?1-sse/sst:null,rmse:Math.sqrt(sse/b.length)};};
          function edge(ex,w,h){if(!ex)return'timeout';const d={left:Math.abs(ex.x),right:Math.abs(ex.x-w),top:Math.abs(ex.y),bottom:Math.abs(ex.y-h)};return Object.keys(d).sort((a,b)=>d[a]-d[b])[0];}
          function vec(rows){const ep={left:0,right:0,top:0,bottom:0,timeout:0};rows.forEach(r=>ep[r.exit]++);const n=rows.length;return [mean(rows.map(r=>r.time)),mean(rows.map(r=>r.zone)),mean(rows.map(r=>r.beeline)),ep.left/n,ep.right/n,ep.top/n,ep.bottom/n,ep.timeout/n];}
          function std(v,b){const scales=[Math.max(1,b[0]),Math.max(.05,b[1]),Math.max(10,b[2]),.25,.25,.25,.25,.1];return v.map((x,i)=>(x-b[i])/scales[i]);}
          function moment(k){const rng=new core.RNG(24681012+Math.round(k*1000));let c=0,n=100000;for(let i=0;i<n;i++)c+=Math.cos(h3.sampleVonMises(rng,k));return c/n;}
          const A2=moment(2),moments={};for(const k of [0.5,1,2,4,8,20])moments[k]=moment(k);
          const matched=k=>({a200:.6*A2/moments[k],a1000:.3*A2/moments[k]});

          const variants=[
            {id:'baseline',k:2,a200:0,a1000:0},
            {id:'null_k0',k:0,a200:0,a1000:0},
            {id:'null_k20',k:20,a200:0,a1000:0},
            {id:'shared_k2',k:2,a200:.6,a1000:.3},
            {id:'fixed_k0',k:0,a200:.6,a1000:.3},
            {id:'fixed_k05',k:.5,a200:.6,a1000:.3},
            {id:'fixed_k1',k:1,a200:.6,a1000:.3},
            {id:'fixed_k4',k:4,a200:.6,a1000:.3},
            {id:'fixed_k8',k:8,a200:.6,a1000:.3},
            {id:'fixed_k20',k:20,a200:.6,a1000:.3},
            {id:'match_k1',k:1,...matched(1)},
            {id:'match_k4',k:4,...matched(4)},
            {id:'match_k8',k:8,...matched(8)},
            {id:'match_k20',k:20,...matched(20)},
            {id:'common_k2',k:2,a200:.3,a1000:.3}
          ];
          if(variants.find(v=>v.id==='match_k1').a200>1)throw new Error('k1 matched alpha unexpectedly infeasible');

          const baseShort=loadBundle('open_arena_short_control.json',{modelId:'lasius_niger_locomotion_h3_v1'});
          const baseLong=loadBundle('open_arena_long_control.json',{modelId:'lasius_niger_locomotion_h3_v1'});
          baseShort.model.reorientation_gate.effect.max_hazard_reduction_fraction=0;baseLong.model.reorientation_gate.effect.max_hazard_reduction_fraction=0;
          const rows=Object.fromEntries(variants.map(v=>[v.id,{short:[],long:[]}]));
          let nullMismatch=0,commonMismatch=0,prefixTimeMismatch=0,prefixAngleMismatch=0,prefixCompared=0;
          const usage=Object.fromEntries(variants.map(v=>[v.id,{short:[0,0],long:[0,0]}]));
          for(let fi=0;fi<geom.EXPECTED_COLONIES.length;fi++){
            const held=geom.EXPECTED_COLONIES[fi],pool=geom.geometryPool(geometry.rows,held);
            for(let i=0;i<50;i++){
              const seed=990000+fi*10000+i,row=geom.sampleGeometry(pool,seed).row,hr=new core.RNG(streamSeed(seed,'h5_dispersion_shared_entry_heading')),heading=hr.next()*2*Math.PI-Math.PI;
              const trial={};
              for(const cond of ['short','long']){
                const base=cond==='short'?baseShort:baseLong,alphaKey=cond==='short'?'a200':'a1000';
                for(const v of variants){
                  const b=geom.applyGeometry(base,row);b.observation.record_trajectories=false;
                  const sim=new Simulation(b,seed);sim.ants[0].heading=heading;
                  sim.__h5diag={alpha:v[alphaKey],searchKappa:v.k,originX:row.entry_reference_x_mm,originY:row.entry_reference_y_mm,worldW:row.arena_width_mm,worldH:row.arena_height_mm};
                  const sx=sim.ants[0].x,sy=sim.ants[0].y,s=sim.runUntilComplete(b.experiment.duration_s,FIXED_DT),o=s.observed_metrics.ants[0],ex=o.exit_coordinate_mm,ev=sim.events.filter(e=>e.type==='h3_reorientation');
                  const rec={time:o.time_to_arena_edge_s??b.experiment.duration_s,zone:o.central_zone_fraction??0,beeline:ex?Math.hypot(ex.x-sx,ex.y-sy):0,exit:edge(ex,row.arena_width_mm,row.arena_height_mm),x:sim.ants[0].x,y:sim.ants[0].y,heading:sim.ants[0].heading,turns:sim.ants[0].h3TurnCount,events:ev.map(e=>[e.time,e.angle_rad,e.h5_diag_search_used])};
                  rows[v.id][cond].push(rec);trial[v.id+'_'+cond]=rec;usage[v.id][cond][0]+=ev.filter(e=>e.h5_diag_search_used).length;usage[v.id][cond][1]+=ev.length;
                }
                const ref=trial['shared_k2_'+cond];
                for(const vid of ['fixed_k0','fixed_k05','fixed_k1','fixed_k4','fixed_k8','fixed_k20','match_k1','match_k4','match_k8','match_k20']){
                  const z=trial[vid+'_'+cond],n=Math.min(ref.events.length,z.events.length);
                  for(let q=0;q<n;q++){prefixCompared++;if(Math.abs(ref.events[q][0]-z.events[q][0])>1e-10)prefixTimeMismatch++;if(Math.abs(ref.events[q][1]-z.events[q][1])>1e-12)prefixAngleMismatch++;}
                }
              }
              const bS=trial.baseline_short,bL=trial.baseline_long;
              for(const vid of ['null_k0','null_k20'])for(const cond of ['short','long'])if(JSON.stringify(trial[vid+'_'+cond])!==JSON.stringify(trial['baseline_'+cond]))nullMismatch++;
              if(JSON.stringify(trial.common_k2_short)!==JSON.stringify(trial.common_k2_long))commonMismatch++;
            }
          }
          const vectors={},effects={},contrasts={};
          for(const v of variants){
            vectors[v.id]={short:vec(rows[v.id].short),long:vec(rows[v.id].long)};
            contrasts[v.id]=vectors[v.id].short.map((x,i)=>x-vectors[v.id].long[i]);
          }
          const bS=vectors.baseline.short,bL=vectors.baseline.long;
          for(const v of variants.filter(v=>!v.id.startsWith('null_')&&v.id!=='baseline')){
            effects[v.id]=[...std(vectors[v.id].short,bS),...std(vectors[v.id].long,bL)];
          }
          const ref=effects.shared_k2,conf={};
          for(const [k,v] of Object.entries(effects))conf[k]={cosine_vs_shared_k2:cos(ref,v),scalar_fit_from_shared_k2:fitScale(ref,v),history_contrast_cosine_vs_shared_k2:cos(contrasts.shared_k2,contrasts[k])};
          const out={
            status:'passed',
            scientific_role:'engineering_identifiability_only_no_biological_fit',
            simulations_per_variant_per_condition:300,
            baseline_kappa:2,
            sampled_first_moment: moments,
            variants,
            exact_null_mismatches:nullMismatch,
            equal_strength_common_search_short_long_mismatches:commonMismatch,
            H3_event_prefix:{comparisons:prefixCompared,time_mismatches:prefixTimeMismatch,baseline_angle_mismatches:prefixAngleMismatch},
            metric_vector_order_per_condition:['mean_time_to_exit_s','mean_middle_zone_fraction','mean_beeline_mm','p_left','p_right','p_top','p_bottom','p_timeout'],
            vectors,
            standardized_effect_confounding:conf,
            search_component_usage:Object.fromEntries(Object.entries(usage).map(([k,v])=>[k,Object.fromEntries(Object.entries(v).map(([c,[a,n]])=>[c,{search_turns:a,total_turns:n,fraction:n?a/n:0}]))])),
            interpretation_guard:'No variant was ranked against Poissonnier reference outcomes.'
          };
          fs.writeFileSync('/tmp/h5-dispersion-node.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          NODE

      - name: Start Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..100}; do if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then exit 0; fi; sleep .2; done
          cat /tmp/chrome.log || true
          exit 1

      - name: Chromium dispersion mirror
        run: |
          set -euo pipefail
          cat >/tmp/h5-dispersion-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms)),tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0],ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!AntLabIntegrity&&!!AntLabCore&&!!AntLabH3"))break;await sleep(100);}
          const report=await evalv(`(async()=>{
            const j=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json();},clone=x=>JSON.parse(JSON.stringify(x));
            const geometry=await j('./reference/poissonnier2026_open_arena_measurement_geometry_v1.json'),policy=await j('./reference/poissonnier2026_open_arena_measurement_policy_v1.json');
            const app0=await j('./apparatus/poissonnier2026_open_arena.json'),short0=await j('./experiments/open_arena_short_control.json'),long0=await j('./experiments/open_arena_long_control.json'),model0=await j('./models/lasius_niger_locomotion_h3_v1.json'),state=await j('./states/naive_outbound_v1.json'),obs0=await j('./observations/poissonnier2026_tracking_25fps.json'),scoring=await j('./scoring/open_arena_first_border_v1.json');
            model0.reorientation_gate.effect.max_hazard_reduction_fraction=0;
            const variants=[{id:'baseline',k:2,a200:0,a1000:0},{id:'k1',k:1,a200:.6,a1000:.3},{id:'k2',k:2,a200:.6,a1000:.3},{id:'k4',k:4,a200:.6,a1000:.3},{id:'k8',k:8,a200:.6,a1000:.3},{id:'common',k:2,a200:.3,a1000:.3},{id:'null20',k:20,a200:0,a1000:0}],colonies=[0,7,16,20,21,27],rows=Object.fromEntries(variants.map(v=>[v.id,{short:[],long:[]}]));
            const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;let nullMismatch=0,commonMismatch=0,prefixTime=0,prefixAngle=0,prefixN=0;
            for(let fi=0;fi<colonies.length;fi++){const held=colonies[fi],pool=geometry.rows.filter(r=>r.colony!==held).sort((a,b)=>a.ant_id-b.ant_id);
              for(let i=0;i<8;i++){const seed=990000+fi*10000+i,rr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,policy.geometry_sampler.rng_stream_name)),row=pool[Math.min(pool.length-1,Math.floor(rr.next()*pool.length))],hr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,'h5_dispersion_shared_entry_heading')),heading=hr.next()*2*Math.PI-Math.PI,trial={};
                for(const cond of ['short','long']){const exp0=cond==='short'?short0:long0,ak=cond==='short'?'a200':'a1000';
                  for(const v of variants){const exp=clone(exp0),app=clone(app0),obs=clone(obs0),model=clone(model0);exp.model=model.id;app.world.width=row.arena_width_mm;app.world.height=row.arena_height_mm;const rect=app.geometry.primitives.find(p=>p.type==='rect');rect.width=row.arena_width_mm;rect.height=row.arena_height_mm;app.entry_points.default={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};app.entry_points.center={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};exp.protocol.entry_state.position_jitter_mm=0;obs.metric_definitions.central_zone_fraction.center_y_mm=row.entry_reference_y_mm;obs.metric_definitions.central_zone_fraction.half_width_mm=10;
                    const sim=new AntLabIntegrity.Simulation({experiment:exp,model,apparatus:app,state,observation:obs,scoring},seed);sim.ants[0].heading=heading;sim.__h5diag={alpha:v[ak],searchKappa:v.k,originX:row.entry_reference_x_mm,originY:row.entry_reference_y_mm,worldW:row.arena_width_mm,worldH:row.arena_height_mm};const sx=sim.ants[0].x,sy=sim.ants[0].y,s=sim.runUntilComplete(exp.duration_s,AntLabIntegrity.FIXED_DT),o=s.observed_metrics.ants[0],ex=o.exit_coordinate_mm,ev=sim.events.filter(e=>e.type==='h3_reorientation'),rec={time:o.time_to_arena_edge_s??exp.duration_s,zone:o.central_zone_fraction??0,beeline:ex?Math.hypot(ex.x-sx,ex.y-sy):0,x:sim.ants[0].x,y:sim.ants[0].y,heading:sim.ants[0].heading,events:ev.map(e=>[e.time,e.angle_rad])};rows[v.id][cond].push(rec);trial[v.id+'_'+cond]=rec;
                  }
                  const ref=trial['k2_'+cond];for(const vid of ['k1','k4','k8']){const z=trial[vid+'_'+cond],n=Math.min(ref.events.length,z.events.length);for(let q=0;q<n;q++){prefixN++;if(Math.abs(ref.events[q][0]-z.events[q][0])>1e-10)prefixTime++;if(Math.abs(ref.events[q][1]-z.events[q][1])>1e-12)prefixAngle++;}}
                }
                for(const cond of ['short','long'])if(JSON.stringify(trial['baseline_'+cond])!==JSON.stringify(trial['null20_'+cond]))nullMismatch++;
                if(JSON.stringify(trial.common_short)!==JSON.stringify(trial.common_long))commonMismatch++;
              }
            }
            const summary={};for(const [k,v] of Object.entries(rows))summary[k]={short:{n:v.short.length,time:mean(v.short.map(x=>x.time)),zone:mean(v.short.map(x=>x.zone)),beeline:mean(v.short.map(x=>x.beeline))},long:{n:v.long.length,time:mean(v.long.map(x=>x.time)),zone:mean(v.long.map(x=>x.zone)),beeline:mean(v.long.map(x=>x.beeline))}};
            return{status:'passed',simulations_per_variant_per_condition:48,summary,exact_null_mismatches:nullMismatch,common_search_short_long_mismatches:commonMismatch,H3_event_prefix:{comparisons:prefixN,time_mismatches:prefixTime,baseline_angle_mismatches:prefixAngle}};
          })()`);
          const forbidden=requests.filter(u=>/neutral_y_maze|\/y_maze|\/y-maze/i.test(u));if(exceptions.length||consoleErrors.length||forbidden.length)throw new Error('browser firewall failure');
          report.browser={exceptions:0,console_errors:0,ymaze_requests:0};
          fs.writeFileSync('/tmp/h5-dispersion-browser.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/h5-dispersion-browser.mjs

      - name: Restore audited runtime and prove no diagnostic leak
        run: |
          set -euo pipefail
          cp /tmp/h3-original.js src/h3.js
          git diff --exit-code -- src/h3.js
          node --check src/h3.js
          for f in tests/h3-reorientation.test.js tests/rng-streams.test.js tests/integrity-firewall.test.js; do node "$f"; done
          if grep -R -n 'h5Diag' src models experiments states apparatus scoring observations; then
            echo 'temporary H5 diagnostic leaked into persistent runtime' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: h5-search-dispersion-stress-audit
          path: |
            /tmp/h5-dispersion-vm.json
            /tmp/h5-dispersion-node.json
            /tmp/h5-dispersion-browser.json
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
