name: H5 search-dispersion final validation
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate exact frozen mechanism state
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_origin_referenced_search_v1.draft.json)" = "71f1f24a6fb1d368341590790388e0c378165718"
          test "$(git hash-object reports/h5_search_dispersion_choice_audit_v1.json)" = "a77a0f49de656b7aba75491de7eb04f6b9f07ccd"
          test "$(git hash-object reports/h5_history_response_choice_audit_v1.json)" = "37d5e0a28f2ed75cc45297ca19d0ed66db45cad6"
          test "$(git hash-object reports/h5_radial_gate_choice_audit_v1.json)" = "66f0d0204979a17ade267b41c387ed872679115a"
          test "$(git hash-object reports/h5_effect_scope_choice_audit_v1.json)" = "d56f1ab242125773905b922e0686e0cceb22bb7e"
          test "$(git hash-object reports/h5_temporal_drive_choice_audit_v1.json)" = "0ec424889ee4c9745af30f70cca7c8b7152bb490"
          test "$(git hash-object reports/h5_biological_origin_choice_audit_v1.json)" = "2378fa54ad4174141f213ed44be3c283706975de"
          test "$(git hash-object src/h3.js)" = "9bb8fc966a5aa4d4173f9bda2020c6d9cd9368f1"
          test "$(git hash-object models/lasius_niger_locomotion_h3_v1.json)" = "fe33c31facfcabb7ddeb9a7bedf71ac248ad8e84"
          test "$(git hash-object hypotheses/h3_parameter_estimation_v1.json)" = "9a000a4369d97ca3aa3cb34ceda1ccbc96373dc9"
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('hypotheses/h5_origin_referenced_search_v1.draft.json','utf8'));
          const r=JSON.parse(fs.readFileSync('reports/h5_search_dispersion_choice_audit_v1.json','utf8'));
          const hp=JSON.parse(fs.readFileSync('hypotheses/h3_parameter_estimation_v1.json','utf8'));
          if(d.schema_version!==10) throw new Error('unexpected H5 draft schema');
          if(d.firewall.mechanism_not_frozen!==false||d.firewall.mechanism_frozen!==true||d.firewall.H5_biological_mechanism_frozen!==true) throw new Error('H5 mechanism not frozen');
          if(d.firewall.H5_estimator_policy_still_unfrozen!==true) throw new Error('estimator policy should remain unfrozen');
          if(d.firewall.H5_runtime_implementation_allowed_before_estimator_policy_freeze!==false||d.firewall.parameter_search_allowed!==false) throw new Error('implementation/search firewall drift');
          if(d.search_dispersion_decision.selected_rule!=='reuse_baseline_H3_turn_concentration_exactly') throw new Error('draft dispersion rule mismatch');
          if(d.firewall.H5_separate_search_concentration_forbidden!==true) throw new Error('separate search kappa firewall missing');
          if(r.decision.selected_rule!=='reuse_baseline_H3_turn_concentration_exactly'||r.firewall.separate_H5_search_concentration_forbidden!==true) throw new Error('dispersion report mismatch');
          if(d.biological_origin_decision.selected_origin!=='central_physical_entry_reference') throw new Error('origin drift');
          if(d.temporal_drive_decision.selected_profile!=='constant_over_observed_arena_traversal') throw new Error('temporal drift');
          if(d.effect_scope_decision.selected_scope!=='conditional_reorientation_direction_only') throw new Error('effect-scope drift');
          if(d.radial_gate_decision.selected_gate!=='boundary_normalized_linear') throw new Error('radial drift');
          if(d.history_response_decision.selected_representation!=='observed_level_effective_search_amplitudes') throw new Error('history drift');
          const kspec=hp.estimated_parameters.baseline_turn_concentration;
          if(JSON.stringify(kspec.bounds)!=='[0,20]') throw new Error('H3 kappa bounds drift');
          if(d.firewall.ymaze_access!==false||r.firewall.ymaze_access!==false) throw new Error('Y-maze firewall drift');
          NODE
          if grep -R -n -E 'h5Diag|biology_h5_search|alpha_search_200|alpha_search_1000|search_concentration|search_kappa|kappa_search' src models experiments states apparatus scoring observations; then
            echo 'Persistent H5 runtime unexpectedly present' >&2
            exit 1
          fi

      - name: Practical shared-kappa numerical gate
        run: |
          set -euo pipefail
          node <<'NODE'
          const core=require('./src/sim-core.js');
          const h3=require('./src/h3.js');
          const ks=[0,.25,.5,1,2,4,8,20],out={};
          for(const k of ks){
            const rng=new core.RNG(700000+Math.round(k*1000));
            let c=0,s=0,n=10000;
            for(let i=0;i<n;i++){
              const a=h3.sampleVonMises(rng,k);
              if(!Number.isFinite(a)||a < -Math.PI-1e-12||a > Math.PI+1e-12) throw new Error('bad VM sample k='+k);
              c+=Math.cos(a);s+=Math.sin(a);
            }
            out[k]={mean_cos:c/n,mean_sin:s/n};
          }
          if(Math.abs(out[0].mean_cos)>.04||Math.abs(out[0].mean_sin)>.04) throw new Error('kappa=0 not approximately uniform');
          if(!(out[2].mean_cos>.6&&out[2].mean_cos<.8)) throw new Error('kappa=2 moment unexpected');
          console.log(JSON.stringify({status:'passed',practical_kappa:out}));
          NODE

      - name: Y-maze-free regression gate
        run: |
          set -euo pipefail
          for f in tests/boundary-timing.test.js tests/determinism.test.js tests/experiment-definition.test.js tests/h3-reorientation.test.js tests/integrity-firewall.test.js tests/measurement-geometry-policy.test.js tests/measurement.test.js tests/open-arena-protocol.test.js tests/rng-streams.test.js tests/state-integrity.test.js; do
            node "$f"
          done

      - name: Start Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then exit 0; fi
            sleep .2
          done
          cat /tmp/chrome.log || true
          exit 1

      - name: Chromium shared-kappa and clean-baseline validation
        run: |
          cat >/tmp/h5-dispersion-final.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!AntLabIntegrity&&!!AntLabCore&&!!AntLabH3"))break;await sleep(100);}
          const report=await evalv(`(async()=>{
            const j=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json();},clone=x=>JSON.parse(JSON.stringify(x));
            const draft=await j('./hypotheses/h5_origin_referenced_search_v1.draft.json');
            const disp=await j('./reports/h5_search_dispersion_choice_audit_v1.json');
            const geometry=await j('./reference/poissonnier2026_open_arena_measurement_geometry_v1.json');
            const policy=await j('./reference/poissonnier2026_open_arena_measurement_policy_v1.json');
            const app0=await j('./apparatus/poissonnier2026_open_arena.json'),exp0=await j('./experiments/open_arena_short_control.json'),model0=await j('./models/lasius_niger_locomotion_h3_v1.json'),state=await j('./states/naive_outbound_v1.json'),obs0=await j('./observations/poissonnier2026_tracking_25fps.json'),scoring=await j('./scoring/open_arena_first_border_v1.json');
            if(draft.search_dispersion_decision.selected_rule!=='reuse_baseline_H3_turn_concentration_exactly')throw new Error('browser draft dispersion mismatch');
            if(disp.decision.selected_rule!=='reuse_baseline_H3_turn_concentration_exactly')throw new Error('browser report dispersion mismatch');
            const baselineKappa=model0.reorientation_gate.baseline.turn_concentration;
            if(baselineKappa!==2)throw new Error('browser baseline kappa drift');
            const norm=a=>{while(a<=-Math.PI)a+=2*Math.PI;while(a>Math.PI)a-=2*Math.PI;return a;};
            let piErr=0,rotErr=0;
            const rng=new AntLabCore.RNG(456789);
            for(let i=0;i<5000;i++){
              const a=AntLabH3.sampleVonMises(rng,baselineKappa);
              piErr=Math.max(piErr,Math.abs(norm(norm(Math.PI+a)-norm(-Math.PI+a))));
              const b=-2+4*(i/4999),phi=.73;
              rotErr=Math.max(rotErr,Math.abs(norm(norm(b+phi+a)-norm(b+a))-phi));
            }
            if(piErr>1e-12||rotErr>1e-12)throw new Error('browser circular invariance failed');
            const colonies=[0,7,16,20,21,27],folds={};
            model0.reorientation_gate.effect.max_hazard_reduction_fraction=0;
            for(let fi=0;fi<colonies.length;fi++){
              const held=colonies[fi],pool=geometry.rows.filter(r=>r.colony!==held).sort((a,b)=>a.ant_id-b.ant_id);let n=0;
              for(let i=0;i<2;i++){
                const seed=990000+fi*10000+i,rr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,policy.geometry_sampler.rng_stream_name)),row=pool[Math.min(pool.length-1,Math.floor(rr.next()*pool.length))];
                const exp=clone(exp0),app=clone(app0),obs=clone(obs0),model=clone(model0);exp.model=model.id;
                app.world.width=row.arena_width_mm;app.world.height=row.arena_height_mm;const rect=app.geometry.primitives.find(p=>p.type==='rect');rect.width=row.arena_width_mm;rect.height=row.arena_height_mm;
                app.entry_points.default={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};app.entry_points.center={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};exp.protocol.entry_state.position_jitter_mm=0;obs.metric_definitions.central_zone_fraction.center_y_mm=row.entry_reference_y_mm;obs.metric_definitions.central_zone_fraction.half_width_mm=10;
                const sim=new AntLabIntegrity.Simulation({experiment:exp,model,apparatus:app,state,observation:obs,scoring},seed);sim.runUntilComplete(exp.duration_s,AntLabIntegrity.FIXED_DT);n++;
              }
              folds[held]={pool_n:pool.length,simulations:n};
            }
            return{status:'passed',baseline_kappa:baselineKappa,pi_representation_error:piErr,rotation_error:rotErr,simulations:12,folds};
          })()`);
          const forbidden=requests.filter(u=>/neutral_y_maze|\/y_maze|\/y-maze/i.test(u));
          if(exceptions.length||consoleErrors.length||forbidden.length)throw new Error('browser firewall failure');
          report.browser={exceptions:0,console_errors:0,ymaze_requests:0};
          fs.writeFileSync('/tmp/h5-dispersion-final.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/h5-dispersion-final.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: h5-search-dispersion-final-validation
          path: |
            /tmp/h5-dispersion-final.json
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
