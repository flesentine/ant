name: P4 v0.3.4f history-test updater
# final helper-name correction

on:
  push:
    branches: [v0.3.4f-p4-highres-authorization]
    paths: [.github/workflows/p4-v034f-history-test-update.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct P4 estimator test helper name
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/p4-estimation.test.js')
          s=p.read_text()
          old="const a=readJson(path.join(root,'hypotheses/p4_highres_authorization_v1.json'));"
          new="const a=read('hypotheses/p4_highres_authorization_v1.json');"
          if old not in s: raise SystemExit('expected helper call not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/p4-estimation.test.js
          git commit -m "Fix P4 authorization test helper call"
          git push origin HEAD:v0.3.4f-p4-highres-authorization
