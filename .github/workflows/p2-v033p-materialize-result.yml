name: P2 v0.3.3p materialize official result
on:
  push:
    branches: [v0.3.3p-p2-result-freeze]
    paths:
      - '.github/workflows/p2-v033p-materialize-result.yml'
permissions:
  contents: write
  actions: read
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3.3p-p2-result-freeze
          fetch-depth: 0
      - name: Download exact official artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10042834346 --jq .digest)" = "sha256:228f3ff98dde77b7a0083bbe20a06c6827c033bdee662bfb044ca7d2136334a4"
          mkdir -p /tmp/p2official
          gh run download 34190528101 -n p2-v033o-official-highres -D /tmp/p2official
          test "$(wc -c </tmp/p2official/p2_response_estimation_1000x60_v1.json | tr -d ' ')" = "332793"
          test "$(sha256sum /tmp/p2official/p2_response_estimation_1000x60_v1.json | awk '{print $1}')" = "bb11e17b1f0919682a57cdc4a396adde807239476216953c2f06e99cf61688c4"
          test "$(git hash-object /tmp/p2official/p2_response_estimation_1000x60_v1.json)" = "cb3060cdbec1ab0832b1e2799c9e37e6ae8e5a72"
          test "$(wc -c </tmp/p2official/p2_response_estimation_execution_provenance_v1.json | tr -d ' ')" = "2000"
          test "$(sha256sum /tmp/p2official/p2_response_estimation_execution_provenance_v1.json | awk '{print $1}')" = "e3a4106aa6c82b439640aa196182141513d4179798b0a03e97534bec28ef3cbd"
          test "$(git hash-object /tmp/p2official/p2_response_estimation_execution_provenance_v1.json)" = "4a9a705c0ab8e9b64534a35f90f1017bf70c4a06"
          cp /tmp/p2official/p2_response_estimation_1000x60_v1.json reports/
          cp /tmp/p2official/p2_response_estimation_execution_provenance_v1.json reports/
      - name: Commit exact official bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/p2_response_estimation_1000x60_v1.json reports/p2_response_estimation_execution_provenance_v1.json
          git diff --cached --quiet && { echo "No result bytes to commit"; exit 1; }
          git commit -m "Materialize exact official P2 response result"
          git push origin HEAD:v0.3.3p-p2-result-freeze
