name: P1 v0.3.3c final audit
on:
  push:
    branches: [v0.3.3c-p1-implementation-reachability]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen P1 implementation/result chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p1_painted_trail_mechanism_v1.json)" = "90e86bce29bf45c6e390f7046a6c25a74f409c78"
          test "$(git hash-object hypotheses/p1_reachability_execution_v1.json)" = "282a95ec6761acd8d94163b25f712f191181f2ff"
          test "$(git hash-object hypotheses/p1_implementation_authorization_v1.json)" = "f9fbaeb63c72de7a639d54b597f5c1247d354e20"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test "$(git hash-object models/lasius_niger_painted_trail_p1_v1.json)" = "73873fd6763838423ca27648136bb0b9ff062817"
          test "$(git hash-object apparatus/poissonnier2026_open_arena_p1_v1.json)" = "df589d6b39c1617a7dedc3bfa9d34a408c51b2f4"
          test "$(git hash-object experiments/open_arena_p1_zero_dose_reachability.json)" = "6e47fa91143ed5d4d2b52bf2c555246b7d216297"
          test "$(git hash-object experiments/open_arena_p1_nominal_dose_reachability.json)" = "8232d378195304f2a15aa76da8abf108d94f2c58"
          test "$(git hash-object tools/run-p1-reachability.js)" = "42f2a4c27bec95394052fd080ce58bdf70db337b"
          test "$(git hash-object reports/p1_reference_free_reachability_v1.json)" = "5a8da255db2eb8a9e2b6dc51a7bd8d30a0e429ed"
          test "$(sha256sum reports/p1_reference_free_reachability_v1.json | awk '{print $1}')" = "6a992cd0a19fefd5d3afbd5fc0b919c55d0b24fbeda9dc5c6d047a758e747fcb"
          test "$(git hash-object hypotheses/p1_reachability_result_freeze_v1.json)" = "e9187ff27fb04015ded038a5f98354995455e377"
          test "$(git hash-object models/lasius_niger_locomotion_v1.json)" = "2fde196d6c8a9353c1c8c206d4fcef223e92ad1d"
          test "$(git hash-object src/sim-core.js)" = "24777aac3577d442893e4779d70aee4e27761fe8"
          test "$(git hash-object src/integrity.js)" = "f23c68a6955832b70eeb3bd3e6893d71a3759018"
          test ! -e .github/workflows/p1-official-reachability.yml
          test ! -e .github/workflows/p1-install-reachability-result.yml
      - name: Verify report semantics and closed firewalls
        shell: bash
        run: |
          mkdir -p /tmp/p1-final
          node - <<'NODE'
          const fs=require('fs');
          const r=require('./reports/p1_reference_free_reachability_v1.json');
          const f=require('./hypotheses/p1_reachability_result_freeze_v1.json');
          if(r.status!=='reference_free_reachability_passed'||r.structural_checks.overall_pass!==true)throw new Error('P1 reachability result not passed');
          if(r.execution_repo_commit!=='da177e90b270d0ed62f627ec1621f7fe2e2ed1ed')throw new Error('P1 execution head drift');
          for(const k of ['fit_performed','parameter_search_performed','reference_targets_accessed','reference_outcomes_accessed','ymaze_accessed','selection_performed','canonical_model_updated'])if(r[k]!==false)throw new Error('firewall drift '+k);
          if(f.interpretation.response_parameter_search_authorized!==false||f.interpretation.canonical_promotion_authorized!==false||f.interpretation.ymaze_unlock_authorized!==false)throw new Error('post-reachability authorization too broad');
          if(r.attraction_panel.trials_per_condition!==400||r.identity_panel.seeds.length!==32)throw new Error('frozen execution size drift');
          const out={status:'passed',result_blob:f.result.git_blob_sha,central_zone_delta:r.attraction_panel.differences.central_zone_fraction,trail_axis_delta:r.attraction_panel.differences.trail_axis_exit_rate,response_search_authorized:f.interpretation.response_parameter_search_authorized,ymaze_authorized:f.interpretation.ymaze_unlock_authorized};
          fs.writeFileSync('/tmp/p1-final/result-semantics.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));
          NODE
      - name: Run full H0-H5 plus P1 suite
        run: ./tests/run-tests.sh
      - name: Build P1 Node parity reference
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),p1=require('./src/p1.js'),{loadBundle}=require('./tools/load-bundle.js');
          const cases=[];
          for(const experiment of ['open_arena_p1_zero_dose_reachability.json','open_arena_p1_nominal_dose_reachability.json'])for(const seed of [1334001,1334077,1334219,1334400]){
            const b=loadBundle(experiment,{modelId:'lasius_niger_painted_trail_p1_v1'}),sim=new p1.Simulation(b,seed),summary=sim.runUntilComplete(b.experiment.duration_s,.02),a=sim.ants[0],o=summary.observed_metrics.ants[0];
            cases.push({experiment,seed,x:a.x,y:a.y,heading:a.heading,completedAt:a.completedAt,distance:a.distanceTravelled,rng:a.rng.state,speedFactor:a.speedFactor,pauseRemaining:a.pauseRemaining,state:a.state,steeringSamples:a.p1SteeringSamples,centralZone:o.central_zone_fraction,movingSpeed:o.mean_moving_speed_mm_s,time:o.time_to_arena_edge_s,exit:o.exit_coordinate_mm});
          }
          fs.writeFileSync('/tmp/p1-final/node-parity.json',JSON.stringify(cases,null,2));console.log(JSON.stringify({status:'passed',cases:cases.length}));
          NODE
      - name: Real Chromium final P1 audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/p1-final/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/p1-final-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p1-final-chrome --remote-debugging-port=9222 about:blank >/tmp/p1-final/chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/tmp/p1-final/chrome-version.json 2>/dev/null && break; sleep .2; done
          cat >/tmp/p1-final/browser.mjs <<'NODE'
          import fs from 'node:fs';
          const refs=JSON.parse(fs.readFileSync('/tmp/p1-final/node-parity.json','utf8'));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<100;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabIntegrity"))break;await new Promise(r=>setTimeout(r,50));}
          const title=await evalv('document.title');
          const p1Default=await evalv("typeof globalThis.AntLabP1!=='undefined'");
          if(p1Default)throw new Error('canonical browser must not auto-load P1');
          const report=await evalv("(async()=>await (await fetch('./reports/p1_reference_free_reachability_v1.json')).json())()");
          const freeze=await evalv("(async()=>await (await fetch('./hypotheses/p1_reachability_result_freeze_v1.json')).json())()");
          if(report.status!=='reference_free_reachability_passed'||report.structural_checks.overall_pass!==true)throw new Error('browser report mismatch');
          if(freeze.status!=='reference_free_reachability_passed_frozen'||freeze.interpretation.response_parameter_search_authorized!==false)throw new Error('browser freeze mismatch');
          await evalv(`new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='./src/p1.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s);})`);
          if(!(await evalv("typeof globalThis.AntLabP1==='object'")))throw new Error('P1 browser runtime failed to load explicitly');
          const cases=await evalv(`(async()=>{const json=async p=>(await fetch(p)).json(),defs=${JSON.stringify(refs.map(x=>({experiment:x.experiment,seed:x.seed})))},out=[];for(const d of defs){const experiment=await json('./experiments/'+d.experiment);const [model,apparatus,state,observation,scoring]=await Promise.all([json('./models/'+experiment.model+'.json'),json('./apparatus/'+experiment.apparatus+'.json'),json('./states/'+experiment.state+'.json'),json('./observations/'+experiment.observation+'.json'),json('./scoring/'+experiment.scoring+'.json')]);const sim=new AntLabP1.Simulation({experiment,model,apparatus,state,observation,scoring},d.seed),summary=sim.runUntilComplete(experiment.duration_s,.02),a=sim.ants[0],o=summary.observed_metrics.ants[0];out.push({experiment:d.experiment,seed:d.seed,x:a.x,y:a.y,heading:a.heading,completedAt:a.completedAt,distance:a.distanceTravelled,rng:a.rng.state,speedFactor:a.speedFactor,pauseRemaining:a.pauseRemaining,state:a.state,steeringSamples:a.p1SteeringSamples,centralZone:o.central_zone_fraction,movingSpeed:o.mean_moving_speed_mm_s,time:o.time_to_arena_edge_s,exit:o.exit_coordinate_mm});}return out;})()`);
          const near=(a,b,t=2e-10)=>{if(a==null||b==null){if(a!==b)throw new Error('null mismatch');return;}if(Math.abs(a-b)>t)throw new Error('numeric mismatch '+a+' '+b);};
          if(cases.length!==refs.length)throw new Error('case count mismatch');
          for(let i=0;i<refs.length;i++){const a=refs[i],b=cases[i];for(const k of ['experiment','seed','rng','state','steeringSamples'])if(a[k]!==b[k])throw new Error(k+' mismatch');for(const k of ['x','y','heading','completedAt','distance','speedFactor','pauseRemaining','centralZone','movingSpeed','time'])near(a[k],b[k]);if(a.exit==null||b.exit==null){if(a.exit!==b.exit)throw new Error('exit null mismatch');}else{near(a.exit.x,b.exit.x);near(a.exit.y,b.exit.y);}}
          const yreq=requests.filter(u=>/y[_-]?maze/i.test(u)),targetReq=requests.filter(u=>u.includes('poissonnier2026_pheromone_response_targets.json'));
          if(exceptions.length||consoleErrors.length||yreq.length||targetReq.length)throw new Error('browser firewall failure');
          const out={status:'passed',title,cases:cases.length,canonical_auto_loaded_p1:false,exceptions:0,console_errors:0,ymaze_requests:0,response_target_requests:0};
          fs.writeFileSync('/tmp/p1-final/browser.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));ws.close();
          NODE
          node /tmp/p1-final/browser.mjs
      - name: Upload P1 final audit
        uses: actions/upload-artifact@v4
        with:
          name: p1-v0.3.3c-final-audit
          path: /tmp/p1-final
          retention-days: 30
