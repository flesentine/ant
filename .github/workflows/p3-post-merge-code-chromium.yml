name: P3 post-merge code + Chromium recheck
on:
  push:
    branches: [audit/p3-post-merge-code-chromium]
permissions:
  contents: read
concurrency:
  group: p3-post-merge-code-chromium
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact merged-code pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/p3-v033w-official-highres.yml)" = "edadbf0756023423235c38992303a716d4d4985c"
          test "$(git hash-object hypotheses/p3_highres_execution_precondition_v1.json)" = "79d58ca1aa734ea6fd2f1e6694c958fa899a6a5f"
          test "$(git hash-object hypotheses/p3_highres_authorization_v1.json)" = "04d2c7b454143fd7073b274bff0ec9b355ec058d"
          test "$(git hash-object hypotheses/p3_response_estimation_v1.json)" = "d86eb9936e993d188f2a28faab838ba158c40f3b"
          test "$(git hash-object tools/run-p3-estimation.js)" = "5bf27bf439dca18629cdfd36f56fe767a23062ff"
          test "$(git hash-object tools/p3-estimation-core.js)" = "410ef81dfe761e3c218d072ca311632329ac1617"

      - name: Focused P3 code-structure review
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const workflow=fs.readFileSync('.github/workflows/p3-v033w-official-highres.yml','utf8');
          const runner=fs.readFileSync('tools/run-p3-estimation.js','utf8');
          const core=fs.readFileSync('tools/p3-estimation-core.js','utf8');
          const app=fs.readFileSync('src/app.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const failures=[];
          const need=(ok,msg)=>{if(!ok)failures.push(msg);};

          need(/^on:\n  push:\n    branches: \[main\]\n    paths:\n      - '\.github\/workflows\/p3-v033w-official-highres\.yml'/m.test(workflow),'official trigger drift');
          need(!/^\s*pull_request:/m.test(workflow),'pull_request trigger present');
          need(!/^\s*workflow_dispatch:/m.test(workflow),'manual dispatch present');
          need(workflow.includes('test "${GITHUB_REF}" = "refs/heads/main"'),'runtime main guard missing');
          need(workflow.includes('test "${GITHUB_EVENT_NAME}" = "push"'),'runtime push guard missing');
          need(workflow.includes('cancel-in-progress: false'),'scientific cancellation policy drift');
          need(workflow.includes('node tools/run-p3-estimation.js --mode highres --out reports/p3_response_estimation_1000x60_v1.json'),'exact highres command missing');
          need(!workflow.includes('--candidates')&&!workflow.includes('--eval-trials')&&!workflow.includes('--final-trials')&&!workflow.includes('--final-seed')&&!workflow.includes('--dt'),'forbidden scientific CLI override present');

          need(runner.includes("if(a.effective_when_merged_to_main===true&&branch!=='main')"),'authorization main-effectiveness guard missing');
          need(runner.includes("P1_official_result_semantic_access_authorized!==false"),'P1 result firewall missing');
          need(runner.includes("P2_official_result_semantic_access_authorized!==false"),'P2 result firewall missing');
          need(runner.includes("canonical_promotion_authorized!==false"),'canonical firewall missing');
          need(runner.includes("ymaze_access_authorized!==false"),'Y-maze firewall missing');
          need(runner.indexOf("highResolutionPreflight({root,policy})") < runner.indexOf("loadReferenceTarget(root,policy)"),'reference target loaded before preflight');
          need(runner.includes("if(!internal_cv.P3_dual_survival_guard_passed)return"),'dual-survival early stop missing');
          need(runner.includes("canonical_locomotion_updated:false"),'canonical mutation firewall missing');

          need(core.includes("const PRIMARY_METRICS=Object.freeze(['middle_zone_fraction','trail_axis_exit'])"),'primary metric drift');
          need(core.includes("const SECONDARY_METRICS=Object.freeze(['time_to_exit_s','beeline_mm'])"),'secondary metric drift');
          need(core.includes("xs.length-1"),'n-1 sample SD denominator missing');
          need(core.includes("rows.sort((a,b)=>a.loss-b.loss||a.candidate_index-b.candidate_index)"),'tie-break drift');
          need(core.includes("nw>=5&&nm>0"),'null survival guard drift');
          need(core.includes("aw>=5&&am>0"),'absolute survival guard drift');

          need(!html.includes('./src/p3.js'),'interactive UI unexpectedly loads P3');
          need(!html.includes('./src/p1.js'),'interactive UI unexpectedly loads P1');
          need(!app.includes('poissonnier2026_pheromone_response_targets'),'interactive app references response target');
          need(!app.includes('p3_response_estimation'),'interactive app references P3 report');

          if(failures.length)throw new Error(failures.join('; '));
          console.log(JSON.stringify({status:'passed',scientific_trigger_intact:true,authorization_before_reference:true,dual_survival_intact:true,interactive_P3_loaded:false,interactive_P1_loaded:false}));
          NODE

      - name: Run permanent regression suite
        run: ./tests/run-tests.sh

      - name: Fresh Chromium canonical UI run-through
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p3-postmerge-browser
          python3 -m http.server 8080 >/tmp/p3-postmerge-http.log 2>&1 &
          SERVER_PID=$!
          CHROME=$(command -v chromium || command -v google-chrome || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p3-postmerge-chrome --remote-debugging-port=9222 about:blank >/tmp/p3-postmerge-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID >/dev/null 2>&1 || true; kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep .2; done
          cat >/tmp/p3-postmerge-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject;});
          let id=0; const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{
            const m=JSON.parse(e.data);
            if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}
            if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);
            if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);
            if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);
          };
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||JSON.stringify(r.exceptionDetails));return r.result.value;};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');
          await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete' && document.getElementById('runStatus')?.textContent==='PAUSED'"))break;await sleep(50);}
          const initial=await evalv("({title:document.title,status:document.getElementById('runStatus').textContent,model:document.getElementById('modelId').textContent,experiment:document.getElementById('experimentSelect').value,simTime:document.getElementById('simTime').textContent})");
          if(initial.title!=='ANTLAB H5'||initial.status!=='PAUSED'||initial.model!=='lasius_niger_locomotion_v1'||initial.experiment!=='open_arena_short_control.json'||initial.simTime!=='0.0 s')throw new Error('initial canonical UI state failed');
          await evalv("document.getElementById('stepBtn').click()"); await sleep(120);
          const afterStep=await evalv("({status:document.getElementById('runStatus').textContent,simTime:document.getElementById('simTime').textContent})");
          if(!(parseFloat(afterStep.simTime)>0))throw new Error('Step 1 s did not advance');
          await evalv("document.getElementById('resetBtn').click()");
          for(let i=0;i<100;i++){if(await evalv("document.getElementById('runStatus').textContent==='PAUSED' && document.getElementById('simTime').textContent==='0.0 s'"))break;await sleep(30);}
          await evalv("document.getElementById('playBtn').click()"); await sleep(250);
          const running=await evalv("({status:document.getElementById('runStatus').textContent,label:document.getElementById('playBtn').textContent,simTime:document.getElementById('simTime').textContent})");
          if(running.status!=='RUNNING'||running.label!=='Pause'||!(parseFloat(running.simTime)>0))throw new Error('Run/Pause control failed');
          await evalv("document.getElementById('playBtn').click()");
          await evalv("(()=>{const s=document.getElementById('experimentSelect');s.value='open_arena_long_control.json';s.dispatchEvent(new Event('change',{bubbles:true}));})()");
          for(let i=0;i<120;i++){if(await evalv("document.getElementById('runStatus').textContent==='PAUSED' && document.getElementById('experimentSelect').value==='open_arena_long_control.json'"))break;await sleep(50);}
          const longState=await evalv("({status:document.getElementById('runStatus').textContent,model:document.getElementById('modelId').textContent,note:document.getElementById('protocolNote').textContent})");
          if(longState.status!=='PAUSED'||longState.model!=='lasius_niger_locomotion_v1'||!longState.note.includes('100'))throw new Error('long-control UI state failed');
          await evalv("(()=>{document.getElementById('showIds').click();document.getElementById('showTrails').click();document.getElementById('showContacts').click();})()");
          const forbidden={
            response_target:requests.filter(u=>u.includes('poissonnier2026_pheromone_response_targets.json')),
            p3_runtime:requests.filter(u=>/\/src\/p3\.js(?:$|\?)/.test(u)),
            p1_runtime:requests.filter(u=>/\/src\/p1\.js(?:$|\?)/.test(u)),
            p3_result:requests.filter(u=>/p3_response_estimation_1000x60_v1\.json/.test(u)),
            p1_result:requests.filter(u=>/p1_response_estimation_(?:500x60|result_freeze)/i.test(u)),
            p2_result:requests.filter(u=>/p2_response_estimation_(?:1000x60|result_freeze)/i.test(u))
          };
          for(const [k,v] of Object.entries(forbidden))if(v.length)throw new Error(k+' requested');
          if(exceptions.length||consoleErrors.length)throw new Error('browser errors');
          const out={status:'passed',user_agent:await evalv('navigator.userAgent'),initial,after_step:afterStep,run_pause:running,long_control:longState,exceptions:exceptions.length,console_errors:consoleErrors.length,total_requests:requests.length,response_target_requests:0,P3_runtime_requests:0,P1_runtime_requests:0,P3_official_result_requests:0,P1_official_result_requests:0,P2_official_result_requests:0};
          fs.writeFileSync('/tmp/p3-postmerge-browser/browser.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out));
          ws.close();
          NODE
          node /tmp/p3-postmerge-browser.mjs

      - name: Upload Chromium recheck
        uses: actions/upload-artifact@v4
        with:
          name: p3-post-merge-code-chromium
          path: /tmp/p3-postmerge-browser
          retention-days: 14
          if-no-files-found: error
