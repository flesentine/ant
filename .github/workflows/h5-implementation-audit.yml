name: H5 implementation audit
on:
  push:
    branches: [h5-transient-heading-restoration-implementation]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen H5 specification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_transient_entry_heading_restoration_v1.json)" = "d6fe2300db09b18d2a4426d6ef7ce6324b615f94"
          node - <<'NODE'
          const f=require('./hypotheses/h5_transient_entry_heading_restoration_v1.json');
          const m=require('./models/lasius_niger_locomotion_h5_v1.json');
          if(f.development_estimation_guardrails.estimator_policy_status!=='not_yet_frozen')throw new Error('H5 estimator policy unexpectedly exists');
          const e=f.engineering_reachability_parameters,h=m.heading_restoration;
          if(h.initialization.lambda_commitment_mm!==e.lambda_commitment_mm||h.decay.tau_commitment_s!==e.tau_commitment_s||h.effect.kappa_restore_per_s!==e.kappa_restore_per_s)throw new Error('H5 model differs from frozen engineering values');
          NODE
      - name: Run full H0-H5 tests
        run: ./tests/run-tests.sh
      - name: Run frozen H5 mechanism reachability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h5-audit
          node tools/run-h5-mechanism.js --trials 400 --seed 928491 --out /tmp/h5-audit/h5-mechanism-results.json | tee /tmp/h5-audit/h5-mechanism.log
          node - <<'NODE'
          const r=require('/tmp/h5-audit/h5-mechanism-results.json');
          if(r.fit_performed||r.reference_targets_accessed||r.ymaze_accessed||r.selection_performed||r.estimator_policy_frozen)throw new Error('H5 reachability crossed a scientific guardrail');
          if(!r.structural_checks.long_commitment_exceeds_short||!r.structural_checks.all_references_captured)throw new Error('H5 structural initialization failed');
          NODE
      - name: Build Node H5 parity reference
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const {Simulation}=require('./src/h5.js');
          const {loadBundle}=require('./tools/load-bundle.js');
          const cases=[];
          for(const experiment of ['open_arena_short_control.json','open_arena_long_control.json']){
            for(const seed of [928491,928550]){
              const b=loadBundle(experiment,{modelId:'lasius_niger_locomotion_h5_v1'});
              b.observation.record_trajectories=false;
              const sim=new Simulation(b,seed);
              if(seed===928550)sim.ants[0].heading=0.731;
              const s=sim.runUntilComplete(b.experiment.duration_s,0.02),a=sim.ants[0],o=s.observed_metrics.ants[0],l=s.latent_states[0];
              cases.push({experiment,seed,pre_step_heading_override:seed===928550?0.731:null,model_hash:s.provenance.model_hash,x:a.x,y:a.y,heading:a.heading,completedAt:a.completedAt,distance:a.distanceTravelled,rng:a.rng.state,speedFactor:a.speedFactor,pauseRemaining:a.pauseRemaining,commitment:l.heading_commitment_current,commitmentInitial:l.heading_commitment_initial,reference:l.h5_heading_reference_rad,referenceCaptured:l.h5_heading_reference_captured,observedTime:o.time_to_arena_edge_s??null,observedDistance:o.total_distance_mm??null,observedStraightness:o.path_straightness??null});
            }
          }
          fs.writeFileSync('/tmp/h5-audit/node-reference.json',JSON.stringify(cases,null,2));
          NODE
      - name: Replay H5 in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/h5-audit/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/h5-chrome-profile\n          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/h5-chrome-profile --remote-debugging-port=9222 about:blank >/tmp/h5-audit/chrome.log 2>&1 &
          for i in {1..100}; do
            curl -fsS http://127.0.0.1:9222/json/version >/tmp/h5-audit/chrome-version.json 2>/dev/null && break
            sleep .2
          done
          curl -fsS http://127.0.0.1:9222/json/version >/tmp/h5-audit/chrome-version.json
          cat >/tmp/h5-audit/browser-parity.mjs <<'NODE'
          import fs from 'node:fs';
          const refs=JSON.parse(fs.readFileSync('/tmp/h5-audit/node-reference.json','utf8'));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'browser eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');
          await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<100;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabIntegrity"))break;await new Promise(r=>setTimeout(r,50));}
          const browser=await evalv(`(async()=>{
            const json=async p=>(await fetch(p)).json();
            const cases=${JSON.stringify(refs.map(r=>({experiment:r.experiment,seed:r.seed,pre_step_heading_override:r.pre_step_heading_override})))};
            const out=[];
            for(const c of cases){
              const experiment=await json('./experiments/'+c.experiment);
              experiment.model='lasius_niger_locomotion_h5_v1';
              const [model,apparatus,state,observation,scoring]=await Promise.all([
                json('./models/lasius_niger_locomotion_h5_v1.json'),
                json('./apparatus/'+experiment.apparatus+'.json'),
                json('./states/'+experiment.state+'.json'),
                json('./observations/'+experiment.observation+'.json'),
                json('./scoring/'+experiment.scoring+'.json')
              ]);
              observation.record_trajectories=false;
              const sim=new AntLabH5.Simulation({experiment,model,apparatus,state,observation,scoring},c.seed);
              if(c.pre_step_heading_override!=null)sim.ants[0].heading=c.pre_step_heading_override;
              const s=sim.runUntilComplete(experiment.duration_s,0.02),a=sim.ants[0],o=s.observed_metrics.ants[0],l=s.latent_states[0];
              out.push({experiment:c.experiment,seed:c.seed,pre_step_heading_override:c.pre_step_heading_override,model_hash:s.provenance.model_hash,x:a.x,y:a.y,heading:a.heading,completedAt:a.completedAt,distance:a.distanceTravelled,rng:a.rng.state,speedFactor:a.speedFactor,pauseRemaining:a.pauseRemaining,commitment:l.heading_commitment_current,commitmentInitial:l.heading_commitment_initial,reference:l.h5_heading_reference_rad,referenceCaptured:l.h5_heading_reference_captured,observedTime:o.time_to_arena_edge_s??null,observedDistance:o.total_distance_mm??null,observedStraightness:o.path_straightness??null});
            }
            return out;
          })()`);
          const near=(a,b,t=2e-10)=>{if(a==null||b==null){if(a!==b)throw new Error('null mismatch '+a+' '+b);return;}if(Math.abs(a-b)>t)throw new Error('numeric mismatch '+a+' '+b);};
          if(browser.length!==refs.length)throw new Error('case count mismatch');
          for(let i=0;i<refs.length;i++){
            const a=refs[i],b=browser[i];
            for(const k of ['experiment','seed','model_hash','rng','referenceCaptured'])if(a[k]!==b[k])throw new Error(k+' mismatch '+a[k]+' '+b[k]);
            for(const k of ['x','y','heading','completedAt','distance','speedFactor','pauseRemaining','commitment','commitmentInitial','reference','observedTime','observedDistance','observedStraightness'])near(a[k],b[k]);
            if(a.pre_step_heading_override!=null)near(b.reference,a.pre_step_heading_override,2e-14);
          }
          const yreq=requests.filter(u=>/y[_-]?maze|ymaze/i.test(u));
          if(yreq.length)throw new Error('Y-maze request detected '+JSON.stringify(yreq));
          if(exceptions.length)throw new Error('Browser exceptions '+JSON.stringify(exceptions));
          if(consoleErrors.length)throw new Error('Console errors '+JSON.stringify(consoleErrors));
          const report={status:'passed',cases:browser.length,exceptions:0,console_errors:0,ymaze_requests:0};
          fs.writeFileSync('/tmp/h5-audit/browser-parity-result.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          ws.close();
          NODE
          node /tmp/h5-audit/browser-parity.mjs
      - name: Upload H5 audit
        uses: actions/upload-artifact@v4
        with:
          name: h5-implementation-audit
          path: /tmp/h5-audit
          retention-days: 7
