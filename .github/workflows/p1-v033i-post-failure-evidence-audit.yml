name: P1 v0.3.3i post-failure evidence audit
on:
  push:
    branches: [v0.3.3i-post-p1-failure-characterization]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact characterization and evidence chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p1_post_failure_characterization_v1.json)" = "1befbcb097959ba698d316adea1eb0c735eccc7f"
          test "$(git hash-object hypotheses/p2_painted_trail_candidate_class_evidence_v1.json)" = "f7eb9fe38f8955c0227501e2d257ff32a40eaf74"
          test "$(git hash-object reports/p1_response_estimation_500x60_v1.json)" = "561aca4a14346ebb4f062f30d0438d3115784172"
          test "$(git hash-object hypotheses/p1_response_estimation_result_freeze_v1.json)" = "1d99ebfaa378aeb1b98963f63b3a513a616a6617"
          test "$(git hash-object hypotheses/p1_response_estimation_v1.json)" = "628d17f6eb69fd11216aff33d1356d184365aedd"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test "$(git hash-object models/lasius_niger_locomotion_v1.json)" = "2fde196d6c8a9353c1c8c206d4fcef223e92ad1d"
          test ! -e hypotheses/p2_painted_trail_mechanism_v1.json
          test ! -e hypotheses/p2_response_estimation_v1.json
          test ! -e hypotheses/p2_highres_authorization_v1.json
          test ! -e models/lasius_niger_painted_trail_p2_v1.json
          test ! -e src/p2.js
          test ! -e tools/run-p2-estimation.js
      - name: Run full H0-H5 plus P1 suite
        run: ./tests/run-tests.sh
      - name: Recheck no-rescue and no-selection semantics
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('hypotheses/p1_post_failure_characterization_v1.json','utf8'));
          const e=JSON.parse(fs.readFileSync('hypotheses/p2_painted_trail_candidate_class_evidence_v1.json','utf8'));
          const r=JSON.parse(fs.readFileSync('reports/p1_response_estimation_500x60_v1.json','utf8'));
          if(r.internal_cv.P1_wins_vs_exact_null!==4||r.internal_cv.P1_survival_guard_passed!==false||r.final_all_data_fit!==null)throw new Error('immutable P1 closure drift');
          if(c.analysis_firewall.raw_102_row_target_semantics_reloaded!==false||c.analysis_firewall.new_simulation_run!==false||c.analysis_firewall.candidate_reranking!==false||c.analysis_firewall.p2_mechanism_selected!==false||c.analysis_firewall.ymaze_accessed!==false)throw new Error('posthoc characterization firewall drift');
          if(e.selection_firewall.candidate_class_selected!==false||e.selection_firewall.p2_runtime_authorized!==false||e.selection_firewall.p2_parameter_policy_authorized!==false||e.selection_firewall.p2_reference_target_search_authorized!==false||e.selection_firewall.new_simulation_authorized!==false||e.selection_firewall.ymaze_access_authorized!==false)throw new Error('P2 evidence selection firewall drift');
          if(e.candidate_mechanism_classes.some(x=>x.status!=='plausible_class_not_selected'))throw new Error('candidate selected unexpectedly');
          NODE
      - name: Real Chromium characterization/evidence firewall
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1-v033i-audit
          python3 -m http.server 8080 >/tmp/p1-v033i-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/p1-v033i-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p1-v033i-chrome --remote-debugging-port=9222 about:blank >/tmp/p1-v033i-chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep .2; done
          cat >/tmp/p1-v033i-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabIntegrity"))break;await new Promise(r=>setTimeout(r,50));}
          const state=await evalv("(async()=>{const c=await (await fetch('./hypotheses/p1_post_failure_characterization_v1.json')).json();const e=await (await fetch('./hypotheses/p2_painted_trail_candidate_class_evidence_v1.json')).json();return{characterizationStatus:c.status,wins:c.frozen_primary_outcome.heldout_wins_vs_exact_null,newSimulation:c.analysis_firewall.new_simulation_run,p2Selected:c.analysis_firewall.p2_mechanism_selected,evidenceStatus:e.status,candidateSelected:e.selection_firewall.candidate_class_selected,p2Runtime:e.selection_firewall.p2_runtime_authorized,p2Search:e.selection_firewall.p2_reference_target_search_authorized,ymaze:e.selection_firewall.ymaze_access_authorized,classes:e.candidate_mechanism_classes.map(x=>x.status)};})()");
          if(state.characterizationStatus!=='posthoc_descriptive_characterization_frozen_no_rescue_no_p2_authorization'||state.wins!==4||state.newSimulation!==false||state.p2Selected!==false)throw new Error('browser characterization drift');
          if(state.evidenceStatus!=='candidate_class_evidence_frozen_no_mechanism_selected_no_implementation_authorized'||state.candidateSelected!==false||state.p2Runtime!==false||state.p2Search!==false||state.ymaze!==false||state.classes.some(x=>x!=='plausible_class_not_selected'))throw new Error('browser P2 evidence drift');
          const targetReq=requests.filter(u=>u.includes('poissonnier2026_pheromone_response_targets.json'));
          const yreq=requests.filter(u=>/y[_-]?maze/i.test(u));
          const p2ExecReq=requests.filter(u=>/\/(?:src\/p2\.js|tools\/run-p2-estimation\.js|models\/lasius_niger_painted_trail_p2_v1\.json|hypotheses\/p2_(?:painted_trail_mechanism|response_estimation|highres_authorization)_v1\.json)/.test(u));
          if(exceptions.length||consoleErrors.length||targetReq.length||yreq.length||p2ExecReq.length)throw new Error('browser firewall failure');
          const out={status:'passed',exceptions:exceptions.length,console_errors:consoleErrors.length,response_target_requests:targetReq.length,ymaze_requests:yreq.length,p2_executable_surface_requests:p2ExecReq.length,p1_wins:state.wins,p2_selected:false,new_simulation_authorized:false};
          fs.writeFileSync('/tmp/p1-v033i-audit/browser.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));ws.close();
          NODE
          node /tmp/p1-v033i-browser.mjs
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: p1-v033i-post-failure-evidence-audit
          path: /tmp/p1-v033i-audit
          retention-days: 30
