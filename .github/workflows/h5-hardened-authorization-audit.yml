name: H5 hardened authorization Chromium audit
on:
  push:
    branches: [h5-highres-authorization-v1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify hardened authorization pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_highres_authorization_v1.json)" = "8741ebfff852d85b319ded5dd45f282d06f2c45e"
          test "$(git hash-object hypotheses/h5_parameter_estimation_v1.json)" = "ead45bacff89bf626deaaf3238a5c363b74279d1"
          test "$(git hash-object tools/run-h5-estimation.js)" = "7d4a68f024c09c111a38088be2c943b7de74b464"
          test "$(git hash-object reports/h5_estimator_qualification_v1.json)" = "da5afe375fccb54e38b9bf3ef6d9879e2e03270d"
          test "$(git hash-object src/h5.js)" = "b43f8e9fcaa4b2cc9981ed4f2922a833cc1a3177"
          test ! -e reports/h5_parameter_estimation_500x60_v1.json
      - name: Run full H0-H5 regression suite
        run: ./tests/run-tests.sh
      - name: Re-run reference-free qualification and verify exact report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h5-hardened
          node tools/run-h5-estimation.js --mode qualification --trials 3 --out /tmp/h5-hardened/qualification.json > /tmp/h5-hardened/qualification.log
          test "$(git hash-object /tmp/h5-hardened/qualification.json)" = "da5afe375fccb54e38b9bf3ef6d9879e2e03270d"
          node - <<'NODE'
          const q=require('/tmp/h5-hardened/qualification.json');
          if(q.status!=='passed'||q.reference_outcomes_accessed!==false||q.ymaze_accessed!==false||q.scientific_evidence!==false)throw new Error('qualification firewall failure');
          NODE
      - name: Prove review branch cannot execute high-resolution
        shell: bash
        run: |
          set -euo pipefail
          if node tools/run-h5-estimation.js --mode highres --out /tmp/h5-hardened/should-not-exist.json >/tmp/h5-hardened/highres.stdout 2>/tmp/h5-hardened/highres.stderr; then
            echo "high-resolution unexpectedly ran on review branch" >&2
            exit 1
          fi
          grep -q "not effective until merged to main" /tmp/h5-hardened/highres.stderr
          test ! -e /tmp/h5-hardened/should-not-exist.json
      - name: Prove exact authorization accepts main preflight
        shell: bash
        run: |
          node - <<'NODE'
          const h5e=require('./tools/run-h5-estimation.js');
          const a=h5e.assertHighResolutionAuthorized(process.cwd(),null,{branchName:'main'});
          if(a.high_resolution_search_authorized!==true||a.estimator_git_blob_sha!=='7d4a68f024c09c111a38088be2c943b7de74b464')throw new Error('main preflight failed');
          if(a.ymaze_access_authorized!==false||a.canonical_promotion_authorized!==false)throw new Error('authorization scope too broad');
          console.log(JSON.stringify({status:'passed',review_branch_highres:false,simulated_main_preflight:true,ymaze_access_authorized:false,canonical_promotion_authorized:false}));
          NODE
      - name: Run low-resolution execution smoke
        shell: bash
        run: |
          set -euo pipefail
          node tools/run-h5-estimation.js --mode smoke --candidates 8 --trials 4 --eval-trials 8 --seed 1110000 --out /tmp/h5-hardened/smoke.json >/tmp/h5-hardened/smoke.log
          node - <<'NODE'
          const r=require('/tmp/h5-hardened/smoke.json');
          if(r.status!=='execution_path_smoke_only_not_evidence'||r.scientific_evidence!==false||r.ymaze_accessed!==false)throw new Error('smoke mislabeled');
          NODE
      - name: Build Node parity reference
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),h5e=require('./tools/run-h5-estimation.js'),h5=require('./src/h5.js');
          const {loadBundle,readJson}=require('./tools/load-bundle.js'),smoke=require('/tmp/h5-hardened/smoke.json');
          const base=readJson('./models/lasius_niger_locomotion_h5_v1.json'),f=smoke.folds[0];
          const inflate=(c,k)=>({angular_sigma_rad_sqrt_s:c.angular_sigma_rad_sqrt_s,q:c.q,lambda_commitment_mm:c.lambda_commitment_mm==null?500:c.lambda_commitment_mm,tau_commitment_s:c.tau_commitment_s==null?5:c.tau_commitment_s,kappa_restore_per_s:k==='null'?0:(c.kappa_restore_per_s??0)});
          const selected=[{kind:'null',candidate:inflate(f.H5_null.fit.candidate,'null')},{kind:'context',candidate:inflate(f.H5_context.fit.candidate,'context')}],cases=[];
          for(const sel of selected){const model=h5e.configuredModel(base,sel.candidate);for(const experiment of ['open_arena_short_control.json','open_arena_long_control.json'])for(const seed of [1910000,1910001]){
            const b=loadBundle(experiment,{modelId:model.id});b.model=JSON.parse(JSON.stringify(model));b.observation.record_trajectories=false;
            const sim=new h5.Simulation(b,seed);h5e.applySharedEntryTransition(sim,seed,sel.candidate.q);const sx=sim.ants[0].x,sy=sim.ants[0].y;
            const s=sim.runUntilComplete(b.experiment.duration_s,0.02),a=sim.ants[0],l=s.latent_states[0],o=s.observed_metrics.ants[0],ex=o.exit_coordinate_mm;
            cases.push({kind:sel.kind,candidate:sel.candidate,experiment,seed,x:a.x,y:a.y,heading:a.heading,completedAt:a.completedAt,distance:a.distanceTravelled,rng:a.rng.state,speedFactor:a.speedFactor,pauseRemaining:a.pauseRemaining,reference:l.h5_heading_reference_rad,commitment:l.heading_commitment_current,time:o.time_to_arena_edge_s??b.experiment.duration_s,zone:o.central_zone_fraction??0,beeline:ex?Math.hypot(ex.x-sx,ex.y-sy):0,edge:h5e.exitEdge(ex,sim.apparatus.world.width,sim.apparatus.world.height)});
          }}
          fs.writeFileSync('/tmp/h5-hardened/node-parity.json',JSON.stringify(cases,null,2));
          NODE
      - name: Real Chromium parity and authorization UI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/h5-hardened/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/h5-auth-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/h5-auth-chrome --remote-debugging-port=9222 about:blank >/tmp/h5-hardened/chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/tmp/h5-hardened/chrome-version.json 2>/dev/null && break; sleep .2; done
          cat >/tmp/h5-hardened/browser.mjs <<'NODE'
          import fs from 'node:fs';
          const refs=JSON.parse(fs.readFileSync('/tmp/h5-hardened/node-parity.json','utf8')),tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<100;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabH5"))break;await new Promise(r=>setTimeout(r,50));}
          const body=await evalv('document.body.innerText');
          if(!body.includes('H5 high-resolution authorized')||!body.includes('official search not yet run'))throw new Error('authorization UI status mismatch');
          const browser=await evalv(`(async()=>{const json=async p=>(await fetch(p)).json(),cases=${JSON.stringify(refs.map(r=>({kind:r.kind,candidate:r.candidate,experiment:r.experiment,seed:r.seed})))},out=[];for(const c of cases){const experiment=await json('./experiments/'+c.experiment);experiment.model='lasius_niger_locomotion_h5_v1';const [model,apparatus,state,observation,scoring]=await Promise.all([json('./models/lasius_niger_locomotion_h5_v1.json'),json('./apparatus/'+experiment.apparatus+'.json'),json('./states/'+experiment.state+'.json'),json('./observations/'+experiment.observation+'.json'),json('./scoring/'+experiment.scoring+'.json')]);model.movement.angular_sigma_rad_sqrt_s=c.candidate.angular_sigma_rad_sqrt_s;model.heading_restoration.initialization.lambda_commitment_mm=c.candidate.lambda_commitment_mm;model.heading_restoration.decay.tau_commitment_s=c.candidate.tau_commitment_s;model.heading_restoration.effect.kappa_restore_per_s=c.candidate.kappa_restore_per_s;observation.record_trajectories=false;const sim=new AntLabH5.Simulation({experiment,model,apparatus,state,observation,scoring},c.seed),rr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(c.seed,'h2_estimation_entry_transition_v1'));if(rr.next()>c.candidate.q)sim.ants[0].heading=rr.next()*2*Math.PI-Math.PI;const sx=sim.ants[0].x,sy=sim.ants[0].y,s=sim.runUntilComplete(experiment.duration_s,0.02),a=sim.ants[0],l=s.latent_states[0],o=s.observed_metrics.ants[0],ex=o.exit_coordinate_mm,edge=ex?Object.entries({left:Math.abs(ex.x),right:Math.abs(ex.x-sim.apparatus.world.width),top:Math.abs(ex.y),bottom:Math.abs(ex.y-sim.apparatus.world.height)}).sort((a,b)=>a[1]-b[1])[0][0]:'timeout';out.push({kind:c.kind,candidate:c.candidate,experiment:c.experiment,seed:c.seed,x:a.x,y:a.y,heading:a.heading,completedAt:a.completedAt,distance:a.distanceTravelled,rng:a.rng.state,speedFactor:a.speedFactor,pauseRemaining:a.pauseRemaining,reference:l.h5_heading_reference_rad,commitment:l.heading_commitment_current,time:o.time_to_arena_edge_s??experiment.duration_s,zone:o.central_zone_fraction??0,beeline:ex?Math.hypot(ex.x-sx,ex.y-sy):0,edge});}return out;})()`);
          const near=(a,b,t=2e-10)=>{if(Math.abs(a-b)>t)throw new Error('numeric mismatch '+a+' '+b);};if(browser.length!==refs.length)throw new Error('case count');
          for(let i=0;i<refs.length;i++){const a=refs[i],b=browser[i];for(const k of ['kind','experiment','seed','rng','edge'])if(a[k]!==b[k])throw new Error(k+' mismatch');for(const k of ['x','y','heading','completedAt','distance','speedFactor','pauseRemaining','reference','commitment','time','zone','beeline'])near(a[k],b[k]);}
          const yreq=requests.filter(u=>/y[_-]?maze|ymaze/i.test(u));if(yreq.length)throw new Error('Y-maze request');if(exceptions.length)throw new Error('exceptions');if(consoleErrors.length)throw new Error('console errors');
          const report={status:'passed',cases:browser.length,review_branch_highres_blocked:true,simulated_main_preflight:true,exceptions:0,console_errors:0,ymaze_requests:0};fs.writeFileSync('/tmp/h5-hardened/browser-result.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));ws.close();
          NODE
          node /tmp/h5-hardened/browser.mjs
      - name: Upload hardened authorization audit
        uses: actions/upload-artifact@v4
        with:
          name: h5-hardened-authorization-audit
          path: /tmp/h5-hardened
          retention-days: 7
