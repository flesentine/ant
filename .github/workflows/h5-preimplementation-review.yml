name: H5 preimplementation review
on:
  push:
    branches: [h5-transient-heading-restoration-v1]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reviewed H5 freeze and browser copy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_transient_entry_heading_restoration_v1.json)" = "d6fe2300db09b18d2a4426d6ef7ce6324b615f94"
          grep -q "ANTLAB H5" index.html
          grep -q "H4 failed promotion" index.html
          ! grep -q "H4 parameter search has not been authorized" index.html
          ! grep -q "it has not been fitted, searched, or promoted" index.html
      - name: Run full implementation tests
        run: ./tests/run-tests.sh
      - name: Exercise current branch in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/h5-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/h5-chrome.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/h5-chrome-version.json 2>/dev/null; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:9222/json/version >/tmp/h5-chrome-version.json
          cat > /tmp/h5-browser-review.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
          let id=0;
          const pending=new Map(), exceptions=[], consoleErrors=[], requests=[];
          ws.onmessage=e=>{
            const m=JSON.parse(e.data);
            if(m.id&&pending.has(m.id)){
              const p=pending.get(m.id); pending.delete(m.id);
              m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);
            }
            if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);
            if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);
            if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);
          };
          const send=(method,params={})=>new Promise((resolve,reject)=>{
            const n=++id; pending.set(n,{resolve,reject}); ws.send(JSON.stringify({id:n,method,params}));
          });
          const evalv=async expression=>{
            const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});
            if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'browser eval failed');
            return r.result.value;
          };
          const waitFor=async(expr,label)=>{
            for(let i=0;i<100;i++){ if(await evalv(expr)) return; await sleep(75); }
            throw new Error('Timed out waiting for '+label);
          };
          await send('Runtime.enable');
          await send('Network.enable');
          await send('Page.enable');
          await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          await waitFor("document.readyState==='complete' && !!globalThis.AntLabIntegrity && document.getElementById('runStatus')?.textContent==='PAUSED'",'initial lab load');
          const initial=await evalv("({title:document.title,h1:document.querySelector('h1')?.innerText,model:document.getElementById('modelId')?.textContent,hash:document.getElementById('modelHash')?.textContent,status:document.getElementById('runStatus')?.textContent,footer:document.querySelector('footer')?.innerText,inspector:document.querySelector('.inspector')?.innerText})");
          if(initial.title!=='ANTLAB H5')throw new Error('Unexpected title '+initial.title);
          if(!/H5/.test(initial.h1||''))throw new Error('H5 header missing');
          if(!/H4 failed promotion/.test(initial.footer||''))throw new Error('H4 result missing from footer');
          if(/H4 parameter search has not been authorized|has not been fitted, searched, or promoted/.test((initial.footer||'')+' '+(initial.inspector||'')))throw new Error('Stale H4 UI text remains');
          const shortModel=initial.model, shortHash=initial.hash;
          await evalv("document.getElementById('stepBtn').click()");
          await waitFor("parseFloat(document.getElementById('simTime').textContent)>=0.9",'short assay step');
          const shortAfter=await evalv("({time:document.getElementById('simTime').textContent,distance:document.getElementById('distanceValue').textContent,truth:document.getElementById('truthDistanceValue').textContent,status:document.getElementById('runStatus').textContent})");
          await evalv("(()=>{const ids=document.getElementById('showIds');ids.checked=true;ids.dispatchEvent(new Event('change',{bubbles:true}));const trails=document.getElementById('showTrails');trails.checked=false;trails.dispatchEvent(new Event('change',{bubbles:true}));return true})()");
          await evalv("(()=>{const s=document.getElementById('seedInput');s.value='928492';s.dispatchEvent(new Event('change',{bubbles:true}));return true})()");
          await waitFor("document.getElementById('runStatus')?.textContent==='PAUSED' && document.getElementById('simTime')?.textContent==='0.0 s'",'seed reset');
          await evalv("(()=>{const e=document.getElementById('experimentSelect');e.value='open_arena_long_control.json';e.dispatchEvent(new Event('change',{bubbles:true}));return true})()");
          await waitFor("document.getElementById('runStatus')?.textContent==='PAUSED' && /100 cm/.test(document.getElementById('protocolNote')?.textContent||'')",'long assay load');
          const longDef=await evalv("({model:document.getElementById('modelId').textContent,hash:document.getElementById('modelHash').textContent,note:document.getElementById('protocolNote').textContent})");
          if(longDef.model!==shortModel||longDef.hash!==shortHash)throw new Error('Canonical short/long model identity changed');
          await evalv("document.getElementById('stepBtn').click()");
          await waitFor("parseFloat(document.getElementById('simTime').textContent)>=0.9",'long assay step');
          await evalv("(()=>{const e=document.getElementById('experimentSelect');e.value='straight_bridge.json';e.dispatchEvent(new Event('change',{bubbles:true}));return true})()");
          await waitFor("document.getElementById('runStatus')?.textContent==='PAUSED' && /Straight/.test(document.getElementById('protocolNote')?.textContent||'')",'bridge load');
          await evalv("document.getElementById('stepBtn').click()");
          await waitFor("parseFloat(document.getElementById('simTime').textContent)>=0.9",'bridge step');
          const records=await evalv("(async()=>({h5:await (await fetch('./hypotheses/h5_transient_entry_heading_restoration_v1.json')).json(),h4:await (await fetch('./reports/h4_parameter_estimation_500x60_v1.json')).json()}))()");
          if(records.h5?.status!=='post_outcome_mechanism_freeze_before_implementation_or_parameter_search')throw new Error('H5 freeze status mismatch');
          if(records.h5?.development_estimation_guardrails?.estimator_policy_status!=='not_yet_frozen')throw new Error('H5 estimator status mismatch');
          if(records.h4?.status!=='development_estimation_failed_promotion_guard')throw new Error('H4 report status mismatch');
          if(records.h4?.internal_cv?.H4_promotion_guard_passed!==false)throw new Error('H4 failed guard mismatch');
          const yreq=requests.filter(u=>/y[_-]?maze|ymaze/i.test(u));
          if(yreq.length)throw new Error('Unexpected Y-maze network access '+JSON.stringify(yreq));
          if(exceptions.length)throw new Error('Browser exceptions '+JSON.stringify(exceptions));
          if(consoleErrors.length)throw new Error('Browser console errors '+JSON.stringify(consoleErrors));
          const report={status:'passed',initial,shortAfter,longDef,exceptions:0,console_errors:0,ymaze_requests:0,h5_freeze_status:records.h5.status,h5_estimator_policy_status:records.h5.development_estimation_guardrails.estimator_policy_status,h4_status:records.h4.status,h4_promotion_guard_passed:records.h4.internal_cv.H4_promotion_guard_passed};
          fs.writeFileSync('/tmp/h5-browser-review.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          ws.close();
          NODE
          node /tmp/h5-browser-review.mjs
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-preimplementation-review
          path: |
            /tmp/h5-browser-review.json
            /tmp/h5-chrome-version.json
            /tmp/h5-chrome.log
            /tmp/h5-http.log
          retention-days: 7
