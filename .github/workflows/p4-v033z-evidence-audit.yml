name: P4 v0.3.3z independent evidence audit

on:
  push:
    branches:
      - v0.3.3z-p4-independent-candidate-evidence
    paths:
      - .github/workflows/p4-v033z-evidence-audit.yml

permissions:
  contents: read

concurrency:
  group: p4-v033z-evidence-audit
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact evidence gate and descriptive-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 50ab8180982dd1a7d8864f88a72fc7dbd3aac166 HEAD

          test "$(git hash-object hypotheses/p4_painted_trail_candidate_class_evidence_v1.json)" = "262f332062f271bbf111d0572f83b2faaf2cfd74"
          test "$(git hash-object hypotheses/p1_response_estimation_result_freeze_v1.json)" = "1d99ebfaa378aeb1b98963f63b3a513a616a6617"
          test "$(git hash-object hypotheses/p2_response_estimation_result_freeze_v1.json)" = "088316e1746594f9b3f700cb277a83eb53fdd9f6"
          test "$(git hash-object hypotheses/p3_response_estimation_result_freeze_v1.json)" = "aa69afda6d80cc9d4ea0b563470cffdf0762b941"
          test "$(git hash-object hypotheses/p3_post_failure_characterization_v1.json)" = "541259b5f26cc475997b7b1a03d6b6f3cba6a332"

          git diff --name-only 50ab8180982dd1a7d8864f88a72fc7dbd3aac166...HEAD | tee /tmp/p4-evidence-changed.txt
          test "$(grep -Ec '^(src/|models/|experiments/|apparatus/|reference/|tools/|reports/)' /tmp/p4-evidence-changed.txt || true)" = "0"
          test "$(grep -Ec '^hypotheses/(p1_|p2_|p3_)' /tmp/p4-evidence-changed.txt || true)" = "0"

          test ! -e src/p4.js
          test ! -e models/lasius_niger_painted_trail_p4_v1.json
          test ! -e hypotheses/p4_painted_trail_mechanism_v1.json
          test ! -e hypotheses/p4_response_estimation_v1.json
          test ! -e tools/run-p4-estimation.js
          test ! -e tools/run-p4-reachability.js

      - name: Run P4 evidence regression directly
        run: node tests/p4-candidate-class-evidence.test.js

      - name: Run permanent regression suite
        run: ./tests/run-tests.sh
