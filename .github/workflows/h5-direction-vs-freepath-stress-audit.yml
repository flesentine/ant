name: H5 direction-vs-freepath stress audit
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate clean H5 preconditions
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_origin_referenced_search_v1.draft.json)" = "57016903a32069876bdf88157ba1c659fa637c5c"
          test "$(git hash-object reports/h5_temporal_drive_choice_audit_v1.json)" = "0ec424889ee4c9745af30f70cca7c8b7152bb490"
          test "$(git hash-object reports/h5_biological_origin_choice_audit_v1.json)" = "2378fa54ad4174141f213ed44be3c283706975de"
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('hypotheses/h5_origin_referenced_search_v1.draft.json','utf8'));
          if(d.firewall.mechanism_not_frozen!==true||d.firewall.parameter_search_allowed!==false) throw new Error('H5 freeze/search firewall mismatch');
          if(d.biological_origin_decision.selected_origin!=='central_physical_entry_reference') throw new Error('origin mismatch');
          if(d.temporal_drive_decision.selected_profile!=='constant_over_observed_arena_traversal') throw new Error('temporal mismatch');
          if(d.firewall.ymaze_access!==false) throw new Error('Y-maze firewall mismatch');
          NODE
          if grep -R -n -E 'biology_h5_search|rho_search|lambda_search_mm|r_search_mm|tau_search' src models experiments states apparatus scoring observations; then
            echo 'Persistent H5 runtime unexpectedly present' >&2
            exit 1
          fi
          cp src/h3.js /tmp/h3-original.js
      - name: Baseline Y-maze-free regressions
        run: |
          set -euo pipefail
          for f in tests/boundary-timing.test.js tests/determinism.test.js tests/experiment-definition.test.js tests/h3-reorientation.test.js tests/integrity-firewall.test.js tests/measurement-geometry-policy.test.js tests/measurement.test.js tests/open-arena-protocol.test.js tests/rng-streams.test.js tests/state-integrity.test.js; do
            node "$f"
          done
      - name: Install temporary diagnostic hook in working tree only
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='src/h3.js';
          let s=fs.readFileSync(p,'utf8');
          const before=s;
          s=s.replace(
            "ant.h3AngleRng = new core.RNG(angleSeed);",
            "ant.h3AngleRng = new core.RNG(angleSeed);\n    ant.h5DiagChoiceRng = new core.RNG(streamSeed(seed, 'biology_h5_search_choice:' + ant.id));\n    ant.h5DiagAngleRng = new core.RNG(streamSeed(seed, 'biology_h5_search_angle:' + ant.id));"
          );
          s=s.replace(
            "const availableHazard = integratedHazard(speed, cfg, gate0, elapsed, remaining);",
            "let activeCfg = cfg;\n      if (sim.__h5diag && Number(sim.__h5diag.freepathBeta) !== 0) {\n        const dx = Number(sim.__h5diag.originX) - ant.x;\n        const dy = Number(sim.__h5diag.originY) - ant.y;\n        const bearing = Math.atan2(dy, dx);\n        const c = Math.cos(ant.heading - bearing);\n        const ell = cfg.ell0 * Math.exp(Number(sim.__h5diag.freepathBeta) * c);\n        activeCfg = Object.assign({}, cfg, { ell0: ell });\n      }\n      const availableHazard = integratedHazard(speed, activeCfg, gate0, elapsed, remaining);"
          );
          s=s.replace(
            "ant.h3HazardRemaining = Math.max(0, ant.h3HazardRemaining - integratedHazard(speed, cfg, gate0, elapsed, moved.activeDt));",
            "ant.h3HazardRemaining = Math.max(0, ant.h3HazardRemaining - integratedHazard(speed, activeCfg, gate0, elapsed, moved.activeDt));"
          );
          s=s.replace(
            "const eventDt = solveEventOffset(speed, cfg, gate0, elapsed, remaining, ant.h3HazardRemaining);",
            "const eventDt = solveEventOffset(speed, activeCfg, gate0, elapsed, remaining, ant.h3HazardRemaining);"
          );
          s=s.replace(
            "ant.heading = core.normalizeAngle(ant.heading + angle);",
            "const baselineHeading = core.normalizeAngle(ant.heading + angle);\n      ant.heading = baselineHeading;\n      let h5DiagSearchUsed = false;\n      if (sim.__h5diag) {\n        const choice = ant.h5DiagChoiceRng.next();\n        const searchAngle = sampleVonMises(ant.h5DiagAngleRng, cfg.kappa);\n        const dx = Number(sim.__h5diag.originX) - ant.x;\n        const dy = Number(sim.__h5diag.originY) - ant.y;\n        const r = Math.hypot(dx, dy);\n        const rs = Math.max(1e-12, Number(sim.__h5diag.rSearchMm) || 50);\n        const radial = r > 0 ? r / (r + rs) : 0;\n        const w = Math.max(0, Math.min(1, (Number(sim.__h5diag.directionW) || 0) * radial));\n        if (choice < w && r > 0) {\n          const bearing = Math.atan2(dy, dx);\n          ant.heading = core.normalizeAngle(bearing + searchAngle);\n          h5DiagSearchUsed = true;\n        }\n      }"
          );
          s=s.replace(
            "sim.events.push({ time: sim.time + elapsed, type: 'h3_reorientation', ant: ant.id, sequence: ant.h3TurnCount, angle_rad: angle, x: ant.x, y: ant.y });",
            "sim.events.push({ time: sim.time + elapsed, type: 'h3_reorientation', ant: ant.id, sequence: ant.h3TurnCount, angle_rad: angle, x: ant.x, y: ant.y, h5_diag_search_used: h5DiagSearchUsed });"
          );
          if(s===before) throw new Error('diagnostic patch did not change h3.js');
          fs.writeFileSync(p,s);
          NODE
          node --check src/h3.js
      - name: Node engineering reachability matrix
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const geom=require('./tools/poissonnier2026-measurement-geometry.js');
          const {Simulation,FIXED_DT}=require('./src/integrity.js');
          const {loadBundle}=require('./tools/load-bundle.js');
          const {geometry}=geom.loadFrozenMeasurementGeometry(process.cwd());
          function edge(ex,w,h){if(!ex)return'timeout';const d={left:Math.abs(ex.x),right:Math.abs(ex.x-w),top:Math.abs(ex.y),bottom:Math.abs(ex.y-h)};return Object.keys(d).sort((a,b)=>d[a]-d[b])[0];}
          function mean(a){return a.reduce((s,x)=>s+x,0)/Math.max(1,a.length);}
          function vec(rows){const ep={left:0,right:0,top:0,bottom:0,timeout:0};rows.forEach(r=>ep[r.exit]++);const n=Math.max(1,rows.length);return [mean(rows.map(r=>r.time)),mean(rows.map(r=>r.zone)),mean(rows.map(r=>r.beeline)),ep.left/n,ep.right/n,ep.top/n,ep.bottom/n,ep.timeout/n];}
          function cos(a,b){const da=Math.sqrt(a.reduce((s,x)=>s+x*x,0)),db=Math.sqrt(b.reduce((s,x)=>s+x*x,0));return da&&db?a.reduce((s,x,i)=>s+x*b[i],0)/(da*db):null;}
          function standardizedDiff(v,b){const scales=[Math.max(1,b[0]),Math.max(.05,b[1]),Math.max(10,b[2]),.25,.25,.25,.25,.1];return v.map((x,i)=>(x-b[i])/scales[i]);}
          const baseBundle=loadBundle('open_arena_short_control.json',{modelId:'lasius_niger_locomotion_h3_v1'});baseBundle.model.reorientation_gate.effect.max_hazard_reduction_fraction=0;
          const variants=[
            {id:'baseline',directionW:0,freepathBeta:0},
            {id:'direction_020',directionW:.20,freepathBeta:0},
            {id:'direction_040',directionW:.40,freepathBeta:0},
            {id:'direction_060',directionW:.60,freepathBeta:0},
            {id:'freepath_half_external',directionW:0,freepathBeta:.1935},
            {id:'freepath_external',directionW:0,freepathBeta:.387},
            {id:'freepath_strong',directionW:0,freepathBeta:.58},
            {id:'combined_low',directionW:.20,freepathBeta:.1935},
            {id:'combined_mid',directionW:.40,freepathBeta:.387},
            {id:'combined_high',directionW:.60,freepathBeta:.58}
          ];
          const results=Object.fromEntries(variants.map(v=>[v.id,[]])),searchUse=Object.fromEntries(variants.map(v=>[v.id,[0,0]]));
          for(let fi=0;fi<geom.EXPECTED_COLONIES.length;fi++){const held=geom.EXPECTED_COLONIES[fi],pool=geom.geometryPool(geometry.rows,held);
            for(let i=0;i<100;i++){const seed=990000+fi*10000+i,row=geom.sampleGeometry(pool,seed).row;
              for(const v of variants){const b=geom.applyGeometry(baseBundle,row);b.observation.record_trajectories=false;const sim=new Simulation(b,seed);sim.__h5diag={directionW:v.directionW,freepathBeta:v.freepathBeta,rSearchMm:50,originX:row.entry_reference_x_mm,originY:row.entry_reference_y_mm};const sx=sim.ants[0].x,sy=sim.ants[0].y;const s=sim.runUntilComplete(b.experiment.duration_s,FIXED_DT),o=s.observed_metrics.ants[0],ex=o.exit_coordinate_mm;results[v.id].push({time:o.time_to_arena_edge_s??b.experiment.duration_s,zone:o.central_zone_fraction??0,beeline:ex?Math.hypot(ex.x-sx,ex.y-sy):0,exit:edge(ex,sim.apparatus.world.width,sim.apparatus.world.height),turns:sim.ants[0].h3TurnCount});const ev=sim.events.filter(e=>e.type==='h3_reorientation');searchUse[v.id][0]+=ev.filter(e=>e.h5_diag_search_used).length;searchUse[v.id][1]+=ev.length;}
            }
          }
          const vectors={};for(const v of variants)vectors[v.id]=vec(results[v.id]);const bvec=vectors.baseline,effects={};for(const v of variants.filter(x=>x.id!=='baseline'))effects[v.id]=standardizedDiff(vectors[v.id],bvec);
          const similarities={direction020_vs_freepathHalf:cos(effects.direction_020,effects.freepath_half_external),direction040_vs_freepathExternal:cos(effects.direction_040,effects.freepath_external),direction060_vs_freepathStrong:cos(effects.direction_060,effects.freepath_strong)};
          const additivity={};for(const [c,d,f] of [['combined_low','direction_020','freepath_half_external'],['combined_mid','direction_040','freepath_external'],['combined_high','direction_060','freepath_strong']]){const pred=effects[d].map((x,i)=>x+effects[f][i]),actual=effects[c],res=actual.map((x,i)=>x-pred[i]);additivity[c]={cosine_actual_vs_sum:cos(actual,pred),residual_norm:Math.sqrt(res.reduce((s,x)=>s+x*x,0)),actual_norm:Math.sqrt(actual.reduce((s,x)=>s+x*x,0))};}
          const out={status:'passed',scientific_role:'engineering_reachability_only_no_fit_no_H5_persistent_runtime',simulations_per_variant:600,variants:variants.map(v=>({...v,toward_to_away_freepath_ratio:v.freepathBeta?Math.exp(2*v.freepathBeta):1})),diagnostic_r_search_mm:50,external_reference_freepath_ratio_approx:Math.exp(2*.387),metric_vector_order:['mean_time_to_exit_s','mean_middle_zone_fraction','mean_beeline_mm','p_left','p_right','p_top','p_bottom','p_timeout'],vectors,standardized_effect_vectors:effects,effect_cosine_similarity:similarities,combined_additivity:additivity,search_component_usage:Object.fromEntries(Object.entries(searchUse).map(([k,[a,n]])=>[k,{search_turns:a,total_turns:n,fraction:n?a/n:0}])),interpretation_guard:'No variant was ranked against reference outcomes. Strengths were broad engineering diagnostics only.'};
          fs.writeFileSync('/tmp/h5-direction-freepath-node.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          NODE
      - name: Node isotropic-heading robustness matrix
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const geom=require('./tools/poissonnier2026-measurement-geometry.js');
          const {Simulation,FIXED_DT,streamSeed}=require('./src/integrity.js');
          const core=require('./src/sim-core.js');
          const {loadBundle}=require('./tools/load-bundle.js');
          const {geometry}=geom.loadFrozenMeasurementGeometry(process.cwd());
          function edge(ex,w,h){if(!ex)return'timeout';const d={left:Math.abs(ex.x),right:Math.abs(ex.x-w),top:Math.abs(ex.y),bottom:Math.abs(ex.y-h)};return Object.keys(d).sort((a,b)=>d[a]-d[b])[0];}
          const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
          const vec=rows=>{const ep={left:0,right:0,top:0,bottom:0,timeout:0};rows.forEach(r=>ep[r.exit]++);const n=rows.length;return [mean(rows.map(r=>r.time)),mean(rows.map(r=>r.zone)),mean(rows.map(r=>r.beeline)),ep.left/n,ep.right/n,ep.top/n,ep.bottom/n,ep.timeout/n];};
          const cos=(a,b)=>{const da=Math.hypot(...a),db=Math.hypot(...b);return da&&db?a.reduce((s,x,i)=>s+x*b[i],0)/(da*db):null;};
          const std=(v,b)=>{const scales=[Math.max(1,b[0]),Math.max(.05,b[1]),Math.max(10,b[2]),.25,.25,.25,.25,.1];return v.map((x,i)=>(x-b[i])/scales[i]);};
          const bundle=loadBundle('open_arena_short_control.json',{modelId:'lasius_niger_locomotion_h3_v1'});bundle.model.reorientation_gate.effect.max_hazard_reduction_fraction=0;
          const variants=[{id:'baseline',directionW:0,freepathBeta:0},{id:'direction',directionW:.4,freepathBeta:0},{id:'freepath',directionW:0,freepathBeta:.387},{id:'combined',directionW:.4,freepathBeta:.387}],rows=Object.fromEntries(variants.map(v=>[v.id,[]]));
          for(let fi=0;fi<geom.EXPECTED_COLONIES.length;fi++){const held=geom.EXPECTED_COLONIES[fi],pool=geom.geometryPool(geometry.rows,held);for(let i=0;i<100;i++){const seed=990000+fi*10000+i,row=geom.sampleGeometry(pool,seed).row,hr=new core.RNG(streamSeed(seed,'h5_diag_shared_entry_heading')),heading=hr.next()*2*Math.PI-Math.PI;for(const v of variants){const b=geom.applyGeometry(bundle,row);b.observation.record_trajectories=false;const sim=new Simulation(b,seed);sim.ants[0].heading=heading;sim.__h5diag={directionW:v.directionW,freepathBeta:v.freepathBeta,rSearchMm:50,originX:row.entry_reference_x_mm,originY:row.entry_reference_y_mm};const sx=sim.ants[0].x,sy=sim.ants[0].y,s=sim.runUntilComplete(b.experiment.duration_s,FIXED_DT),o=s.observed_metrics.ants[0],ex=o.exit_coordinate_mm;rows[v.id].push({time:o.time_to_arena_edge_s??b.experiment.duration_s,zone:o.central_zone_fraction??0,beeline:ex?Math.hypot(ex.x-sx,ex.y-sy):0,exit:edge(ex,sim.apparatus.world.width,sim.apparatus.world.height)});}}}
          const vectors=Object.fromEntries(Object.entries(rows).map(([k,v])=>[k,vec(v)])),b=vectors.baseline,effects={direction:std(vectors.direction,b),freepath:std(vectors.freepath,b),combined:std(vectors.combined,b)},sum=effects.direction.map((x,i)=>x+effects.freepath[i]);
          const out={status:'passed',simulations_per_variant:600,entry_heading:'shared deterministic uniform [-pi,pi) per trial',metric_vector_order:['mean_time_to_exit_s','mean_middle_zone_fraction','mean_beeline_mm','p_left','p_right','p_top','p_bottom','p_timeout'],vectors,effects,direction_vs_freepath_cosine:cos(effects.direction,effects.freepath),combined_vs_sum_cosine:cos(effects.combined,sum)};
          fs.writeFileSync('/tmp/h5-direction-freepath-isotropic-node.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          NODE
      - name: Start Chromium with temporary diagnostic hook
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..100}; do if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then exit 0; fi; sleep .2; done
          cat /tmp/chrome.log || true
          exit 1
      - name: Chromium engineering mirror
        run: |
          set -euo pipefail
          cat >/tmp/h5-direction-freepath-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms)),tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0],ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));}),evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!AntLabIntegrity&&!!AntLabCore&&!!AntLabH3"))break;await sleep(100);}
          const report=await evalv(`(async()=>{const j=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json();},clone=x=>JSON.parse(JSON.stringify(x));const geometry=await j('./reference/poissonnier2026_open_arena_measurement_geometry_v1.json'),policy=await j('./reference/poissonnier2026_open_arena_measurement_policy_v1.json'),app0=await j('./apparatus/poissonnier2026_open_arena.json'),exp0=await j('./experiments/open_arena_short_control.json'),model0=await j('./models/lasius_niger_locomotion_h3_v1.json'),state=await j('./states/naive_outbound_v1.json'),obs0=await j('./observations/poissonnier2026_tracking_25fps.json'),scoring=await j('./scoring/open_arena_first_border_v1.json');model0.reorientation_gate.effect.max_hazard_reduction_fraction=0;const variants=[{id:'baseline',directionW:0,freepathBeta:0},{id:'direction',directionW:.4,freepathBeta:0},{id:'freepath',directionW:0,freepathBeta:.387},{id:'combined',directionW:.4,freepathBeta:.387}],colonies=[0,7,16,20,21,27],rows=Object.fromEntries(variants.map(v=>[v.id,[]])),edge=(ex,w,h)=>{if(!ex)return'timeout';const d={left:Math.abs(ex.x),right:Math.abs(ex.x-w),top:Math.abs(ex.y),bottom:Math.abs(ex.y-h)};return Object.keys(d).sort((a,b)=>d[a]-d[b])[0];};for(let fi=0;fi<colonies.length;fi++){const held=colonies[fi],pool=geometry.rows.filter(r=>r.colony!==held).sort((a,b)=>a.ant_id-b.ant_id);for(let i=0;i<10;i++){const seed=990000+fi*10000+i,rr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,policy.geometry_sampler.rng_stream_name)),row=pool[Math.min(pool.length-1,Math.floor(rr.next()*pool.length))];for(const v of variants){const exp=clone(exp0),app=clone(app0),obs=clone(obs0),model=clone(model0);exp.model=model.id;app.world.width=row.arena_width_mm;app.world.height=row.arena_height_mm;const rect=app.geometry.primitives.find(p=>p.type==='rect');rect.width=row.arena_width_mm;rect.height=row.arena_height_mm;app.entry_points.default={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};app.entry_points.center={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};exp.protocol.entry_state.position_jitter_mm=0;obs.metric_definitions.central_zone_fraction.center_y_mm=row.entry_reference_y_mm;obs.metric_definitions.central_zone_fraction.half_width_mm=10;const sim=new AntLabIntegrity.Simulation({experiment:exp,model,apparatus:app,state,observation:obs,scoring},seed);sim.__h5diag={directionW:v.directionW,freepathBeta:v.freepathBeta,rSearchMm:50,originX:row.entry_reference_x_mm,originY:row.entry_reference_y_mm};const sx=sim.ants[0].x,sy=sim.ants[0].y,s=sim.runUntilComplete(exp.duration_s,AntLabIntegrity.FIXED_DT),o=s.observed_metrics.ants[0],ex=o.exit_coordinate_mm;rows[v.id].push({time:o.time_to_arena_edge_s??exp.duration_s,zone:o.central_zone_fraction??0,beeline:ex?Math.hypot(ex.x-sx,ex.y-sy):0,exit:edge(ex,sim.apparatus.world.width,sim.apparatus.world.height)});}}}const mean=a=>a.reduce((s,x)=>s+x,0)/a.length,summary={};for(const [k,a] of Object.entries(rows))summary[k]={n:a.length,time:mean(a.map(x=>x.time)),zone:mean(a.map(x=>x.zone)),beeline:mean(a.map(x=>x.beeline))};return{status:'passed',simulations_per_variant:60,summary};})()`);
          const forbidden=requests.filter(u=>/neutral_y_maze|\/y_maze|\/y-maze/i.test(u));if(exceptions.length||consoleErrors.length||forbidden.length)throw new Error('browser firewall failure');report.browser={exceptions:0,console_errors:0,ymaze_requests:0};fs.writeFileSync('/tmp/h5-direction-freepath-browser.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/h5-direction-freepath-browser.mjs
      - name: Restore audited runtime and prove no persistent diagnostic code
        run: |
          set -euo pipefail
          cp /tmp/h3-original.js src/h3.js
          git diff --exit-code -- src/h3.js
          node --check src/h3.js
          for f in tests/h3-reorientation.test.js tests/rng-streams.test.js tests/integrity-firewall.test.js; do node "$f"; done
          if grep -R -n 'h5Diag' src models experiments states apparatus scoring observations; then
            echo 'temporary H5 diagnostic leaked into persistent runtime' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: h5-direction-vs-freepath-stress-audit
          path: |
            /tmp/h5-direction-freepath-node.json
            /tmp/h5-direction-freepath-browser.json
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
