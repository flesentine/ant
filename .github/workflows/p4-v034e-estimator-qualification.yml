name: P4 v0.3.4e estimator qualification

on:
  push:
    branches:
      - v0.3.4e-p4-estimator-qualification
    paths:
      - .github/workflows/p4-v034e-estimator-qualification.yml

permissions:
  contents: write

concurrency:
  group: p4-v034e-estimator-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact pre-qualification pins and firewalls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p4_response_estimation_v1.json)" = "2d0bdfaba74ad08f8424870f37a48399428ae8b7"
          test "$(git hash-object hypotheses/p4_estimator_implementation_authorization_v1.json)" = "e8f26731412d8693a5596da4374de932745b9392"
          test "$(git hash-object tools/p4-estimation-core.js)" = "4d985cd7258fc26eb06be75f09bdac4b92325ff0"
          test "$(git hash-object tools/run-p4-estimation.js)" = "e57b554c0ad56a0034f4f79ec8090d3e863e3d11"
          test "$(git hash-object src/p4.js)" = "bf7d5781bd69ec4568450ebbd3bdc284897b6f61"
          test "$(git hash-object src/p3.js)" = "4010b19fd7a1b713a4b8d25b6a693d3ee0a581b8"
          test "$(git hash-object reference/poissonnier2026_pheromone_response_targets.json)" = "81910c5bd3ec7b1f7728c2c9f100b0e8a6db29ed"
          test ! -e hypotheses/p4_highres_authorization_v1.json
          node --check tools/p4-estimation-core.js
          node --check tools/run-p4-estimation.js
          node - <<'NODE'
          const fs=require('fs');
          const core=fs.readFileSync('tools/p4-estimation-core.js','utf8');
          const runner=fs.readFileSync('tools/run-p4-estimation.js','utf8');
          if(core.includes('Math.random'))throw new Error('P4 estimator core may not use Math.random');
          for(const bad of ['p1_response_estimation_','p2_response_estimation_','p3_response_estimation_','neutral-y-maze']){
            if(runner.includes(bad))throw new Error('Forbidden prior-result/Y-maze reference in runner: '+bad);
          }
          const pre=runner.indexOf('const preflight = highResolutionPreflight({ root, policy, options });');
          const read=runner.indexOf("validateReferenceTarget(readJson(path.resolve(root, RESPONSE_TARGET_FILE)), policy)");
          if(!(pre>=0&&read>pre))throw new Error('Target semantic read is not after high-resolution preflight');
          console.log(JSON.stringify({syntax:true,no_response_rng:true,prior_result_paths:false,ymaze_path:false,target_read_after_preflight:true}));
          NODE

      - name: Run complete permanent regression suite
        run: ./tests/run-tests.sh

      - name: Run reference-free P4 estimator qualification
        shell: bash
        run: |
          set -euo pipefail
          rm -f reports/p4_estimator_qualification_v1.json
          node tools/run-p4-estimation.js --mode qualify --trials 1 --out reports/p4_estimator_qualification_v1.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p='reports/p4_estimator_qualification_v1.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.status!=='passed')throw new Error('P4 estimator qualification did not pass');
          if(r.scientific_evidence!==false||r.reference_outcomes_accessed!==false||r.response_target_semantics_loaded!==false||r.response_target_hash_verified_only!==true)throw new Error('P4 qualification reference firewall failed');
          if(r.P1_official_result_semantics_loaded!==false||r.P2_official_result_semantics_loaded!==false||r.P3_official_result_semantics_loaded!==false||r.ymaze_accessed!==false||r.high_resolution_search_executed!==false)throw new Error('P4 qualification provenance firewall failed');
          for(const [k,v] of Object.entries(r.checks))if(v!==true)throw new Error('P4 qualification check failed: '+k);
          const b=fs.readFileSync(p);
          console.log(JSON.stringify({status:r.status,bytes:b.length,git_blob:crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex'),sha256:crypto.createHash('sha256').update(b).digest('hex'),checks:Object.keys(r.checks).length}));
          NODE

      - name: Prove high-resolution path remains unauthorized
        shell: bash
        run: |
          set -euo pipefail
          if node tools/run-p4-estimation.js --mode highres --out /tmp/should-not-exist.json >/tmp/p4-highres-out.txt 2>/tmp/p4-highres-err.txt; then
            echo 'High-resolution P4 search unexpectedly succeeded without authorization' >&2
            exit 1
          fi
          grep -F 'missing post-qualification authorization artifact' /tmp/p4-highres-err.txt
          test ! -e /tmp/should-not-exist.json

      - name: Commit exact qualification report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/p4_estimator_qualification_v1.json
          test "$(git diff --cached --name-only | wc -l)" = "1"
          git diff --cached --name-only | grep -Fx reports/p4_estimator_qualification_v1.json
          git commit -m "Materialize P4 estimator qualification report"
          git push origin HEAD:v0.3.4e-p4-estimator-qualification

      - name: Upload qualification artifact
        uses: actions/upload-artifact@v4
        with:
          name: p4-v034e-estimator-qualification
          retention-days: 90
          if-no-files-found: error
          path: |
            reports/p4_estimator_qualification_v1.json
            /tmp/p4-highres-out.txt
            /tmp/p4-highres-err.txt
