name: H5 frozen-mechanism extra hardening
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact-state and stale-marker audit
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_origin_referenced_search_v1.draft.json)" = "bb198c985d6fbf2dd9b006a23b429095c9a7ec82"
          test "$(git hash-object reports/h5_biological_origin_choice_audit_v1.json)" = "2378fa54ad4174141f213ed44be3c283706975de"
          test "$(git hash-object reports/h5_temporal_drive_choice_audit_v1.json)" = "0ec424889ee4c9745af30f70cca7c8b7152bb490"
          test "$(git hash-object reports/h5_effect_scope_choice_audit_v1.json)" = "d56f1ab242125773905b922e0686e0cceb22bb7e"
          test "$(git hash-object reports/h5_radial_gate_choice_audit_v1.json)" = "66f0d0204979a17ade267b41c387ed872679115a"
          test "$(git hash-object reports/h5_history_response_choice_audit_v1.json)" = "37d5e0a28f2ed75cc45297ca19d0ed66db45cad6"
          test "$(git hash-object reports/h5_search_dispersion_choice_audit_v1.json)" = "a77a0f49de656b7aba75491de7eb04f6b9f07ccd"
          test "$(git hash-object reference/poissonnier2026_open_arena_measurement_policy_v1.json)" = "fd2718cf9351b655340eacd868adc536301a83a4"
          test "$(git hash-object reference/poissonnier2026_open_arena_measurement_geometry_v1.json)" = "af0ec6fbacf83b915dd78cb3a822609c126dc1e7"
          test "$(git hash-object src/h3.js)" = "9bb8fc966a5aa4d4173f9bda2020c6d9cd9368f1"
          test "$(git hash-object models/lasius_niger_locomotion_h3_v1.json)" = "fe33c31facfcabb7ddeb9a7bedf71ac248ad8e84"
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('hypotheses/h5_origin_referenced_search_v1.draft.json','utf8'));
          if(d.schema_version!==11) throw new Error('draft schema drift');
          if(d.status!=='mechanism_frozen_estimator_policy_pending_before_runtime_implementation_or_parameter_search') throw new Error('status drift');
          if(d.current_stage?.biological_mechanism!=='fully_frozen'||d.current_stage?.persistent_H5_runtime!=='absent'||d.current_stage?.estimator_policy!=='unfrozen'||d.current_stage?.parameter_search!=='forbidden') throw new Error('current_stage inconsistent');
          if(d.pre_freeze_questions.length!==0) throw new Error('obsolete pre-freeze questions remain');
          if(d.remaining_estimator_policy_questions.length!==1) throw new Error('remaining estimator question missing');
          if(d.temporal_drive_decision.history_response_still_unfrozen!==false) throw new Error('stale nested history-response state');
          if(!d.candidate_mechanism.rng_candidate.cadence_rule.startsWith('Frozen cadence contract')) throw new Error('stale RNG freeze wording');
          if(/draft/i.test(d.candidate_mechanism.speed)||/draft/i.test(d.candidate_mechanism.pause)) throw new Error('stale draft wording in frozen primitives');
          if(d.firewall.mechanism_frozen!==true||d.firewall.mechanism_not_frozen!==false||d.firewall.H5_estimator_policy_still_unfrozen!==true||d.firewall.parameter_search_allowed!==false) throw new Error('firewall mismatch');
          const trueStill=[];
          const walk=(x,p=[])=>{if(Array.isArray(x))return x.forEach((v,i)=>walk(v,[...p,i]));if(x&&typeof x==='object')for(const [k,v] of Object.entries(x)){if(/still_unfrozen$/i.test(k)&&v===true)trueStill.push([...p,k].join('.'));walk(v,[...p,k]);}};
          walk(d);
          if(JSON.stringify(trueStill)!==JSON.stringify(['firewall.H5_estimator_policy_still_unfrozen'])) throw new Error('unexpected true still_unfrozen markers: '+JSON.stringify(trueStill));
          if(d.search_dispersion_decision.selected_rule!=='reuse_baseline_H3_turn_concentration_exactly') throw new Error('dispersion drift');
          if(d.history_response_decision.null_structure.history_modulation_null.indexOf('alpha_search_200 = alpha_search_1000')<0) throw new Error('common-search null missing');
          console.log(JSON.stringify({status:'passed',true_still_unfrozen:trueStill,current_stage:d.current_stage}));
          NODE
          if grep -R -n -E 'h5Diag|biology_h5_search|alpha_search_200|alpha_search_1000|search_kappa|kappa_search' src models experiments states apparatus scoring observations; then
            echo 'Persistent H5 runtime unexpectedly present' >&2
            exit 1
          fi

      - name: H3 sampler seam and practical-range audit
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),core=require('./src/sim-core.js'),h3=require('./src/h3.js');
          const practical=[0,.25,.5,1,2,4,8,20],moments={};
          for(const k of practical){
            const rng=new core.RNG(321000+Math.round(k*10000));let c=0,s=0,n=25000;
            for(let i=0;i<n;i++){const a=h3.sampleVonMises(rng,k);if(!Number.isFinite(a)||a < -Math.PI-1e-12||a > Math.PI+1e-12)throw new Error('bad sample k='+k);c+=Math.cos(a);s+=Math.sin(a);}
            moments[k]={mean_cos:c/n,mean_sin:s/n};
          }
          const seam={};
          for(const k of [5e-9,1e-8,1.1e-8,2e-8,1e-7,1e-6]){
            const rng=new core.RNG(777);
            try{const a=h3.sampleVonMises(rng,k);seam[k]={ok:true,angle:a};}
            catch(e){seam[k]={ok:false,error:String(e.message||e)};}
          }
          if(!seam[5e-9].ok)throw new Error('uniform-side seam point failed');
          if(!seam[2e-8].ok||!seam[1e-7].ok||!seam[1e-6].ok)throw new Error('practical-above-seam point failed');
          if(Math.abs(moments[0].mean_cos)>.03||Math.abs(moments[0].mean_sin)>.03)throw new Error('kappa zero not approximately uniform');
          fs.writeFileSync('/tmp/h5-extra-node-sampler.json',JSON.stringify({status:'passed',practical,moments,seam},null,2)+'\n');
          console.log(JSON.stringify({status:'passed',moments,seam},null,2));
          NODE

      - name: H3-null treatment-neutrality on reconstructed geometry
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const geom=require('./tools/poissonnier2026-measurement-geometry.js');
          const core=require('./src/sim-core.js');
          const {Simulation,FIXED_DT,streamSeed}=require('./src/integrity.js');
          const {loadBundle}=require('./tools/load-bundle.js');
          const {geometry}=geom.loadFrozenMeasurementGeometry(process.cwd());
          const short0=loadBundle('open_arena_short_control.json',{modelId:'lasius_niger_locomotion_h3_v1'});
          const long0=loadBundle('open_arena_long_control.json',{modelId:'lasius_niger_locomotion_h3_v1'});
          short0.model.reorientation_gate.effect.max_hazard_reduction_fraction=0;
          long0.model.reorientation_gate.effect.max_hazard_reduction_fraction=0;
          const sanitize=s=>({time:s.observed_metrics.ants[0].time_to_arena_edge_s??null,zone:s.observed_metrics.ants[0].central_zone_fraction??null,exit:s.observed_metrics.ants[0].exit_coordinate_mm??null,events:s.events?.filter(e=>e.type==='h3_reorientation').map(e=>({time:e.time,angle:e.angle_rad,x:e.x,y:e.y}))});
          let pairs=0,mismatches=0;
          const folds={};
          for(let fi=0;fi<geom.EXPECTED_COLONIES.length;fi++){
            const held=geom.EXPECTED_COLONIES[fi],pool=geom.geometryPool(geometry.rows,held);let fp=0;
            for(let i=0;i<12;i++){
              const seed=880000+fi*10000+i,row=geom.sampleGeometry(pool,seed).row;
              const hr=new core.RNG(streamSeed(seed,'h5_extra_shared_heading')),heading=hr.next()*2*Math.PI-Math.PI;
              const bs=geom.applyGeometry(short0,row),bl=geom.applyGeometry(long0,row);
              bs.observation.record_trajectories=false;bl.observation.record_trajectories=false;
              const ss=new Simulation(bs,seed),sl=new Simulation(bl,seed);ss.ants[0].heading=heading;sl.ants[0].heading=heading;
              const a=sanitize(ss.runUntilComplete(bs.experiment.duration_s,FIXED_DT)),b=sanitize(sl.runUntilComplete(bl.experiment.duration_s,FIXED_DT));
              pairs++;fp++;if(JSON.stringify(a)!==JSON.stringify(b))mismatches++;
            }
            folds[held]={pool_n:pool.length,pairs:fp};
          }
          if(mismatches)throw new Error('H3-null short/long treatment leakage: '+mismatches);
          const out={status:'passed',pairs,mismatches,folds};
          fs.writeFileSync('/tmp/h5-extra-node-neutrality.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          NODE

      - name: Y-maze-free regression suite
        run: |
          set -euo pipefail
          for f in tests/boundary-timing.test.js tests/determinism.test.js tests/experiment-definition.test.js tests/h3-reorientation.test.js tests/integrity-firewall.test.js tests/measurement-geometry-policy.test.js tests/measurement.test.js tests/open-arena-protocol.test.js tests/rng-streams.test.js tests/state-integrity.test.js; do node "$f"; done

      - name: Start Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..100}; do if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then exit 0; fi; sleep .2; done
          cat /tmp/chrome.log || true
          exit 1

      - name: Chromium frozen-contract replay
        run: |
          set -euo pipefail
          cat >/tmp/h5-extra-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0],ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!AntLabIntegrity&&!!AntLabCore&&!!AntLabH3"))break;await sleep(100);}
          const report=await evalv(`(async()=>{
            const j=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json();},clone=x=>JSON.parse(JSON.stringify(x));
            const d=await j('./hypotheses/h5_origin_referenced_search_v1.draft.json'),disp=await j('./reports/h5_search_dispersion_choice_audit_v1.json'),geometry=await j('./reference/poissonnier2026_open_arena_measurement_geometry_v1.json'),policy=await j('./reference/poissonnier2026_open_arena_measurement_policy_v1.json');
            if(d.schema_version!==11||d.current_stage.biological_mechanism!=='fully_frozen'||d.temporal_drive_decision.history_response_still_unfrozen!==false)throw new Error('browser current-state mismatch');
            if(d.search_dispersion_decision.selected_rule!=='reuse_baseline_H3_turn_concentration_exactly'||disp.decision.separate_search_kappa_present!==false)throw new Error('browser dispersion mismatch');
            const app0=await j('./apparatus/poissonnier2026_open_arena.json'),short0=await j('./experiments/open_arena_short_control.json'),long0=await j('./experiments/open_arena_long_control.json'),model0=await j('./models/lasius_niger_locomotion_h3_v1.json'),state=await j('./states/naive_outbound_v1.json'),obs0=await j('./observations/poissonnier2026_tracking_25fps.json'),scoring=await j('./scoring/open_arena_first_border_v1.json');
            model0.reorientation_gate.effect.max_hazard_reduction_fraction=0;
            const practical=[0,.25,.5,1,2,4,8,20],moments={};
            for(const k of practical){const rng=new AntLabCore.RNG(450000+Math.round(k*10000));let c=0,s=0,n=8000;for(let i=0;i<n;i++){const a=AntLabH3.sampleVonMises(rng,k);if(!Number.isFinite(a))throw new Error('browser VM bad '+k);c+=Math.cos(a);s+=Math.sin(a);}moments[k]={mean_cos:c/n,mean_sin:s/n};}
            if(Math.abs(moments[0].mean_cos)>.05||Math.abs(moments[0].mean_sin)>.05)throw new Error('browser kappa0 nonuniform');
            const colonies=[0,7,16,20,21,27],folds={};let pairs=0,neutralityMismatch=0,events=0,exactNullSelections=0,commonMismatch=0,longNotSubsetOfShort=0,searchAngleMismatch=0;
            const apply=(exp0,row)=>{const exp=clone(exp0),app=clone(app0),obs=clone(obs0),model=clone(model0);exp.model=model.id;app.world.width=row.arena_width_mm;app.world.height=row.arena_height_mm;const rect=app.geometry.primitives.find(p=>p.type==='rect');rect.width=row.arena_width_mm;rect.height=row.arena_height_mm;app.entry_points.default={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};app.entry_points.center={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};exp.protocol.entry_state.position_jitter_mm=0;obs.metric_definitions.central_zone_fraction.center_y_mm=row.entry_reference_y_mm;obs.metric_definitions.central_zone_fraction.half_width_mm=10;return{experiment:exp,model,apparatus:app,state:clone(state),observation:obs,scoring:clone(scoring)};};
            const radial=(x,y,row)=>{const ox=row.entry_reference_x_mm,oy=row.entry_reference_y_mm,dx=x-ox,dy=y-oy,r=Math.hypot(dx,dy);if(!r)return 0;const ux=dx/r,uy=dy/r,c=[];if(ux>0)c.push((row.arena_width_mm-ox)/ux);else if(ux<0)c.push((0-ox)/ux);if(uy>0)c.push((row.arena_height_mm-oy)/uy);else if(uy<0)c.push((0-oy)/uy);const de=Math.min(...c.filter(t=>t>0&&Number.isFinite(t)));return Math.max(0,Math.min(1,r/de));};
            for(let fi=0;fi<colonies.length;fi++){const held=colonies[fi],pool=geometry.rows.filter(r=>r.colony!==held).sort((a,b)=>a.ant_id-b.ant_id);let fp=0;
              for(let i=0;i<4;i++){const seed=881000+fi*10000+i,gr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,policy.geometry_sampler.rng_stream_name)),row=pool[Math.min(pool.length-1,Math.floor(gr.next()*pool.length))],hr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,'h5_extra_shared_heading')),heading=hr.next()*2*Math.PI-Math.PI;
                const bs=apply(short0,row),bl=apply(long0,row),ss=new AntLabIntegrity.Simulation(bs,seed),sl=new AntLabIntegrity.Simulation(bl,seed);ss.ants[0].heading=heading;sl.ants[0].heading=heading;
                const as=ss.runUntilComplete(bs.experiment.duration_s,AntLabIntegrity.FIXED_DT),al=sl.runUntilComplete(bl.experiment.duration_s,AntLabIntegrity.FIXED_DT),es=ss.events.filter(e=>e.type==='h3_reorientation'),el=sl.events.filter(e=>e.type==='h3_reorientation');
                const sig=x=>JSON.stringify({o:x.observed_metrics.ants[0],events:(x===as?es:el).map(e=>[e.time,e.angle_rad,e.x,e.y])});
                pairs++;fp++;if(sig(as)!==sig(al))neutralityMismatch++;
                const choice=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,'biology_h5_search_choice:0')),angle=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,'biology_h5_search_angle:0'));
                for(const e of es){events++;const u=choice.next(),sa=AntLabH3.sampleVonMises(angle,model0.reorientation_gate.baseline.turn_concentration),R=radial(e.x,e.y,row),z0=u<0*R,cs=u<.4*R,cl=u<.4*R,hs=u<.6*R,hl=u<.3*R;if(z0)exactNullSelections++;if(cs!==cl)commonMismatch++;if(hl&&!hs)longNotSubsetOfShort++;const mirror=sa;if(sa!==mirror)searchAngleMismatch++;}
              }folds[held]={pool_n:pool.length,pairs:fp};
            }
            if(neutralityMismatch||exactNullSelections||commonMismatch||longNotSubsetOfShort||searchAngleMismatch)throw new Error('browser contract mismatch');
            return{status:'passed',practical_kappa_moments:moments,pairs,neutrality_mismatches:neutralityMismatch,events,exact_null_search_selections:exactNullSelections,common_search_mismatches:commonMismatch,long_history_selection_not_subset_of_short:longNotSubsetOfShort,search_angle_mismatches:searchAngleMismatch,folds};
          })()`);
          const forbidden=requests.filter(u=>/neutral_y_maze|\/y_maze|\/y-maze/i.test(u));
          if(exceptions.length||consoleErrors.length||forbidden.length)throw new Error('browser firewall failure');
          report.browser={exceptions:0,console_errors:0,ymaze_requests:0};
          fs.writeFileSync('/tmp/h5-extra-browser.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/h5-extra-browser.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: h5-frozen-mechanism-extra-hardening
          path: |
            /tmp/h5-extra-node-sampler.json
            /tmp/h5-extra-node-neutrality.json
            /tmp/h5-extra-browser.json
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
