name: P1 v0.3.3e estimator audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [v0.3.3e-p1-estimator-qualification]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact P1 estimator chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p1_response_estimation_v1.json)" = "628d17f6eb69fd11216aff33d1356d184365aedd"
          test "$(git hash-object tools/run-p1-estimation.js)" = "a307e74e8ba2366e2546eebe1a7cccac69a3ff9a"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test "$(git hash-object models/lasius_niger_painted_trail_p1_v1.json)" = "73873fd6763838423ca27648136bb0b9ff062817"
          test "$(git hash-object reference/poissonnier2026_pheromone_response_targets.json)" = "81910c5bd3ec7b1f7728c2c9f100b0e8a6db29ed"
          test "$(git hash-object models/lasius_niger_locomotion_v1.json)" = "2fde196d6c8a9353c1c8c206d4fcef223e92ad1d"
          test "$(git hash-object src/sim-core.js)" = "24777aac3577d442893e4779d70aee4e27761fe8"
          test "$(git hash-object src/integrity.js)" = "f23c68a6955832b70eeb3bd3e6893d71a3759018"
          test ! -e hypotheses/p1_highres_authorization_v1.json
      - name: Run full H0-H5 plus P1 suite
        run: ./tests/run-tests.sh
      - name: Run standalone P1 estimator qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1-estimator-audit
          node tools/run-p1-estimation.js --mode qualification --trials 2 --out /tmp/p1-estimator-audit/qualification.json
          node - <<'NODE'
          const q=require('/tmp/p1-estimator-audit/qualification.json');
          if(q.status!=='passed')throw new Error('qualification failed');
          if(q.reference_outcomes_accessed!==false||q.response_target_semantics_loaded!==false||q.ymaze_accessed!==false)throw new Error('qualification firewall failed');
          if(q.estimator_git_blob_sha!=='a307e74e8ba2366e2546eebe1a7cccac69a3ff9a')throw new Error('estimator pin drift');
          NODE
      - name: Prove high-resolution path remains unauthorized
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/run-p1-estimation.js --mode highres --out /tmp/p1-estimator-audit/UNAUTHORIZED.json >/tmp/p1-highres.out 2>/tmp/p1-highres.err
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "missing post-qualification authorization artifact" /tmp/p1-highres.err
          test ! -e /tmp/p1-estimator-audit/UNAUTHORIZED.json
      - name: Build expanded Node P1 parity reference
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const est=require('./tools/run-p1-estimation.js');
          const p1=require('./src/p1.js');
          const {loadBundle,readJson}=require('./tools/load-bundle.js');
          const policy=readJson('./hypotheses/p1_response_estimation_v1.json');
          const base=readJson('./models/lasius_niger_painted_trail_p1_v1.json');
          const candidates=[est.contextCandidate(0,policy),est.contextCandidate(17,policy),est.contextCandidate(127,policy),est.nullAnchor(policy)];
          const specs=[];let k=0;
          for(const c of candidates)for(const treatment of ['dcm_control','pheromone']){
            const seed=992000+(++k)*17;
            specs.push({candidate:{sigma_field_mm:c.sigma_field_mm,kappa_trail_per_s:c.kappa_trail_per_s},candidate_index:c.candidate_index,source:c.source,treatment,seed});
          }
          function run(spec){
            const exp=est.conditionExperiment(spec.treatment),b=loadBundle(exp,{modelId:base.id});
            b.model=est.configuredModel(base,spec.candidate);b.observation.record_trajectories=false;
            const sim=new p1.Simulation(b,spec.seed),s=sim.runUntilComplete(b.experiment.duration_s,p1.FIXED_DT),a=sim.ants[0],r=s.observed_metrics.ants[0],ex=r.exit_coordinate_mm;
            return Object.assign({},spec,{result:{x:a.x,y:a.y,heading:a.heading,rng_state:a.rng.state,finished:a.finished,time_to_exit_s:r.time_to_arena_edge_s==null?b.experiment.duration_s:r.time_to_arena_edge_s,middle_zone_fraction:r.central_zone_fraction==null?0:r.central_zone_fraction,exit_x:ex?ex.x:null,exit_y:ex?ex.y:null,steering_samples:a.p1SteeringSamples,last_omega:a.p1LastOmega,dose_ratio:sim.p1DoseRatio}});
          }
          const out=specs.map(run);
          fs.writeFileSync('/tmp/p1-estimator-audit/node-parity.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({cases:out.length,null_cases:out.filter(x=>x.candidate.kappa_trail_per_s===0).length}));
          NODE
      - name: Real Chromium P1 estimator/runtime parity and firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/p1-estimator-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/p1-estimator-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p1-estimator-chrome --remote-debugging-port=9222 about:blank >/tmp/p1-estimator-chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/tmp/p1-estimator-version.json 2>/dev/null && break; sleep .2; done
          cat >/tmp/p1-estimator-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const refs=JSON.parse(fs.readFileSync('/tmp/p1-estimator-audit/node-parity.json','utf8'));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabIntegrity"))break;await new Promise(r=>setTimeout(r,50));}
          await evalv("new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='./src/p1.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})");
          const expr="(async()=>{const refs="+JSON.stringify(refs)+";const cache={};async function j(p){if(!cache[p])cache[p]=await (await fetch(p)).json();return JSON.parse(JSON.stringify(cache[p]));}async function bundle(treatment,candidate){const ep=treatment==='dcm_control'?'open_arena_p1_zero_dose_reachability.json':'open_arena_p1_nominal_dose_reachability.json';const experiment=await j('./experiments/'+ep),model=await j('./models/lasius_niger_painted_trail_p1_v1.json');model.painted_trail_response.field.sigma_field_mm=candidate.sigma_field_mm;model.painted_trail_response.steering.kappa_trail_per_s=candidate.kappa_trail_per_s;const apparatus=await j('./apparatus/'+experiment.apparatus+'.json'),state=await j('./states/'+experiment.state+'.json'),observation=await j('./observations/'+experiment.observation+'.json'),scoring=await j('./scoring/'+experiment.scoring+'.json');observation.record_trajectories=false;return{experiment,model,apparatus,state,observation,scoring};}const out=[];for(const spec of refs){const b=await bundle(spec.treatment,spec.candidate),sim=new AntLabP1.Simulation(b,spec.seed),s=sim.runUntilComplete(b.experiment.duration_s,AntLabP1.FIXED_DT),a=sim.ants[0],r=s.observed_metrics.ants[0],ex=r.exit_coordinate_mm;out.push({candidate:spec.candidate,candidate_index:spec.candidate_index,source:spec.source,treatment:spec.treatment,seed:spec.seed,result:{x:a.x,y:a.y,heading:a.heading,rng_state:a.rng.state,finished:a.finished,time_to_exit_s:r.time_to_arena_edge_s==null?b.experiment.duration_s:r.time_to_arena_edge_s,middle_zone_fraction:r.central_zone_fraction==null?0:r.central_zone_fraction,exit_x:ex?ex.x:null,exit_y:ex?ex.y:null,steering_samples:a.p1SteeringSamples,last_omega:a.p1LastOmega,dose_ratio:sim.p1DoseRatio}});}return out;})()";
          const browser=await evalv(expr);
          const near=(a,b,t=1e-11)=>a===b||(Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<=t);
          const numeric=['x','y','heading','time_to_exit_s','middle_zone_fraction','exit_x','exit_y','last_omega','dose_ratio'];
          let matched=0;
          for(let i=0;i<refs.length;i++){
            const a=refs[i],b=browser[i];
            if(a.treatment!==b.treatment||a.seed!==b.seed||a.candidate_index!==b.candidate_index)throw new Error('case metadata mismatch '+i);
            for(const k of numeric){if(a.result[k]==null||b.result[k]==null){if(a.result[k]!==b.result[k])throw new Error('null mismatch '+i+' '+k);}else if(!near(a.result[k],b.result[k]))throw new Error('numeric mismatch '+i+' '+k+' '+a.result[k]+' '+b.result[k]);}
            for(const k of ['rng_state','finished','steering_samples'])if(a.result[k]!==b.result[k])throw new Error('exact mismatch '+i+' '+k);
            matched++;
          }
          const policy=await evalv("(async()=>await (await fetch('./hypotheses/p1_response_estimation_v1.json')).json())()");
          if(policy.estimator_implementation_gate.high_resolution_response_search_authorized!==false)throw new Error('policy highres auth drift');
          const yreq=requests.filter(u=>/y[_-]?maze/i.test(u)),targetReq=requests.filter(u=>u.includes('poissonnier2026_pheromone_response_targets.json'));
          if(exceptions.length||consoleErrors.length||yreq.length||targetReq.length)throw new Error('browser firewall failure');
          const out={status:'passed',parity_cases:matched,exceptions:exceptions.length,console_errors:consoleErrors.length,ymaze_requests:yreq.length,response_target_requests:targetReq.length,highres_authorized:false};
          fs.writeFileSync('/tmp/p1-estimator-audit/browser.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));ws.close();
          NODE
          node /tmp/p1-estimator-browser.mjs
      - name: Upload P1 estimator audit
        uses: actions/upload-artifact@v4
        with:
          name: p1-v033e-estimator-audit
          path: /tmp/p1-estimator-audit
          retention-days: 30
