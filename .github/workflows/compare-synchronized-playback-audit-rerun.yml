name: Compare synchronized playback audit rerun
on:
  push:
    branches:
      - audit/compare-06-223ea04
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 223ea048c9b8065bbb7ec623bd2635b858ab7df9
          fetch-depth: 0
      - name: Verify exact synchronized-playback head
        run: test "$(git rev-parse HEAD)" = "223ea048c9b8065bbb7ec623bd2635b858ab7df9"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full ANTLAB suite
        run: bash tests/run-tests.sh
