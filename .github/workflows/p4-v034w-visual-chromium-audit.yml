name: P4 v0.3.4w visual simulator Chromium audit

on:
  push:
    branches: [v0.3.4w-p4-visual-simulator]
    paths:
      - '.github/workflows/p4-v034w-visual-chromium-audit.yml'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen P4 science bytes and visual regression
        run: |
          set -euo pipefail
          test "$(git hash-object src/p4.js)" = "bf7d5781bd69ec4568450ebbd3bdc284897b6f61"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test "$(git hash-object models/lasius_niger_painted_trail_p4_fitted_v1.json)" = "e23b022279d463442bdd4e16d4cf56e0212d2b11"
          test "$(git hash-object apparatus/poissonnier2026_y_maze_p4_left_v1.json)" = "219d42036c13463e8cae5045b8fdba6d5bd24454"
          test "$(git hash-object apparatus/poissonnier2026_y_maze_p4_right_v1.json)" = "bfcba7e34eed4b4f79e67d6fc22c60af993f5386"
          test "$(git hash-object experiments/y_maze_p4_left_consistency_v1.json)" = "08edc2d3ef9899820c04e900154f1b4bee2a5104"
          test "$(git hash-object experiments/y_maze_p4_right_consistency_v1.json)" = "217f94ec4ba61a61c7956baeac34abd19cf5eec8"
          test "$(git hash-object experiments/y_maze_p4_neutral_consistency_v1.json)" = "e58cf3f4f5c51168f2dc267af7a820bc5b875b90"
          node --check src/app.js
          node --check tests/p4-visual-simulator.test.js
          node tests/p4-visual-simulator.test.js
          git hash-object index.html | tee /tmp/index-blob.txt
          git hash-object src/app.js | tee /tmp/app-blob.txt
      - name: Locate real Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version | tee /tmp/chrome-version.txt
      - name: Generate six-case Node reference
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p4=require('./src/p4.js');
          const {loadBundle}=require('./tools/load-bundle.js');
          const cases=[
            ['left-8410000','y_maze_p4_left_consistency_v1.json',8410000],
            ['left-8410001','y_maze_p4_left_consistency_v1.json',8410001],
            ['right-8410000','y_maze_p4_right_consistency_v1.json',8410000],
            ['right-8410001','y_maze_p4_right_consistency_v1.json',8410001],
            ['neutral-8510000','y_maze_p4_neutral_consistency_v1.json',8510000],
            ['neutral-8510001','y_maze_p4_neutral_consistency_v1.json',8510001]
          ];
          const num=x=>Number.isFinite(x)?Number(x.toFixed(12)):x;
          function summary(name,seed,sim){const a=sim.ants[0];return{
            case:name,seed,time:num(sim.time),outcome:a.outcome,finished:a.finished,completedAt:num(a.completedAt),
            x:num(a.x),y:num(a.y),heading:num(a.heading),distanceTravelled:num(a.distanceTravelled),movingTime:num(a.movingTime),
            speedFactor:num(a.speedFactor),pauseRemaining:num(a.pauseRemaining),rngState:a.rng.state,
            p4EvaluationSamples:a.p4EvaluationSamples,p4DetectedSamples:a.p4DetectedSamples,
            p4SubthresholdSamples:a.p4SubthresholdSamples,p4NonzeroSteeringSamples:a.p4NonzeroSteeringSamples
          };}
          const out=[];
          for(const [name,file,seed] of cases){const b=loadBundle(file);const sim=new p4.Simulation(b,seed);sim.runUntilComplete(b.experiment.duration_s,p4.FIXED_DT);out.push(summary(name,seed,sim));}
          fs.writeFileSync('/tmp/node-cases.json',JSON.stringify(out));
          NODE
      - name: Build direct P4 browser parity harness
        run: |
          cat > p4-visual-browser-audit.tmp.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>P4 visual browser audit</title>
          <script src="/src/sim-core.js"></script>
          <script src="/src/measurement.js"></script>
          <script src="/src/h3.js"></script>
          <script src="/src/integrity.js"></script>
          <script src="/src/p1.js"></script>
          <script src="/src/p4.js"></script>
          <pre id="result">RUNNING</pre>
          <script>
          (async()=>{
            const cases=[
              ['left-8410000','y_maze_p4_left_consistency_v1.json',8410000],
              ['left-8410001','y_maze_p4_left_consistency_v1.json',8410001],
              ['right-8410000','y_maze_p4_right_consistency_v1.json',8410000],
              ['right-8410001','y_maze_p4_right_consistency_v1.json',8410001],
              ['neutral-8510000','y_maze_p4_neutral_consistency_v1.json',8510000],
              ['neutral-8510001','y_maze_p4_neutral_consistency_v1.json',8510001]
            ];
            const j=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+' HTTP '+r.status);return r.json();};
            async function load(file){const experiment=await j('/experiments/'+file);return{
              experiment,
              model:await j('/models/'+experiment.model+'.json'),
              apparatus:await j('/apparatus/'+experiment.apparatus+'.json'),
              state:await j('/states/'+experiment.state+'.json'),
              observation:await j('/observations/'+experiment.observation+'.json'),
              scoring:await j('/scoring/'+experiment.scoring+'.json')
            };}
            const num=x=>Number.isFinite(x)?Number(x.toFixed(12)):x;
            function summary(name,seed,sim){const a=sim.ants[0];return{
              case:name,seed,time:num(sim.time),outcome:a.outcome,finished:a.finished,completedAt:num(a.completedAt),
              x:num(a.x),y:num(a.y),heading:num(a.heading),distanceTravelled:num(a.distanceTravelled),movingTime:num(a.movingTime),
              speedFactor:num(a.speedFactor),pauseRemaining:num(a.pauseRemaining),rngState:a.rng.state,
              p4EvaluationSamples:a.p4EvaluationSamples,p4DetectedSamples:a.p4DetectedSamples,
              p4SubthresholdSamples:a.p4SubthresholdSamples,p4NonzeroSteeringSamples:a.p4NonzeroSteeringSamples
            };}
            try{
              const out=[];
              for(const [name,file,seed] of cases){const b=await load(file);const sim=new AntLabP4.Simulation(b,seed);sim.runUntilComplete(b.experiment.duration_s,AntLabP4.FIXED_DT);out.push(summary(name,seed,sim));}
              document.getElementById('result').textContent=JSON.stringify(out);
              document.documentElement.dataset.done='1';
            }catch(e){document.getElementById('result').textContent='ERROR:'+String(e&&e.stack||e);document.documentElement.dataset.done='error';}
          })();
          </script>
          HTML
      - name: Run real Chrome direct parity audit
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --disable-component-update --disable-default-apps --disable-sync --no-first-run --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8000/p4-visual-browser-audit.tmp.html > /tmp/browser-dom.html
          grep -q 'data-done="1"' /tmp/browser-dom.html
          python3 <<'PY'
          import html
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.on=False; self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='pre' and dict(attrs).get('id')=='result': self.on=True
              def handle_endtag(self,tag):
                  if tag=='pre' and self.on: self.on=False
              def handle_data(self,data):
                  if self.on: self.parts.append(data)
          p=P(); p.feed(open('/tmp/browser-dom.html',encoding='utf8').read())
          text=html.unescape(''.join(p.parts))
          if text.startswith('ERROR:'): raise SystemExit(text)
          open('/tmp/browser-cases.json','w',encoding='utf8').write(text)
          PY
      - name: Verify deterministic Node-Chrome semantic parity
        run: |
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const n=JSON.parse(fs.readFileSync('/tmp/node-cases.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/browser-cases.json','utf8'));
          const exactKeys=['case','seed','outcome','finished','rngState','p4EvaluationSamples','p4DetectedSamples','p4SubthresholdSamples','p4NonzeroSteeringSamples'];
          const numericKeys=['time','completedAt','x','y','heading','distanceTravelled','movingTime','speedFactor','pauseRemaining'];
          const tolerance=1e-7;
          assert.strictEqual(n.length,6); assert.strictEqual(b.length,6);
          let maxAbs=0,maxCase=null,maxKey=null;
          for(let i=0;i<n.length;i++){
            for(const k of exactKeys)assert.strictEqual(b[i][k],n[i][k],`exact parity drift ${n[i].case}.${k}`);
            for(const k of numericKeys){
              const d=Math.abs(b[i][k]-n[i][k]);
              if(d>maxAbs){maxAbs=d;maxCase=n[i].case;maxKey=k;}
              assert.ok(d<=tolerance,`continuous parity drift ${n[i].case}.${k}: ${d} > ${tolerance}`);
            }
          }
          for(const x of b.filter(x=>x.case.startsWith('neutral-')))assert.strictEqual(x.p4EvaluationSamples,0);
          const parity={case_count:b.length,exact_discrete_semantic_parity:true,continuous_state_abs_tolerance:tolerance,max_abs_numeric_difference:maxAbs,max_difference_case:maxCase,max_difference_field:maxKey,neutral_zero_dose_bypass:true};
          fs.writeFileSync('/tmp/parity.json',JSON.stringify(parity,null,2)+'\n');
          console.log('REAL CHROME SEMANTIC PARITY PASS '+JSON.stringify(parity));
          NODE
      - name: Verify actual ANTLAB P4 visual entries load in Chrome
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text()
          cases=[
            ('left','y_maze_p4_left_consistency_v1.json','left arm marked'),
            ('right','y_maze_p4_right_consistency_v1.json','right arm marked'),
            ('neutral','y_maze_p4_neutral_consistency_v1.json','exact zero-dose neutral')
          ]
          for name,value,title in cases:
              marker=f'<option value="{value}">'
              if marker not in src: raise SystemExit(f'missing option {value}')
              html=src.replace(marker,f'<option value="{value}" selected>')
              Path(f'p4-ui-{name}.tmp.html').write_text(html)
          PY
          : > /tmp/ui-smoke.txt
          for NAME in left right neutral; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --disable-component-update --disable-default-apps --disable-sync --no-first-run --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:8000/p4-ui-$NAME.tmp.html" > "/tmp/ui-$NAME.html"
            grep -q '>PAUSED<' "/tmp/ui-$NAME.html"
            grep -qi 'Frozen P4 Candidate 307 visual runtime' "/tmp/ui-$NAME.html"
            grep -qi 'noncanonical descriptive visualization only' "/tmp/ui-$NAME.html"
            ! grep -q 'LOAD ERROR' "/tmp/ui-$NAME.html"
            echo "$NAME PASS" >> /tmp/ui-smoke.txt
          done
      - name: Verify browser network firewall
        run: |
          set -euo pipefail
          ! grep -Eqi 'poissonnier2026_published_targets|poissonnier2026_inventory|/reference/' /tmp/http.log
          REQUESTS=$(grep -Ec '"GET ' /tmp/http.log || true)
          test "$REQUESTS" -gt 0
          echo "$REQUESTS" > /tmp/request-count.txt
      - name: Write Chromium qualification artifact
        run: |
          node <<'NODE'
          const fs=require('fs');
          const parity=JSON.parse(fs.readFileSync('/tmp/parity.json','utf8'));
          const report={
            schema_version:1,
            id:'P4_visual_simulator_chromium_qualification_v1',
            scientific_evidence:false,
            qualified_head_sha:process.env.GITHUB_SHA,
            index_git_blob_sha:fs.readFileSync('/tmp/index-blob.txt','utf8').trim(),
            app_git_blob_sha:fs.readFileSync('/tmp/app-blob.txt','utf8').trim(),
            chrome_version:fs.readFileSync('/tmp/chrome-version.txt','utf8').trim(),
            ui_smoke:fs.readFileSync('/tmp/ui-smoke.txt','utf8').trim().split('\n'),
            case_count:6,
            exact_discrete_semantic_parity:parity.exact_discrete_semantic_parity,
            continuous_state_abs_tolerance:parity.continuous_state_abs_tolerance,
            max_abs_numeric_difference:parity.max_abs_numeric_difference,
            max_difference_case:parity.max_difference_case,
            max_difference_field:parity.max_difference_field,
            neutral_zero_dose_bypass:parity.neutral_zero_dose_bypass,
            browser_http_request_count:Number(fs.readFileSync('/tmp/request-count.txt','utf8').trim()),
            forbidden_biological_ymaze_network_requests:0,
            frozen_candidate_307:true,
            browser_visualization_only:true,
            canonical_promotion_authorized:false
          };
          fs.writeFileSync('/tmp/p4-visual-chromium-audit.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: p4-visual-simulator-chromium-qualification
          path: /tmp/p4-visual-chromium-audit.json
          if-no-files-found: error
