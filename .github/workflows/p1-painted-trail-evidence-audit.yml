name: P1 painted-trail evidence audit
on:
  push:
    branches: [v0.3.3a-painted-trail-evidence-freeze]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact P1 evidence chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p1_painted_trail_response_evidence_v1.json)" = "afa3257468f7290a277c888276b671119e2be169"
          test "$(git hash-object reference/poissonnier2026_pheromone_response_targets.json)" = "81910c5bd3ec7b1f7728c2c9f100b0e8a6db29ed"
          test "$(git hash-object tools/derive-pheromone-response-targets.py)" = "d44fee2d176eb6dcdfea625d4280059d499cf80b"
          test "$(git hash-object reference/calibration_manifest.json)" = "58e06a93d9bc1ac1eb25316f4b1590743019c936"
          test ! -e src/p1.js
          test ! -e models/lasius_niger_painted_trail_p1_v1.json
      - name: Run full H0-H5 plus P1 evidence regression suite
        run: ./tests/run-tests.sh
      - name: Verify P1 response surface and holdout firewall
        shell: bash
        run: |
          mkdir -p /tmp/p1-evidence
          node - <<'NODE'
          const fs=require('fs');
          const t=require('./reference/poissonnier2026_pheromone_response_targets.json');
          const f=require('./hypotheses/p1_painted_trail_response_evidence_v1.json');
          const c=require('./reference/calibration_manifest.json');
          const mean=(tr,p,k)=>{const a=t.rows.filter(r=>r.treatment===tr&&r.path_length===p);return a.reduce((s,r)=>s+(typeof r[k]==='boolean'?(r[k]?1:0):r[k]),0)/a.length;};
          const out={
            status:'passed',
            rows:t.rows.length,
            middle_zone:{
              dcm_short:mean('dcm_control','s','middle_zone_fraction'),
              pheromone_short:mean('pheromone','s','middle_zone_fraction'),
              dcm_long:mean('dcm_control','l','middle_zone_fraction'),
              pheromone_long:mean('pheromone','l','middle_zone_fraction')
            },
            trail_axis_exit:{
              dcm_short:mean('dcm_control','s','trail_axis_exit'),
              pheromone_short:mean('pheromone','s','trail_axis_exit'),
              dcm_long:mean('dcm_control','l','trail_axis_exit'),
              pheromone_long:mean('pheromone','l','trail_axis_exit')
            },
            chemical_sensor_code_authorized:f.implementation_gate.chemical_sensor_code_authorized,
            response_parameter_search_authorized:f.implementation_gate.response_parameter_search_authorized,
            ymaze_allowed:c.datasets.poissonnier2026_ymaze.allowed_for_development_parameter_estimation
          };
          if(out.rows!==102||out.chemical_sensor_code_authorized!==false||out.response_parameter_search_authorized!==false||out.ymaze_allowed!==false)throw new Error('P1 evidence firewall failed');
          fs.writeFileSync('/tmp/p1-evidence/summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          NODE
      - name: Real Chromium sanity on unchanged canonical browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/p1-evidence/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/p1-evidence-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p1-evidence-chrome --remote-debugging-port=9222 about:blank >/tmp/p1-evidence/chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/tmp/p1-evidence/chrome-version.json 2>/dev/null && break; sleep .2; done
          cat >/tmp/p1-evidence/browser.mjs <<'NODE'
          import fs from 'node:fs';
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<100;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabH5"))break;await new Promise(r=>setTimeout(r,50));}
          const title=await evalv('document.title'),body=await evalv('document.body.innerText');
          if(title!=='ANTLAB H5'||!body.includes('H5-v1 closed'))throw new Error('canonical browser state drift');
          const yreq=requests.filter(u=>/y[_-]?maze|ymaze/i.test(u));
          if(exceptions.length||consoleErrors.length||yreq.length)throw new Error('browser firewall failure');
          const out={status:'passed',title,exceptions:0,console_errors:0,ymaze_requests:0,p1_implementation_present:!!(await evalv("typeof globalThis.AntLabP1!=='undefined'"))};
          if(out.p1_implementation_present)throw new Error('P1 implementation appeared before mechanism freeze');
          fs.writeFileSync('/tmp/p1-evidence/browser.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));ws.close();
          NODE
          node /tmp/p1-evidence/browser.mjs
      - name: Upload P1 evidence audit
        uses: actions/upload-artifact@v4
        with:
          name: p1-painted-trail-evidence-audit
          path: /tmp/p1-evidence
          retention-days: 30
