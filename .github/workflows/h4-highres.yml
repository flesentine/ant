name: Record H4 frozen 500x60 result
on:
  push:
    branches: [h4-transient-locomotor-activation-v1]
permissions:
  contents: write
  actions: read
jobs:
  record_result:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact successful high-resolution artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/h4-result
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9876724477/zip" \
            -o /tmp/h4-result.zip
          test "$(sha256sum /tmp/h4-result.zip | awk '{print $1}')" = "a81dd68a4c0e39f0cd7bf81831b7ab72098c0759b2a3489095ce523af4808473"
          unzip -q /tmp/h4-result.zip -d /tmp/h4-result
      - name: Verify frozen scientific result
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          src=pathlib.Path('/tmp/h4-result/h4_parameter_estimation_500x60_v1.json')
          assert src.exists()
          assert hashlib.sha256(src.read_bytes()).hexdigest() == '05f76e18d6ecdff9f038f4244227ede7a73cc323ca9857ac1d6dbbff1dd2e310'
          r=json.loads(src.read_text())
          assert r['scientific_evidence'] is True
          assert r['execution_class'] == 'frozen_high_resolution'
          assert r['policy_git_blob_sha'] == 'a889007f988628a8e61139f4349c23714cc1dd68'
          assert r['execution']['repo_commit'] == 'cb63d00e030b87016890f169f2852699ee6f8d6b'
          assert r['search']['H4_null_candidates_per_fold'] == 500
          assert r['search']['H4_context_candidates_per_fold_total'] == 500
          assert r['search']['training_trials_per_condition_per_candidate'] == 60
          assert r['search']['evaluation_trials_per_condition'] == 120
          assert r['search']['folds'] == 6
          assert r['search']['root_seed'] == 990000
          assert r['search']['physics_dt_s'] == 0.02
          assert r['status'] == 'development_estimation_failed_promotion_guard'
          assert r['internal_cv']['H4_promotion_guard_passed'] is False
          assert r['internal_cv']['H4_wins_vs_H4_null'] == 2
          assert r['canonical_parameters_updated'] is False
          assert r['ymaze_accessed'] is False
          assert r['moving_speed_used_for_fit'] is False
          pathlib.Path('reports/h4_parameter_estimation_500x60_v1.json').write_bytes(src.read_bytes())
          PY
          test "$(sha256sum reports/h4_parameter_estimation_500x60_v1.json | awk '{print $1}')" = "05f76e18d6ecdff9f038f4244227ede7a73cc323ca9857ac1d6dbbff1dd2e310"
      - name: Commit report and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'flesentine'
          git config user.email 'chrisgmcc@gmail.com'
          git add reports/h4_parameter_estimation_500x60_v1.json
          git rm .github/workflows/h4-highres.yml
          git commit -m 'Record H4 high-resolution LOCO failure'
          git push origin HEAD:h4-transient-locomotor-activation-v1
