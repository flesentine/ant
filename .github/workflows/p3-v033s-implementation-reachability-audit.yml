name: P3 v0.3.3s implementation reachability audit
on:
  push:
    branches: [v0.3.3s-p3-implementation-reachability]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Verify exact P3 implementation chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p3_painted_trail_mechanism_v1.json)" = "5d00ce0058ff388c9f57d7dce56ce465d82c5765"
          test "$(git hash-object hypotheses/p3_reachability_execution_v1.json)" = "55494a3190964d24ded2ae0d1faf3b355cc7835f"
          test "$(git hash-object hypotheses/p3_implementation_authorization_v1.json)" = "128afcbdb10d3254240c5074e1e997cee7d7fe51"
          test "$(git hash-object src/p3.js)" = "4010b19fd7a1b713a4b8d25b6a693d3ee0a581b8"
          test "$(git hash-object models/lasius_niger_painted_trail_p3_v1.json)" = "9107de0c71641c4037bbedbb498b9fa868c1ef00"
          test "$(git hash-object experiments/open_arena_p3_zero_dose_reachability.json)" = "f2a97691e604bbb086216221da1c776cc74e9dbb"
          test "$(git hash-object experiments/open_arena_p3_nominal_dose_reachability.json)" = "e3c3d7c4c58c885b99654e8797b8570ef91f7cde"
          test "$(git hash-object tools/run-p3-reachability.js)" = "0e1795b7bbb3a568fbbd241cc809d600e1f8ca67"
          test ! -e hypotheses/p3_response_estimation_v1.json
          test ! -e tools/run-p3-estimation.js

      - name: Run full permanent suite
        run: ./tests/run-tests.sh

      - name: Run frozen P3 reference-free reachability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p3-v033s-audit
          node tools/run-p3-reachability.js --out /tmp/p3-v033s-audit/p3_reference_free_reachability_v1.json
          node - <<'NODE'
          const r=require('/tmp/p3-v033s-audit/p3_reference_free_reachability_v1.json');
          if(r.status!=='reference_free_reachability_passed'||r.structural_checks.overall_pass!==true)throw new Error('P3 reachability failed');
          if(r.nominal_reachability_panel.trials!==400||r.nominal_reachability_panel.all_trials_finite!==true||r.nominal_reachability_panel.any_trial_with_steering!==true)throw new Error('P3 nominal panel drift');
          if(r.reference_targets_accessed!==false||r.reference_outcomes_accessed!==false||r.p1_official_result_semantics_loaded!==false||r.p2_official_result_semantics_loaded!==false||r.ymaze_accessed!==false)throw new Error('P3 reference firewall drift');
          console.log(JSON.stringify({status:r.status,trials:r.nominal_reachability_panel.trials,mean_central_zone_fraction:r.nominal_reachability_panel.mean_central_zone_fraction,trail_axis_exit_rate:r.nominal_reachability_panel.trail_axis_exit_rate,mean_speed:r.nominal_reachability_panel.mean_moving_speed_mm_s,mean_exit_time:r.nominal_reachability_panel.mean_time_to_exit_s,mean_steering_samples:r.nominal_reachability_panel.mean_steering_samples}));
          NODE

      - name: Prepare Node parity cases
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),p3=require('./src/p3.js'),p1=require('./src/p1.js');
          const {loadBundle}=require('./tools/load-bundle.js');
          function run(sim,seconds=2,dt=.02){for(let i=0;i<Math.round(seconds/dt)&&!sim.allFinished();i++)sim.step(dt);return sim;}
          const b=loadBundle('open_arena_p3_nominal_dose_reachability.json',{modelId:'lasius_niger_painted_trail_p3_v1'});
          const sim=new p3.Simulation(b,741000),field=sim.p3Field,cfg=sim.p3Config;
          const out={
            relative:[p3.relativeSignal(0,0),p3.relativeSignal(2,2),p3.relativeSignal(2,6),p3.relativeSignal(6,2)],
            points:p3.sectorSamplePoints(0,0,0,cfg),
            center:p3.trailSteeringRate(100,105,0,cfg,field,1),
            above:p3.trailSteeringRate(100,95,0,cfg,field,1),
            scale025:p3.trailSteeringRate(117,96,.37,cfg,field,.25),
            scale4:p3.trailSteeringRate(117,96,.37,cfg,field,4),
            nominalFingerprint:run(sim,2).fingerprint()
          };
          fs.writeFileSync('p3-node-parity.json',JSON.stringify(out));
          NODE

      - name: Real Chromium P3 parity and firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/p3-v033s-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/p3-v033s-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p3-v033s-chrome --remote-debugging-port=9222 about:blank >/tmp/p3-v033s-chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep .2; done
          cat >/tmp/p3-v033s-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabIntegrity"))break;await new Promise(r=>setTimeout(r,50));}
          await evalv("(async()=>{for(const src of ['./src/p1.js','./src/p3.js']){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}})()");
          const result=await evalv("(async()=>{const f=async p=>(await fetch(p)).json();const exp=await f('./experiments/open_arena_p3_nominal_dose_reachability.json'),model=await f('./models/lasius_niger_painted_trail_p3_v1.json'),apparatus=await f('./apparatus/'+exp.apparatus+'.json'),state=await f('./states/'+exp.state+'.json'),observation=await f('./observations/'+exp.observation+'.json'),scoring=await f('./scoring/'+exp.scoring+'.json'),node=await f('./p3-node-parity.json');const bundle={experiment:exp,model,apparatus,state,observation,scoring};const sim=new AntLabP3.Simulation(bundle,741000),cfg=sim.p3Config,field=sim.p3Field;for(let i=0;i<100&&!sim.allFinished();i++)sim.step(.02);const browser={relative:[AntLabP3.relativeSignal(0,0),AntLabP3.relativeSignal(2,2),AntLabP3.relativeSignal(2,6),AntLabP3.relativeSignal(6,2)],points:AntLabP3.sectorSamplePoints(0,0,0,cfg),center:AntLabP3.trailSteeringRate(100,105,0,cfg,field,1),above:AntLabP3.trailSteeringRate(100,95,0,cfg,field,1),scale025:AntLabP3.trailSteeringRate(117,96,.37,cfg,field,.25),scale4:AntLabP3.trailSteeringRate(117,96,.37,cfg,field,4),nominalFingerprint:sim.fingerprint()};return{same:JSON.stringify(browser)===JSON.stringify(node),browser,node};})()");
          if(!result.same)throw new Error('Node/Chromium P3 parity mismatch');
          const targetReq=requests.filter(u=>u.includes('poissonnier2026_pheromone_response_targets.json'));
          const yreq=requests.filter(u=>/y[_-]?maze/i.test(u));
          const p1ResultReq=requests.filter(u=>u.includes('p1_response_estimation_500x60_v1.json'));
          const p2ResultReq=requests.filter(u=>u.includes('p2_response_estimation_1000x60_v1.json'));
          const p3EstReq=requests.filter(u=>u.includes('run-p3-estimation')||u.includes('p3_response_estimation'));
          if(exceptions.length||consoleErrors.length||targetReq.length||yreq.length||p1ResultReq.length||p2ResultReq.length||p3EstReq.length)throw new Error('P3 browser firewall failure');
          const out={status:'passed',parity:true,exceptions:exceptions.length,console_errors:consoleErrors.length,response_target_requests:targetReq.length,ymaze_requests:yreq.length,p1_result_requests:p1ResultReq.length,p2_result_requests:p2ResultReq.length,p3_estimation_surface_requests:p3EstReq.length};
          fs.writeFileSync('/tmp/p3-v033s-audit/browser.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));ws.close();
          NODE
          node /tmp/p3-v033s-browser.mjs
          rm -f p3-node-parity.json

      - uses: actions/upload-artifact@v4
        with:
          name: p3-v033s-implementation-reachability-audit
          path: /tmp/p3-v033s-audit
          retention-days: 30
