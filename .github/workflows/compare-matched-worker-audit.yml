name: Compare matched-worker audit
on:
  push:
    branches:
      - audit/compare-08-97bc676
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97bc6764ed75c1c32b125bee04e7283bf6eb932b
          fetch-depth: 0
      - name: Verify exact matched-worker head
        run: test "$(git rev-parse HEAD)" = "97bc6764ed75c1c32b125bee04e7283bf6eb932b"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full ANTLAB suite
        run: bash tests/run-tests.sh
