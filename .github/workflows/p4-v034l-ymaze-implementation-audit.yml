# final evidence-head audit after qualification report freeze
name: P4 v0.3.4l Y-maze implementation audit

on:
  push:
    branches: [v0.3.4l-p4-ymaze-implementation-qualification]
    paths:
      - '.github/workflows/p4-v034l-ymaze-implementation-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact implementation and qualification evidence scope
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p4_Y_maze_consistency_implementation_authorization_v1.json)" = "db64b72830c3715b3dd26d5ad3422655e50e8828"
          test "$(git hash-object hypotheses/p4_cross_apparatus_Y_maze_consistency_protocol_v1.json)" = "22515a3fe0945c0f19b6fb2166923f027bbf1b54"
          test "$(git hash-object src/p4.js)" = "bf7d5781bd69ec4568450ebbd3bdc284897b6f61"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test "$(git hash-object models/lasius_niger_painted_trail_p4_fitted_v1.json)" = "e23b022279d463442bdd4e16d4cf56e0212d2b11"
          test "$(git hash-object apparatus/poissonnier2026_y_maze_p4_left_v1.json)" = "219d42036c13463e8cae5045b8fdba6d5bd24454"
          test "$(git hash-object apparatus/poissonnier2026_y_maze_p4_right_v1.json)" = "bfcba7e34eed4b4f79e67d6fc22c60af993f5386"
          test "$(git hash-object tools/run-p4-ymaze-consistency.js)" = "af0fd2d91f67102c62243bef289bbfe20cf471d7"
          test "$(git hash-object tools/compare-p4-ymaze-consistency.js)" = "8e8c1ecf1a98fb14fe2e83ce38be224d7739c11c"
          test "$(git hash-object reports/p4_ymaze_consistency_implementation_qualification_v1.json)" = "ac44324c1e7619a7e9d43f338c19951b661e8a14"
          test ! -e hypotheses/p4_Y_maze_consistency_official_execution_authorization_v1.json
          test ! -e hypotheses/p4_Y_maze_consistency_stage_B_authorization_v1.json
          test ! -e reports/p4_ymaze_consistency_simulation_v1.json
          test ! -e reports/p4_ymaze_consistency_comparison_v1.json
          git diff --name-only 4a2c6a0f40f9d07c57ac7eb2ad6eec58aa0cd6e6...HEAD | grep -Ev '^(.github/workflows/p4-v034l-ymaze-implementation-audit.yml|.github/workflows/p4-v034l-ymaze-chromium-audit.yml|models/lasius_niger_painted_trail_p4_fitted_v1.json|apparatus/poissonnier2026_y_maze_p4_left_v1.json|apparatus/poissonnier2026_y_maze_p4_right_v1.json|experiments/y_maze_p4_left_consistency_v1.json|experiments/y_maze_p4_right_consistency_v1.json|experiments/y_maze_p4_neutral_consistency_v1.json|tools/run-p4-ymaze-consistency.js|tools/compare-p4-ymaze-consistency.js|reports/p4_ymaze_consistency_implementation_qualification_v1.json|tests/p4-cross-apparatus-validation-source-design.test.js|tests/p4-ymaze-consistency-protocol.test.js|tests/p4-ymaze-consistency-implementation-authorization.test.js|tests/p4-ymaze-consistency-implementation.test.js|tests/p4-ymaze-consistency-implementation-qualification-result.test.js|tests/run-tests.sh)$' && { echo 'unexpected v0.3.4l diff'; exit 1; } || true
      - name: Syntax-check new runners
        run: |
          node --check tools/run-p4-ymaze-consistency.js
          node --check tools/compare-p4-ymaze-consistency.js
      - name: Run lifecycle regressions directly
        run: |
          node tests/p4-cross-apparatus-validation-source-design.test.js
          node tests/p4-ymaze-consistency-protocol.test.js
          node tests/p4-ymaze-consistency-implementation-authorization.test.js
      - name: Run implementation and qualification-result regressions directly
        run: |
          node tests/p4-ymaze-consistency-implementation.test.js
          node tests/p4-ymaze-consistency-implementation-qualification-result.test.js
      - name: Confirm official Stage A and real Stage B are still locked
        run: |
          if node tools/run-p4-ymaze-consistency.js --official --out /tmp/forbidden-official.json; then echo 'official Stage A unexpectedly ran'; exit 1; fi
          test ! -e /tmp/forbidden-official.json
          test ! -e reports/p4_ymaze_consistency_simulation_v1.json
          test ! -e reports/p4_ymaze_consistency_comparison_v1.json
      - name: Run complete permanent regression suite
        run: ./tests/run-tests.sh
      - name: Confirm evidence-only finalization did not mutate repo
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          echo 'v0.3.4l final evidence-head qualification PASS: implementation fixed, Stage A official and Stage B real comparison remain locked'
