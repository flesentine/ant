# rerun after protocol/authorization lifecycle corrections
name: P4 v0.3.4l Y-maze implementation audit

on:
  push:
    branches: [v0.3.4l-p4-ymaze-implementation-qualification]
    paths:
      - '.github/workflows/p4-v034l-ymaze-implementation-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact implementation scope and frozen runtime
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p4_Y_maze_consistency_implementation_authorization_v1.json)" = "db64b72830c3715b3dd26d5ad3422655e50e8828"
          test "$(git hash-object hypotheses/p4_cross_apparatus_Y_maze_consistency_protocol_v1.json)" = "22515a3fe0945c0f19b6fb2166923f027bbf1b54"
          test "$(git hash-object src/p4.js)" = "bf7d5781bd69ec4568450ebbd3bdc284897b6f61"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test ! -e hypotheses/p4_Y_maze_consistency_official_execution_authorization_v1.json
          test ! -e hypotheses/p4_Y_maze_consistency_stage_B_authorization_v1.json
          test ! -e reports/p4_ymaze_consistency_simulation_v1.json
          test ! -e reports/p4_ymaze_consistency_comparison_v1.json
          git diff --name-only 4a2c6a0f40f9d07c57ac7eb2ad6eec58aa0cd6e6...HEAD | grep -Ev '^(.github/workflows/p4-v034l-ymaze-implementation-audit.yml|models/lasius_niger_painted_trail_p4_fitted_v1.json|apparatus/poissonnier2026_y_maze_p4_left_v1.json|apparatus/poissonnier2026_y_maze_p4_right_v1.json|experiments/y_maze_p4_left_consistency_v1.json|experiments/y_maze_p4_right_consistency_v1.json|experiments/y_maze_p4_neutral_consistency_v1.json|tools/run-p4-ymaze-consistency.js|tools/compare-p4-ymaze-consistency.js|tests/p4-cross-apparatus-validation-source-design.test.js|tests/p4-ymaze-consistency-protocol.test.js|tests/p4-ymaze-consistency-implementation-authorization.test.js|tests/p4-ymaze-consistency-implementation.test.js|tests/run-tests.sh)$' && { echo 'unexpected v0.3.4l diff'; exit 1; } || true
      - name: Syntax-check new runners
        run: |
          node --check tools/run-p4-ymaze-consistency.js
          node --check tools/compare-p4-ymaze-consistency.js
      - name: Run lifecycle regressions directly
        run: |
          node tests/p4-cross-apparatus-validation-source-design.test.js
          node tests/p4-ymaze-consistency-protocol.test.js
          node tests/p4-ymaze-consistency-implementation-authorization.test.js
      - name: Run implementation regression directly
        run: node tests/p4-ymaze-consistency-implementation.test.js
      - name: Run qualification Stage A CLI on non-official seeds
        run: |
          node tools/run-p4-ymaze-consistency.js --qualification --out /tmp/p4-ymaze-qualification.json
          node -e "const r=require('/tmp/p4-ymaze-qualification.json'); if(r.mode!=='qualification'||r.seed_contract.left_root!==8410000||r.seed_contract.neutral_root!==8510000) process.exit(1)"
      - name: Confirm official Stage A CLI is locked
        run: |
          if node tools/run-p4-ymaze-consistency.js --official --out /tmp/forbidden-official.json; then echo 'official Stage A unexpectedly ran'; exit 1; fi
          test ! -e /tmp/forbidden-official.json
      - name: Run complete permanent regression suite
        run: ./tests/run-tests.sh
      - name: Confirm no official or biological-comparison artifact was created
        run: |
          set -euo pipefail
          test ! -e reports/p4_ymaze_consistency_simulation_v1.json
          test ! -e reports/p4_ymaze_consistency_comparison_v1.json
          test "$(git status --porcelain)" = ""
          echo 'v0.3.4l Node implementation qualification stayed reference-free and non-official'
