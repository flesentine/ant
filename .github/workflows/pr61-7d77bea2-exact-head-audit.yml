name: PR61 exact-head audit 7d77bea2
on:
  push:
    branches:
      - audit/pr61-7d77bea2-exact-head
permissions:
  contents: read
jobs:
  exact-head-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: 7d77bea2b763a473f0359e9a9b32940c4922fa59
          fetch-depth: 0
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "7d77bea2b763a473f0359e9a9b32940c4922fa59"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full ANTLAB suite
        run: bash tests/run-tests.sh
