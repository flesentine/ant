name: H5 measurement reconstruction audit
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned final-record supplement
        run: |
          set -euo pipefail
          mkdir -p /tmp/h5-source
          ./tools/fetch-poissonnier2026-reference.sh /tmp/h5-source >/tmp/fetch-reference.log
          test "$(sha256sum /tmp/h5-source/40_2026_1106_MOESM2_ESM.xlsx | awk '{print $1}')" = "b311d5fdc89eac56724bb5195743cf4bb52a6cff4040b18704353091e1fe6318"
      - name: Derive and validate geometry-only reference
        run: |
          set -euo pipefail
          python3 tools/derive-poissonnier2026-measurement-geometry.py /tmp/h5-source/40_2026_1106_MOESM2_ESM.xlsx /tmp/geometry.json >/tmp/geometry.stdout
          python3 -m json.tool /tmp/geometry.json >/dev/null
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/geometry.json'))
          assert d['summary']['rows']==51
          assert len(d['summary']['colonies'])==6
          assert d['summary']['max_abs_Y_Line_minus_vertical_midpoint_mm']==0
          assert all(r['arena_width_mm']>0 and r['arena_height_mm']>0 for r in d['rows'])
          assert all(0<=r['first_track_x_mm']<=r['arena_width_mm'] for r in d['rows'])
          assert all(0<=r['first_track_y_mm']<=r['arena_height_mm'] for r in d['rows'])
          forbidden={'path_length','Xlast','Ylast','Beeline','Straightness','Total_Frames','Proportion_Frames_MiddleZone','Average_Speed','Average_Speed_Moving','Traveled_Dist','Traveled_Dist_Moving'}
          assert all(not forbidden.intersection(r.keys()) for r in d['rows'])
          print(json.dumps(d['summary'],indent=2))
          PY
      - name: Materialize exact audited reference on branch
        run: |
          set -euo pipefail
          mkdir -p reference
          cp /tmp/geometry.json reference/poissonnier2026_open_arena_measurement_geometry_v1.json
          if git diff --quiet -- reference/poissonnier2026_open_arena_measurement_geometry_v1.json; then
            echo 'Derived reference already matches branch.'
            exit 0
          fi
          changed=$(git status --porcelain --untracked-files=all | awk '{print $2}')
          test "$changed" = "reference/poissonnier2026_open_arena_measurement_geometry_v1.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reference/poissonnier2026_open_arena_measurement_geometry_v1.json
          git commit -m 'Freeze reconstructed open-arena geometry reference'
          git push origin HEAD:h5-origin-referenced-search-v1
      - uses: actions/upload-artifact@v4
        with:
          name: h5-measurement-reconstruction-audit
          path: |
            /tmp/geometry.json
            /tmp/geometry.stdout
            /tmp/fetch-reference.log
          retention-days: 14
