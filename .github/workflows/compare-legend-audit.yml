name: Compare legend audit
on:
  push:
    branches:
      - audit/compare-15-af7382c
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af7382c43556436eedee23ca49b263b0c2f476f3
          fetch-depth: 0
      - name: Verify exact comparison-legend head
        run: test "$(git rev-parse HEAD)" = "af7382c43556436eedee23ca49b263b0c2f476f3"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full ANTLAB suite
        run: bash tests/run-tests.sh
