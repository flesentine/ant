name: Test and deploy ANTLAB
on:
  push:
    branches: [h4-transient-locomotor-activation-v1]
permissions:
  contents: read
  actions: read
jobs:
  h4_deep_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact hardened audit candidate from prior artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/h4-candidate
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9874025287/zip" -o /tmp/h4-candidate.zip
          unzip -q /tmp/h4-candidate.zip -d /tmp/h4-candidate
          est=$(find /tmp/h4-candidate -path '*/tools/run-h4-estimation.js' -type f | head -1)
          tst=$(find /tmp/h4-candidate -path '*/tests/h4-estimation.test.js' -type f | head -1)
          test -n "$est" -a -n "$tst"
          test "$(sha256sum "$est" | awk '{print $1}')" = "b33b3a02cde8c00985c997dc4ecb4003415d6506542e5c27171b099fcfc97c9c"
          test "$(sha256sum "$tst" | awk '{print $1}')" = "6afd098d9f4371dfae33f58f8beb6b6c8d62a5004c04adff2422fbdee6231e1d"
          cp "$est" tools/run-h4-estimation.js
          cp "$tst" tests/h4-estimation.test.js
          node --check tools/run-h4-estimation.js
          node --check tests/h4-estimation.test.js
          test "$(git hash-object hypotheses/h4_parameter_estimation_v1.json)" = "a889007f988628a8e61139f4349c23714cc1dd68"
      - name: Run full H0-H4 suite and estimator audit tests
        run: ./tests/run-tests.sh
      - name: Verify unsafe report destinations are rejected
        shell: bash
        run: |
          before=$(git hash-object models/lasius_niger_locomotion_v1.json)
          if node tools/run-h4-estimation.js --mode qualification --trials 1 --out models/lasius_niger_locomotion_v1.json >/tmp/unsafe.log 2>&1; then
            echo "Unsafe canonical-model output path was accepted" >&2
            exit 1
          fi
          after=$(git hash-object models/lasius_niger_locomotion_v1.json)
          test "$before" = "$after"
          grep -q 'only under reports/' /tmp/unsafe.log
      - name: Build Node parity reference
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h4=require('./tools/run-h4-estimation.js');
          const {Simulation,streamSeed,FIXED_DT}=require('./src/integrity.js');
          const core=require('./src/sim-core.js');
          const {loadBundle,readJson}=require('./tools/load-bundle.js');
          const root=process.cwd(), policy=h4.assertExactPolicyBlob(root).policy;
          h4.assertFrozenRuntimeBlobs(root);
          const base=readJson('./models/lasius_niger_locomotion_h4_v1.json');
          const n500=h4.nullCandidate(499,policy);
          const cases=[
            {name:'context_halton_1',candidate:h4.contextCandidate(0,policy),seed:424242},
            {name:'context_halton_499',candidate:h4.contextCandidate(498,policy),seed:424243},
            {name:'null_halton_500',candidate:n500,seed:424244},
            {name:'exact_null_anchor_500',candidate:h4.nullAnchor(n500),seed:424244}
          ];
          function edge(ex,w,h){if(!ex)return'timeout';const d={left:Math.abs(ex.x),right:Math.abs(ex.x-w),top:Math.abs(ex.y),bottom:Math.abs(ex.y-h)};return Object.keys(d).sort((a,b)=>d[a]-d[b])[0];}
          function one(c,seed,pl,exp){const model=h4.configuredModel(base,c),b=loadBundle(exp,{modelId:model.id});b.model=JSON.parse(JSON.stringify(model));b.observation.record_trajectories=false;const sim=new Simulation(b,seed),rr=new core.RNG(streamSeed(seed,h4.ENTRY_STREAM));if(rr.next()>c.q)sim.ants[0].heading=rr.next()*2*Math.PI-Math.PI;const sx=sim.ants[0].x,sy=sim.ants[0].y,s=sim.runUntilComplete(b.experiment.duration_s,FIXED_DT),r=s.observed_metrics.ants[0],a=sim.ants[0],ex=r.exit_coordinate_mm;return{path_length:pl,time_to_exit_s:r.time_to_arena_edge_s??b.experiment.duration_s,middle_zone_fraction:r.central_zone_fraction??0,beeline_mm:ex?Math.hypot(ex.x-sx,ex.y-sy):0,exit_edge:edge(ex,sim.apparatus.world.width,sim.apparatus.world.height),A0:a.locomotorActivationInitial,A:a.locomotorActivation,completedAt:a.completedAt,distanceTravelled:a.distanceTravelled,heading:a.heading,speedFactor:a.speedFactor,biologyRngState:a.rng.state,modelHash:sim.layerHashes.model_hash,x:a.x,y:a.y,startX:sx,startY:sy};}
          const out={policy_blob:h4.POLICY_GIT_BLOB_SHA,repo_commit:h4.currentRepoCommit(root),cases:cases.map(x=>({name:x.name,candidate:x.candidate,seed:x.seed,runs:[one(x.candidate,x.seed,'s','open_arena_short_control.json'),one(x.candidate,x.seed,'l','open_arena_long_control.json')]}))};
          fs.writeFileSync('/tmp/h4-node-parity.json',JSON.stringify(out,null,2));
          NODE
      - name: Start Chromium and local lab server
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/h4-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/h4-chrome.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break; sleep .2; done
          curl -fsS http://127.0.0.1:9222/json/version > /tmp/chrome-version.json
      - name: Targeted Node to Chromium parity
        shell: bash
        run: |
          cat > /tmp/h4-parity.mjs <<'NODE'
          import fs from 'node:fs';
          const expected=JSON.parse(fs.readFileSync('/tmp/h4-node-parity.json','utf8'));
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();const target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});let id=0;const pending=new Map(),exceptions=[],consoleErrors=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'browser eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});for(let i=0;i<60;i++){if(await evalv("document.readyState==='complete' && !!globalThis.AntLabIntegrity && !!globalThis.AntLabCore"))break;await sleep(100);}
          const browser=await evalv(`(async()=>{const cases=${JSON.stringify(expected.cases.map(c=>({name:c.name,candidate:c.candidate,seed:c.seed})))};const clone=x=>JSON.parse(JSON.stringify(x));async function j(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' '+r.status);return r.json();}const base=await j('./models/lasius_niger_locomotion_h4_v1.json');async function bundle(exp,model){const e=await j('./experiments/'+exp);e.model=model.id;const [apparatus,state,observation,scoring]=await Promise.all([j('./apparatus/'+e.apparatus+'.json'),j('./states/'+e.state+'.json'),j('./observations/'+e.observation+'.json'),j('./scoring/'+e.scoring+'.json')]);return{experiment:e,model:clone(model),apparatus,state,observation,scoring};}function configured(c){const m=clone(base);m.movement.base_speed_mm_s=c.base_speed_mm_s;m.movement.angular_sigma_rad_sqrt_s=c.angular_sigma_rad_sqrt_s;m.locomotor_activation.initialization.history_distance_scale_mm=c.lambda_activation_mm;m.locomotor_activation.decay.activation_tau_s=c.tau_activation_s;m.locomotor_activation.effect.max_speed_gain_fraction=c.rho_speed;return m;}function edge(ex,w,h){if(!ex)return'timeout';const d={left:Math.abs(ex.x),right:Math.abs(ex.x-w),top:Math.abs(ex.y),bottom:Math.abs(ex.y-h)};return Object.keys(d).sort((a,b)=>d[a]-d[b])[0];}async function one(c,seed,pl,exp){const model=configured(c),b=await bundle(exp,model);b.observation.record_trajectories=false;const sim=new AntLabIntegrity.Simulation(b,seed),rr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,'h2_estimation_entry_transition_v1'));if(rr.next()>c.q)sim.ants[0].heading=rr.next()*2*Math.PI-Math.PI;const sx=sim.ants[0].x,sy=sim.ants[0].y,s=sim.runUntilComplete(b.experiment.duration_s,AntLabIntegrity.FIXED_DT),r=s.observed_metrics.ants[0],a=sim.ants[0],ex=r.exit_coordinate_mm;return{path_length:pl,time_to_exit_s:r.time_to_arena_edge_s??b.experiment.duration_s,middle_zone_fraction:r.central_zone_fraction??0,beeline_mm:ex?Math.hypot(ex.x-sx,ex.y-sy):0,exit_edge:edge(ex,sim.apparatus.world.width,sim.apparatus.world.height),A0:a.locomotorActivationInitial,A:a.locomotorActivation,completedAt:a.completedAt,distanceTravelled:a.distanceTravelled,heading:a.heading,speedFactor:a.speedFactor,biologyRngState:a.rng.state,modelHash:sim.layerHashes.model_hash,x:a.x,y:a.y,startX:sx,startY:sy};}const out=[];for(const c of cases)out.push({name:c.name,candidate:c.candidate,seed:c.seed,runs:[await one(c.candidate,c.seed,'s','open_arena_short_control.json'),await one(c.candidate,c.seed,'l','open_arena_long_control.json')]});return out;})()`);
          function cmp(a,b,path='root'){if(typeof a==='number'||typeof b==='number'){if(a==null||b==null){if(a!==b)throw new Error(path+': '+a+' != '+b);return;}const scale=Math.max(1,Math.abs(a),Math.abs(b));if(Math.abs(a-b)>2e-11*scale)throw new Error(path+`: ${a} != ${b}`);return;}if(Array.isArray(a)){if(!Array.isArray(b)||a.length!==b.length)throw new Error(path+' array mismatch');a.forEach((v,i)=>cmp(v,b[i],path+'['+i+']'));return;}if(a&&typeof a==='object'){for(const k of Object.keys(a))cmp(a[k],b?.[k],path+'.'+k);return;}if(a!==b)throw new Error(path+`: ${a} != ${b}`);}
          cmp(expected.cases,browser,'cases');const n=browser.find(x=>x.name==='null_halton_500'),a=browser.find(x=>x.name==='exact_null_anchor_500');cmp(n.runs,a.runs,'browser.null_anchor_exact_equivalence');if(exceptions.length)throw new Error('Browser exceptions '+JSON.stringify(exceptions));if(consoleErrors.length)throw new Error('Browser console errors '+JSON.stringify(consoleErrors));
          const report={status:'passed',browser_target:target.url,policy_blob:expected.policy_blob,repo_commit:expected.repo_commit,cases:browser.map(x=>({name:x.name,seed:x.seed,short:{time:x.runs[0].time_to_exit_s,A0:x.runs[0].A0,hash:x.runs[0].modelHash,rng:x.runs[0].biologyRngState},long:{time:x.runs[1].time_to_exit_s,A0:x.runs[1].A0,hash:x.runs[1].modelHash,rng:x.runs[1].biologyRngState}})),null_anchor_exact_equivalence:true,exceptions:0,console_errors:0,ymaze_loaded:false};fs.writeFileSync('/tmp/h4-chromium-parity.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/h4-parity.mjs
      - name: Upload H4 deep audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h4-deep-estimator-audit
          path: |
            /tmp/h4-node-parity.json
            /tmp/h4-chromium-parity.json
            /tmp/chrome-version.json
            /tmp/h4-chrome.log
            /tmp/h4-http.log
            /tmp/unsafe.log
            tools/run-h4-estimation.js
            tests/h4-estimation.test.js
          retention-days: 7
          if-no-files-found: warn
