name: Test and deploy ANTLAB
on:
  push:
    branches: [h4-transient-locomotor-activation-v1]
permissions:
  contents: write
  actions: read
jobs:
  commit_h4_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact successful deep-audit candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/h4-success
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9874077142/zip" -o /tmp/h4-success.zip
          unzip -q /tmp/h4-success.zip -d /tmp/h4-success
          est=$(find /tmp/h4-success -path '*/tools/run-h4-estimation.js' -type f | head -1)
          tst=$(find /tmp/h4-success -path '*/tests/h4-estimation.test.js' -type f | head -1)
          test -n "$est" -a -n "$tst"
          test "$(sha256sum "$est" | awk '{print $1}')" = "b33b3a02cde8c00985c997dc4ecb4003415d6506542e5c27171b099fcfc97c9c"
          test "$(sha256sum "$tst" | awk '{print $1}')" = "6afd098d9f4371dfae33f58f8beb6b6c8d62a5004c04adff2422fbdee6231e1d"
          cp "$est" tools/run-h4-estimation.js
          cp "$tst" tests/h4-estimation.test.js
          test "$(git hash-object tools/run-h4-estimation.js)" = "d417c62a4ef4f97c338a1da2f1ff10f49e18c175"
          test "$(git hash-object tests/h4-estimation.test.js)" = "00c196cd3a8f341ae955f227ba66542ece22c6cd"
          test "$(git hash-object hypotheses/h4_parameter_estimation_v1.json)" = "a889007f988628a8e61139f4349c23714cc1dd68"
      - name: Commit exact tested bytes
        shell: bash
        run: |
          git config user.name 'flesentine'
          git config user.email 'chrisgmcc@gmail.com'
          git add tools/run-h4-estimation.js tests/h4-estimation.test.js
          git commit -m 'Harden H4 estimator after deep audit'
          git push origin HEAD:h4-transient-locomotor-activation-v1
