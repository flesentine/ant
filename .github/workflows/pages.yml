name: Test and deploy ANTLAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run reference tests
        run: ./tests/run-tests.sh
      - name: Run frozen H2 mechanism reachability
        run: |
          mkdir -p /tmp/antlab-h2
          node tools/run-h2-mechanism.js --trials 400 --seed 928491 --out /tmp/antlab-h2/h2-mechanism-results.json
      - name: Upload H2 mechanism report
        uses: actions/upload-artifact@v4
        with:
          name: h2-mechanism-reachability
          path: /tmp/antlab-h2/h2-mechanism-results.json
          retention-days: 7
      - name: Run frozen H3 mechanism reachability
        run: |
          mkdir -p /tmp/antlab-h3
          node tools/run-h3-mechanism.js --trials 400 --seed 928491 --out /tmp/antlab-h3/h3-mechanism-results.json
      - name: Upload H3 mechanism report
        uses: actions/upload-artifact@v4
        with:
          name: h3-mechanism-reachability
          path: /tmp/antlab-h3/h3-mechanism-results.json
          retention-days: 7
      - name: Run frozen H4 mechanism reachability
        run: |
          mkdir -p /tmp/antlab-h4
          node tools/run-h4-mechanism.js --trials 400 --seed 928491 --out /tmp/antlab-h4/h4-mechanism-results.json
      - name: Upload H4 mechanism report
        uses: actions/upload-artifact@v4
        with:
          name: h4-mechanism-reachability
          path: /tmp/antlab-h4/h4-mechanism-results.json
          retention-days: 7
      - name: Run frozen H5 mechanism reachability
        run: |
          mkdir -p /tmp/antlab-h5
          node tools/run-h5-mechanism.js --trials 400 --seed 928491 --out /tmp/antlab-h5/h5-mechanism-results.json
      - name: Upload H5 mechanism report
        uses: actions/upload-artifact@v4
        with:
          name: h5-mechanism-reachability
          path: /tmp/antlab-h5/h5-mechanism-results.json
          retention-days: 7
      - name: Probe final-version reference supplements
        id: reference_probe
        continue-on-error: true
        run: ./tools/fetch-poissonnier2026-reference.sh /tmp/antlab-reference
      - name: Verify pinned control-effect screening target
        if: always()
        run: |
          xlsx=/tmp/antlab-reference/40_2026_1106_MOESM2_ESM.xlsx
          if [ -f "$xlsx" ]; then
            python3 tools/derive-poissonnier2026-control-effects.py \
              "$xlsx" \
              /tmp/antlab-reference/control-effects-regenerated.json >/tmp/control-effects.log
            cmp reference/poissonnier2026_control_effects.json /tmp/antlab-reference/control-effects-regenerated.json
            echo "Pinned control-effect target reproduced exactly from downloaded XLSX."
          else
            echo "::warning::Springer reference probe unavailable; live supplement regeneration gate was not run."
          fi
      - name: Verify H2 estimation target from Springer XLSX
        if: always()
        run: |
          xlsx=/tmp/antlab-reference/40_2026_1106_MOESM2_ESM.xlsx
          if [ -f "$xlsx" ]; then
            python3 tools/derive-h2-estimation-targets.py "$xlsx" /tmp/antlab-reference/h2-estimation-targets-regenerated.json >/tmp/h2-targets.log
            python3 - <<'PY'
          import json
          a=json.load(open('reference/poissonnier2026_h2_estimation_targets.json'))
          b=json.load(open('/tmp/antlab-reference/h2-estimation-targets-regenerated.json'))
          assert a==b, 'Pinned H2 estimation target differs from XLSX regeneration'
          print('Pinned threshold-independent estimation target reproduced from downloaded XLSX.')
          PY
          else
            echo "::warning::Springer reference probe unavailable; estimation-target regeneration gate was not run."
          fi
      - name: Run H2 LOCO estimator smoke test
        run: |
          mkdir -p /tmp/antlab-h2-estimation
          node tools/run-h2-estimation.js --mode loco --candidates 8 --trials 4 --seed 981000 --out /tmp/antlab-h2-estimation/loco-smoke.json >/tmp/h2-estimation-smoke.log
          echo "Low-resolution estimator smoke only; not a parameter estimate." > /tmp/antlab-h2-estimation/README.txt
      - name: Upload H2 estimator smoke report
        uses: actions/upload-artifact@v4
        with:
          name: h2-estimator-smoke
          path: /tmp/antlab-h2-estimation
          retention-days: 7
      - name: Run H3 LOCO estimator smoke test
        run: |
          mkdir -p /tmp/antlab-h3-estimation
          node tools/run-h3-estimation.js --mode loco --candidates 8 --trials 4 --seed 982000 --out /tmp/antlab-h3-estimation/loco-smoke.json >/tmp/h3-estimation-smoke.log
          echo "Low-resolution H3 LOCO execution-path smoke only; not a parameter estimate or model-selection result." > /tmp/antlab-h3-estimation/README.txt
      - name: Upload H3 estimator smoke report
        uses: actions/upload-artifact@v4
        with:
          name: h3-estimator-smoke
          path: /tmp/antlab-h3-estimation
          retention-days: 7
      - name: Run frozen H4 estimator qualification
        run: |
          mkdir -p /tmp/antlab-h4-estimation
          node tools/run-h4-estimation.js --mode qualification --trials 3 --out /tmp/antlab-h4-estimation/qualification.json >/tmp/h4-estimator-qualification.log
      - name: Run H4 LOCO estimator smoke test
        run: |
          node tools/run-h4-estimation.js --mode smoke --candidates 8 --trials 4 --eval-trials 8 --seed 990000 --out /tmp/antlab-h4-estimation/loco-smoke.json >/tmp/h4-estimation-smoke.log
          echo "H4 qualification plus low-resolution LOCO execution-path smoke only; no high-resolution H4 search, parameter estimate, promotion decision, or model-selection evidence." > /tmp/antlab-h4-estimation/README.txt
      - name: Upload H4 estimator qualification and smoke report
        uses: actions/upload-artifact@v4
        with:
          name: h4-estimator-qualification-and-smoke
          path: /tmp/antlab-h4-estimation
          retention-days: 7
      - name: Upload reference probe
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: poissonnier2026-reference-probe
          path: /tmp/antlab-reference
          retention-days: 1
          if-no-files-found: ignore
  deploy:
    needs: test
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = "200" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Pages setup notice
        if: steps.pages.outputs.enabled != 'true'
        run: echo "Enable GitHub Actions under Settings → Pages." >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Assemble static site
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site/src _site/experiments _site/models _site/apparatus _site/states _site/observations _site/scoring _site/reference _site/hypotheses
          cp index.html _site/index.html
          cp src/app.js src/sim-core.js src/measurement.js src/h3.js src/integrity.js src/style.css _site/src/
          cp experiments/*.json _site/experiments/
          cp models/*.json _site/models/
          cp apparatus/*.json _site/apparatus/
          cp states/*.json _site/states/
          cp observations/*.json _site/observations/
          cp scoring/*.json _site/scoring/
          cp reference/*.json _site/reference/
          cp hypotheses/*.json _site/hypotheses/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
