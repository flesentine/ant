name: P4 v0.3.4f high-resolution authorization audit

on:
  push:
    branches: [v0.3.4f-p4-highres-authorization]
    paths: [.github/workflows/p4-v034f-highres-authorization-audit.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact authorization scope and pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p4_highres_authorization_v1.json)" = "d8088ab94480faf0f5db012ca538bdc4d5a42ccb"
          test "$(git hash-object hypotheses/p4_response_estimation_v1.json)" = "2d0bdfaba74ad08f8424870f37a48399428ae8b7"
          test "$(git hash-object hypotheses/p4_estimator_implementation_authorization_v1.json)" = "e8f26731412d8693a5596da4374de932745b9392"
          test "$(git hash-object tools/p4-estimation-core.js)" = "4d985cd7258fc26eb06be75f09bdac4b92325ff0"
          test "$(git hash-object tools/run-p4-estimation.js)" = "e57b554c0ad56a0034f4f79ec8090d3e863e3d11"
          test "$(git hash-object reports/p4_estimator_qualification_v1.json)" = "33cf1216ade03b0f25ddf643cdc28fd5c3df0010"
          test "$(git hash-object reports/p4_estimator_browser_audit_v1.json)" = "8ae7c0f8940502c64e720b5abafde4fc094a255c"
          test "$(git hash-object hypotheses/p4_estimator_qualification_result_freeze_v1.json)" = "635b64ff1bfe08f6f914e5fd8bef8306ee0b27d5"
          test "$(git hash-object reference/poissonnier2026_pheromone_response_targets.json)" = "81910c5bd3ec7b1f7728c2c9f100b0e8a6db29ed"
          test ! -e hypotheses/p4_highres_execution_precondition_v1.json
          test ! -e reports/p4_response_estimation_2000x60_v1.json
          test ! -e .github/workflows/p4-v034g-official-highres.yml
          node --check tools/p4-estimation-core.js
          node --check tools/run-p4-estimation.js

      - name: Run P4 high-resolution authorization regression directly
        run: node tests/p4-highres-authorization.test.js

      - name: Run complete permanent regression suite
        run: ./tests/run-tests.sh

      - name: Prove review branch cannot access target semantics or execute science
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/p4-v034f-should-not-exist.json
          if node tools/run-p4-estimation.js --mode highres --out /tmp/p4-v034f-should-not-exist.json >/tmp/p4-v034f-highres.out 2>/tmp/p4-v034f-highres.err; then
            echo 'P4 high-resolution search unexpectedly ran on authorization review branch' >&2
            exit 1
          fi
          grep -F 'not effective until merged to main' /tmp/p4-v034f-highres.err
          test ! -e /tmp/p4-v034f-should-not-exist.json
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('tools/run-p4-estimation.js','utf8');
          const start=s.indexOf('function loadReferenceTarget');
          const end=s.indexOf('function comparatorMathQualification',start);
          if(start<0||end<=start)throw new Error('loadReferenceTarget surface missing');
          const body=s.slice(start,end);
          const pre=body.indexOf('highResolutionPreflight');
          const read=body.indexOf('readJson(path.resolve(root, RESPONSE_TARGET_FILE))');
          if(!(pre>=0&&read>pre))throw new Error('target semantic read is not after high-resolution preflight');
          console.log(JSON.stringify({branch_authorization_effective:false,target_read_after_preflight:true,scientific_search_executed:false}));
          NODE
