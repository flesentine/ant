name: P1 official reference-free reachability
on:
  push:
    branches: [v0.3.3c-p1-implementation-reachability]
permissions:
  contents: read
concurrency:
  group: p1-reference-free-reachability-v1
  cancel-in-progress: false
jobs:
  reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact qualified implementation head
        uses: actions/checkout@v4
        with:
          ref: da177e90b270d0ed62f627ec1621f7fe2e2ed1ed
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact frozen execution chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "da177e90b270d0ed62f627ec1621f7fe2e2ed1ed"
          test "$(git hash-object hypotheses/p1_painted_trail_mechanism_v1.json)" = "90e86bce29bf45c6e390f7046a6c25a74f409c78"
          test "$(git hash-object hypotheses/p1_reachability_execution_v1.json)" = "282a95ec6761acd8d94163b25f712f191181f2ff"
          test "$(git hash-object hypotheses/p1_implementation_authorization_v1.json)" = "f9fbaeb63c72de7a639d54b597f5c1247d354e20"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test "$(git hash-object models/lasius_niger_painted_trail_p1_v1.json)" = "73873fd6763838423ca27648136bb0b9ff062817"
          test "$(git hash-object apparatus/poissonnier2026_open_arena_p1_v1.json)" = "df589d6b39c1617a7dedc3bfa9d34a408c51b2f4"
          test "$(git hash-object experiments/open_arena_p1_zero_dose_reachability.json)" = "6e47fa91143ed5d4d2b52bf2c555246b7d216297"
          test "$(git hash-object experiments/open_arena_p1_nominal_dose_reachability.json)" = "8232d378195304f2a15aa76da8abf108d94f2c58"
          test "$(git hash-object tools/run-p1-reachability.js)" = "42f2a4c27bec95394052fd080ce58bdf70db337b"
          test "$(git hash-object models/lasius_niger_locomotion_v1.json)" = "2fde196d6c8a9353c1c8c206d4fcef223e92ad1d"
          test "$(git hash-object src/sim-core.js)" = "24777aac3577d442893e4779d70aee4e27761fe8"
          test "$(git hash-object src/integrity.js)" = "f23c68a6955832b70eeb3bd3e6893d71a3759018"
          ! grep -n 'poissonnier2026_pheromone_response_targets.json' src/p1.js tools/run-p1-reachability.js
          ! grep -nEi '(loadBundle|readJson|require).{0,120}y[_-]?maze' src/p1.js tools/run-p1-reachability.js
      - name: Run full pre-execution regression suite
        run: ./tests/run-tests.sh
      - name: Run one frozen reference-free P1 reachability panel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1-official
          set +e
          node tools/run-p1-reachability.js --out /tmp/p1-official/p1_reference_free_reachability_v1.json > /tmp/p1-official/run.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            cat /tmp/p1-official/run.log
            exit "$code"
          fi
          printf '%s\n' "$code" > /tmp/p1-official/runner-exit-code.txt
          printf '%s\n' "da177e90b270d0ed62f627ec1621f7fe2e2ed1ed" > /tmp/p1-official/execution-head.txt
          cat /tmp/p1-official/run.log
      - name: Verify and summarize frozen reachability result
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p='/tmp/p1-official/p1_reference_free_reachability_v1.json',r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.id!=='P1_reference_free_reachability_result_v1')throw new Error('wrong result id');
          if(!['reference_free_reachability_passed','reference_free_reachability_failed'].includes(r.status))throw new Error('wrong result status');
          if(r.execution_repo_commit!=='da177e90b270d0ed62f627ec1621f7fe2e2ed1ed')throw new Error('wrong execution head');
          if(r.mechanism_freeze_git_blob_sha!=='90e86bce29bf45c6e390f7046a6c25a74f409c78')throw new Error('mechanism pin drift');
          if(r.reachability_execution_policy_git_blob_sha!=='282a95ec6761acd8d94163b25f712f191181f2ff')throw new Error('policy pin drift');
          if(r.implementation_authorization_git_blob_sha!=='f9fbaeb63c72de7a639d54b597f5c1247d354e20')throw new Error('authorization pin drift');
          if(r.runtime_git_blob_sha!=='f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca')throw new Error('runtime pin drift');
          if(r.model_git_blob_sha!=='73873fd6763838423ca27648136bb0b9ff062817')throw new Error('model pin drift');
          if(r.apparatus_git_blob_sha!=='df589d6b39c1617a7dedc3bfa9d34a408c51b2f4')throw new Error('apparatus pin drift');
          if(r.zero_experiment_git_blob_sha!=='6e47fa91143ed5d4d2b52bf2c555246b7d216297')throw new Error('zero experiment pin drift');
          if(r.nominal_experiment_git_blob_sha!=='8232d378195304f2a15aa76da8abf108d94f2c58')throw new Error('nominal experiment pin drift');
          if(r.reachability_runner_git_blob_sha!=='42f2a4c27bec95394052fd080ce58bdf70db337b')throw new Error('runner pin drift');
          if(r.fit_performed!==false||r.parameter_search_performed!==false||r.reference_targets_accessed!==false||r.reference_outcomes_accessed!==false||r.ymaze_accessed!==false||r.selection_performed!==false||r.canonical_model_updated!==false)throw new Error('reference/scientific firewall violation');
          if(r.identity_panel.seeds.length!==32||r.identity_panel.seeds[0]!==1333001||r.identity_panel.seeds[31]!==1333032||r.identity_panel.fixed_time_s!==2)throw new Error('identity panel drift');
          if(r.attraction_panel.trials_per_condition!==400||r.attraction_panel.seed_range[0]!==1334001||r.attraction_panel.seed_range[1]!==1334400||r.attraction_panel.common_random_numbers!==true)throw new Error('attraction panel drift');
          if(r.physics_dt_s!==0.02)throw new Error('dt drift');
          const sha=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          fs.writeFileSync('/tmp/p1-official/report.sha256',sha+'  p1_reference_free_reachability_v1.json\n');
          fs.writeFileSync('/tmp/p1-official/summary.json',JSON.stringify({status:r.status,structural_checks:r.structural_checks,zero:r.attraction_panel.zero_dose,nominal:r.attraction_panel.nominal_dose,differences:r.attraction_panel.differences},null,2)+'\n');
          console.log('REPORT_SHA256='+sha);
          console.log('STATUS='+r.status);
          console.log('CHECKS='+JSON.stringify(r.structural_checks));
          console.log('ZERO='+JSON.stringify(r.attraction_panel.zero_dose));
          console.log('NOMINAL='+JSON.stringify(r.attraction_panel.nominal_dose));
          console.log('DIFFERENCES='+JSON.stringify(r.attraction_panel.differences));
          NODE
      - name: Upload frozen P1 reachability result
        uses: actions/upload-artifact@v4
        with:
          name: p1-reference-free-reachability-official
          path: /tmp/p1-official
          retention-days: 90
