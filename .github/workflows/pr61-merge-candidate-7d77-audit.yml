name: PR61 merge-candidate audit 7d77
on:
  push:
    branches:
      - audit/pr61-merge-candidate-7d77
permissions:
  contents: read
jobs:
  merge-candidate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact GitHub merge candidate
        uses: actions/checkout@v4
        with:
          ref: 470e1dc57d0640bfcb682d105f94357a3b0129c1
          fetch-depth: 0
      - name: Verify exact merge candidate
        run: |
          test "$(git rev-parse HEAD)" = "470e1dc57d0640bfcb682d105f94357a3b0129c1"
          test "$(git rev-parse HEAD^1)" = "dd01be17876f4d374d2dfda7f462a7a8fd8ec01d"
          test "$(git rev-parse HEAD^2)" = "7d77bea2b763a473f0359e9a9b32940c4922fa59"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full ANTLAB suite
        run: bash tests/run-tests.sh
