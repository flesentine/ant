name: H5 draft final validation
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse and validate final draft records
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('hypotheses/h5_origin_referenced_search_v1.draft.json','utf8'));
          const a=JSON.parse(fs.readFileSync('reports/h5_draft_stress_audit_v1.json','utf8'));
          if(d.schema_version!==2) throw new Error('Unexpected H5 draft schema');
          if(d.status!=='draft_post_H4_failure_after_stress_audit_before_mechanism_freeze') throw new Error('Unexpected H5 draft status');
          if(d.stress_audit!=='reports/h5_draft_stress_audit_v1.json') throw new Error('Stress audit link mismatch');
          if(d.candidate_mechanism?.reorientation_effect?.type!=='mixture_of_circular_reorientation_distributions') throw new Error('Surviving circular formulation not recorded');
          const rejected=new Set((d.rejected_pre_freeze_formulations||[]).map(x=>x.name));
          if(!rejected.has('signed_error_mean_shift')||!rejected.has('circular_vector_mean_blend')) throw new Error('Rejected formulations missing');
          if(d.firewall?.mechanism_not_frozen!==true||d.firewall?.implementation_allowed_before_freeze!==false||d.firewall?.parameter_search_allowed!==false||d.firewall?.measurement_reconstruction_must_precede_H5_estimator_policy!==true||d.firewall?.ymaze_access!==false) throw new Error('H5 firewall mismatch');
          if(a.status!=='pre_freeze_design_audit_completed_no_H5_runtime_implementation_or_parameter_search') throw new Error('Unexpected audit status');
          if(a.scientific_status?.H5_mechanism_frozen!==false||a.scientific_status?.H5_runtime_implemented!==false||a.scientific_status?.H5_parameter_search_performed!==false||a.scientific_status?.ymaze_accessed!==false) throw new Error('Audit scientific status mismatch');
          if(a.rejected_turn_formulations?.signed_error_mean_shift?.rejected!==true||a.rejected_turn_formulations?.circular_vector_mean_blend?.rejected!==true) throw new Error('Audit rejection mismatch');
          if(a.preferred_turn_representation_for_further_draft_review?.type!=='mixture_of_circular_reorientation_distributions') throw new Error('Audit preferred formulation mismatch');
          if(a.measurement_geometry_findings?.Xstart_Ystart_present!==true) throw new Error('Measurement finding missing');
          console.log(JSON.stringify({status:'passed',draft_bytes:fs.statSync('hypotheses/h5_origin_referenced_search_v1.draft.json').size,audit_bytes:fs.statSync('reports/h5_draft_stress_audit_v1.json').size,draft_status:d.status,audit_status:a.status,mechanism_frozen:d.firewall.mechanism_not_frozen===false,runtime_implemented:a.scientific_status.H5_runtime_implemented,parameter_search:a.scientific_status.H5_parameter_search_performed,ymaze:a.scientific_status.ymaze_accessed},null,2));
          NODE
          if grep -R -n -E 'origin_referenced_search|rho_search|lambda_search|r_search_mm' src models experiments states apparatus scoring observations; then
            echo 'H5 runtime implementation found before freeze' >&2
            exit 1
          fi
          test "$(git hash-object src/h3.js)" = "9bb8fc966a5aa4d4173f9bda2020c6d9cd9368f1"
          test "$(git hash-object src/integrity.js)" = "f23c68a6955832b70eeb3bd3e6893d71a3759018"
          test "$(git hash-object src/sim-core.js)" = "24777aac3577d442893e4779d70aee4e27761fe8"
