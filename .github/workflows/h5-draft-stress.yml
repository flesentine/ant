name: H5 draft stress test
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  circular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm H5 remains unimplemented
        run: |
          set -euo pipefail
          test "$(git hash-object src/h3.js)" = "9bb8fc966a5aa4d4173f9bda2020c6d9cd9368f1"
          test "$(git hash-object src/integrity.js)" = "f23c68a6955832b70eeb3bd3e6893d71a3759018"
          if grep -R -n -E 'origin_referenced_search|rho_search|lambda_search|r_search_mm' src models experiments states apparatus scoring observations; then exit 1; fi
          node -e "const d=require('./hypotheses/h5_origin_referenced_search_v1.draft.json');if(d.firewall.implementation_allowed_before_freeze!==false||d.firewall.parameter_search_allowed!==false||d.firewall.ymaze_access!==false)process.exit(1)"
      - name: Start Chromium
        run: |
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..80}; do if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then break; fi; sleep .2; done
          curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json
      - name: Stress circular formulations in Chromium
        run: |
          cat >/tmp/circular.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();const target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});for(let i=0;i<100;i++){if(await evalv("document.readyState==='complete'&&!!AntLabCore&&!!AntLabH3&&!!AntLabIntegrity"))break;await sleep(100);}
          const report=await evalv(`(()=>{
            const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));const drive=(L,l)=>Math.exp(-Math.max(0,L)/l);const radial=(r,s)=>r/(r+s);const weight=(L,r,l,s,rho)=>rho*drive(L,l)*radial(r,s);
            const vm=(x,mu,k)=>Math.exp(k*Math.cos(x-mu));const mix=(x,theta,phi,w,kb,ks)=>(1-w)*vm(x,theta,kb)+w*vm(x,phi,ks);
            const signed=(theta,phi,w)=>wrap(theta+w*wrap(phi-theta));const vector=(theta,phi,w)=>Math.atan2((1-w)*Math.sin(theta)+w*Math.sin(phi),(1-w)*Math.cos(theta)+w*Math.cos(phi));
            const lambda=500,scale=50,rho=.75,ws=weight(200,100,lambda,scale,rho),wl=weight(1000,100,lambda,scale,rho);if(!(ws>wl&&ws<1&&wl>0))throw new Error('weight');
            const eps=1e-9,theta=0,phi=Math.PI;const signedJump=Math.abs(wrap(signed(theta+eps,phi,ws)-signed(theta-eps,phi,ws)));const vectorJump=Math.abs(wrap(vector(theta,phi,.5+eps)-vector(theta,phi,.5-eps)));
            let refl=0,branch=0,rotErr=0,nullErr=0;for(let i=0;i<=720;i++){const h=-Math.PI+i*2*Math.PI/720;const f=mix(h,0,Math.PI,ws,2,2);refl=Math.max(refl,Math.abs(f-mix(-h,0,Math.PI,ws,2,2)));branch=Math.max(branch,Math.abs(mix(h,0,Math.PI-1e-10,ws,2,2)-mix(h,0,-Math.PI+1e-10,ws,2,2)));const rot=.731;rotErr=Math.max(rotErr,Math.abs(f-mix(wrap(h+rot),rot,wrap(Math.PI+rot),ws,2,2)));nullErr=Math.max(nullErr,Math.abs(mix(h,.42,-2.1,0,2,5)-vm(h,.42,2)));}
            if(refl>1e-10||branch>1e-8||rotErr>1e-10||nullErr!==0)throw new Error('mixture symmetry/null failure');
            const baseline=new AntLabCore.RNG(AntLabIntegrity.streamSeed(424242,'biology_h3_turn_angle:0'));const withH5=new AntLabCore.RNG(AntLabIntegrity.streamSeed(424242,'biology_h3_turn_angle:0'));const choice=new AntLabCore.RNG(AntLabIntegrity.streamSeed(424242,'biology_h5_search_choice:0'));const searchAngle=new AntLabCore.RNG(AntLabIntegrity.streamSeed(424242,'biology_h5_search_angle:0'));
            const a=[],b=[];for(let i=0;i<20;i++)a.push(AntLabH3.sampleVonMises(baseline,2));for(let i=0;i<20;i++){b.push(AntLabH3.sampleVonMises(withH5,2));choice.next();AntLabH3.sampleVonMises(searchAngle,2);}if(JSON.stringify(a)!==JSON.stringify(b)||baseline.state!==withH5.state)throw new Error('H5 dedicated streams perturb H3');
            const c0=new AntLabCore.RNG(AntLabIntegrity.streamSeed(9988,'biology_h5_search_choice:0')),c1=new AntLabCore.RNG(AntLabIntegrity.streamSeed(9988,'biology_h5_search_choice:0'));for(let i=0;i<50;i++)if(c0.next()!==c1.next())throw new Error('CRN choice mismatch');
            const offOrigin={x:80,y:60},center={x:148.5,y:105},p={x:130,y:60};const bearing=(o,p)=>Math.atan2(o.y-p.y,o.x-p.x);const originCenterSeparation=Math.abs(wrap(bearing(offOrigin,p)-bearing(center,p)));
            if(originCenterSeparation<.2)throw new Error('origin/center synthetic separation failed');if(weight(200,0,lambda,scale,rho)!==0)throw new Error('origin radial gate');
            return {status:'passed',weights:{short:ws,long:wl,ratio:ws/wl},signed_mean_shift:{antipodal_jump_rad:signedJump,reject:true},vector_blend:{half_weight_jump_rad:vectorJump,reject:true},mixture_distribution:{reflection_error:refl,branch_cut_error:branch,rotation_error:rotErr,null_error:nullErr,antipodal_symmetric:true,preferred_for_further_draft_review:true},rng:{dedicated_streams_preserve_h3_angle_stream:true,matched_choice_crn:true},geometry:{origin_center_separation_rad:originCenterSeparation,actual_assay_origin_center_confounded:true}};
          })()`);
          const y=requests.filter(u=>/y[_-]?maze|ymaze/i.test(u));if(exceptions.length||consoleErrors.length||y.length)throw new Error('browser firewall failure');report.browser={exceptions:0,console_errors:0,ymaze_requests:0};fs.writeFileSync('/tmp/h5-circular-stress.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/circular.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: h5-circular-stress
          path: |
            /tmp/h5-circular-stress.json
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
