name: H5 draft stress test
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  measurement_geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm draft-only state
        run: |
          set -euo pipefail
          test "$(git hash-object src/h3.js)" = "9bb8fc966a5aa4d4173f9bda2020c6d9cd9368f1"
          if grep -R -n -E 'origin_referenced_search|rho_search|lambda_search|r_search_mm' src models experiments states apparatus scoring observations; then exit 1; fi
      - name: Fetch pinned final-record supplement
        run: |
          mkdir -p /tmp/h5-source
          ./tools/fetch-poissonnier2026-reference.sh /tmp/h5-source >/tmp/fetch-reference.log
          test "$(sha256sum /tmp/h5-source/40_2026_1106_MOESM2_ESM.xlsx | awk '{print $1}')" = "b311d5fdc89eac56724bb5195743cf4bb52a6cff4040b18704353091e1fe6318"
      - name: Audit coordinate and Beeline definitions without model fitting
        run: |
          python3 - <<'PY'
          import json, math, re, importlib.util, pathlib
          root=pathlib.Path('.').resolve()
          spec=importlib.util.spec_from_file_location('r',root/'tools/reconstruct-poissonnier2026.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          xlsx='/tmp/h5-source/40_2026_1106_MOESM2_ESM.xlsx'
          ss=m.sheets(xlsx); raw=ss['Exp 1']; headers=raw[0]; rows=m.records(raw)
          interesting=[h for h in headers if re.search(r'(x|y|first|last|arena|bee|start|end|border|frame)',h,re.I)]
          controls=[r for r in rows if r.get('Pheromone')=='n']
          def num(r,k):
              try:return float(r[k])
              except:return None
          def stats(xs):
              xs=sorted(x for x in xs if x is not None and math.isfinite(x))
              if not xs:return None
              q=lambda p: xs[round((len(xs)-1)*p)]
              return {'n':len(xs),'min':xs[0],'q10':q(.1),'median':q(.5),'q90':q(.9),'max':xs[-1]}
          report={'status':'passed','headers':headers,'interesting_headers':interesting,'control_rows':len(controls)}
          numeric={}
          for h in interesting:
              s=stats([num(r,h) for r in controls]);
              if s:numeric[h]=s
          report['numeric_ranges']=numeric
          # Try all plausible first/start XY pairs and compare their Euclidean endpoint distance to published Beeline.
          candidates=[]
          lower={h.lower():h for h in headers}
          pairs=[]
          for xname in headers:
              lx=xname.lower()
              if not lx.startswith('x'):continue
              for yname in headers:
                  ly=yname.lower()
                  if not ly.startswith('y'):continue
                  sx=re.sub(r'^x','',lx); sy=re.sub(r'^y','',ly)
                  if sx==sy and any(t in lx for t in ['first','start','initial']):pairs.append((xname,yname))
          last_pairs=[]
          for xname in headers:
              lx=xname.lower()
              if not lx.startswith('x'):continue
              for yname in headers:
                  ly=yname.lower();sx=re.sub(r'^x','',lx);sy=re.sub(r'^y','',ly)
                  if sy==sx and any(t in lx for t in ['last','end','final']):last_pairs.append((xname,yname))
          for xp,yp in pairs:
              for xl,yl in last_pairs:
                  errs=[]; offsets=[]
                  for r in controls:
                      vals=[num(r,k) for k in [xp,yp,xl,yl,'Beeline','Xmin_Arena','Xmax_Arena','Ymin_Arena','Ymax_Arena']]
                      if any(v is None for v in vals):continue
                      x0,y0,x1,y1,b,xmn,xmx,ymn,ymx=vals
                      errs.append(abs(math.hypot(x1-x0,y1-y0)-b))
                      offsets.append(math.hypot(x0-(xmn+xmx)/2,y0-(ymn+ymx)/2))
                  if errs:candidates.append({'start':[xp,yp],'end':[xl,yl],'n':len(errs),'beeline_max_abs_error':max(errs),'beeline_mean_abs_error':sum(errs)/len(errs),'start_offset_from_arena_midpoint_mm':stats(offsets)})
          report['coordinate_pair_tests']=sorted(candidates,key=lambda z:z['beeline_max_abs_error'])[:10]
          # Center-to-final distance sanity using per-row arena bounds.
          center_err=[]; center_to_final=[]; beelines=[]; impossible=[]
          if all(k in headers for k in ['Xlast','Ylast','Xmin_Arena','Xmax_Arena','Ymin_Arena','Ymax_Arena','Beeline']):
              for r in controls:
                  vals=[num(r,k) for k in ['Xlast','Ylast','Xmin_Arena','Xmax_Arena','Ymin_Arena','Ymax_Arena','Beeline']]
                  if any(v is None for v in vals):continue
                  xl,yl,xmn,xmx,ymn,ymx,b=vals;cx=(xmn+xmx)/2;cy=(ymn+ymx)/2;d=math.hypot(xl-cx,yl-cy)
                  center_to_final.append(d);beelines.append(b);center_err.append(abs(d-b))
                  mincenter=min((xmx-xmn)/2,(ymx-ymn)/2)
                  if b+1e-9<mincenter: impossible.append({'ant_id':r.get('ant_ID'),'beeline':b,'minimum_center_to_border':mincenter,'center_to_final':d})
          report['center_to_final_mm']=stats(center_to_final);report['beeline_mm']=stats(beelines);report['center_beeline_abs_error_mm']=stats(center_err);report['beeline_below_center_to_nearest_border_count']=len(impossible);report['examples_beeline_below_center_border']=impossible[:12]
          # Bounds variability and implied center/border distances.
          for key in ['Xmin_Arena','Xmax_Arena','Ymin_Arena','Ymax_Arena']:
              if key in headers: report.setdefault('arena_bounds',{})[key]=stats([num(r,key) for r in controls])
          pathlib.Path('/tmp/h5-measurement-geometry.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: h5-measurement-geometry-audit
          path: |
            /tmp/h5-measurement-geometry.json
            /tmp/fetch-reference.log
            /tmp/h5-source/SHA256SUMS
          retention-days: 14
