name: H5 draft stress test
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  measured_start_state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm draft-only state
        run: |
          set -euo pipefail
          if grep -R -n -E 'origin_referenced_search|rho_search|lambda_search|r_search_mm' src models experiments states apparatus scoring observations; then exit 1; fi
      - name: Fetch pinned final-record supplement
        run: |
          mkdir -p /tmp/h5-source
          ./tools/fetch-poissonnier2026-reference.sh /tmp/h5-source >/tmp/fetch-reference.log
          test "$(sha256sum /tmp/h5-source/40_2026_1106_MOESM2_ESM.xlsx | awk '{print $1}')" = "b311d5fdc89eac56724bb5195743cf4bb52a6cff4040b18704353091e1fe6318"
      - name: Inspect published analysis-code references to start and Beeline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/h5-source/40_2026_1106_MOESM1_ESM.rmd')
          lines=p.read_text(errors='replace').splitlines()
          hits=[]
          for i,line in enumerate(lines):
              if any(k.lower() in line.lower() for k in ['xstart','ystart','beeline','straightness']):
                  lo=max(0,i-2);hi=min(len(lines),i+3)
                  hits.append({'line':i+1,'context':lines[lo:hi]})
          import json
          Path('/tmp/h5-rmd-start-beeline.json').write_text(json.dumps(hits,indent=2)+'\n')
          print(json.dumps(hits,indent=2))
          PY
      - name: Quantify measured start-state differences by treatment and colony
        run: |
          python3 - <<'PY'
          import json, math, statistics, random, importlib.util, pathlib
          root=pathlib.Path('.').resolve();spec=importlib.util.spec_from_file_location('r',root/'tools/reconstruct-poissonnier2026.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          rows=m.records(m.sheets('/tmp/h5-source/40_2026_1106_MOESM2_ESM.xlsx')['Exp 1']);rows=[r for r in rows if r['Pheromone']=='n']
          def f(r,k):return float(r[k])
          dat=[]
          for r in rows:
              cx=(f(r,'Xmin_Arena')+f(r,'Xmax_Arena'))/2;cy=(f(r,'Ymin_Arena')+f(r,'Ymax_Arena'))/2
              dx=f(r,'Xstart')-cx;dy=f(r,'Ystart')-cy
              dat.append({'ant':int(float(r['ant_ID'])),'colony':int(float(r['Colony'])),'path':r['Path_length'],'dx':dx,'dy':dy,'r':math.hypot(dx,dy),'xnorm':(f(r,'Xstart')-f(r,'Xmin_Arena'))/(f(r,'Xmax_Arena')-f(r,'Xmin_Arena')),'ynorm':(f(r,'Ystart')-f(r,'Ymin_Arena'))/(f(r,'Ymax_Arena')-f(r,'Ymin_Arena'))})
          def mean(xs):return sum(xs)/len(xs)
          def sd(xs):
              if len(xs)<2:return 0
              mu=mean(xs);return math.sqrt(sum((x-mu)**2 for x in xs)/(len(xs)-1))
          def summarize(sub):
              out={'n':len(sub)}
              for k in ['dx','dy','r','xnorm','ynorm']:
                  xs=[x[k] for x in sub];out[k]={'mean':mean(xs),'sd':sd(xs),'min':min(xs),'max':max(xs)}
              return out
          s=[x for x in dat if x['path']=='s'];l=[x for x in dat if x['path']=='l']
          diffs={k:mean([x[k] for x in s])-mean([x[k] for x in l]) for k in ['dx','dy','r','xnorm','ynorm']}
          pooled={}
          for k in ['dx','dy','r','xnorm','ynorm']:
              sp=math.sqrt(((len(s)-1)*sd([x[k] for x in s])**2+(len(l)-1)*sd([x[k] for x in l])**2)/(len(s)+len(l)-2));pooled[k]=diffs[k]/sp if sp else 0
          colonies=sorted({x['colony'] for x in dat});loco={}
          for c in colonies:
              ss=[x for x in s if x['colony']!=c];ll=[x for x in l if x['colony']!=c]
              loco[str(c)]={k:mean([x[k] for x in ss])-mean([x[k] for x in ll]) for k in ['dx','dy','r','xnorm','ynorm']}
          # Deterministic permutation diagnostics for mean differences. Descriptive only, not a gate.
          rng=random.Random(20260903); vals={k:[x[k] for x in dat] for k in ['dx','dy','r','xnorm','ynorm']};nS=len(s);perm={}
          for k in vals:
              obs=abs(diffs[k]);arr=vals[k][:];ge=0;N=20000
              for _ in range(N):
                  rng.shuffle(arr);d=abs(mean(arr[:nS])-mean(arr[nS:]));ge+=d>=obs-1e-15
              perm[k]=(ge+1)/(N+1)
          out={'status':'passed','coordinate_role':'measured first tracked position, not assumed physical hole center','groups':{'short':summarize(s),'long':summarize(l)},'short_minus_long':diffs,'standardized_difference_cohen_d':pooled,'permutation_p_descriptive_only':perm,'leave_one_colony_out_short_minus_long':loco,'raw_measured_start_available':True,'entry_heading_available_from_this_table':False,'entry_speed_available_from_this_table':False}
          pathlib.Path('/tmp/h5-start-state-audit.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: h5-measured-start-state-audit
          path: |
            /tmp/h5-start-state-audit.json
            /tmp/h5-rmd-start-beeline.json
            /tmp/fetch-reference.log
          retention-days: 14
