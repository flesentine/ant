name: H5 draft stress test
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm draft-only state
        run: |
          set -euo pipefail
          test "$(git hash-object src/h3.js)" = "9bb8fc966a5aa4d4173f9bda2020c6d9cd9368f1"
          if grep -R -n -E 'origin_referenced_search|rho_search|lambda_search|r_search_mm' src models experiments states apparatus scoring observations; then exit 1; fi
      - name: Start Chromium
        run: |
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..80}; do if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then break; fi; sleep .2; done
          curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json
      - name: Run shadow-mode event sensitivity in Chromium
        run: |
          cat >/tmp/shadow.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();const target=tabs.find(t=>t.type==='page')||tabs[0];const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});for(let i=0;i<100;i++){if(await evalv("document.readyState==='complete'&&!!AntLabCore&&!!AntLabH3&&!!AntLabIntegrity"))break;await sleep(100);}
          const report=await evalv(`(async()=>{
            const clone=x=>JSON.parse(JSON.stringify(x));const j=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json();};const drive=(L,l)=>Math.exp(-L/l),radial=(r,s)=>r/(r+s),weight=(L,r,c)=>c.rho*drive(L,c.lambda)*radial(r,c.scale);
            const model=await j('./models/lasius_niger_locomotion_h3_v1.json');model.reorientation_gate.effect.max_hazard_reduction_fraction=0;const exp=await j('./experiments/open_arena_short_control.json'),apparatus=await j('./apparatus/poissonnier2026_open_arena.json'),state=await j('./states/naive_outbound_v1.json'),obs=await j('./observations/poissonnier2026_tracking_25fps.json'),scoring=await j('./scoring/open_arena_first_border_v1.json');exp.model=model.id;
            const configs={gentle:{lambda:1000,scale:100,rho:.5},middle:{lambda:500,scale:50,rho:.75},strong:{lambda:250,scale:25,rho:.9}};
            const runs=[];let allR=[];
            for(let seed=1001;seed<=1100;seed++){
              const b={experiment:clone(exp),model:clone(model),apparatus:clone(apparatus),state:clone(state),observation:clone(obs),scoring:clone(scoring)};const sim=new AntLabIntegrity.Simulation(b,seed);const origin={x:sim.ants[0].x,y:sim.ants[0].y};sim.runUntilComplete(exp.duration_s,AntLabIntegrity.FIXED_DT);const events=sim.events.filter(e=>e.type==='h3_reorientation');const radii=events.map(e=>Math.hypot(e.x-origin.x,e.y-origin.y));allR.push(...radii);const cfgOut={};for(const [name,c] of Object.entries(configs)){const sw=radii.map(r=>weight(200,r,c)),lw=radii.map(r=>weight(1000,r,c));cfgOut[name]={expected_search_turns_short:sw.reduce((a,b)=>a+b,0),expected_search_turns_long:lw.reduce((a,b)=>a+b,0),max_w_short:sw.length?Math.max(...sw):0,max_w_long:lw.length?Math.max(...lw):0,mean_w_short:sw.length?sw.reduce((a,b)=>a+b,0)/sw.length:0,mean_w_long:lw.length?lw.reduce((a,b)=>a+b,0)/lw.length:0};}runs.push({seed,event_count:events.length,exit_time:sim.ants[0].completedAt,radii,cfg:cfgOut});
            }
            const quant=(xs,q)=>{if(!xs.length)return null;const a=[...xs].sort((x,y)=>x-y),p=(a.length-1)*q,i=Math.floor(p),f=p-i;return a[i]*(1-f)+(a[Math.min(i+1,a.length-1)])*f;};
            const summary={n_runs:runs.length,total_events:allR.length,zero_event_runs:runs.filter(r=>r.event_count===0).length,event_radius_mm:{min:Math.min(...allR),q10:quant(allR,.1),median:quant(allR,.5),q90:quant(allR,.9),max:Math.max(...allR)}};
            summary.configs={};for(const name of Object.keys(configs)){const es=runs.map(r=>r.cfg[name].expected_search_turns_short),el=runs.map(r=>r.cfg[name].expected_search_turns_long),ms=runs.flatMap(r=>r.radii.map((_,i)=>r.cfg[name].mean_w_short)).filter(Number.isFinite), ratio=Math.exp(800/configs[name].lambda);summary.configs[name]={params:configs[name],theoretical_short_long_weight_ratio:ratio,expected_search_turns_short:{median:quant(es,.5),q10:quant(es,.1),q90:quant(es,.9)},expected_search_turns_long:{median:quant(el,.5),q10:quant(el,.1),q90:quant(el,.9)},max_observed_w_short:Math.max(...runs.map(r=>r.cfg[name].max_w_short)),max_observed_w_long:Math.max(...runs.map(r=>r.cfg[name].max_w_long))};}
            const actualCenter={x:148.5,y:105};const originOffsets=runs.map(()=>0);summary.identifiability={only_two_history_levels_mm:[200,1000],lambda_controls_weight_ratio_as_exp_800_over_lambda:true,radial_scale_compared_to_event_radius:summary.event_radius_mm,entry_origin_equals_arena_center_in_reference_assay:true};
            return {status:'passed',summary,sample_runs:runs.slice(0,5)};
          })()`);const y=requests.filter(u=>/y[_-]?maze|ymaze/i.test(u));if(exceptions.length||consoleErrors.length||y.length)throw new Error('browser firewall failure');report.browser={exceptions:0,console_errors:0,ymaze_requests:0};fs.writeFileSync('/tmp/h5-shadow-stress.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/shadow.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: h5-shadow-stress
          path: |
            /tmp/h5-shadow-stress.json
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
