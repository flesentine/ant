name: P4 v0.3.4g execution-gate audit

on:
  push:
    branches: [v0.3.4g-p4-official-execution-gate]
    paths:
      - '.github/workflows/p4-v034g-execution-gate-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact one-shot gate pins and trigger
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/v0.3.4g-p4-official-execution-gate"
          test "$(git hash-object hypotheses/p4_highres_authorization_v1.json)" = "d8088ab94480faf0f5db012ca538bdc4d5a42ccb"
          test "$(git hash-object hypotheses/p4_response_estimation_v1.json)" = "2d0bdfaba74ad08f8424870f37a48399428ae8b7"
          test "$(git hash-object tools/p4-estimation-core.js)" = "4d985cd7258fc26eb06be75f09bdac4b92325ff0"
          test "$(git hash-object tools/run-p4-estimation.js)" = "e57b554c0ad56a0034f4f79ec8090d3e863e3d11"
          test "$(git hash-object hypotheses/p4_highres_execution_precondition_v1.json)" = "313f2892a5627195b1319911a87cdfe7884337ae"
          test "$(git hash-object .github/workflows/p4-v034g-official-highres.yml)" = "1b34c35246117ad483c25c10601c8971fe6f273e"
          test ! -e reports/p4_response_estimation_2000x60_v1.json
          test ! -e reports/p4_response_estimation_execution_provenance_v1.json
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/p4-v034g-official-highres.yml').read_text()
          assert 'branches: [main]' in s
          assert "- '.github/workflows/p4-v034g-official-highres.yml'" in s
          assert 'workflow_dispatch' not in s
          assert 'pull_request' not in s
          assert 'cancel-in-progress: false' in s
          assert 'test "${GITHUB_REF}" = "refs/heads/main"' in s
          assert 'test "${GITHUB_EVENT_NAME}" = "push"' in s
          assert 'node tools/run-p4-estimation.js --mode highres --out reports/p4_response_estimation_2000x60_v1.json' in s
          print('official workflow static one-shot trigger PASS')
          PY
      - name: Run execution-precondition regression directly
        run: node tests/p4-highres-execution-precondition.test.js
      - name: Run complete permanent regression suite
        run: ./tests/run-tests.sh
      - name: Confirm audit did not execute science
        shell: bash
        run: |
          set -euo pipefail
          test ! -e reports/p4_response_estimation_2000x60_v1.json
          test ! -e reports/p4_response_estimation_execution_provenance_v1.json
          echo 'P4 execution-gate audit PASS: scientific search not executed'
