name: H5 origin-choice shadow audit
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen biological-origin decision
        run: |
          set -euo pipefail
          python3 -m json.tool hypotheses/h5_origin_referenced_search_v1.draft.json >/dev/null
          python3 -m json.tool reports/h5_biological_origin_choice_audit_v1.json >/dev/null
          test "$(git hash-object reports/h5_biological_origin_choice_audit_v1.json)" = "2378fa54ad4174141f213ed44be3c283706975de"
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('hypotheses/h5_origin_referenced_search_v1.draft.json','utf8'));
          const r=JSON.parse(fs.readFileSync('reports/h5_biological_origin_choice_audit_v1.json','utf8'));
          if(d.biological_origin_decision.selected_origin!=='central_physical_entry_reference') throw new Error('origin not frozen to central physical entry');
          if(d.biological_origin_decision.first_track_position_role.indexOf('forbidden as the H5 biological origin')<0) throw new Error('first-track role not separated');
          if(d.firewall.H5_biological_origin_still_unfrozen!==false) throw new Error('origin still marked unfrozen');
          if(d.firewall.H5_biological_origin_frozen_to_central_physical_entry_reference!==true) throw new Error('central-origin freeze flag missing');
          if(d.firewall.parameter_search_allowed!==false) throw new Error('parameter search unexpectedly allowed');
          if(d.firewall.mechanism_not_frozen!==true) throw new Error('full H5 mechanism should remain unfrozen');
          if(d.firewall.ymaze_access!==false||r.firewall.ymaze_access!==false) throw new Error('Y-maze firewall failed');
          if(r.decision.selected_origin!=='central_physical_entry_reference') throw new Error('report decision mismatch');
          if(r.firewall.H5_runtime_implemented!==false||r.firewall.H5_parameter_search_allowed!==false) throw new Error('runtime/search state mismatch');
          NODE
          if grep -R -n -E 'biology_h5_search|rho_search|lambda_search_mm|r_search_mm' src models experiments states apparatus scoring observations; then
            echo 'H5 runtime biology unexpectedly present' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node shadow audit
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const geom=require('./tools/poissonnier2026-measurement-geometry.js');
          const {Simulation,FIXED_DT}=require('./src/integrity.js');
          const {loadBundle}=require('./tools/load-bundle.js');
          const {geometry}=geom.loadFrozenMeasurementGeometry(process.cwd());
          const wrap=a=>{while(a<=-Math.PI)a+=2*Math.PI;while(a>Math.PI)a-=2*Math.PI;return a;};
          const q=(xs,p)=>{const a=[...xs].sort((x,y)=>x-y);if(!a.length)return null;const z=(a.length-1)*p,lo=Math.floor(z),hi=Math.ceil(z),f=z-lo;return a[lo]*(1-f)+a[hi]*f;};
          const summary=xs=>({n:xs.length,min:Math.min(...xs),q10:q(xs,.1),median:q(xs,.5),q90:q(xs,.9),max:Math.max(...xs)});
          const base=loadBundle('open_arena_short_control.json',{modelId:'lasius_niger_locomotion_h3_v1'});
          base.model.reorientation_gate.effect.max_hazard_reduction_fraction=0;
          const all=[],first=[],offsets=[],gate0={20:[],50:[],100:[]},gateEvent={20:[],50:[],100:[]};
          const fold={};
          for(let fi=0;fi<geom.EXPECTED_COLONIES.length;fi++){
            const held=geom.EXPECTED_COLONIES[fi], pool=geom.geometryPool(geometry.rows,held);
            let sims=0,events=0;
            for(let i=0;i<100;i++){
              const seed=990000+fi*10000+i;
              const row=geom.sampleGeometry(pool,seed).row;
              const b=geom.applyGeometry(base,row);
              const sim=new Simulation(b,seed);
              const off=Math.hypot(row.first_track_x_mm-row.entry_reference_x_mm,row.first_track_y_mm-row.entry_reference_y_mm);
              offsets.push(off);
              for(const rs of [20,50,100]) gate0[rs].push(off/(off+rs));
              sim.runUntilComplete(120,FIXED_DT);
              const ev=sim.events.filter(e=>e.type==='h3_reorientation');
              sims++; events+=ev.length;
              ev.forEach((e,j)=>{
                const bc=Math.atan2(row.entry_reference_y_mm-e.y,row.entry_reference_x_mm-e.x);
                const bf=Math.atan2(row.first_track_y_mm-e.y,row.first_track_x_mm-e.x);
                const d=Math.abs(wrap(bc-bf));
                const rc=Math.hypot(e.x-row.entry_reference_x_mm,e.y-row.entry_reference_y_mm);
                const rf=Math.hypot(e.x-row.first_track_x_mm,e.y-row.first_track_y_mm);
                const rec={bearing_delta_rad:d,bearing_delta_deg:d*180/Math.PI,r_central:rc,r_first:rf,radial_delta:rc-rf,offset:off};
                all.push(rec); if(j===0) first.push(rec);
                for(const rs of [20,50,100]) gateEvent[rs].push(rc/(rc+rs)-rf/(rf+rs));
              });
            }
            fold[held]={pool_n:pool.length,simulations:sims,events};
          }
          const deg=all.map(x=>x.bearing_delta_deg), firstDeg=first.map(x=>x.bearing_delta_deg);
          const out={
            status:'passed',
            biological_decision_context:'shadow_only_no_H5_runtime',
            simulations:600,
            events:all.length,
            folds:fold,
            measured_origin_offset_mm:summary(offsets),
            first_event_bearing_difference_deg:summary(firstDeg),
            all_event_bearing_difference_deg:summary(deg),
            fraction_events_bearing_difference_gt_5_deg:deg.filter(x=>x>5).length/deg.length,
            fraction_events_bearing_difference_gt_15_deg:deg.filter(x=>x>15).length/deg.length,
            fraction_first_events_bearing_difference_gt_15_deg:firstDeg.filter(x=>x>15).length/firstDeg.length,
            initial_radial_gate_central_origin:{},
            initial_radial_gate_first_track_origin:{20:0,50:0,100:0},
            event_radial_gate_difference_central_minus_first:{}
          };
          for(const rs of [20,50,100]){
            out.initial_radial_gate_central_origin[rs]=summary(gate0[rs]);
            out.event_radial_gate_difference_central_minus_first[rs]=summary(gateEvent[rs]);
          }
          fs.writeFileSync('/tmp/h5-origin-node.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Y-maze-free regressions
        run: |
          set -euo pipefail
          for f in tests/boundary-timing.test.js tests/determinism.test.js tests/experiment-definition.test.js tests/h3-reorientation.test.js tests/integrity-firewall.test.js tests/measurement-geometry-policy.test.js tests/measurement.test.js tests/open-arena-protocol.test.js tests/rng-streams.test.js tests/state-integrity.test.js; do
            node "$f"
          done
      - name: Start Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..100}; do if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then exit 0; fi; sleep .2; done
          cat /tmp/chrome.log || true
          exit 1
      - name: Chromium shadow mirror
        run: |
          cat >/tmp/h5-origin-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!AntLabIntegrity&&!!AntLabCore"))break;await sleep(100);}
          const report=await evalv(`(async()=>{
            const j=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json();};
            const clone=x=>JSON.parse(JSON.stringify(x));
            const geometry=await j('./reference/poissonnier2026_open_arena_measurement_geometry_v1.json');
            const policy=await j('./reference/poissonnier2026_open_arena_measurement_policy_v1.json');
            const app0=await j('./apparatus/poissonnier2026_open_arena.json');
            const exp0=await j('./experiments/open_arena_short_control.json');
            const model0=await j('./models/lasius_niger_locomotion_h3_v1.json');
            const state=await j('./states/naive_outbound_v1.json');
            const obs0=await j('./observations/poissonnier2026_tracking_25fps.json');
            const scoring=await j('./scoring/open_arena_first_border_v1.json');
            const wrap=a=>{while(a<=-Math.PI)a+=2*Math.PI;while(a>Math.PI)a-=2*Math.PI;return a;};
            const vals=[],first=[],folds={};
            const colonies=[0,7,16,20,21,27];
            for(let fi=0;fi<colonies.length;fi++){
              const held=colonies[fi],pool=geometry.rows.filter(r=>r.colony!==held).sort((a,b)=>a.ant_id-b.ant_id);let ne=0;
              for(let i=0;i<10;i++){
                const seed=990000+fi*10000+i;
                const rr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,policy.geometry_sampler.rng_stream_name));
                const row=pool[Math.min(pool.length-1,Math.floor(rr.next()*pool.length))];
                const exp=clone(exp0),app=clone(app0),obs=clone(obs0),model=clone(model0);
                model.reorientation_gate.effect.max_hazard_reduction_fraction=0; exp.model=model.id;
                app.world.width=row.arena_width_mm;app.world.height=row.arena_height_mm;
                const rect=app.geometry.primitives.find(p=>p.type==='rect');rect.width=row.arena_width_mm;rect.height=row.arena_height_mm;
                app.entry_points.default={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};
                app.entry_points.center={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};
                exp.protocol.entry_state.position_jitter_mm=0;obs.metric_definitions.central_zone_fraction.center_y_mm=row.entry_reference_y_mm;obs.metric_definitions.central_zone_fraction.half_width_mm=10;
                const sim=new AntLabIntegrity.Simulation({experiment:exp,model,apparatus:app,state,observation:obs,scoring},seed);sim.runUntilComplete(120,AntLabIntegrity.FIXED_DT);
                const ev=sim.events.filter(e=>e.type==='h3_reorientation');ne+=ev.length;
                ev.forEach((e,k)=>{const bc=Math.atan2(row.entry_reference_y_mm-e.y,row.entry_reference_x_mm-e.x),bf=Math.atan2(row.first_track_y_mm-e.y,row.first_track_x_mm-e.x),d=Math.abs(wrap(bc-bf))*180/Math.PI;vals.push(d);if(k===0)first.push(d);});
              }
              folds[held]={pool_n:pool.length,events:ne};
            }
            vals.sort((a,b)=>a-b);first.sort((a,b)=>a-b);const med=a=>a.length?a[Math.floor((a.length-1)/2)]:null;
            return{status:'passed',simulations:60,events:vals.length,folds,median_event_bearing_delta_deg:med(vals),median_first_event_bearing_delta_deg:med(first),gt15:vals.filter(x=>x>15).length/vals.length};
          })()`);
          const forbidden=requests.filter(u=>/neutral_y_maze|\/y_maze|\/y-maze/i.test(u));
          if(exceptions.length||consoleErrors.length||forbidden.length)throw new Error(`browser firewall failure exceptions=${exceptions.length} console=${consoleErrors.length} ymaze=${forbidden.length}`);
          report.browser={exceptions:0,console_errors:0,ymaze_requests:0};
          fs.writeFileSync('/tmp/h5-origin-browser.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/h5-origin-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: h5-origin-choice-shadow-audit
          path: |
            /tmp/h5-origin-node.json
            /tmp/h5-origin-browser.json
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
