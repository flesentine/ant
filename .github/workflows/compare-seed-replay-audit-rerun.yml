          ref: c985bb9dd5083afb976c5bc602446a14bf901f11
          fetch-depth: 0
      - name: Verify exact seed-replay head
        run: test "$(git rev-parse HEAD)" = "c985bb9dd5083afb976c5bc602446a14bf901f11"
