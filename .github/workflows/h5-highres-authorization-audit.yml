name: H5 high-resolution authorization audit
on:
  push:
    branches: [h5-highres-authorization-v1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact authorization chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_highres_authorization_v1.json)" = "d3d2d61dab1337c321e9a3bf0eaae704ef152706"
          test "$(git hash-object hypotheses/h5_parameter_estimation_v1.json)" = "ead45bacff89bf626deaaf3238a5c363b74279d1"
          test "$(git hash-object tools/run-h5-estimation.js)" = "e3172bb051de3fab350a7a63746d3e870fbaa0fc"
          test "$(git hash-object reports/h5_estimator_qualification_v1.json)" = "8ee978588c97d56a9660693bc08ed4ba0600d961"
          test "$(git hash-object src/h5.js)" = "b43f8e9fcaa4b2cc9981ed4f2922a833cc1a3177"
          test ! -e reports/h5_parameter_estimation_500x60_v1.json
      - name: Run full H0-H5 regression suite
        run: ./tests/run-tests.sh
      - name: Verify authorized preflight without running high-resolution
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const path=require('path');
          const h5e=require('./tools/run-h5-estimation.js');
          const root=process.cwd();
          const p=h5e.assertExactPolicyBlob(root).policy;
          h5e.assertPolicySemantics(p);
          const a=h5e.assertHighResolutionAuthorized(root);
          if(a.high_resolution_search_authorized!==true) throw new Error('authorization did not enable frozen high-resolution preflight');
          if(a.estimator_git_blob_sha!=='e3172bb051de3fab350a7a63746d3e870fbaa0fc') throw new Error('wrong estimator authorized');
          if(a.ymaze_access_authorized!==false||a.canonical_promotion_authorized!==false) throw new Error('authorization scope too broad');
          console.log(JSON.stringify({status:'passed',authorization:a.id,estimator:a.estimator_git_blob_sha,high_resolution_search_authorized:true,high_resolution_executed:false,ymaze_access_authorized:false,canonical_promotion_authorized:false}));
          NODE
          test ! -e reports/h5_parameter_estimation_500x60_v1.json
