name: H3 500x60 LOCO once
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fold:
    if: contains(github.event.head_commit.message, '[H3-500x60]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - colony: 0
            fi: 0
          - colony: 7
            fi: 1
          - colony: 16
            fi: 2
          - colony: 20
            fi: 3
          - colony: 21
            fi: 4
          - colony: 27
            fi: 5
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact fold
        env:
          HELD: ${{ matrix.colony }}
          FI: ${{ matrix.fi }}
        run: |
          mkdir -p /tmp/h3-fold
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const h3=require('./tools/run-h3-estimation.js');
          const h2=require('./tools/run-h2-estimation.js');
          const {readJson}=require('./tools/load-bundle.js');
          const held=Number(process.env.HELD),fi=Number(process.env.FI),seed0=990000,count=500,trials=60,evalTrials=120;
          const policy=readJson('hypotheses/h3_parameter_estimation_v1.json');
          const target=readJson('reference/poissonnier2026_h2_estimation_targets.json');
          const cal=readJson('reference/calibration_manifest.json');
          const source=readJson('reference/poissonnier2026_source_manifest.json');
          const base=readJson('models/lasius_niger_locomotion_h3_v1.json');
          const h2Base=readJson('models/lasius_niger_locomotion_h2_v1.json');
          const h2Report=readJson('reports/h2_parameter_estimation_500x60_v1.json');
          h3.validate(policy,target,cal,source,h2Report);
          const train=target.rows.filter(r=>r.colony!==held),test=target.rows.filter(r=>r.colony===held);
          const fitSeed=seed0+fi*10000,evalSeed=seed0+500000+fi*10000,scales=h3.scoreScales(train);
          const ns=h3.search(train,policy,base,{count,trials,seed0:fitSeed,baseline:true});
          const hs=h3.search(train,policy,base,{count,trials,seed0:fitSeed,baseline:false});
          const nEval=h3.score(h3.simulateCandidate(ns.best.candidate,evalTrials,evalSeed,base),test,scales);
          const hEval=h3.score(h3.simulateCandidate(hs.best.candidate,evalTrials,evalSeed,base),test,scales);
          const h2Fold=h2Report.folds.find(f=>f.held_out_colony===held);
          const h2Candidate=h3.h2CandidateFromReportFold(h2Fold);
          const h2Eval=h3.score(h2.simulateCandidate(h2Candidate,evalTrials,evalSeed,h2Base),test,scales);
          const fold={held_out_colony:held,fold_index:fi,train_n:train.length,test_n:test.length,fit_seed:fitSeed,evaluation_seed:evalSeed,evaluation_trials_per_condition:evalTrials,heldout_metric_scales_from_training:scales,H3_null:{fit:ns.best,heldout_loss:nEval.loss},H3_context:{fit:hs.best,heldout_loss:hEval.loss},H2_v1_recorded_candidate:{candidate:h2Candidate,recorded_heldout_loss:h2Fold.H2.heldout_loss,reevaluated_heldout_loss_matched_crn:h2Eval.loss},heldout_relative_improvement_vs_H3_null:(nEval.loss-hEval.loss)/Math.max(1e-12,nEval.loss),heldout_relative_improvement_vs_H2_v1:(h2Eval.loss-hEval.loss)/Math.max(1e-12,h2Eval.loss)};
          fs.writeFileSync('/tmp/h3-fold/fold.json',JSON.stringify(fold,null,2)+'\n');
          console.log(JSON.stringify({held,vs_null:fold.heldout_relative_improvement_vs_H3_null,vs_h2:fold.heldout_relative_improvement_vs_H2_v1,H3:hs.best.candidate},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: h3-fold-${{ matrix.colony }}
          path: /tmp/h3-fold/fold.json
          retention-days: 7
  combine:
    if: contains(github.event.head_commit.message, '[H3-500x60]')
    needs: fold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: h3-fold-*
          path: /tmp/h3-folds
      - name: Combine frozen promotion decision
        env:
          EXEC_SHA: ${{ github.sha }}
        run: |
          mkdir -p /tmp/h3-result
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          function files(dir){return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?files(path.join(dir,e.name)):[path.join(dir,e.name)]);}
          const folds=files('/tmp/h3-folds').filter(x=>x.endsWith('fold.json')).map(x=>JSON.parse(fs.readFileSync(x,'utf8'))).sort((a,b)=>a.held_out_colony-b.held_out_colony);
          function median(xs){const a=[...xs].sort((x,y)=>x-y),n=a.length;return n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2;}
          const impNull=folds.map(f=>f.heldout_relative_improvement_vs_H3_null),impH2=folds.map(f=>f.heldout_relative_improvement_vs_H2_v1);
          const winsNull=impNull.filter(x=>x>0).length,winsH2=impH2.filter(x=>x>0).length,medNull=median(impNull),medH2=median(impH2);
          const nullPass=winsNull>=5&&medNull>0,h2Pass=winsH2>=4&&medH2>0;
          const report={schema_version:1,id:'H3_parameter_estimation_500x60_v1',status:nullPass?'development_internal_promotion_guard_passed':'development_estimation_failed_promotion_guard',execution:{repo_commit:process.env.EXEC_SHA,source_xlsx_sha256:'b311d5fdc89eac56724bb5195743cf4bb52a6cff4040b18704353091e1fe6318',candidates_per_model:500,trials_per_condition:60,evaluation_trials_per_condition:120,seed:990000,physics_dt_s:0.02,method:'deterministic Halton low-discrepancy search; six LOCO folds',parallelization:'folds parallelized only; candidate sequence, seeds, simulation physics, training-derived scoring scales, and objective unchanged',scoring_audit:'reports/estimator_scoring_audit_v1.json'},fit_policy:{threshold_independent_metrics:['time_to_exit_s','middle_zone_fraction','beeline_mm','exit_edge'],exit_outcomes:['left','right','top','bottom','timeout'],heldout_continuous_scaling:'pooled training SD frozen per LOCO fold',ymaze_accessed:false,canonical_parameters_updated:false},internal_cv:{H3_wins_vs_H3_null:winsNull,total_folds:6,median_relative_improvement_vs_H3_null:medNull,H3_promotion_guard_passed:nullPass,H3_wins_vs_H2_v1:winsH2,median_relative_improvement_vs_H2_v1:medH2,H2_comparison_guard_passed:h2Pass,development_preferred_over_H2_v1:nullPass&&h2Pass,canonical_promotion:false},folds};
          report.conclusion=nullPass?(h2Pass?'H3 passes its frozen internal guard and is development-preferred over the re-evaluated H2-v1 candidates; this is not external validation and does not change the canonical model.':'H3 passes its own frozen internal guard but does not pass the frozen H2 comparison guard; do not call it development-preferred over H2-v1.'):'H3 fails its frozen >=5/6 held-out-colony promotion guard; do not promote or tune harder using these same outcomes.';
          fs.writeFileSync('/tmp/h3-result/h3_parameter_estimation_500x60_v1.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report.internal_cv,null,2));
          console.log(report.conclusion);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: h3-highres-500x60
          path: /tmp/h3-result/h3_parameter_estimation_500x60_v1.json
          retention-days: 14
