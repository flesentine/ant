name: P1 v0.3.3h result-freeze audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [v0.3.3h-p1-response-result-freeze]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact frozen P1 result chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object reports/p1_response_estimation_500x60_v1.json)" = "561aca4a14346ebb4f062f30d0438d3115784172"
          test "$(sha256sum reports/p1_response_estimation_500x60_v1.json | awk '{print $1}')" = "4e3de4c1fb35465a877fbc78b8ce178763b5bcb968af05d66085186a93a3facf"
          test "$(wc -c < reports/p1_response_estimation_500x60_v1.json | tr -d ' ')" = "174770"
          test "$(git hash-object reports/p1_response_estimation_execution_provenance_v1.json)" = "6afe2727a88b7294d2bd09b8704755a5a355826a"
          test "$(sha256sum reports/p1_response_estimation_execution_provenance_v1.json | awk '{print $1}')" = "96b86db1070c221a0e5040b2f05ebab40303c7ee3a0b486133a181f56e4d5e93"
          test "$(git hash-object hypotheses/p1_response_estimation_result_freeze_v1.json)" = "1d99ebfaa378aeb1b98963f63b3a513a616a6617"
          test "$(git hash-object hypotheses/archive/p1_highres_authorization_v1.json)" = "7e77c5b1b9a6de9d665ff2be55c0780cc7d24d9c"
          test "$(git hash-object hypotheses/p1_highres_execution_precondition_v1.json)" = "18f2674ad3ee8da8f0a624a2a93b46f4bf673864"
          test "$(git hash-object hypotheses/p1_response_estimation_v1.json)" = "628d17f6eb69fd11216aff33d1356d184365aedd"
          test "$(git hash-object tools/run-p1-estimation.js)" = "a307e74e8ba2366e2546eebe1a7cccac69a3ff9a"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test ! -e hypotheses/p1_highres_authorization_v1.json
          test ! -e .github/workflows/p1-v033g-official-highres.yml
          test ! -e .github/workflows/p1-v033h-materialize-result.yml
      - name: Run full H0-H5 plus P1 suite
        run: ./tests/run-tests.sh
      - name: Recheck frozen decision semantics
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('reports/p1_response_estimation_500x60_v1.json','utf8'));
          const f=JSON.parse(fs.readFileSync('hypotheses/p1_response_estimation_result_freeze_v1.json','utf8'));
          if(r.internal_cv.P1_wins_vs_exact_null!==4||r.internal_cv.total_folds!==6||r.internal_cv.P1_survival_guard_passed!==false)throw new Error('frozen primary decision drift');
          if(Math.abs(r.internal_cv.median_relative_improvement_vs_exact_null-0.26132694328143546)>1e-15)throw new Error('frozen median drift');
          if(r.final_all_data_fit!==null)throw new Error('final fit must remain absent');
          if(r.promotion.mechanism_survives_internal_development!==false||r.promotion.fixed_parameter_pair_eligible_for_future_v0_4_freeze!==false)throw new Error('frozen promotion drift');
          if(f.rerun_authorized!==false||f.ymaze_accessed!==false||f.canonical_locomotion_changed!==false)throw new Error('closure firewall drift');
          NODE
      - name: Build reference-free Node parity panel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1-result-freeze-audit
          node - <<'NODE'
          const fs=require('fs'),p1=require('./src/p1.js'),est=require('./tools/run-p1-estimation.js');
          const {loadBundle,readJson}=require('./tools/load-bundle.js');
          const policy=readJson('./hypotheses/p1_response_estimation_v1.json'),base=readJson('./models/lasius_niger_painted_trail_p1_v1.json');
          const candidates=[est.contextCandidate(0,policy),est.nullAnchor(policy)],out=[];let k=0;
          for(const c of candidates)for(const treatment of ['dcm_control','pheromone']){
            const spec={candidate:{sigma_field_mm:c.sigma_field_mm,kappa_trail_per_s:c.kappa_trail_per_s},candidate_index:c.candidate_index,treatment,seed:994000+(++k)*37};
            const b=loadBundle(est.conditionExperiment(treatment),{modelId:base.id});b.model=est.configuredModel(base,spec.candidate);b.observation.record_trajectories=false;
            const sim=new p1.Simulation(b,spec.seed),s=sim.runUntilComplete(b.experiment.duration_s,p1.FIXED_DT),a=sim.ants[0],r=s.observed_metrics.ants[0],ex=r.exit_coordinate_mm;
            out.push({...spec,result:{x:a.x,y:a.y,heading:a.heading,rng_state:a.rng.state,finished:a.finished,time_to_exit_s:r.time_to_arena_edge_s==null?b.experiment.duration_s:r.time_to_arena_edge_s,middle_zone_fraction:r.central_zone_fraction==null?0:r.central_zone_fraction,exit_x:ex?ex.x:null,exit_y:ex?ex.y:null,steering_samples:a.p1SteeringSamples,last_omega:a.p1LastOmega,dose_ratio:sim.p1DoseRatio}});
          }
          fs.writeFileSync('/tmp/p1-result-freeze-audit/node-parity.json',JSON.stringify(out,null,2));
          NODE
      - name: Real Chromium frozen-result/runtime parity and firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/p1-result-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/p1-result-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p1-result-chrome --remote-debugging-port=9222 about:blank >/tmp/p1-result-chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep .2; done
          cat >/tmp/p1-result-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const refs=JSON.parse(fs.readFileSync('/tmp/p1-result-freeze-audit/node-parity.json','utf8'));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabIntegrity"))break;await new Promise(r=>setTimeout(r,50));}
          await evalv("new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='./src/p1.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})");
          const frozen=await evalv("(async()=>{const r=await (await fetch('./reports/p1_response_estimation_500x60_v1.json')).json();const f=await (await fetch('./hypotheses/p1_response_estimation_result_freeze_v1.json')).json();return{status:r.status,wins:r.internal_cv.P1_wins_vs_exact_null,median:r.internal_cv.median_relative_improvement_vs_exact_null,survival:r.internal_cv.P1_survival_guard_passed,finalFit:r.final_all_data_fit,rerun:f.rerun_authorized,ymaze:f.ymaze_accessed};})()");
          if(frozen.status!=='development_response_estimation_failed_primary_survival_guard'||frozen.wins!==4||frozen.survival!==false||frozen.finalFit!==null||frozen.rerun!==false||frozen.ymaze!==false)throw new Error('browser frozen-result semantics drift');
          const expr="(async()=>{const refs="+JSON.stringify(refs)+";const cache={};async function j(p){if(!cache[p])cache[p]=await (await fetch(p)).json();return JSON.parse(JSON.stringify(cache[p]));}async function bundle(treatment,candidate){const ep=treatment==='dcm_control'?'open_arena_p1_zero_dose_reachability.json':'open_arena_p1_nominal_dose_reachability.json';const experiment=await j('./experiments/'+ep),model=await j('./models/lasius_niger_painted_trail_p1_v1.json');model.painted_trail_response.field.sigma_field_mm=candidate.sigma_field_mm;model.painted_trail_response.steering.kappa_trail_per_s=candidate.kappa_trail_per_s;const apparatus=await j('./apparatus/'+experiment.apparatus+'.json'),state=await j('./states/'+experiment.state+'.json'),observation=await j('./observations/'+experiment.observation+'.json'),scoring=await j('./scoring/'+experiment.scoring+'.json');observation.record_trajectories=false;return{experiment,model,apparatus,state,observation,scoring};}const out=[];for(const spec of refs){const b=await bundle(spec.treatment,spec.candidate),sim=new AntLabP1.Simulation(b,spec.seed),s=sim.runUntilComplete(b.experiment.duration_s,AntLabP1.FIXED_DT),a=sim.ants[0],r=s.observed_metrics.ants[0],ex=r.exit_coordinate_mm;out.push({...spec,result:{x:a.x,y:a.y,heading:a.heading,rng_state:a.rng.state,finished:a.finished,time_to_exit_s:r.time_to_arena_edge_s==null?b.experiment.duration_s:r.time_to_arena_edge_s,middle_zone_fraction:r.central_zone_fraction==null?0:r.central_zone_fraction,exit_x:ex?ex.x:null,exit_y:ex?ex.y:null,steering_samples:a.p1SteeringSamples,last_omega:a.p1LastOmega,dose_ratio:sim.p1DoseRatio}});}return out;})()";
          const browser=await evalv(expr),near=(a,b,t=1e-11)=>a===b||(Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<=t),numeric=['x','y','heading','time_to_exit_s','middle_zone_fraction','exit_x','exit_y','last_omega','dose_ratio'];
          let matched=0;
          for(let i=0;i<refs.length;i++){const a=refs[i],b=browser[i];for(const k of numeric){if(a.result[k]==null||b.result[k]==null){if(a.result[k]!==b.result[k])throw new Error('null mismatch '+i+' '+k);}else if(!near(a.result[k],b.result[k]))throw new Error('numeric mismatch '+i+' '+k);}for(const k of ['rng_state','finished','steering_samples'])if(a.result[k]!==b.result[k])throw new Error('exact mismatch '+i+' '+k);matched++;}
          const yreq=requests.filter(u=>/y[_-]?maze/i.test(u)),targetReq=requests.filter(u=>u.includes('poissonnier2026_pheromone_response_targets.json'));
          if(exceptions.length||consoleErrors.length||yreq.length||targetReq.length)throw new Error('browser firewall failure');
          const out={status:'passed',parity_cases:matched,exceptions:exceptions.length,console_errors:consoleErrors.length,response_target_requests:targetReq.length,ymaze_requests:yreq.length,frozen_wins:frozen.wins,survival:false,rerun_authorized:false};
          fs.writeFileSync('/tmp/p1-result-freeze-audit/browser.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));ws.close();
          NODE
          node /tmp/p1-result-browser.mjs
      - name: Upload P1 result-freeze audit
        uses: actions/upload-artifact@v4
        with:
          name: p1-v033h-result-freeze-audit
          path: /tmp/p1-result-freeze-audit
          retention-days: 30
