# final full-suite qualification after P1 review remediation evidence freeze
name: P4 v0.3.4l review remediation audit

on:
  push:
    branches: [v0.3.4l-p4-ymaze-implementation-qualification]
    paths:
      - '.github/workflows/p4-v034l-review-remediation-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Chrome-qualified simulation bytes unchanged
        run: |
          set -euo pipefail
          test "$(git hash-object src/p4.js)" = "bf7d5781bd69ec4568450ebbd3bdc284897b6f61"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test "$(git hash-object models/lasius_niger_painted_trail_p4_fitted_v1.json)" = "e23b022279d463442bdd4e16d4cf56e0212d2b11"
          test "$(git hash-object apparatus/poissonnier2026_y_maze_p4_left_v1.json)" = "219d42036c13463e8cae5045b8fdba6d5bd24454"
          test "$(git hash-object apparatus/poissonnier2026_y_maze_p4_right_v1.json)" = "bfcba7e34eed4b4f79e67d6fc22c60af993f5386"
          test "$(git hash-object experiments/y_maze_p4_left_consistency_v1.json)" = "08edc2d3ef9899820c04e900154f1b4bee2a5104"
          test "$(git hash-object experiments/y_maze_p4_right_consistency_v1.json)" = "217f94ec4ba61a61c7956baeac34abd19cf5eec8"
          test "$(git hash-object experiments/y_maze_p4_neutral_consistency_v1.json)" = "e58cf3f4f5c51168f2dc267af7a820bc5b875b90"
      - name: Verify remediated tooling and evidence bytes
        run: |
          set -euo pipefail
          test "$(git hash-object tools/run-p4-ymaze-consistency.js)" = "fe3bff285290d0d612a5b9ab665e887c728e3d2e"
          test "$(git hash-object tools/compare-p4-ymaze-consistency.js)" = "75cf0ae6075695784e7c67c1473a50e0daaa98cc"
          test "$(git hash-object tests/p4-ymaze-consistency-implementation.test.js)" = "74ecec3c2a588e7decc04875fd814101b705abef"
          test "$(git hash-object tests/p4-ymaze-consistency-implementation-authorization.test.js)" = "8907721d081665c40f485f3146b590b38f948c1c"
          test "$(git hash-object reports/p4_ymaze_consistency_implementation_qualification_v1.json)" = "184e1dc5d50a14fd10615f95db412dc414cf45d5"
          test "$(git hash-object tests/p4-ymaze-consistency-implementation-qualification-result.test.js)" = "5b1aa2109f91fd1535abb9b6c1c1562a6cb0fc7f"
          test ! -e hypotheses/p4_Y_maze_consistency_official_execution_authorization_v1.json
          test ! -e hypotheses/p4_Y_maze_consistency_stage_B_authorization_v1.json
          test ! -e reports/p4_ymaze_consistency_simulation_v1.json
          test ! -e reports/p4_ymaze_consistency_comparison_v1.json
      - name: Run remediated implementation and evidence checks
        run: |
          node --check tools/run-p4-ymaze-consistency.js
          node --check tools/compare-p4-ymaze-consistency.js
          node tests/p4-ymaze-consistency-implementation.test.js
          node tests/p4-ymaze-consistency-implementation-authorization.test.js
          node tests/p4-ymaze-consistency-implementation-qualification-result.test.js
      - name: Confirm Stage A and Stage B remain locked
        run: |
          set -euo pipefail
          if node tools/run-p4-ymaze-consistency.js --official --out /tmp/forbidden-stage-a.json; then exit 1; fi
          test ! -e /tmp/forbidden-stage-a.json
          if node tools/compare-p4-ymaze-consistency.js --simulation anything.json --observed anything.json --synthetic; then exit 1; fi
      - name: Run complete permanent regression suite
        run: ./tests/run-tests.sh
      - name: Confirm no official artifacts were created
        run: |
          set -euo pipefail
          test ! -e reports/p4_ymaze_consistency_simulation_v1.json
          test ! -e reports/p4_ymaze_consistency_comparison_v1.json
          test "$(git status --porcelain)" = ""
          echo 'final P1 remediation qualification remained reference-free and non-official'
