name: P3 v0.3.3u estimator probe
on:
  push:
    branches: [v0.3.3u-p3-estimator-qualification]
permissions:
  contents: read
concurrency:
  group: p3-v033u-estimator-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact P3 estimator chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p3_response_estimation_v1.json)" = "d86eb9936e993d188f2a28faab838ba158c40f3b"
          test "$(git hash-object tools/p3-estimation-core.js)" = "410ef81dfe761e3c218d072ca311632329ac1617"
          test "$(git hash-object tools/run-p3-estimation.js)" = "5bf27bf439dca18629cdfd36f56fe767a23062ff"
          test ! -e hypotheses/p3_highres_authorization_v1.json
      - name: Run permanent suite
        run: ./tests/run-tests.sh
      - name: Run reference-free P3 estimator qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p3-v033u-probe
          node tools/run-p3-estimation.js --mode qualification --trials 2 --out /tmp/p3-v033u-probe/qualification.json
          node - <<'NODE'
          const q=require('/tmp/p3-v033u-probe/qualification.json');
          if(q.status!=='passed'||q.reference_outcomes_accessed!==false||q.response_target_semantics_loaded!==false||q.P1_official_result_semantics_loaded!==false||q.P2_official_result_semantics_loaded!==false||q.ymaze_accessed!==false)throw new Error('P3 qualification firewall failed');
          for(const [k,v] of Object.entries(q.checks))if(v!==true)throw new Error('P3 qualification check failed: '+k);
          console.log(JSON.stringify({status:q.status,checks:Object.keys(q.checks).length}));
          NODE
      - name: Prove highres remains blocked
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/run-p3-estimation.js --mode highres --out /tmp/p3-v033u-probe/unauthorized.json >/tmp/p3-v033u-highres.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "missing post-qualification authorization artifact" /tmp/p3-v033u-highres.log
          test ! -e /tmp/p3-v033u-probe/unauthorized.json
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: p3-v033u-estimator-probe
          path: /tmp/p3-v033u-probe
          retention-days: 7
