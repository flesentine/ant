name: P3 v0.3.3x exact result materialization

on:
  push:
    branches:
      - v0.3.3x-p3-response-result-freeze
    paths:
      - .github/workflows/p3-v033x-materialize-result.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: p3-v033x-materialize-result
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout result-freeze branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source and official artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/v0.3.3x-p3-response-result-freeze"
          git merge-base --is-ancestor 3ba8debdd6fe0c2b84a4f7c00a8d5a11f1fd614f HEAD

          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10116473125 --jq '.name')" = "p3-v033w-official-highres"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10116473125 --jq '.expired')" = "false"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10116473125 --jq '.digest')" = "sha256:03c55fbdef17515bbc48b2bb8561db8168c72c802f29d9ffc172869b9f305233"

          rm -rf /tmp/p3-official
          mkdir -p /tmp/p3-official
          gh run download 34375376968 -n p3-v033w-official-highres -D /tmp/p3-official

          test "$(stat -c %s /tmp/p3-official/p3_response_estimation_1000x60_v1.json)" = "317685"
          test "$(sha256sum /tmp/p3-official/p3_response_estimation_1000x60_v1.json | awk '{print $1}')" = "55bffcd30c85e1a891879fd712f8332f119d191d5930fa4c4710ae9589c8e73b"
          test "$(git hash-object /tmp/p3-official/p3_response_estimation_1000x60_v1.json)" = "264d822c7e6180dc0c9a3da1b8045df3f0e2a03d"

          test "$(stat -c %s /tmp/p3-official/p3_response_estimation_execution_provenance_v1.json)" = "2533"
          test "$(sha256sum /tmp/p3-official/p3_response_estimation_execution_provenance_v1.json | awk '{print $1}')" = "668706dcd7de505fe956ed8de2db57b37753c5198fd281a66f92ea8ce8c65bed"
          test "$(git hash-object /tmp/p3-official/p3_response_estimation_execution_provenance_v1.json)" = "cd397bc5f7cd0f62ed12a0d741750d6700dbef10"

      - name: Commit exact official bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cp /tmp/p3-official/p3_response_estimation_1000x60_v1.json reports/
          cp /tmp/p3-official/p3_response_estimation_execution_provenance_v1.json reports/

          test "$(git hash-object reports/p3_response_estimation_1000x60_v1.json)" = "264d822c7e6180dc0c9a3da1b8045df3f0e2a03d"
          test "$(git hash-object reports/p3_response_estimation_execution_provenance_v1.json)" = "cd397bc5f7cd0f62ed12a0d741750d6700dbef10"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/p3_response_estimation_1000x60_v1.json reports/p3_response_estimation_execution_provenance_v1.json

          test "$(git diff --cached --name-only | wc -l)" = "2"
          git diff --cached --name-only | grep -Fx "reports/p3_response_estimation_1000x60_v1.json"
          git diff --cached --name-only | grep -Fx "reports/p3_response_estimation_execution_provenance_v1.json"

          git commit -m "Materialize exact official P3 response result"
          git push origin HEAD:v0.3.3x-p3-response-result-freeze
