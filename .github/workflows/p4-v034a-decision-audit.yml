name: P4 v0.3.4a candidate-class decision audit

on:
  push:
    branches:
      - v0.3.4a-p4-candidate-class-decision
    paths:
      - .github/workflows/p4-v034a-decision-audit.yml

permissions:
  contents: read

concurrency:
  group: p4-v034a-decision-audit
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact decision gate and non-executable scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 152f47f30845f0af91150e9bfe1cbba43e9bfcc7 HEAD

          test "$(git hash-object hypotheses/p4_painted_trail_candidate_class_evidence_v1.json)" = "262f332062f271bbf111d0572f83b2faaf2cfd74"
          test "$(git hash-object hypotheses/p4_painted_trail_candidate_class_decision_v1.json)" = "ad7295ba6d466549c60c8ecac37e39d30006ec1c"
          test "$(git hash-object hypotheses/p1_response_estimation_result_freeze_v1.json)" = "1d99ebfaa378aeb1b98963f63b3a513a616a6617"
          test "$(git hash-object hypotheses/p2_response_estimation_result_freeze_v1.json)" = "088316e1746594f9b3f700cb277a83eb53fdd9f6"
          test "$(git hash-object hypotheses/p3_response_estimation_result_freeze_v1.json)" = "aa69afda6d80cc9d4ea0b563470cffdf0762b941"
          test "$(git hash-object hypotheses/p3_post_failure_characterization_v1.json)" = "541259b5f26cc475997b7b1a03d6b6f3cba6a332"

          git diff --name-only 152f47f30845f0af91150e9bfe1cbba43e9bfcc7...HEAD | tee /tmp/p4-decision-changed.txt
          test "$(grep -Ec '^(src/|models/|experiments/|apparatus/|reference/|tools/|reports/)' /tmp/p4-decision-changed.txt || true)" = "0"
          test "$(grep -Ec '^hypotheses/(p1_|p2_|p3_)' /tmp/p4-decision-changed.txt || true)" = "0"

          test ! -e src/p4.js
          test ! -e models/lasius_niger_painted_trail_p4_v1.json
          test ! -e hypotheses/p4_painted_trail_mechanism_v1.json
          test ! -e hypotheses/p4_response_estimation_v1.json
          test ! -e hypotheses/p4_implementation_authorization_v1.json
          test ! -e hypotheses/p4_reachability_execution_v1.json
          test ! -e tools/run-p4-estimation.js
          test ! -e tools/run-p4-reachability.js

      - name: Run P4 candidate-class decision regression directly
        run: node tests/p4-candidate-class-decision.test.js

      - name: Run permanent regression suite
        run: ./tests/run-tests.sh
