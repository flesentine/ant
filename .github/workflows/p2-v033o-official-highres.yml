name: P2 v0.3.3o official high-resolution response execution
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2-v033o-official-highres.yml'
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify one-shot main-only execution preconditions
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REF}" = "refs/heads/main"
          git merge-base --is-ancestor a2f5c3dc2a10aad30e796c3f866a382b31cc6210 HEAD

          test "$(git hash-object hypotheses/p2_highres_authorization_v1.json)" = "de361b15b9600bd92a35baf30fa71c2a7c61003c"
          test "$(git hash-object hypotheses/p2_response_estimation_v1.json)" = "eaa74df19f3fdc1a59dec5f0b3b2efefba3f89ce"
          test "$(git hash-object tools/run-p2-estimation.js)" = "38d66d28e94d2f532e9c8a20bd6553d6d11be8a6"
          test "$(git hash-object reports/p2_estimator_qualification_v1.json)" = "9f4d15875b35773b41696987abd1cc4721435bc2"
          test "$(git hash-object hypotheses/p2_estimator_qualification_result_freeze_v1.json)" = "1d46b594cb154a93c2e321fb67d399acdd821993"
          test "$(git hash-object src/p2.js)" = "f91a2f7ede1b8119acc1fd57ac94a9718d074e15"
          test "$(git hash-object models/lasius_niger_painted_trail_p2_v1.json)" = "7d3eecc44cb2eaf727249083a6fcfa21986fd475"
          test "$(git hash-object reference/poissonnier2026_pheromone_response_targets.json)" = "81910c5bd3ec7b1f7728c2c9f100b0e8a6db29ed"
          test "$(git hash-object models/lasius_niger_locomotion_v1.json)" = "2fde196d6c8a9353c1c8c206d4fcef223e92ad1d"
          test "$(git hash-object src/sim-core.js)" = "24777aac3577d442893e4779d70aee4e27761fe8"
          test "$(git hash-object src/integrity.js)" = "f23c68a6955832b70eeb3bd3e6893d71a3759018"

          node - <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const a=JSON.parse(fs.readFileSync('hypotheses/p2_highres_authorization_v1.json','utf8'));
          const p=JSON.parse(fs.readFileSync('hypotheses/p2_highres_execution_precondition_v1.json','utf8'));

          if(a.id!=='P2_high_resolution_authorization_v1')throw new Error('authorization id drift');
          if(a.status!=='qualified_estimator_authorized_for_frozen_high_resolution_response_search')throw new Error('authorization status drift');
          if(a.effective_when_merged_to_main!==true||a.high_resolution_response_search_authorized!==true)throw new Error('authorization effectiveness drift');
          if(a.policy_git_blob_sha!=='eaa74df19f3fdc1a59dec5f0b3b2efefba3f89ce')throw new Error('authorization policy pin drift');
          if(a.estimator_git_blob_sha!=='38d66d28e94d2f532e9c8a20bd6553d6d11be8a6')throw new Error('authorization estimator pin drift');
          if(a.qualification_report.git_blob_sha!=='9f4d15875b35773b41696987abd1cc4721435bc2')throw new Error('authorization qualification pin drift');
          if(a.qualification_result_freeze.git_blob_sha!=='1d46b594cb154a93c2e321fb67d399acdd821993')throw new Error('authorization qualification freeze pin drift');
          if(a.P1_official_result_semantic_access_authorized!==false||a.canonical_promotion_authorized!==false||a.Candidate_B_authorized!==false||a.ymaze_access_authorized!==false)throw new Error('authorization firewall drift');

          if(p.id!=='P2_high_resolution_execution_precondition_v1')throw new Error('execution precondition id drift');
          if(p.status!=='authorization_merged_and_permanent_main_ci_green_before_official_execution')throw new Error('execution precondition status drift');
          if(p.authorization_main_commit!=='a2f5c3dc2a10aad30e796c3f866a382b31cc6210')throw new Error('authorization main checkpoint drift');
          if(p.authorization_git_blob_sha!=='de361b15b9600bd92a35baf30fa71c2a7c61003c')throw new Error('precondition authorization blob drift');
          if(p.policy_git_blob_sha!=='eaa74df19f3fdc1a59dec5f0b3b2efefba3f89ce')throw new Error('precondition policy blob drift');
          if(p.estimator_git_blob_sha!=='38d66d28e94d2f532e9c8a20bd6553d6d11be8a6')throw new Error('precondition estimator blob drift');
          if(p.qualification_report_git_blob_sha!=='9f4d15875b35773b41696987abd1cc4721435bc2')throw new Error('precondition qualification blob drift');
          if(p.qualification_result_freeze_git_blob_sha!=='1d46b594cb154a93c2e321fb67d399acdd821993')throw new Error('precondition qualification freeze drift');
          if(p.permanent_main_workflow.run_id!==34189072667||p.permanent_main_workflow.run_number!==140||p.permanent_main_workflow.conclusion!=='success')throw new Error('permanent main CI checkpoint drift');
          if(p.permanent_main_workflow.test_job_id!==101943216663||p.permanent_main_workflow.test_job_conclusion!=='success')throw new Error('permanent main test checkpoint drift');
          if(p.permanent_main_workflow.deploy_job_id!==101943352041||p.permanent_main_workflow.deploy_job_conclusion!=='success')throw new Error('permanent main deploy checkpoint drift');

          const workflowBlob=cp.execFileSync('git',['hash-object','.github/workflows/p2-v033o-official-highres.yml'],{encoding:'utf8'}).trim();
          if(p.execution_workflow_git_blob_sha!==workflowBlob)throw new Error('execution workflow blob does not match frozen precondition');
          if(p.authorized_command_exact!=='node tools/run-p2-estimation.js --mode highres --out reports/p2_response_estimation_1000x60_v1.json')throw new Error('authorized command drift');
          if(p.official_execution_still_unrun_at_freeze!==true)throw new Error('execution was not frozen as unrun');
          if(p.canonical_promotion_authorized!==false||p.ymaze_access_authorized!==false)throw new Error('precondition promotion firewall drift');

          if(fs.existsSync('reports/p2_response_estimation_1000x60_v1.json'))throw new Error('official P2 report already exists before one-shot execution');
          NODE

      - name: Run permanent regression suite before official search
        run: ./tests/run-tests.sh

      - name: Run official frozen P2 high-resolution response search
        shell: bash
        run: |
          set -euo pipefail
          node tools/run-p2-estimation.js --mode highres --out reports/p2_response_estimation_1000x60_v1.json

      - name: Validate official result and write execution provenance
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const cp=require('child_process');

          const reportPath='reports/p2_response_estimation_1000x60_v1.json';
          const report=JSON.parse(fs.readFileSync(reportPath,'utf8'));
          const allowedStatuses=new Set([
            'development_response_estimation_failed_dual_primary_survival_guard',
            'development_response_estimation_survived_but_parameter_triple_not_eligible',
            'development_response_estimation_passed_and_parameter_triple_eligible_for_future_freeze'
          ]);
          if(!allowedStatuses.has(report.status))throw new Error('unexpected official P2 result status: '+report.status);
          if(report.execution_class!=='frozen_high_resolution_response_search')throw new Error('official execution class drift');
          if(report.policy_git_blob_sha!=='eaa74df19f3fdc1a59dec5f0b3b2efefba3f89ce')throw new Error('official report policy drift');
          if(report.estimator_git_blob_sha!=='38d66d28e94d2f532e9c8a20bd6553d6d11be8a6')throw new Error('official report estimator drift');
          if(report.response_target_git_blob_sha!=='81910c5bd3ec7b1f7728c2c9f100b0e8a6db29ed')throw new Error('official report target drift');
          if(report.reference_outcomes_accessed!==true)throw new Error('official report must record authorized response-target access');
          if(report.P1_official_result_semantics_loaded!==false)throw new Error('P1 official result semantics must remain unloaded');
          if(report.ymaze_accessed!==false||report.Candidate_B_implemented!==false||report.canonical_locomotion_updated!==false)throw new Error('official report firewall drift');
          if(report.nuisance_parameters_estimated!==false||report.H2_H3_H4_H5_refit!==false)throw new Error('official report nuisance/refit firewall drift');
          if(report.pre_reference_qualification?.status!=='passed')throw new Error('official report missing passing pre-reference qualification');
          if(report.high_resolution_authorization?.id!=='P2_high_resolution_authorization_v1')throw new Error('official report missing exact authorization');
          if(report.search?.P2_candidates_per_fold_total!==1000||report.search?.projected_no_lapse_candidates_per_fold_total!==1000)throw new Error('official candidate-panel drift');
          if(report.search?.training_trials_per_treatment_path_per_candidate!==60||report.search?.heldout_evaluation_trials_per_treatment_path!==120)throw new Error('official LOCO budget drift');
          if(report.search?.root_fit_seed!==4210000||report.search?.root_evaluation_seed!==4810000)throw new Error('official seed drift');

          const buf=fs.readFileSync(reportPath);
          const sha256=crypto.createHash('sha256').update(buf).digest('hex');
          const gitBlob=cp.execFileSync('git',['hash-object',reportPath],{encoding:'utf8'}).trim();
          const workflowBlob=cp.execFileSync('git',['hash-object','.github/workflows/p2-v033o-official-highres.yml'],{encoding:'utf8'}).trim();
          const preconditionBlob=cp.execFileSync('git',['hash-object','hypotheses/p2_highres_execution_precondition_v1.json'],{encoding:'utf8'}).trim();

          const provenance={
            schema_version:1,
            id:'P2_official_high_resolution_execution_provenance_v1',
            status:'official_execution_completed_result_uninterpreted_at_provenance_write',
            github:{
              repository:process.env.GITHUB_REPOSITORY,
              run_id:Number(process.env.GITHUB_RUN_ID),
              run_number:Number(process.env.GITHUB_RUN_NUMBER),
              run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),
              workflow:process.env.GITHUB_WORKFLOW,
              event_name:process.env.GITHUB_EVENT_NAME,
              ref:process.env.GITHUB_REF,
              sha:process.env.GITHUB_SHA
            },
            frozen_chain:{
              authorization_git_blob_sha:'de361b15b9600bd92a35baf30fa71c2a7c61003c',
              policy_git_blob_sha:'eaa74df19f3fdc1a59dec5f0b3b2efefba3f89ce',
              estimator_git_blob_sha:'38d66d28e94d2f532e9c8a20bd6553d6d11be8a6',
              qualification_report_git_blob_sha:'9f4d15875b35773b41696987abd1cc4721435bc2',
              qualification_result_freeze_git_blob_sha:'1d46b594cb154a93c2e321fb67d399acdd821993',
              execution_precondition_git_blob_sha:preconditionBlob,
              execution_workflow_git_blob_sha:workflowBlob,
              response_target_git_blob_sha:'81910c5bd3ec7b1f7728c2c9f100b0e8a6db29ed'
            },
            command:'node tools/run-p2-estimation.js --mode highres --out reports/p2_response_estimation_1000x60_v1.json',
            cli_parameter_overrides:[],
            report:{
              file:'p2_response_estimation_1000x60_v1.json',
              bytes:buf.length,
              git_blob_sha:gitBlob,
              sha256,
              status:report.status
            },
            firewalls:{
              P1_official_result_semantics_loaded:report.P1_official_result_semantics_loaded,
              ymaze_accessed:report.ymaze_accessed,
              Candidate_B_implemented:report.Candidate_B_implemented,
              canonical_locomotion_updated:report.canonical_locomotion_updated,
              nuisance_parameters_estimated:report.nuisance_parameters_estimated,
              H2_H3_H4_H5_refit:report.H2_H3_H4_H5_refit
            },
            interpretation_performed:false,
            canonical_promotion_performed:false,
            ymaze_unlock_performed:false
          };

          fs.mkdirSync('/tmp/p2-official',{recursive:true});
          fs.writeFileSync('/tmp/p2-official/p2_response_estimation_execution_provenance_v1.json',JSON.stringify(provenance,null,2)+'\n');
          fs.copyFileSync(reportPath,'/tmp/p2-official/p2_response_estimation_1000x60_v1.json');

          console.log(JSON.stringify({
            status:report.status,
            report_bytes:buf.length,
            report_git_blob_sha:gitBlob,
            report_sha256:sha256,
            github_run_id:provenance.github.run_id,
            github_run_attempt:provenance.github.run_attempt
          }));
          NODE

      - name: Upload exact official P2 result and provenance
        uses: actions/upload-artifact@v4
        with:
          name: p2-v033o-official-highres
          path: /tmp/p2-official
          retention-days: 90
          if-no-files-found: error
