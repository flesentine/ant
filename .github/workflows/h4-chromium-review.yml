name: H4 Chromium review
on:
  push:
    branches: [h4-transient-locomotor-activation-v1]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-run full test suite
        run: ./tests/run-tests.sh
      - name: Start local lab server
        run: |
          python3 -m http.server 8080 >/tmp/antlab-http.log 2>&1 &
          echo $! >/tmp/antlab-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 0.2; done
          cat /tmp/antlab-http.log
          exit 1
      - name: Launch Chromium and exercise UI
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then echo "No Chromium-family browser found"; exit 1; fi
          echo "Browser: $CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          echo $! >/tmp/chrome.pid
          for i in {1..50}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break; sleep 0.2; done
          cat > /tmp/chromium-smoke.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function target(){
            const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();
            return tabs.find(t=>t.type==='page')||tabs[0];
          }
          const t=await target();
          const ws=new WebSocket(t.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject;});
          let seq=0; const pending=new Map(); const exceptions=[]; const consoleErrors=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data); if(m.id&&pending.has(m.id)){const {resolve,reject}=pending.get(m.id);pending.delete(m.id);m.error?reject(new Error(JSON.stringify(m.error))):resolve(m.result);} if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params); if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);};
          function send(method,params={}){return new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));});}
          async function evalv(expression){const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'Runtime evaluation failed');return r.result.value;}
          async function waitFor(expr,label,timeout=6000){const start=Date.now();while(Date.now()-start<timeout){try{if(await evalv(expr))return;}catch{}await sleep(100);}throw new Error(`Timed out waiting for ${label}`);}
          await send('Runtime.enable'); await send('Page.enable');
          await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          await waitFor(`document.readyState==='complete'`,'document complete');
          await waitFor(`document.getElementById('runStatus')?.textContent==='PAUSED'`,'default assay PAUSED');
          const initial=await evalv(`({title:document.title,status:runStatus.textContent,model:modelId.textContent,hash:modelHash.textContent,note:protocolNote.textContent,footer:document.querySelector('footer').innerText})`);
          if(initial.title!=='ANTLAB H4')throw new Error('Unexpected title '+initial.title);
          if(initial.model!=='lasius_niger_locomotion_v1')throw new Error('Interactive default must remain canonical model, got '+initial.model);
          if(!initial.hash||initial.hash==='—')throw new Error('Model hash missing');
          await evalv(`stepBtn.click()`); await waitFor(`parseFloat(simTime.textContent)>=0.9`,'1 s step');
          const stepped=await evalv(`({time:simTime.textContent,status:runStatus.textContent,speed:meanSpeed.textContent,distance:distanceValue.textContent,truth:truthDistanceValue.textContent})`);
          if(stepped.status==='LOAD ERROR')throw new Error('LOAD ERROR after stepping');
          await evalv(`showTrails.click();showIds.click();showContacts.click(); true`);
          const toggles=await evalv(`({trails:showTrails.checked,ids:showIds.checked,contacts:showContacts.checked})`);
          if(toggles.trails!==false||toggles.ids!==true||toggles.contacts!==false)throw new Error('Display toggles failed');
          await evalv(`experimentSelect.value='open_arena_long_control.json';experimentSelect.dispatchEvent(new Event('change',{bubbles:true}));true`);
          await waitFor(`runStatus.textContent==='PAUSED' && protocolNote.textContent.includes('1000 mm')`,'100 cm assay load');
          const longState=await evalv(`({model:modelId.textContent,hash:modelHash.textContent,note:protocolNote.textContent,time:simTime.textContent})`);
          if(longState.model!=='lasius_niger_locomotion_v1')throw new Error('Long interactive assay must remain canonical/H0');
          if(longState.hash!==initial.hash)throw new Error('Short/long interactive assays must share canonical model hash');
          await evalv(`seedInput.value='928492';seedInput.dispatchEvent(new Event('change',{bubbles:true}));true`);
          await waitFor(`runStatus.textContent==='PAUSED' && simTime.textContent.startsWith('0.0')`,'seed reset');
          await evalv(`speedSelect.value='20';playBtn.click();true`); await sleep(500); await evalv(`playBtn.click();true`);
          const played=await evalv(`({time:parseFloat(simTime.textContent),status:runStatus.textContent})`);
          if(!(played.time>0))throw new Error('Run/Pause did not advance simulation');
          if(played.status!=='PAUSED'&&played.status!=='COMPLETE')throw new Error('Unexpected post-pause status '+played.status);
          await evalv(`experimentSelect.value='straight_bridge.json';experimentSelect.dispatchEvent(new Event('change',{bubbles:true}));true`);
          await waitFor(`runStatus.textContent==='PAUSED'`,'straight bridge load');
          await evalv(`stepBtn.click();true`); await waitFor(`parseFloat(simTime.textContent)>=0.9`,'straight bridge step');
          const finalState=await evalv(`({status:runStatus.textContent,model:modelId.textContent,experiment:protocolNote.textContent,time:simTime.textContent,canvas:[labCanvas.width,labCanvas.height]})`);
          if(finalState.status==='LOAD ERROR')throw new Error('Straight bridge LOAD ERROR');
          if(exceptions.length)throw new Error('Browser exceptions: '+JSON.stringify(exceptions));
          if(consoleErrors.length)throw new Error('Console errors: '+JSON.stringify(consoleErrors));
          const shot=await send('Page.captureScreenshot',{format:'png',captureBeyondViewport:true});fs.writeFileSync('/tmp/h4-chromium-final.png',Buffer.from(shot.data,'base64'));
          const report={browser_target:t.url,initial,stepped,toggles,longState,played,finalState,exceptions:exceptions.length,consoleErrors:consoleErrors.length,ymaze_loaded:false};
          fs.writeFileSync('/tmp/h4-chromium-report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          ws.close();
          NODE
          node /tmp/chromium-smoke.mjs
      - name: Upload Chromium review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h4-chromium-review
          path: |
            /tmp/h4-chromium-report.json
            /tmp/h4-chromium-final.png
            /tmp/chrome.log
            /tmp/antlab-http.log
          retention-days: 7
          if-no-files-found: warn
