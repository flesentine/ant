name: PR61 synthetic activation descendant audit 7d77bea2
on:
  push:
    branches:
      - audit/pr61-7d77bea2-synthetic
permissions:
  contents: read
jobs:
  synthetic-activation-descendant-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact synthetic descendant head
        uses: actions/checkout@v4
        with:
          ref: 1cb9c5eea3b470c634a028f1afa398a4c1feaf8d
          fetch-depth: 0
      - name: Verify activation lineage
        run: |
          test "$(git rev-parse HEAD)" = "1cb9c5eea3b470c634a028f1afa398a4c1feaf8d"
          test "$(git rev-parse HEAD^1)" = "b573eda8810bf4fc5cb9855fa6146e35b8cbb67b"
          test "$(git rev-parse HEAD~2)" = "7d77bea2b763a473f0359e9a9b32940c4922fa59"
          git diff --name-status HEAD~2 HEAD^1
          git diff --name-status HEAD^1 HEAD
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full ANTLAB suite
        run: bash tests/run-tests.sh
