name: H5 result-freeze audit
# registration trigger
on:
  push:
    branches: [h5-result-freeze-v1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact frozen result and closure chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object reports/h5_parameter_estimation_500x60_v1.json)" = "1fcdb357e1755b5ba5cb4be6ee8b69db617e732d"
          test "$(sha256sum reports/h5_parameter_estimation_500x60_v1.json | awk '{print $1}')" = "28bcbcb4782dac05606f3c204fe661f5503d2a93ecfefa6fc2c27b719e885053"
          test "$(git hash-object hypotheses/archive/h5_highres_authorization_v1.json)" = "24b3c422f40bc4c44437995eff81ecdfd104ca34"
          test ! -e hypotheses/h5_highres_authorization_v1.json
          test ! -e .github/workflows/h5-official-highres.yml
          test "$(git hash-object tools/run-h5-estimation.js)" = "7d4a68f024c09c111a38088be2c943b7de74b464"
          test "$(git hash-object src/h5.js)" = "b43f8e9fcaa4b2cc9981ed4f2922a833cc1a3177"
          node - <<'NODE'
          const r=require('./reports/h5_parameter_estimation_500x60_v1.json');
          const f=require('./hypotheses/h5_result_freeze_v1.json');
          if(r.status!=='development_estimation_failed_development_preference_guards')throw new Error('wrong H5 result status');
          if(r.internal_cv.H5_wins_vs_H5_null!==3||r.internal_cv.H5_wins_vs_best_prior!==2)throw new Error('wrong frozen H5 summary');
          if(r.internal_cv.development_preferred!==false||r.internal_cv.canonical_promotion!==false)throw new Error('wrong frozen promotion state');
          if(f.status!=='official_high_resolution_result_frozen_failed_closed'||f.closure.H5_v1_closed!==true)throw new Error('result freeze not closed');
          if(f.posthoc_integrity_audit.chromium_parity_cases!==48||f.posthoc_integrity_audit.result_invalidated!==false)throw new Error('posthoc audit evidence mismatch');
          console.log(JSON.stringify({status:'passed',result_blob:f.result.git_blob_sha,H5_wins_vs_null:3,H5_wins_vs_best_prior:2,closed:true}));
          NODE
      - name: Run full H0-H5 regression suite
        run: ./tests/run-tests.sh
      - name: Build selected official Node parity reference
        shell: bash
        run: |
          mkdir -p /tmp/h5-freeze-audit
          node - <<'NODE'
          const fs=require('fs');
          const h5e=require('./tools/run-h5-estimation.js');
          const h5=require('./src/h5.js');
          const {loadBundle,readJson}=require('./tools/load-bundle.js');
          const report=require('./reports/h5_parameter_estimation_500x60_v1.json');
          const base=readJson('./models/lasius_niger_locomotion_h5_v1.json');
          const inflate=(fit,kind)=>{const c=fit.candidate;return{angular_sigma_rad_sqrt_s:c.angular_sigma_rad_sqrt_s,q:c.q,lambda_commitment_mm:c.lambda_commitment_mm==null?500:c.lambda_commitment_mm,tau_commitment_s:c.tau_commitment_s==null?5:c.tau_commitment_s,kappa_restore_per_s:kind==='null'?0:(c.kappa_restore_per_s??0)};};
          const selected=report.folds.filter(f=>f.held_out_colony===0||f.held_out_colony===16);
          const cases=[];
          for(const f of selected)for(const [kind,fit] of [['null',f.H5_null.fit],['context',f.H5_context.fit]]){
            const candidate=inflate(fit,kind),model=h5e.configuredModel(base,candidate);
            for(const experiment of ['open_arena_short_control.json','open_arena_long_control.json']){
              const seed=f.evaluation_seed,b=loadBundle(experiment,{modelId:model.id});b.model=JSON.parse(JSON.stringify(model));b.observation.record_trajectories=false;
              const sim=new h5.Simulation(b,seed);h5e.applySharedEntryTransition(sim,seed,candidate.q);const sx=sim.ants[0].x,sy=sim.ants[0].y;
              const summary=sim.runUntilComplete(b.experiment.duration_s,0.02),a=sim.ants[0],l=summary.latent_states[0],o=summary.observed_metrics.ants[0],ex=o.exit_coordinate_mm;
              cases.push({held_out_colony:f.held_out_colony,kind,candidate,experiment,seed,x:a.x,y:a.y,heading:a.heading,completedAt:a.completedAt,distance:a.distanceTravelled,rng:a.rng.state,speedFactor:a.speedFactor,pauseRemaining:a.pauseRemaining,reference:l.h5_heading_reference_rad,commitment:l.heading_commitment_current,time:o.time_to_arena_edge_s??b.experiment.duration_s,zone:o.central_zone_fraction??0,beeline:ex?Math.hypot(ex.x-sx,ex.y-sy):0,edge:h5e.exitEdge(ex,sim.apparatus.world.width,sim.apparatus.world.height)});
            }
          }
          fs.writeFileSync('/tmp/h5-freeze-audit/node-parity.json',JSON.stringify(cases,null,2));
          console.log(JSON.stringify({cases:cases.length,folds:selected.map(f=>f.held_out_colony)}));
          NODE
      - name: Real Chromium freeze UI and selected-candidate parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/h5-freeze-audit/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/h5-freeze-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/h5-freeze-chrome --remote-debugging-port=9222 about:blank >/tmp/h5-freeze-audit/chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/tmp/h5-freeze-audit/chrome-version.json 2>/dev/null && break; sleep .2; done
          cat >/tmp/h5-freeze-audit/browser.mjs <<'NODE'
          import fs from 'node:fs';
          const refs=JSON.parse(fs.readFileSync('/tmp/h5-freeze-audit/node-parity.json','utf8'));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<100;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabH5"))break;await new Promise(r=>setTimeout(r,50));}
          const body=await evalv('document.body.innerText');
          for(const phrase of ['H5-v1 failed promotion','official result frozen','H5-v1 closed'])if(!body.includes(phrase))throw new Error('missing UI phrase '+phrase);
          if(body.includes('official search not yet run'))throw new Error('stale pre-result UI text');
          const result=await evalv("(async()=>await (await fetch('./reports/h5_parameter_estimation_500x60_v1.json')).json())()");
          const freeze=await evalv("(async()=>await (await fetch('./hypotheses/h5_result_freeze_v1.json')).json())()");
          if(result.status!=='development_estimation_failed_development_preference_guards'||result.internal_cv.H5_wins_vs_H5_null!==3||result.internal_cv.H5_wins_vs_best_prior!==2)throw new Error('browser result JSON mismatch');
          if(freeze.status!=='official_high_resolution_result_frozen_failed_closed'||freeze.closure.H5_v1_closed!==true)throw new Error('browser freeze JSON mismatch');
          const browser=await evalv(`(async()=>{const json=async p=>(await fetch(p)).json(),cases=${JSON.stringify(refs.map(r=>({held_out_colony:r.held_out_colony,kind:r.kind,candidate:r.candidate,experiment:r.experiment,seed:r.seed})))},out=[];for(const c of cases){const experiment=await json('./experiments/'+c.experiment);experiment.model='lasius_niger_locomotion_h5_v1';const [model,apparatus,state,observation,scoring]=await Promise.all([json('./models/lasius_niger_locomotion_h5_v1.json'),json('./apparatus/'+experiment.apparatus+'.json'),json('./states/'+experiment.state+'.json'),json('./observations/'+experiment.observation+'.json'),json('./scoring/'+experiment.scoring+'.json')]);model.movement.angular_sigma_rad_sqrt_s=c.candidate.angular_sigma_rad_sqrt_s;model.heading_restoration.initialization.lambda_commitment_mm=c.candidate.lambda_commitment_mm;model.heading_restoration.decay.tau_commitment_s=c.candidate.tau_commitment_s;model.heading_restoration.effect.kappa_restore_per_s=c.candidate.kappa_restore_per_s;observation.record_trajectories=false;const sim=new AntLabH5.Simulation({experiment,model,apparatus,state,observation,scoring},c.seed),rr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(c.seed,'h2_estimation_entry_transition_v1'));if(rr.next()>c.candidate.q)sim.ants[0].heading=rr.next()*2*Math.PI-Math.PI;const sx=sim.ants[0].x,sy=sim.ants[0].y,summary=sim.runUntilComplete(experiment.duration_s,0.02),a=sim.ants[0],l=summary.latent_states[0],o=summary.observed_metrics.ants[0],ex=o.exit_coordinate_mm,edge=ex?Object.entries({left:Math.abs(ex.x),right:Math.abs(ex.x-sim.apparatus.world.width),top:Math.abs(ex.y),bottom:Math.abs(ex.y-sim.apparatus.world.height)}).sort((a,b)=>a[1]-b[1])[0][0]:'timeout';out.push({held_out_colony:c.held_out_colony,kind:c.kind,candidate:c.candidate,experiment:c.experiment,seed:c.seed,x:a.x,y:a.y,heading:a.heading,completedAt:a.completedAt,distance:a.distanceTravelled,rng:a.rng.state,speedFactor:a.speedFactor,pauseRemaining:a.pauseRemaining,reference:l.h5_heading_reference_rad,commitment:l.heading_commitment_current,time:o.time_to_arena_edge_s??experiment.duration_s,zone:o.central_zone_fraction??0,beeline:ex?Math.hypot(ex.x-sx,ex.y-sy):0,edge});}return out;})()`);
          const near=(a,b,t=2e-10)=>{if(a==null||b==null){if(a!==b)throw new Error('null mismatch');return;}if(Math.abs(a-b)>t)throw new Error('numeric mismatch '+a+' '+b);};
          if(browser.length!==refs.length)throw new Error('case count mismatch');
          for(let i=0;i<refs.length;i++){const a=refs[i],b=browser[i];for(const k of ['held_out_colony','kind','experiment','seed','rng','edge'])if(a[k]!==b[k])throw new Error(k+' mismatch');for(const k of ['x','y','heading','completedAt','distance','speedFactor','pauseRemaining','reference','commitment','time','zone','beeline'])near(a[k],b[k]);}
          const yreq=requests.filter(u=>/y[_-]?maze|ymaze/i.test(u));if(yreq.length)throw new Error('Y-maze request');if(exceptions.length)throw new Error('browser exceptions');if(consoleErrors.length)throw new Error('console errors');
          const report={status:'passed',cases:browser.length,folds:[...new Set(browser.map(x=>x.held_out_colony))].length,ui_failed_closed:true,exceptions:0,console_errors:0,ymaze_requests:0};
          fs.writeFileSync('/tmp/h5-freeze-audit/browser-result.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));ws.close();
          NODE
          node /tmp/h5-freeze-audit/browser.mjs
      - name: Upload H5 result-freeze audit
        uses: actions/upload-artifact@v4
        with:
          name: h5-result-freeze-audit
          path: /tmp/h5-freeze-audit
          retention-days: 30
