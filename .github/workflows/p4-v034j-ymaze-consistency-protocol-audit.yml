# rerun after semantic seed-contract assertion fix
name: P4 v0.3.4j Y-maze consistency protocol audit

on:
  push:
    branches: [v0.3.4j-p4-ymaze-consistency-protocol]
    paths:
      - '.github/workflows/p4-v034j-ymaze-consistency-protocol-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact protocol scope and frozen lineage
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p4_cross_apparatus_Y_maze_consistency_protocol_v1.json)" = "22515a3fe0945c0f19b6fb2166923f027bbf1b54"
          test "$(git hash-object hypotheses/p4_cross_apparatus_validation_source_design_v1.json)" = "740bedc5d552036c2d8adcac7529b64b2da6de0c"
          test "$(git hash-object hypotheses/p4_response_estimation_result_freeze_v1.json)" = "73f802be9dd9f21819649ab25323a9b3a92cff04"
          test "$(git hash-object src/p4.js)" = "bf7d5781bd69ec4568450ebbd3bdc284897b6f61"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test "$(git hash-object apparatus/poissonnier2026_y_maze.json)" = "eca7a0e66aed9546e5fc26c08f7abaa37bb3cbc8"
          test "$(git hash-object experiments/neutral_y_maze.json)" = "e61793266a7716587ef11fc96e0959f86103931c"
          test "$(git hash-object scoring/y_maze_endpoint_engineering_v1.json)" = "8235e511b8ef4159671f670b944129c82f7358cb"
          test ! -e models/lasius_niger_painted_trail_p4_fitted_v1.json
          test ! -e apparatus/poissonnier2026_y_maze_p4_left_v1.json
          test ! -e apparatus/poissonnier2026_y_maze_p4_right_v1.json
          test ! -e tools/run-p4-ymaze-consistency.js
          test ! -e reports/p4_ymaze_consistency_simulation_v1.json
          test ! -e reports/p4_ymaze_consistency_comparison_v1.json
          git diff --name-only 92cf82051b4cf780721dbb66042d5d373527fff9...HEAD | grep -Ev '^(.github/workflows/p4-v034j-ymaze-consistency-protocol-audit.yml|hypotheses/p4_cross_apparatus_Y_maze_consistency_protocol_v1.json|tests/p4-ymaze-consistency-protocol.test.js|tests/run-tests.sh|docs/P4_VALIDATION.md)$' && { echo 'unexpected v0.3.4j diff'; exit 1; } || true
      - name: Run Y-maze consistency protocol regression directly
        run: node tests/p4-ymaze-consistency-protocol.test.js
      - name: Run complete permanent regression suite
        run: ./tests/run-tests.sh
      - name: Confirm protocol freeze performed no new Y-maze simulation
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          echo 'v0.3.4j froze protocol only: no fitted execution model, derived apparatus, runner, biological comparison, or Y-maze simulation exists'
