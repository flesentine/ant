name: P4 v0.3.4w final code and Pages Chromium audit

on:
  push:
    branches: [v0.3.4w-p4-visual-simulator]
    paths:
      - '.github/workflows/p4-v034w-final-audit.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full ANTLAB test suite
        run: ./tests/run-tests.sh
      - name: Verify frozen P4 science bytes
        run: |
          set -euo pipefail
          test "$(git hash-object src/p4.js)" = "bf7d5781bd69ec4568450ebbd3bdc284897b6f61"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test "$(git hash-object models/lasius_niger_painted_trail_p4_fitted_v1.json)" = "e23b022279d463442bdd4e16d4cf56e0212d2b11"
          test "$(git hash-object apparatus/poissonnier2026_y_maze_p4_left_v1.json)" = "219d42036c13463e8cae5045b8fdba6d5bd24454"
          test "$(git hash-object apparatus/poissonnier2026_y_maze_p4_right_v1.json)" = "bfcba7e34eed4b4f79e67d6fc22c60af993f5386"
          test "$(git hash-object experiments/y_maze_p4_left_consistency_v1.json)" = "08edc2d3ef9899820c04e900154f1b4bee2a5104"
          test "$(git hash-object experiments/y_maze_p4_right_consistency_v1.json)" = "217f94ec4ba61a61c7956baeac34abd19cf5eec8"
          test "$(git hash-object experiments/y_maze_p4_neutral_consistency_v1.json)" = "e58cf3f4f5c51168f2dc267af7a820bc5b875b90"
      - name: Assemble exact Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site/src _site/experiments _site/models _site/apparatus _site/states _site/observations _site/scoring _site/reference _site/hypotheses
          cp index.html _site/index.html
          cp src/app.js src/sim-core.js src/measurement.js src/h3.js src/integrity.js src/p1.js src/p4.js src/h5.js src/style.css _site/src/
          cp experiments/*.json _site/experiments/
          cp models/*.json _site/models/
          cp apparatus/*.json _site/apparatus/
          cp states/*.json _site/states/
          cp observations/*.json _site/observations/
          cp scoring/*.json _site/scoring/
          cp reference/*.json _site/reference/
          cp hypotheses/*.json _site/hypotheses/
          touch _site/.nojekyll
          test -s _site/src/p1.js
          test -s _site/src/p4.js
          git hash-object index.html | tee /tmp/index-blob.txt
          git hash-object src/app.js | tee /tmp/app-blob.txt
          git hash-object .github/workflows/pages.yml | tee /tmp/pages-blob.txt
      - name: Locate real Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version | tee /tmp/chrome-version.txt
      - name: Verify deployed P4 visual entries in real Chrome
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          src=Path('_site/index.html').read_text()
          cases=[
            ('left','y_maze_p4_left_consistency_v1.json'),
            ('right','y_maze_p4_right_consistency_v1.json'),
            ('neutral','y_maze_p4_neutral_consistency_v1.json')
          ]
          for name,value in cases:
              marker=f'<option value="{value}">'
              if marker not in src: raise SystemExit(f'missing option {value}')
              html=src.replace(marker,f'<option value="{value}" selected>')
              Path(f'_site/p4-ui-{name}.html').write_text(html)
          PY
          python3 -m http.server 8000 --bind 127.0.0.1 --directory _site > /tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          : > /tmp/ui-smoke.txt
          for NAME in left right neutral; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --disable-component-update --disable-default-apps --disable-sync --no-first-run --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:8000/p4-ui-$NAME.html" > "/tmp/ui-$NAME.html"
            grep -q '>PAUSED<' "/tmp/ui-$NAME.html"
            grep -qi 'Frozen P4 Candidate 307 visual runtime' "/tmp/ui-$NAME.html"
            grep -qi 'noncanonical descriptive visualization only' "/tmp/ui-$NAME.html"
            grep -q 'H5-v1 failed promotion' "/tmp/ui-$NAME.html"
            grep -q 'official result frozen' "/tmp/ui-$NAME.html"
            grep -q 'H5-v1 closed' "/tmp/ui-$NAME.html"
            ! grep -q 'LOAD ERROR' "/tmp/ui-$NAME.html"
            echo "$NAME PASS" >> /tmp/ui-smoke.txt
          done
          ! grep -Eqi 'poissonnier2026_published_targets|poissonnier2026_inventory|/reference/' /tmp/http.log
          grep -q 'GET /src/p1.js' /tmp/http.log
          grep -q 'GET /src/p4.js' /tmp/http.log
          REQUESTS=$(grep -Ec '"GET ' /tmp/http.log || true)
          echo "$REQUESTS" > /tmp/request-count.txt
      - name: Write qualification summary
        run: |
          node <<'NODE'
          const fs=require('fs');
          const report={
            id:'P4_visual_simulator_final_pages_qualification_v1',
            qualified_head_sha:process.env.GITHUB_SHA,
            chrome_version:fs.readFileSync('/tmp/chrome-version.txt','utf8').trim(),
            index_git_blob_sha:fs.readFileSync('/tmp/index-blob.txt','utf8').trim(),
            app_git_blob_sha:fs.readFileSync('/tmp/app-blob.txt','utf8').trim(),
            pages_workflow_git_blob_sha:fs.readFileSync('/tmp/pages-blob.txt','utf8').trim(),
            full_test_suite:true,
            ui_smoke:fs.readFileSync('/tmp/ui-smoke.txt','utf8').trim().split('\n'),
            deployed_p1_runtime_loaded:true,
            deployed_p4_runtime_loaded:true,
            forbidden_biological_ymaze_network_requests:0,
            frozen_h5_lifecycle_disclosure_preserved:true,
            frozen_p4_science_bytes_unchanged:true
          };
          fs.writeFileSync('/tmp/p4-visual-final-audit.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: p4-visual-final-pages-qualification
          path: /tmp/p4-visual-final-audit.json
          if-no-files-found: error
