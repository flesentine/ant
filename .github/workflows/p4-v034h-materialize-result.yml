name: P4 v0.3.4h materialize official result

on:
  push:
    branches: [v0.3.4h-p4-result-freeze]
    paths:
      - '.github/workflows/p4-v034h-materialize-result.yml'

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3.4h-p4-result-freeze
          fetch-depth: 0
      - name: Verify source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api repos/flesentine/ant/actions/artifacts/10309441871)"
          test "$(jq -r .name <<<"$meta")" = "p4-v034g-official-highres"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "34724113310"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "55ad9d1d7c794216c917012a94f4abe78a79d588"
          test "$(jq -r .digest <<<"$meta")" = "sha256:9f0d4c98a4bd7d3c0ebbb9b0beda8a46622868b79215fb9d427ad0c2bab3d400"
      - name: Download exact official artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/flesentine/ant/actions/artifacts/10309441871/zip > /tmp/p4.zip
          rm -rf /tmp/p4-artifact
          mkdir -p /tmp/p4-artifact
          unzip -q /tmp/p4.zip -d /tmp/p4-artifact
          test -f /tmp/p4-artifact/p4_response_estimation_2000x60_v1.json
          test -f /tmp/p4-artifact/p4_response_estimation_execution_provenance_v1.json
      - name: Verify exact artifact bytes and provenance
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/p4-artifact/p4_response_estimation_2000x60_v1.json)" = "318152"
          test "$(sha256sum /tmp/p4-artifact/p4_response_estimation_2000x60_v1.json | cut -d' ' -f1)" = "0092dc672114371d43ae1b75a63ce48e03263e34a32dae12474780b735be191d"
          test "$(git hash-object /tmp/p4-artifact/p4_response_estimation_2000x60_v1.json)" = "f3e61db9964c25b95d3bfc55d8aa7d52930a0b7f"
          test "$(wc -c < /tmp/p4-artifact/p4_response_estimation_execution_provenance_v1.json)" = "2351"
          test "$(sha256sum /tmp/p4-artifact/p4_response_estimation_execution_provenance_v1.json | cut -d' ' -f1)" = "12ea29cbfd7317614b39adcef3d0674e4ccd05737384985ec198549025b3904b"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/p4-artifact/p4_response_estimation_2000x60_v1.json','utf8'));
          const p=JSON.parse(fs.readFileSync('/tmp/p4-artifact/p4_response_estimation_execution_provenance_v1.json','utf8'));
          if(r.status!=='development_response_estimation_passed_and_parameter_triplet_eligible_for_future_freeze') throw new Error('unexpected P4 status');
          if(r.internal_cv?.P4_dual_survival_guard_passed!==true) throw new Error('dual survival did not pass');
          if(r.final_all_data_fit?.identifiability?.passed!==true) throw new Error('identifiability did not pass');
          if(r.promotion?.fixed_parameter_triplet_eligible_for_future_freeze!==true) throw new Error('triplet not eligible');
          if(p.github?.run_id!==34724113310||p.github?.sha!=='55ad9d1d7c794216c917012a94f4abe78a79d588') throw new Error('provenance source drift');
          if(p.report?.git_blob_sha!=='f3e61db9964c25b95d3bfc55d8aa7d52930a0b7f') throw new Error('report blob provenance drift');
          NODE
      - name: Materialize exact official files
        run: |
          set -euo pipefail
          cp /tmp/p4-artifact/p4_response_estimation_2000x60_v1.json reports/p4_response_estimation_2000x60_v1.json
          cp /tmp/p4-artifact/p4_response_estimation_execution_provenance_v1.json reports/p4_response_estimation_execution_provenance_v1.json
          test "$(git hash-object reports/p4_response_estimation_2000x60_v1.json)" = "f3e61db9964c25b95d3bfc55d8aa7d52930a0b7f"
          test "$(sha256sum reports/p4_response_estimation_execution_provenance_v1.json | cut -d' ' -f1)" = "12ea29cbfd7317614b39adcef3d0674e4ccd05737384985ec198549025b3904b"
      - name: Commit exact result and provenance
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/p4_response_estimation_2000x60_v1.json reports/p4_response_estimation_execution_provenance_v1.json
          git diff --cached --quiet && { echo 'expected new official result files'; exit 1; }
          git commit -m 'Materialize exact official P4 response result'
          git push origin HEAD:v0.3.4h-p4-result-freeze
