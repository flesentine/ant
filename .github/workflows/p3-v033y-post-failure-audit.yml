name: P3 v0.3.3y post-failure characterization audit

on:
  push:
    branches:
      - v0.3.3y-post-p3-failure-characterization
    paths:
      - .github/workflows/p3-v033y-post-failure-audit.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify descriptive-only diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d03e39832a1c6d3a526bfe8b071aaf8d2dc1204b HEAD
          git diff --name-only d03e39832a1c6d3a526bfe8b071aaf8d2dc1204b...HEAD | tee /tmp/changed.txt
          test "$(grep -Ec '^(src/|models/|experiments/|apparatus/|reference/|tools/|hypotheses/p3_response_estimation_v1.json|hypotheses/p3_painted_trail_mechanism_v1.json)' /tmp/changed.txt || true)" = "0"
          test "$(git hash-object reports/p3_response_estimation_1000x60_v1.json)" = "264d822c7e6180dc0c9a3da1b8045df3f0e2a03d"
          test "$(git hash-object hypotheses/p3_response_estimation_result_freeze_v1.json)" = "aa69afda6d80cc9d4ea0b563470cffdf0762b941"
          test "$(git hash-object hypotheses/p3_response_estimation_v1.json)" = "d86eb9936e993d188f2a28faab838ba158c40f3b"
          test "$(git hash-object hypotheses/p3_painted_trail_mechanism_v1.json)" = "5d00ce0058ff388c9f57d7dce56ce465d82c5765"
          test "$(git hash-object hypotheses/p3_post_failure_characterization_v1.json)" = "541259b5f26cc475997b7b1a03d6b6f3cba6a332"

      - name: Run P3 characterization regression directly
        run: node tests/p3-post-failure-characterization.test.js

      - name: Run permanent regression suite
        run: ./tests/run-tests.sh
