name: P3 v0.3.3r mechanism-freeze audit
on:
  push:
    branches: [v0.3.3r-p3-mechanism-freeze]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Verify exact P3 mechanism chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p3_painted_trail_mechanism_v1.json)" = "5d00ce0058ff388c9f57d7dce56ce465d82c5765"
          test "$(git hash-object hypotheses/p3_painted_trail_candidate_class_decision_v1.json)" = "e8da07f6f73934e0120fd41d4668ae4039108336"
          test "$(git hash-object hypotheses/p2_response_estimation_result_freeze_v1.json)" = "088316e1746594f9b3f700cb277a83eb53fdd9f6"
          test ! -e src/p3.js
          test ! -e models/lasius_niger_painted_trail_p3_v1.json
          test ! -e tools/run-p3-estimation.js

      - name: Run full permanent regression suite
        run: ./tests/run-tests.sh

      - name: Verify pure mechanism semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p3-v033r-audit
          node - <<'NODE'
          const fs=require('fs');
          const m=require('./hypotheses/p3_painted_trail_mechanism_v1.json');
          const d=require('./hypotheses/p3_painted_trail_candidate_class_decision_v1.json');
          if(m.mechanism.mechanism_id!=='P3_local_sector_weber_steering_v1')throw new Error('mechanism id drift');
          if(m.mechanism.sector_sensors.radius_mm!==10||m.mechanism.sector_sensors.digital_operator.samples_per_sector!==32)throw new Error('sector drift');
          if(m.mechanism.relative_transduction.equation!=='W(L,R) = 0 if L+R <= 0; otherwise (R-L)/(R+L)')throw new Error('equation drift');
          if(m.mechanism.relative_transduction.epsilon_or_regularization!==0||m.mechanism.relative_transduction.threshold_parameter!==null)throw new Error('epsilon/threshold drift');
          if(m.mechanism.stochastic_structure.P2_transient_lapse_state_present!==false||m.mechanism.stochastic_structure.response_rng_present!==false||m.mechanism.stochastic_structure.biology_rng_draws_added!==0)throw new Error('stochastic drift');
          if(m.implementation_gate.implementation_authorized_by_this_record!==false||m.estimation_firewall.response_target_semantic_access_authorized!==false||m.global_firewall.Y_maze_access!==false)throw new Error('firewall drift');
          if(d.selected_next_candidate_class.class_id!=='P3_candidate_relative_bilateral_transduction')throw new Error('candidate drift');
          const W=(L,R)=>L+R<=0?0:(R-L)/(R+L);
          if(W(0,0)!==0||W(2,2)!==0||Math.abs(W(2,6)-.5)>1e-15||Math.abs(W(20,60)-.5)>1e-15||Math.abs(W(2,6)+W(6,2))>1e-15)throw new Error('Weber math');
          const out={status:'passed',mechanism:m.mechanism.mechanism_id,radius_mm:10,samples_per_sector:32,epsilon:0,lapse_state:false,response_rng:false,p3_runtime:false,response_target_access:false,ymaze:false};
          fs.writeFileSync('/tmp/p3-v033r-audit/mechanism.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          NODE

      - name: Real Chromium P3 mechanism firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/p3-v033r-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/p3-v033r-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p3-v033r-chrome --remote-debugging-port=9222 about:blank >/tmp/p3-v033r-chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep .2; done
          cat >/tmp/p3-v033r-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabIntegrity"))break;await new Promise(r=>setTimeout(r,50));}
          const state=await evalv("(async()=>{const m=await(await fetch('./hypotheses/p3_painted_trail_mechanism_v1.json')).json();const p3js=await fetch('./src/p3.js');const model=await fetch('./models/lasius_niger_painted_trail_p3_v1.json');const est=await fetch('./tools/run-p3-estimation.js');return{id:m.id,mechanism:m.mechanism.mechanism_id,radius:m.mechanism.sector_sensors.radius_mm,samples:m.mechanism.sector_sensors.digital_operator.samples_per_sector,epsilon:m.mechanism.relative_transduction.epsilon_or_regularization,lapse:m.mechanism.stochastic_structure.P2_transient_lapse_state_present,rng:m.mechanism.stochastic_structure.response_rng_present,target:m.estimation_firewall.response_target_semantic_access_authorized,ymaze:m.global_firewall.Y_maze_access,p3js:p3js.status,model:model.status,est:est.status};})()");
          if(state.id!=='P3_painted_trail_mechanism_v1'||state.mechanism!=='P3_local_sector_weber_steering_v1'||state.radius!==10||state.samples!==32||state.epsilon!==0||state.lapse!==false||state.rng!==false||state.target!==false||state.ymaze!==false)throw new Error('browser mechanism drift');
          if(state.p3js!==404||state.model!==404||state.est!==404)throw new Error('P3 executable surface exists');
          const targetReq=requests.filter(u=>u.includes('poissonnier2026_pheromone_response_targets.json'));
          const yreq=requests.filter(u=>/y[_-]?maze/i.test(u));
          const p1Req=requests.filter(u=>u.includes('p1_response_estimation_500x60_v1.json'));
          const p2Req=requests.filter(u=>u.includes('p2_response_estimation_1000x60_v1.json'));
          if(exceptions.length||consoleErrors.length||targetReq.length||yreq.length||p1Req.length||p2Req.length)throw new Error('browser firewall failure');
          const out={status:'passed',exceptions:exceptions.length,console_errors:consoleErrors.length,response_target_requests:targetReq.length,ymaze_requests:yreq.length,p1_result_requests:p1Req.length,p2_result_requests:p2Req.length,p3_js_status:state.p3js,p3_model_status:state.model,p3_estimator_status:state.est};
          fs.writeFileSync('/tmp/p3-v033r-audit/browser.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));ws.close();
          NODE
          node /tmp/p3-v033r-browser.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: p3-v033r-mechanism-freeze-audit
          path: /tmp/p3-v033r-audit
          retention-days: 30
