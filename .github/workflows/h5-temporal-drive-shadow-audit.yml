name: H5 temporal-drive shadow audit
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preconditions
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_origin_referenced_search_v1.draft.json)" = "57016903a32069876bdf88157ba1c659fa637c5c"
          test "$(git hash-object reports/h5_temporal_drive_choice_audit_v1.json)" = "0ec424889ee4c9745af30f70cca7c8b7152bb490"
          test "$(git hash-object reports/h5_biological_origin_choice_audit_v1.json)" = "2378fa54ad4174141f213ed44be3c283706975de"
          test "$(git hash-object reference/poissonnier2026_open_arena_measurement_policy_v1.json)" = "fd2718cf9351b655340eacd868adc536301a83a4"
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('hypotheses/h5_origin_referenced_search_v1.draft.json','utf8'));
          const o=JSON.parse(fs.readFileSync('reports/h5_biological_origin_choice_audit_v1.json','utf8'));
          const t=JSON.parse(fs.readFileSync('reports/h5_temporal_drive_choice_audit_v1.json','utf8'));
          const p=JSON.parse(fs.readFileSync('reference/poissonnier2026_open_arena_measurement_policy_v1.json','utf8'));
          if(d.firewall.mechanism_not_frozen!==true||d.firewall.parameter_search_allowed!==false) throw new Error('H5 freeze/search firewall mismatch');
          if(d.temporal_drive_decision.selected_profile!=='constant_over_observed_arena_traversal') throw new Error('temporal profile not frozen constant');
          if(d.firewall.H5_temporal_profile_frozen_constant!==true||d.firewall.H5_tau_search_parameter_forbidden!==true) throw new Error('temporal firewall mismatch');
          if(t.decision.selected_temporal_profile!=='constant_over_observed_arena_traversal'||t.firewall.tau_search_parameter_forbidden_in_H5_v1!==true) throw new Error('temporal report mismatch');
          if(d.biological_origin_decision.selected_origin!=='central_physical_entry_reference') throw new Error('origin not central physical entry');
          if(o.firewall.H5_runtime_implemented!==false||o.firewall.H5_parameter_search_allowed!==false) throw new Error('origin report runtime/search mismatch');
          if(p.simulation_application.time_origin.indexOf('first-track position')<0) throw new Error('measurement time origin changed');
          if(p.firewall.ymaze_access!==false||d.firewall.ymaze_access!==false||o.firewall.ymaze_access!==false) throw new Error('Y-maze firewall mismatch');
          NODE
          if grep -R -n -E 'biology_h5_search|rho_search|lambda_search_mm|r_search_mm|tau_search' src models experiments states apparatus scoring observations; then
            echo 'H5 runtime unexpectedly present' >&2
            exit 1
          fi
      - name: Node first-turn and decay sensitivity
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const geom=require('./tools/poissonnier2026-measurement-geometry.js');
          const {Simulation,FIXED_DT}=require('./src/integrity.js');
          const {loadBundle}=require('./tools/load-bundle.js');
          const {geometry}=geom.loadFrozenMeasurementGeometry(process.cwd());
          const q=(xs,p)=>{const a=[...xs].sort((x,y)=>x-y);if(!a.length)return null;const z=(a.length-1)*p,lo=Math.floor(z),hi=Math.ceil(z),f=z-lo;return a[lo]*(1-f)+a[hi]*f;};
          const summary=xs=>({n:xs.length,min:Math.min(...xs),q10:q(xs,.1),q25:q(xs,.25),median:q(xs,.5),q75:q(xs,.75),q90:q(xs,.9),max:Math.max(...xs),mean:xs.reduce((a,b)=>a+b,0)/xs.length});
          const base=loadBundle('open_arena_short_control.json',{modelId:'lasius_niger_locomotion_h3_v1'});
          base.model.reorientation_gate.effect.max_hazard_reduction_fraction=0;
          const firstTimes=[],exitTimes=[],noTurn=[],offsets=[];
          const folds={};
          for(let fi=0;fi<geom.EXPECTED_COLONIES.length;fi++){
            const held=geom.EXPECTED_COLONIES[fi],pool=geom.geometryPool(geometry.rows,held);
            let turns=0,none=0;
            for(let i=0;i<200;i++){
              const seed=990000+fi*10000+i;
              const row=geom.sampleGeometry(pool,seed).row;
              const b=geom.applyGeometry(base,row);
              const sim=new Simulation(b,seed);
              sim.runUntilComplete(120,FIXED_DT);
              offsets.push(Math.hypot(row.first_track_x_mm-row.entry_reference_x_mm,row.first_track_y_mm-row.entry_reference_y_mm));
              exitTimes.push(sim.ants[0].finishedAt ?? sim.time);
              if(sim.ants[0].h3FirstTurnTime==null){none++;noTurn.push(sim.ants[0].finishedAt ?? sim.time);}
              else {turns++;firstTimes.push(sim.ants[0].h3FirstTurnTime);}
            }
            folds[held]={simulations:200,with_first_turn:turns,no_turn_before_end:none,pool_n:pool.length};
          }
          const taus=[0.5,1,2,5,10,20,40];
          const deltas=[0,0.25,0.5,1,2];
          const sensitivity={};
          for(const tau of taus){
            const baseline=firstTimes.map(t=>Math.exp(-t/tau));
            const rows={tau_s:tau,observed_first_turn_drive:summary(baseline),unknown_pretrack_delay:{}};
            for(const delta of deltas){
              const ratio=Math.exp(-delta/tau);
              const shifted=firstTimes.map(t=>Math.exp(-(t+delta)/tau));
              rows.unknown_pretrack_delay[delta]={multiplicative_ratio_vs_assumed_zero:ratio,percent_reduction_vs_zero:(1-ratio)*100,first_turn_drive:summary(shifted)};
            }
            sensitivity[tau]=rows;
          }
          const out={
            status:'passed',
            scientific_role:'shadow_only_no_H5_runtime_no_fit',
            simulations:1200,
            folds,
            first_reorientation_time_from_first_track_s:summary(firstTimes),
            fraction_no_reorientation_before_exit_or_timeout:noTurn.length/1200,
            exit_or_timeout_time_s:summary(exitTimes),
            first_track_offset_from_central_origin_mm:summary(offsets),
            unobserved_pretrack_delay_identified_from_frozen_geometry:false,
            diagnostic_delay_grid_s:deltas,
            diagnostic_tau_grid_s:taus,
            decay_sensitivity:sensitivity,
            structural_observation:[
              'For exponential decay exp(-(t+delta)/tau), unknown pre-track delay delta is exactly confounded as a multiplicative factor exp(-delta/tau).',
              'The frozen measurement policy starts t=0 at first track and contains no biological elapsed-time measurement from physical entry to first track.',
              'A fitted decay amplitude can trade against the unknown pre-track delay; a fitted tau adds another weakly identified timescale.',
              'Constant drive over the observed traversal is invariant to the unobserved pre-track time offset.'
            ]
          };
          fs.writeFileSync('/tmp/h5-temporal-node.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Y-maze-free regressions
        run: |
          set -euo pipefail
          for f in tests/boundary-timing.test.js tests/determinism.test.js tests/experiment-definition.test.js tests/h3-reorientation.test.js tests/integrity-firewall.test.js tests/measurement-geometry-policy.test.js tests/measurement.test.js tests/open-arena-protocol.test.js tests/rng-streams.test.js tests/state-integrity.test.js; do
            node "$f"
          done
      - name: Start Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then exit 0; fi
            sleep .2
          done
          cat /tmp/chrome.log || true
          exit 1
      - name: Chromium temporal shadow mirror
        run: |
          set -euo pipefail
          cat >/tmp/h5-temporal-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!AntLabIntegrity&&!!AntLabCore"))break;await sleep(100);}
          const report=await evalv(`(async()=>{
            const j=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json();},clone=x=>JSON.parse(JSON.stringify(x));
            const geometry=await j('./reference/poissonnier2026_open_arena_measurement_geometry_v1.json');
            const policy=await j('./reference/poissonnier2026_open_arena_measurement_policy_v1.json');
            const app0=await j('./apparatus/poissonnier2026_open_arena.json'),exp0=await j('./experiments/open_arena_short_control.json'),model0=await j('./models/lasius_niger_locomotion_h3_v1.json'),state=await j('./states/naive_outbound_v1.json'),obs0=await j('./observations/poissonnier2026_tracking_25fps.json'),scoring=await j('./scoring/open_arena_first_border_v1.json');
            const colonies=[0,7,16,20,21,27],first=[],folds={};
            for(let fi=0;fi<colonies.length;fi++){
              const held=colonies[fi],pool=geometry.rows.filter(r=>r.colony!==held).sort((a,b)=>a.ant_id-b.ant_id);let n=0,none=0;
              for(let i=0;i<20;i++){
                const seed=990000+fi*10000+i,rr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,policy.geometry_sampler.rng_stream_name)),row=pool[Math.min(pool.length-1,Math.floor(rr.next()*pool.length))];
                const exp=clone(exp0),app=clone(app0),obs=clone(obs0),model=clone(model0);model.reorientation_gate.effect.max_hazard_reduction_fraction=0;exp.model=model.id;
                app.world.width=row.arena_width_mm;app.world.height=row.arena_height_mm;const rect=app.geometry.primitives.find(p=>p.type==='rect');rect.width=row.arena_width_mm;rect.height=row.arena_height_mm;
                app.entry_points.default={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};app.entry_points.center={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};exp.protocol.entry_state.position_jitter_mm=0;obs.metric_definitions.central_zone_fraction.center_y_mm=row.entry_reference_y_mm;obs.metric_definitions.central_zone_fraction.half_width_mm=10;
                const sim=new AntLabIntegrity.Simulation({experiment:exp,model,apparatus:app,state,observation:obs,scoring},seed);sim.runUntilComplete(120,AntLabIntegrity.FIXED_DT);
                if(sim.ants[0].h3FirstTurnTime==null)none++;else{n++;first.push(sim.ants[0].h3FirstTurnTime);}
              }
              folds[held]={simulations:20,with_first_turn:n,no_turn:none,pool_n:pool.length};
            }
            first.sort((a,b)=>a-b);const quant=p=>{const z=(first.length-1)*p,lo=Math.floor(z),hi=Math.ceil(z),f=z-lo;return first[lo]*(1-f)+first[hi]*f;};
            const taus=[1,2,5,10,20],deltas=[0.25,0.5,1,2],decay={};
            for(const tau of taus){decay[tau]={};for(const delta of deltas)decay[tau][delta]={ratio:Math.exp(-delta/tau),reduction_pct:(1-Math.exp(-delta/tau))*100};}
            return{status:'passed',simulations:120,first_turns:first.length,folds,first_turn_time_s:{q10:quant(.1),median:quant(.5),q90:quant(.9)},diagnostic_decay_delay_sensitivity:decay};
          })()`);
          const forbidden=requests.filter(u=>/neutral_y_maze|\/y_maze|\/y-maze/i.test(u));
          if(exceptions.length||consoleErrors.length||forbidden.length)throw new Error(`browser firewall failure exceptions=${exceptions.length} console=${consoleErrors.length} ymaze=${forbidden.length}`);
          report.browser={exceptions:0,console_errors:0,ymaze_requests:0};
          fs.writeFileSync('/tmp/h5-temporal-browser.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/h5-temporal-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: h5-temporal-drive-shadow-audit
          path: |
            /tmp/h5-temporal-node.json
            /tmp/h5-temporal-browser.json
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
