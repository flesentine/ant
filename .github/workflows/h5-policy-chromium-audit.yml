name: H5 policy Chromium audit
on:
  push:
    branches: [h5-parameter-estimation-policy-v1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen policy and unchanged runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/h5_parameter_estimation_v1.json)" = "ead45bacff89bf626deaaf3238a5c363b74279d1"
          test "$(git hash-object hypotheses/h5_transient_entry_heading_restoration_v1.json)" = "d6fe2300db09b18d2a4426d6ef7ce6324b615f94"
          test "$(git hash-object src/h5.js)" = "b43f8e9fcaa4b2cc9981ed4f2922a833cc1a3177"
          test "$(git hash-object models/lasius_niger_locomotion_h5_v1.json)" = "ee2e5570f6d43cd91317fd38299b70bde32f191a"
          test "$(git hash-object src/integrity.js)" = "f23c68a6955832b70eeb3bd3e6893d71a3759018"
          test "$(git hash-object src/sim-core.js)" = "24777aac3577d442893e4779d70aee4e27761fe8"
          test ! -e tools/run-h5-estimation.js
          ! grep -q "H5 has no frozen estimator policy" index.html
          grep -q "H5 estimator policy frozen" index.html
      - name: Run full H0-H5 suite
        run: ./tests/run-tests.sh
      - name: Build Node H5 parity reference
        shell: bash
        run: |
          mkdir -p /tmp/h5-policy-audit
          node - <<'NODE'
          const fs=require('fs');
          const {Simulation}=require('./src/h5.js');
          const {loadBundle}=require('./tools/load-bundle.js');
          const cases=[];
          for(const experiment of ['open_arena_short_control.json','open_arena_long_control.json']){
            for(const seed of [1110000,1110123]){
              const b=loadBundle(experiment,{modelId:'lasius_niger_locomotion_h5_v1'});
              b.observation.record_trajectories=false;
              const sim=new Simulation(b,seed);
              const s=sim.runUntilComplete(b.experiment.duration_s,0.02),a=sim.ants[0],l=s.latent_states[0],o=s.observed_metrics.ants[0];
              cases.push({
                experiment,seed,model_hash:s.provenance.model_hash,
                x:a.x,y:a.y,heading:a.heading,completedAt:a.completedAt,distance:a.distanceTravelled,
                rng:a.rng.state,speedFactor:a.speedFactor,pauseRemaining:a.pauseRemaining,
                commitment:l.heading_commitment_current,commitmentInitial:l.heading_commitment_initial,
                reference:l.h5_heading_reference_rad,referenceCaptured:l.h5_heading_reference_captured,
                observedTime:o.time_to_arena_edge_s??null,observedDistance:o.total_distance_mm??null,
                observedStraightness:o.path_straightness??null
              });
            }
          }
          fs.writeFileSync('/tmp/h5-policy-audit/node-reference.json',JSON.stringify(cases,null,2));
          NODE
      - name: Real Chromium policy and H5 parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/h5-policy-audit/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/h5-policy-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/h5-policy-chrome --remote-debugging-port=9222 about:blank >/tmp/h5-policy-audit/chrome.log 2>&1 &
          for i in {1..100}; do
            curl -fsS http://127.0.0.1:9222/json/version >/tmp/h5-policy-audit/chrome-version.json 2>/dev/null && break
            sleep .2
          done
          curl -fsS http://127.0.0.1:9222/json/version >/tmp/h5-policy-audit/chrome-version.json
          cat >/tmp/h5-policy-audit/browser.mjs <<'NODE'
          import fs from 'node:fs';
          const refs=JSON.parse(fs.readFileSync('/tmp/h5-policy-audit/node-reference.json','utf8'));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{
            const m=JSON.parse(e.data);
            if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}
            if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);
            if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);
            if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);
          };
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'browser eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');
          await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<100;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabH5"))break;await new Promise(r=>setTimeout(r,50));}
          const title=await evalv('document.title');
          const body=await evalv('document.body.innerText');
          if(title!=='ANTLAB H5')throw new Error('unexpected title '+title);
          if(!body.includes('H5 estimator policy frozen'))throw new Error('browser does not show frozen H5 estimator policy');
          if(body.includes('H5 has no frozen estimator policy'))throw new Error('stale H5 policy browser copy remains');

          const policy=await evalv("(async()=>await (await fetch('./hypotheses/h5_parameter_estimation_v1.json')).json())()");
          if(policy.id!=='H5_parameter_estimation_v1')throw new Error('wrong H5 policy');
          if(policy.status!=='development_estimation_policy_frozen_before_estimator_implementation_or_parameter_search')throw new Error('wrong H5 policy status');
          if(policy.estimator_implementation_gate.high_resolution_search_authorized!==false)throw new Error('H5 high-resolution search unexpectedly authorized');

          const browser=await evalv(`(async()=>{
            const json=async p=>(await fetch(p)).json();
            const cases=${JSON.stringify(refs.map(r=>({experiment:r.experiment,seed:r.seed})))};
            const out=[];
            for(const c of cases){
              const experiment=await json('./experiments/'+c.experiment);
              experiment.model='lasius_niger_locomotion_h5_v1';
              const [model,apparatus,state,observation,scoring]=await Promise.all([
                json('./models/lasius_niger_locomotion_h5_v1.json'),
                json('./apparatus/'+experiment.apparatus+'.json'),
                json('./states/'+experiment.state+'.json'),
                json('./observations/'+experiment.observation+'.json'),
                json('./scoring/'+experiment.scoring+'.json')
              ]);
              observation.record_trajectories=false;
              const sim=new AntLabH5.Simulation({experiment,model,apparatus,state,observation,scoring},c.seed);
              const s=sim.runUntilComplete(experiment.duration_s,0.02),a=sim.ants[0],l=s.latent_states[0],o=s.observed_metrics.ants[0];
              out.push({
                experiment:c.experiment,seed:c.seed,model_hash:s.provenance.model_hash,
                x:a.x,y:a.y,heading:a.heading,completedAt:a.completedAt,distance:a.distanceTravelled,
                rng:a.rng.state,speedFactor:a.speedFactor,pauseRemaining:a.pauseRemaining,
                commitment:l.heading_commitment_current,commitmentInitial:l.heading_commitment_initial,
                reference:l.h5_heading_reference_rad,referenceCaptured:l.h5_heading_reference_captured,
                observedTime:o.time_to_arena_edge_s??null,observedDistance:o.total_distance_mm??null,
                observedStraightness:o.path_straightness??null
              });
            }
            return out;
          })()`);
          const near=(a,b,t=2e-10)=>{if(a==null||b==null){if(a!==b)throw new Error('null mismatch '+a+' '+b);return;}if(Math.abs(a-b)>t)throw new Error('numeric mismatch '+a+' '+b);};
          if(browser.length!==refs.length)throw new Error('case count mismatch');
          for(let i=0;i<refs.length;i++){
            const a=refs[i],b=browser[i];
            for(const k of ['experiment','seed','model_hash','rng','referenceCaptured'])if(a[k]!==b[k])throw new Error(k+' mismatch '+a[k]+' '+b[k]);
            for(const k of ['x','y','heading','completedAt','distance','speedFactor','pauseRemaining','commitment','commitmentInitial','reference','observedTime','observedDistance','observedStraightness'])near(a[k],b[k]);
          }
          const yreq=requests.filter(u=>/y[_-]?maze|ymaze/i.test(u));
          if(yreq.length)throw new Error('Y-maze request detected '+JSON.stringify(yreq));
          if(exceptions.length)throw new Error('browser exceptions '+JSON.stringify(exceptions));
          if(consoleErrors.length)throw new Error('console errors '+JSON.stringify(consoleErrors));
          const report={status:'passed',cases:browser.length,policy_status:policy.status,exceptions:0,console_errors:0,ymaze_requests:0};
          fs.writeFileSync('/tmp/h5-policy-audit/browser-result.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          ws.close();
          NODE
          node /tmp/h5-policy-audit/browser.mjs
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: h5-policy-chromium-audit
          path: /tmp/h5-policy-audit
          retention-days: 7
