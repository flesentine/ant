name: H4 deep estimator audit
on:
  push:
    branches: [h4-transient-locomotor-activation-v1]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply audit hardening patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/run-h4-estimation.js')
          s=p.read_text()
          changed=False
          def rep(old,new,count=1):
              global s,changed
              if old in s:
                  s=s.replace(old,new,count)
                  changed=True
              elif new not in s:
                  raise SystemExit('Expected patch anchor not found: '+old[:120])

          rep("const crypto = require('crypto');\n", "const crypto = require('crypto');\nconst childProcess = require('child_process');\n")

          constants=r'''const FROZEN_RUNTIME_BLOBS = Object.freeze({
            'src/integrity.js': 'f23c68a6955832b70eeb3bd3e6893d71a3759018',
            'src/sim-core.js': '24777aac3577d442893e4779d70aee4e27761fe8',
            'src/measurement.js': '8845726e02360655c605851662256bc729277b21',
            'src/h3.js': '9bb8fc966a5aa4d4173f9bda2020c6d9cd9368f1',
            'tools/load-bundle.js': '235067f10ed85eeeaebcfe6fef0963940d516b6b',
            'tools/run-h2-estimation.js': '0fb069b3772c30f5769b4d1be285be7f67f3efe3',
            'tools/run-h3-estimation.js': '9b27812fcb869489d4979e26e8085cb8d2bf6fc1',
            'models/lasius_niger_locomotion_h4_v1.json': '4f14e9f9b5eaab4cc89f28cbd033a8fd26a8f944',
            'experiments/open_arena_short_control.json': '2a75bcff9e88dc8617911886f8381315d5c05638',
            'experiments/open_arena_long_control.json': 'f38632b4fad43f0282b85e345416a1c6f1593725',
            'states/naive_outbound_v1.json': 'd3db29a83eed68bc28f771c147dd33966764d535',
            'apparatus/poissonnier2026_open_arena.json': '1f6461ffa392656a7cf807413ad2120636d99ee9',
            'observations/poissonnier2026_tracking_25fps.json': '8720b5ee34165d167a7ff7a5a363449ffabef2ad',
            'scoring/open_arena_first_border_v1.json': '7e6ee59c223a9da1763d6b54ef3a2e3938c8bee0'
          });
          const FROZEN_REFERENCE_COMPARATOR_BLOBS = Object.freeze({
            'reference/calibration_manifest.json': '29044577af38dced5cccb83c687117ee878fd66c',
            'reference/poissonnier2026_source_manifest.json': '545c108f0da20cbebbe8e95c62e43fc5443d9f18',
            'models/lasius_niger_locomotion_h2_v1.json': '3d12970e782b5fd1dc54727f4d8df044c11801db',
            'models/lasius_niger_locomotion_h3_v1.json': 'fe33c31facfcabb7ddeb9a7bedf71ac248ad8e84',
            'reports/h2_parameter_estimation_500x60_v1.json': '342f7a5af7c1ed71a8bdb7ff14becf38d24daa88',
            'reports/h3_parameter_estimation_500x60_v1.json': '1d5c1b88ca9b425e927d761bc3ff1e5bad5bd5f3'
          });

          '''
          if 'const FROZEN_RUNTIME_BLOBS' not in s:
              rep('function clone(v) {',constants+'function clone(v) {')

          funcs=r'''function assertBlobSet(root, blobs, label) {
            const verified = {};
            for (const [rel, expected] of Object.entries(blobs)) {
              const file = path.resolve(root, rel);
              const actual = gitBlobShaFile(file);
              if (actual !== expected) {
                throw new Error(`${label} blob mismatch for ${rel}: expected ${expected}, got ${actual}.`);
              }
              verified[rel] = actual;
            }
            return verified;
          }

          function assertFrozenRuntimeBlobs(root) {
            return assertBlobSet(root, FROZEN_RUNTIME_BLOBS, 'Frozen H4 runtime input');
          }

          function assertFrozenReferenceComparatorBlobs(root) {
            return assertBlobSet(root, FROZEN_REFERENCE_COMPARATOR_BLOBS, 'Frozen H4 reference/comparator input');
          }

          function currentRepoCommit(root) {
            try {
              return childProcess.execFileSync('git', ['rev-parse', 'HEAD'], {
                cwd: root,
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'ignore']
              }).trim();
            } catch (_) {
              return process.env.GITHUB_SHA || null;
            }
          }

          function assertSafeReportOutput(root, out) {
            const resolved = path.resolve(out);
            if (path.extname(resolved).toLowerCase() !== '.json') {
              throw new Error('H4 estimation output must be a JSON report.');
            }
            if (fs.existsSync(resolved) && fs.lstatSync(resolved).isSymbolicLink()) {
              throw new Error('H4 estimation refuses to write through a symbolic-link output path.');
            }
            const rel = path.relative(root, resolved);
            const insideRepo = rel === '' || (!rel.startsWith('..' + path.sep) && rel !== '..' && !path.isAbsolute(rel));
            if (insideRepo) {
              const reportsRoot = path.resolve(root, 'reports');
              const reportRel = path.relative(reportsRoot, resolved);
              const insideReports = reportRel !== '' && !reportRel.startsWith('..' + path.sep) && reportRel !== '..' && !path.isAbsolute(reportRel);
              if (!insideReports) {
                throw new Error('H4 estimation may write inside the repository only under reports/.');
              }
            }
            return resolved;
          }

          '''
          if 'function assertFrozenRuntimeBlobs' not in s:
              rep('function halton(index, base) {',funcs+'function halton(index, base) {')

          rep("function loadReferenceInputs(root, policy) {\n  const targetPath", "function loadReferenceInputs(root, policy) {\n  const frozenRuntimeBlobs = assertFrozenRuntimeBlobs(root);\n  const frozenReferenceComparatorBlobs = assertFrozenReferenceComparatorBlobs(root);\n  const targetPath")
          rep("    targetPath,\n    colonies: v.colonies", "    targetPath,\n    frozenRuntimeBlobs,\n    frozenReferenceComparatorBlobs,\n    colonies: v.colonies")

          rep("function qualify({ root, policy, trials = 3 }) {\n  assertPolicySemantics(policy);", "function qualify({ root, policy, trials = 3 }) {\n  assertPolicySemantics(policy);\n  const runtimeBlobs = assertFrozenRuntimeBlobs(root);")
          rep("  checks.training_scale_api_is_audited_h3 =\n    h3est.score === score &&\n    h3est.scoreScales === scoreScales &&\n    h3est.edgeProbs === edgeProbs;", "  checks.scorer_identity_is_audited_h3 =\n    h3est.score === score &&\n    h3est.scoreScales === scoreScales &&\n    h3est.edgeProbs === edgeProbs;\n\n  const syntheticTrainForScale = [\n    { time_to_exit_s: 1, middle_zone_fraction: 0.1, beeline_mm: 10 },\n    { time_to_exit_s: 3, middle_zone_fraction: 0.3, beeline_mm: 30 },\n    { time_to_exit_s: 5, middle_zone_fraction: 0.5, beeline_mm: 50 }\n  ];\n  const syntheticHeldoutForScale = [\n    { time_to_exit_s: 10, middle_zone_fraction: 0.2, beeline_mm: 100 },\n    { time_to_exit_s: 30, middle_zone_fraction: 0.8, beeline_mm: 300 },\n    { time_to_exit_s: 50, middle_zone_fraction: 0.9, beeline_mm: 500 }\n  ];\n  const trainingScales = scoreScales(syntheticTrainForScale);\n  const heldoutScales = scoreScales(syntheticHeldoutForScale);\n  checks.training_fold_scaling_semantics =\n    !near(trainingScales.time, heldoutScales.time) &&\n    !near(trainingScales.beeline, heldoutScales.beeline);")
          rep("    scientific_evidence: false,\n    trials_per_condition: trials,", "    scientific_evidence: false,\n    frozen_runtime_blobs_verified: runtimeBlobs,\n    trials_per_condition: trials,")

          rep("      H4_null: {\n        fit: ns.best,\n        heldout_loss: nEval.loss\n      },", "      H4_null: {\n        fit: ns.best,\n        training_top_candidates: ns.top,\n        heldout_loss: nEval.loss,\n        heldout_components: nEval.components\n      },")
          rep("      H4_context: {\n        fit: cs.best,\n        heldout_loss: cEval.loss,\n        null_anchor_train_loss: cs.anchor.loss\n      },", "      H4_context: {\n        fit: cs.best,\n        training_top_candidates: cs.top,\n        heldout_loss: cEval.loss,\n        heldout_components: cEval.components,\n        null_anchor_train_loss: cs.anchor.loss\n      },")
          rep("      H2_v1_frozen_candidate: {\n        candidate: h2c,\n        reevaluated_heldout_loss_matched_crn: h2Eval.loss\n      },", "      H2_v1_frozen_candidate: {\n        candidate: h2c,\n        reevaluated_heldout_loss_matched_crn: h2Eval.loss,\n        heldout_components: h2Eval.components\n      },")
          rep("      H3_v1_frozen_candidate: {\n        candidate: h3c,\n        reevaluated_heldout_loss_matched_crn: h3Eval.loss\n      },", "      H3_v1_frozen_candidate: {\n        candidate: h3c,\n        reevaluated_heldout_loss_matched_crn: h3Eval.loss,\n        heldout_components: h3Eval.components\n      },")

          ident=r'''  const boundaryHitCounts = {};
            const nullAnchorSelectedFolds = [];
            for (const f of folds) {
              const fit = f.H4_context.fit;
              if (fit.source === 'exact_null_anchor') nullAnchorSelectedFolds.push(f.held_out_colony);
              for (const key of fit.near_search_bounds || []) {
                boundaryHitCounts[key] = (boundaryHitCounts[key] || 0) + 1;
              }
            }

            '''
          if 'const boundaryHitCounts = {};' not in s:
              rep('  return {\n    folds,\n    internal_cv: {',ident+"  return {\n    folds,\n    identifiability: {\n      boundary_hit_counts_across_selected_H4_context_folds: boundaryHitCounts,\n      null_anchor_selected_folds: nullAnchorSelectedFolds,\n      top_training_candidates_retained_per_model_per_fold: 12,\n      ridge_assessment: 'Not automated because the frozen policy defines no numeric ridge tolerance; top training candidates and effective quantities are retained for post-selection identifiability review.'\n    },\n    internal_cv: {")

          rep("function writeReport(report, out) {\n  fs.writeFileSync(out, JSON.stringify(report, null, 2) + '\\n');\n  console.log(JSON.stringify(report, null, 2));\n  console.log(`Saved ${out}`);\n}", "function writeReport(report, out) {\n  const root = path.resolve(__dirname, '..');\n  const safeOut = assertSafeReportOutput(root, out);\n  fs.writeFileSync(safeOut, JSON.stringify(report, null, 2) + '\\n');\n  console.log(JSON.stringify(report, null, 2));\n  console.log(`Saved ${safeOut}`);\n}")
          rep("arg('out', 'h4-estimator-qualification.json')", "arg('out', path.join('reports', 'h4_estimator_qualification_v1.json'))")
          rep("arg('out', evidence ? 'h4-estimation-500x60-v1.json' : 'h4-estimation-smoke.json')", "arg('out', evidence ? path.join('reports', 'h4_parameter_estimation_500x60_v1.json') : path.join('reports', 'h4_estimation_smoke_v1.json'))")

          rep("    reference_target_git_blob_sha: gitBlobShaFile(inputs.targetPath),\n    search: {", "    reference_target_git_blob_sha: gitBlobShaFile(inputs.targetPath),\n    execution: {\n      repo_commit: currentRepoCommit(root),\n      node_version: process.version,\n      frozen_runtime_blobs: inputs.frozenRuntimeBlobs,\n      frozen_reference_comparator_blobs: inputs.frozenReferenceComparatorBlobs\n    },\n    search: {")

          rep("  POLICY_GIT_BLOB_SHA,\n  ENTRY_STREAM,\n  HALTON,", "  POLICY_GIT_BLOB_SHA,\n  ENTRY_STREAM,\n  HALTON,\n  FROZEN_RUNTIME_BLOBS,\n  FROZEN_REFERENCE_COMPARATOR_BLOBS,")
          rep("  assertExactPolicyBlob,\n  assertPolicySemantics,", "  assertExactPolicyBlob,\n  assertFrozenRuntimeBlobs,\n  assertFrozenReferenceComparatorBlobs,\n  assertSafeReportOutput,\n  currentRepoCommit,\n  assertPolicySemantics,")

          if changed:
              p.write_text(s)

          tp=Path('tests/h4-estimation.test.js')
          t=tp.read_text()
          marker="h4.assertPolicySemantics(policy);\n"
          addition="""h4.assertPolicySemantics(policy);\nconst runtimePins=h4.assertFrozenRuntimeBlobs(root),referencePins=h4.assertFrozenReferenceComparatorBlobs(root);\nassert.strictEqual(runtimePins['models/lasius_niger_locomotion_h4_v1.json'],'4f14e9f9b5eaab4cc89f28cbd033a8fd26a8f944');\nassert.strictEqual(referencePins['reports/h3_parameter_estimation_500x60_v1.json'],'1d5c1b88ca9b425e927d761bc3ff1e5bad5bd5f3');\nassert.throws(()=>h4.assertSafeReportOutput(root,path.join(root,'models','lasius_niger_locomotion_v1.json')),/reports\\//);\nassert.throws(()=>h4.assertSafeReportOutput(root,path.join(root,'hypotheses','h4_parameter_estimation_v1.json')),/reports\\//);\nassert.strictEqual(h4.assertSafeReportOutput(root,'/tmp/h4-safe-report.json'),'/tmp/h4-safe-report.json');\n"""
          if 'const runtimePins=' not in t:
              if marker not in t: raise SystemExit('Test patch anchor missing')
              t=t.replace(marker,addition,1)
              tp.write_text(t)
          PY
          node --check tools/run-h4-estimation.js
          node --check tests/h4-estimation.test.js
      - name: Run full H0-H4 suite and estimator audit tests
        run: ./tests/run-tests.sh
      - name: Verify unsafe report destinations are rejected
        shell: bash
        run: |
          before=$(git hash-object models/lasius_niger_locomotion_v1.json)
          if node tools/run-h4-estimation.js --mode qualification --trials 1 --out models/lasius_niger_locomotion_v1.json >/tmp/unsafe.log 2>&1; then
            echo 'Unsafe canonical-model output path was accepted' >&2
            exit 1
          fi
          after=$(git hash-object models/lasius_niger_locomotion_v1.json)
          test "$before" = "$after"
          grep -q 'only under reports/' /tmp/unsafe.log
      - name: Build Node parity reference
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h4=require('./tools/run-h4-estimation.js');
          const {Simulation,streamSeed,FIXED_DT}=require('./src/integrity.js');
          const core=require('./src/sim-core.js');
          const {loadBundle,readJson}=require('./tools/load-bundle.js');
          const root=process.cwd(), policy=h4.assertExactPolicyBlob(root).policy;
          h4.assertFrozenRuntimeBlobs(root);
          const base=readJson('./models/lasius_niger_locomotion_h4_v1.json');
          const n500=h4.nullCandidate(499,policy);
          const cases=[
            {name:'context_halton_1',candidate:h4.contextCandidate(0,policy),seed:424242},
            {name:'context_halton_499',candidate:h4.contextCandidate(498,policy),seed:424243},
            {name:'null_halton_500',candidate:n500,seed:424244},
            {name:'exact_null_anchor_500',candidate:h4.nullAnchor(n500),seed:424244}
          ];
          function edge(ex,w,h){if(!ex)return'timeout';const d={left:Math.abs(ex.x),right:Math.abs(ex.x-w),top:Math.abs(ex.y),bottom:Math.abs(ex.y-h)};return Object.keys(d).sort((a,b)=>d[a]-d[b])[0];}
          function one(c,seed,pl,exp){const model=h4.configuredModel(base,c),b=loadBundle(exp,{modelId:model.id});b.model=JSON.parse(JSON.stringify(model));b.observation.record_trajectories=false;const sim=new Simulation(b,seed),rr=new core.RNG(streamSeed(seed,h4.ENTRY_STREAM));if(rr.next()>c.q)sim.ants[0].heading=rr.next()*2*Math.PI-Math.PI;const sx=sim.ants[0].x,sy=sim.ants[0].y;const summary=sim.runUntilComplete(b.experiment.duration_s,FIXED_DT),r=summary.observed_metrics.ants[0],a=sim.ants[0],ex=r.exit_coordinate_mm;return{path_length:pl,time_to_exit_s:r.time_to_arena_edge_s??b.experiment.duration_s,middle_zone_fraction:r.central_zone_fraction??0,beeline_mm:ex?Math.hypot(ex.x-sx,ex.y-sy):0,exit_edge:edge(ex,sim.apparatus.world.width,sim.apparatus.world.height),A0:a.locomotorActivationInitial,A:a.locomotorActivation,completedAt:a.completedAt,distanceTravelled:a.distanceTravelled,heading:a.heading,speedFactor:a.speedFactor,biologyRngState:a.rng.state,modelHash:sim.layerHashes.model_hash,x:a.x,y:a.y,startX:sx,startY:sy};}
          const out={policy_blob:h4.POLICY_GIT_BLOB_SHA,repo_commit:h4.currentRepoCommit(root),cases:cases.map(x=>({name:x.name,candidate:x.candidate,seed:x.seed,runs:[one(x.candidate,x.seed,'s','open_arena_short_control.json'),one(x.candidate,x.seed,'l','open_arena_long_control.json')]}))};
          fs.writeFileSync('/tmp/h4-node-parity.json',JSON.stringify(out,null,2));
          NODE
      - name: Start local server and Chromium
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/h4-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/h4-chrome.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break; sleep .2; done
          curl -fsS http://127.0.0.1:9222/json/version
      - name: Run targeted Node to Chromium estimator parity
        shell: bash
        run: |
          cat > /tmp/h4-parity.mjs <<'NODE'
          import fs from 'node:fs';
          const expected=JSON.parse(fs.readFileSync('/tmp/h4-node-parity.json','utf8'));
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();const target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});let id=0;const pending=new Map(),exceptions=[],consoleErrors=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'browser eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});for(let i=0;i<60;i++){if(await evalv("document.readyState==='complete' && !!globalThis.AntLabIntegrity && !!globalThis.AntLabCore"))break;await sleep(100);}
          const browser=await evalv(`(async()=>{const cases=${JSON.stringify(expected.cases.map(c=>({name:c.name,candidate:c.candidate,seed:c.seed})))};const clone=x=>JSON.parse(JSON.stringify(x));async function j(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' '+r.status);return r.json();}const base=await j('./models/lasius_niger_locomotion_h4_v1.json');async function bundle(exp,model){const e=await j('./experiments/'+exp);e.model=model.id;const [apparatus,state,observation,scoring]=await Promise.all([j('./apparatus/'+e.apparatus+'.json'),j('./states/'+e.state+'.json'),j('./observations/'+e.observation+'.json'),j('./scoring/'+e.scoring+'.json')]);return{experiment:e,model:clone(model),apparatus,state,observation,scoring};}function configured(c){const m=clone(base);m.movement.base_speed_mm_s=c.base_speed_mm_s;m.movement.angular_sigma_rad_sqrt_s=c.angular_sigma_rad_sqrt_s;m.locomotor_activation.initialization.history_distance_scale_mm=c.lambda_activation_mm;m.locomotor_activation.decay.activation_tau_s=c.tau_activation_s;m.locomotor_activation.effect.max_speed_gain_fraction=c.rho_speed;return m;}function edge(ex,w,h){if(!ex)return'timeout';const d={left:Math.abs(ex.x),right:Math.abs(ex.x-w),top:Math.abs(ex.y),bottom:Math.abs(ex.y-h)};return Object.keys(d).sort((a,b)=>d[a]-d[b])[0];}async function one(c,seed,pl,exp){const model=configured(c),b=await bundle(exp,model);b.observation.record_trajectories=false;const sim=new AntLabIntegrity.Simulation(b,seed),rr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,'h2_estimation_entry_transition_v1'));if(rr.next()>c.q)sim.ants[0].heading=rr.next()*2*Math.PI-Math.PI;const sx=sim.ants[0].x,sy=sim.ants[0].y;const summary=sim.runUntilComplete(b.experiment.duration_s,AntLabIntegrity.FIXED_DT),r=summary.observed_metrics.ants[0],a=sim.ants[0],ex=r.exit_coordinate_mm;return{path_length:pl,time_to_exit_s:r.time_to_arena_edge_s??b.experiment.duration_s,middle_zone_fraction:r.central_zone_fraction??0,beeline_mm:ex?Math.hypot(ex.x-sx,ex.y-sy):0,exit_edge:edge(ex,sim.apparatus.world.width,sim.apparatus.world.height),A0:a.locomotorActivationInitial,A:a.locomotorActivation,completedAt:a.completedAt,distanceTravelled:a.distanceTravelled,heading:a.heading,speedFactor:a.speedFactor,biologyRngState:a.rng.state,modelHash:sim.layerHashes.model_hash,x:a.x,y:a.y,startX:sx,startY:sy};}const out=[];for(const c of cases)out.push({name:c.name,candidate:c.candidate,seed:c.seed,runs:[await one(c.candidate,c.seed,'s','open_arena_short_control.json'),await one(c.candidate,c.seed,'l','open_arena_long_control.json')]});return out;})()`);
          function cmp(a,b,path='root'){if(typeof a==='number'||typeof b==='number'){if(a==null||b==null){if(a!==b)throw new Error(path+': '+a+' != '+b);return;}const scale=Math.max(1,Math.abs(a),Math.abs(b));if(Math.abs(a-b)>2e-11*scale)throw new Error(path+`: ${a} != ${b}`);return;}if(Array.isArray(a)){if(!Array.isArray(b)||a.length!==b.length)throw new Error(path+' array mismatch');a.forEach((v,i)=>cmp(v,b[i],path+'['+i+']'));return;}if(a&&typeof a==='object'){for(const k of Object.keys(a))cmp(a[k],b?.[k],path+'.'+k);return;}if(a!==b)throw new Error(path+`: ${a} != ${b}`);}
          cmp(expected.cases,browser,'cases');
          const n=browser.find(x=>x.name==='null_halton_500'),a=browser.find(x=>x.name==='exact_null_anchor_500');cmp(n.runs,a.runs,'browser.null_anchor_exact_equivalence');
          if(exceptions.length)throw new Error('Browser exceptions '+JSON.stringify(exceptions));if(consoleErrors.length)throw new Error('Browser console errors '+JSON.stringify(consoleErrors));
