name: H5 pre-freeze code and Chromium review
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static frozen-boundary audit
        run: |
          set -euo pipefail
          python3 -m json.tool reference/poissonnier2026_open_arena_measurement_policy_v1.json >/dev/null
          python3 -m json.tool reference/poissonnier2026_open_arena_measurement_geometry_v1.json >/dev/null
          python3 -m json.tool hypotheses/h5_origin_referenced_search_v1.draft.json >/dev/null
          python3 -m json.tool reports/poissonnier2026_open_arena_measurement_reconstruction_v1.json >/dev/null
          node <<'NODE'
          const assert=require('assert');
          const fs=require('fs');
          const path=require('path');
          const geom=require('./tools/poissonnier2026-measurement-geometry.js');
          const {Simulation,FIXED_DT}=require('./src/integrity.js');
          const {loadBundle}=require('./tools/load-bundle.js');
          const root=process.cwd();
          const {policy,geometry}=geom.loadFrozenMeasurementGeometry(root);
          const draft=JSON.parse(fs.readFileSync('hypotheses/h5_origin_referenced_search_v1.draft.json','utf8'));
          const report=JSON.parse(fs.readFileSync('reports/poissonnier2026_open_arena_measurement_reconstruction_v1.json','utf8'));
          assert.strictEqual(policy.firewall.H5_mechanism_still_unfrozen,true);
          assert.strictEqual(policy.firewall.H5_parameter_search_allowed,false);
          assert.strictEqual(policy.firewall.ymaze_access,false);
          assert.strictEqual(draft.firewall.mechanism_not_frozen,true);
          assert.strictEqual(draft.firewall.parameter_search_allowed,false);
          assert.strictEqual(draft.firewall.ymaze_access,false);
          assert.strictEqual(report.scientific_state.H5_runtime_implemented,false);
          assert.strictEqual(report.scientific_state.H5_parameter_search_performed,false);
          const target=JSON.parse(fs.readFileSync('reference/poissonnier2026_h2_estimation_targets.json','utf8'));
          assert(geom.assertTargetAlignment(geometry,target));
          assert.strictEqual(geom.geometryPool(geometry.rows,null).length,51); // permitted pooled descriptive path only
          const expected={0:42,7:41,16:44,20:38,21:45,27:45};
          for(const held of geom.EXPECTED_COLONIES){
            const pool=geom.geometryPool(geometry.rows,held);
            assert.strictEqual(pool.length,expected[held]);
            assert(pool.every(r=>r.colony!==held));
            for(let i=0;i<1000;i++){
              const seed=990000+i;
              const a=geom.sampleGeometry(pool,seed),b=geom.sampleGeometry(pool,seed);
              assert.strictEqual(a.row.ant_id,b.row.ant_id);
              assert(a.index>=0&&a.index<pool.length);
              assert(a.u>=0&&a.u<1);
            }
          }
          const short0=loadBundle('open_arena_short_control.json',{modelId:'lasius_niger_locomotion_h3_v1'});
          const long0=loadBundle('open_arena_long_control.json',{modelId:'lasius_niger_locomotion_h3_v1'});
          for(const row of geometry.rows){
            const s=geom.applyGeometry(short0,row),l=geom.applyGeometry(long0,row);
            assert.deepStrictEqual(s.apparatus.world,l.apparatus.world);
            assert.deepStrictEqual(s.apparatus.entry_points.center,l.apparatus.entry_points.center);
            assert.strictEqual(s.apparatus.world.width,row.arena_width_mm);
            assert.strictEqual(s.apparatus.world.height,row.arena_height_mm);
            assert.strictEqual(s.experiment.protocol.entry_state.position_jitter_mm,0);
            assert.strictEqual(s.observation.metric_definitions.central_zone_fraction.center_y_mm,row.entry_reference_y_mm);
            const sim=new Simulation(s,424242);
            assert(Math.abs(sim.ants[0].x-row.first_track_x_mm)<1e-12);
            assert(Math.abs(sim.ants[0].y-row.first_track_y_mm)<1e-12);
            sim.runFor(.08,FIXED_DT);
            const sum=sim.summary();
            assert(sum.observed_metrics && sum.observed_metrics.ants.length===1);
          }
          // Directly prove sampled world bounds drive first-border termination.
          const row=geometry.rows[0];
          const b=geom.applyGeometry(short0,row);
          b.model.reorientation_gate.effect.max_hazard_reduction_fraction=0;
          b.model.movement.angular_sigma_rad_sqrt_s=0;
          b.model.movement.speed_sd_mm_s=0;
          b.model.movement.speed_noise_sigma_sqrt_s=0;
          b.model.movement.pause_rate_s=0;
          b.model.movement.base_speed_mm_s=80;
          b.apparatus.entry_points.center.heading_rad=0;
          b.apparatus.entry_points.default.heading_rad=0;
          b.experiment.protocol.entry_state.heading_jitter_rad=0;
          const edgeSim=new Simulation(b,12345);
          const edgeSummary=edgeSim.runUntilComplete(10,FIXED_DT);
          assert(edgeSim.ants[0].finished,'deterministic eastbound ant did not hit border');
          assert.strictEqual(edgeSim.ants[0].outcome,'arena_exit');
          assert(Math.abs(edgeSim.ants[0].exitX-row.arena_width_mm)<1e-7,`exitX=${edgeSim.ants[0].exitX} width=${row.arena_width_mm}`);
          assert(edgeSim.ants[0].exitY>=0&&edgeSim.ants[0].exitY<=row.arena_height_mm);
          assert(edgeSummary.observed_metrics.ants[0].exit_coordinate_mm.x<=row.arena_width_mm+1e-7);
          console.log(JSON.stringify({status:'passed',rows:geometry.rows.length,fold_pool_sizes:expected,boundary:{width:row.arena_width_mm,exitX:edgeSim.ants[0].exitX,exitY:edgeSim.ants[0].exitY}},null,2));
          NODE
      - name: Y-maze-free regression set
        run: |
          set -euo pipefail
          tests=(
            tests/boundary-timing.test.js
            tests/determinism.test.js
            tests/experiment-definition.test.js
            tests/h2-estimation.test.js
            tests/h2-persistence.test.js
            tests/h3-estimation.test.js
            tests/h3-observation-convergence.test.js
            tests/h3-reorientation.test.js
            tests/h4-estimation.test.js
            tests/h4-locomotor-activation.test.js
            tests/hazard.test.js
            tests/integrity-firewall.test.js
            tests/measurement-geometry-policy.test.js
            tests/measurement.test.js
            tests/observation-convergence.test.js
            tests/open-arena-protocol.test.js
            tests/rng-streams.test.js
            tests/state-integrity.test.js
            tests/timestep-convergence.test.js
          )
          for f in "${tests[@]}"; do node "$f"; done
      - name: Start Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then exit 0; fi
            sleep .2
          done
          cat /tmp/chrome.log || true
          exit 1
      - name: Chromium UI and reconstructed-geometry walkthrough
        run: |
          set -euo pipefail
          cat >/tmp/h5-review-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'evaluate failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');
          await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&document.getElementById('runStatus')?.textContent==='PAUSED'"))break;await sleep(100);}
          const initial=await evalv(`(()=>{const c=document.getElementById('labCanvas'),ctx=c.getContext('2d'),px=ctx.getImageData(0,0,c.width,c.height).data;let nonBlack=0;for(let i=0;i<px.length;i+=400){if(px[i]||px[i+1]||px[i+2])nonBlack++;}return{status:runStatus.textContent,model:modelId.textContent,hash:modelHash.textContent,apparatus:apparatusId.textContent,observation:observationId.textContent,scoring:scoringId.textContent,experiment:experimentSelect.value,canvas_nonblack_samples:nonBlack,simTime:simTime.textContent};})()`);
          if(initial.status!=='PAUSED'||initial.model!=='lasius_niger_locomotion_v1'||initial.hash!=='75c3a4b9'||initial.experiment!=='open_arena_short_control.json'||initial.canvas_nonblack_samples<=0)throw new Error('canonical initial UI mismatch '+JSON.stringify(initial));
          await evalv("stepBtn.click(); true");await sleep(100);
          const stepped=await evalv(`(()=>({status:runStatus.textContent,simTime:simTime.textContent,model:modelId.textContent,canvasWidth:labCanvas.width,canvasHeight:labCanvas.height}))()`);
          if(!/^1\.0 s$/.test(stepped.simTime)||stepped.model!=='lasius_niger_locomotion_v1')throw new Error('short step mismatch '+JSON.stringify(stepped));
          await evalv(`(()=>{showTrails.checked=false;showIds.checked=true;showContacts.checked=false;experimentSelect.value='open_arena_long_control.json';experimentSelect.dispatchEvent(new Event('change'));return true;})()`);
          for(let i=0;i<100;i++){if(await evalv("runStatus.textContent==='PAUSED'&&experimentSelect.value==='open_arena_long_control.json'"))break;await sleep(50);}
          const long=await evalv(`(()=>({status:runStatus.textContent,model:modelId.textContent,apparatus:apparatusId.textContent,simTime:simTime.textContent}))()`);
          if(long.status!=='PAUSED'||long.model!=='lasius_niger_locomotion_v1')throw new Error('long load mismatch '+JSON.stringify(long));
          await evalv("stepBtn.click(); true");await sleep(100);
          await evalv(`(()=>{experimentSelect.value='straight_bridge.json';experimentSelect.dispatchEvent(new Event('change'));return true;})()`);
          for(let i=0;i<100;i++){if(await evalv("runStatus.textContent==='PAUSED'&&experimentSelect.value==='straight_bridge.json'"))break;await sleep(50);}
          const bridge=await evalv(`(()=>({status:runStatus.textContent,model:modelId.textContent,apparatus:apparatusId.textContent,scoring:scoringId.textContent}))()`);
          if(bridge.status!=='PAUSED'||bridge.model!=='lasius_niger_locomotion_v1')throw new Error('bridge load mismatch '+JSON.stringify(bridge));
          await evalv("stepBtn.click(); true");await sleep(100);
          // Direct browser-core reconstructed geometry exercise without loading any disallowed assay.
          const reconstructed=await evalv(`(async()=>{const clone=x=>JSON.parse(JSON.stringify(x));const j=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json();};const geometry=await j('./reference/poissonnier2026_open_arena_measurement_geometry_v1.json');const policy=await j('./reference/poissonnier2026_open_arena_measurement_policy_v1.json');const app0=await j('./apparatus/poissonnier2026_open_arena.json');const exp0=await j('./experiments/open_arena_short_control.json');const model=await j('./models/lasius_niger_locomotion_h3_v1.json');const state=await j('./states/naive_outbound_v1.json');const obs0=await j('./observations/poissonnier2026_tracking_25fps.json');const scoring=await j('./scoring/open_arena_first_border_v1.json');model.reorientation_gate.effect.max_hazard_reduction_fraction=0;const held=0,pool=geometry.rows.filter(r=>r.colony!==held).sort((a,b)=>a.ant_id-b.ant_id);const rr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(990000,policy.geometry_sampler.rng_stream_name)),u=rr.next(),row=pool[Math.min(pool.length-1,Math.floor(u*pool.length))];const exp=clone(exp0),app=clone(app0),obs=clone(obs0);exp.model=model.id;app.world.width=row.arena_width_mm;app.world.height=row.arena_height_mm;const rect=app.geometry.primitives.find(p=>p.type==='rect');rect.width=row.arena_width_mm;rect.height=row.arena_height_mm;app.entry_points.default={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};app.entry_points.center={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};exp.protocol.entry_state.position_jitter_mm=0;obs.metric_definitions.central_zone_fraction.center_y_mm=row.entry_reference_y_mm;obs.metric_definitions.central_zone_fraction.half_width_mm=10;const sim=new AntLabIntegrity.Simulation({experiment:exp,model,apparatus:app,state,observation:obs,scoring},990000);const start={x:sim.ants[0].x,y:sim.ants[0].y};sim.runFor(.4,AntLabIntegrity.FIXED_DT);return{heldout:held,pool_n:pool.length,ant_id:row.ant_id,width:sim.apparatus.world.width,height:sim.apparatus.world.height,start,expected_start:{x:row.first_track_x_mm,y:row.first_track_y_mm},frame_count:sim.summary().observed_metrics.frame_count};})()`);
          if(reconstructed.pool_n!==42||Math.abs(reconstructed.start.x-reconstructed.expected_start.x)>1e-12||Math.abs(reconstructed.start.y-reconstructed.expected_start.y)>1e-12)throw new Error('reconstructed geometry mismatch '+JSON.stringify(reconstructed));
          const forbidden=requests.filter(u=>/neutral_y_maze|\/y_maze|\/y-maze/i.test(u));
          if(exceptions.length||consoleErrors.length||forbidden.length)throw new Error(`browser errors exceptions=${exceptions.length} console=${consoleErrors.length} forbidden_requests=${forbidden.length}`);
          const shot=await send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});fs.writeFileSync('/tmp/h5-pre-freeze.png',Buffer.from(shot.data,'base64'));
          const report={status:'passed',initial,stepped,long,bridge,reconstructed,browser:{exceptions:0,console_errors:0,forbidden_requests:0},request_count:requests.length};
          fs.writeFileSync('/tmp/h5-pre-freeze-browser.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/h5-review-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: h5-pre-freeze-code-browser-review
          path: |
            /tmp/h5-pre-freeze-browser.json
            /tmp/h5-pre-freeze.png
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
