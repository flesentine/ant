name: P2 v0.3.3l response-estimation policy audit
on:
  push:
    branches: [v0.3.3l-p2-response-estimation-policy]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact P2 policy chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p2_response_estimation_v1.json)" = "eaa74df19f3fdc1a59dec5f0b3b2efefba3f89ce"
          test "$(git hash-object hypotheses/p2_painted_trail_mechanism_v1.json)" = "70f51e5cab5db0024947ed71cf760590089f8aea"
          test "$(git hash-object hypotheses/p2_reachability_execution_v1.json)" = "8431ada87724953128104077f4ce1c11b569b1cf"
          test "$(git hash-object hypotheses/p2_implementation_authorization_v1.json)" = "462997ea7399d98efca5a6b19a0e38160fbddbaf"
          test "$(git hash-object hypotheses/p2_reachability_result_freeze_v1.json)" = "8dddaf083d4af046051fc1b7412b9f22cda8618a"
          test "$(git hash-object reports/p2_reference_free_reachability_v1.json)" = "78a5e0ac4a3dd536a0e2d06ece2e9e37cdb2aefa"
          test "$(git hash-object src/p2.js)" = "f91a2f7ede1b8119acc1fd57ac94a9718d074e15"
          test "$(git hash-object models/lasius_niger_painted_trail_p2_v1.json)" = "7d3eecc44cb2eaf727249083a6fcfa21986fd475"
          test "$(git hash-object src/p1.js)" = "f8d8e07c92a2fe4ebdbfd640827fe4b5a489e8ca"
          test "$(git hash-object models/lasius_niger_locomotion_v1.json)" = "2fde196d6c8a9353c1c8c206d4fcef223e92ad1d"
          test "$(git hash-object reference/poissonnier2026_pheromone_response_targets.json)" = "81910c5bd3ec7b1f7728c2c9f100b0e8a6db29ed"
          test ! -e tools/run-p2-estimation.js
          test ! -e hypotheses/p2_highres_authorization_v1.json
      - name: Run full H0-H5 plus P1/P2 suite
        run: ./tests/run-tests.sh
      - name: Pure policy math and firewall sanity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p2-v033l-audit
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('hypotheses/p2_response_estimation_v1.json','utf8'));
          function h(i,b){let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b);}return r;}
          function sigma(u){return Math.exp(Math.log(2)+u*(Math.log(32)-Math.log(2)));}
          const first={sigma:sigma(h(1,2)),kappa:16*h(1,3),p_lapse:h(1,5)};
          const second={sigma:sigma(h(2,2)),kappa:16*h(2,3),p_lapse:h(2,5)};
          if(Math.abs(first.sigma-8)>1e-12||Math.abs(first.kappa-16/3)>1e-12||Math.abs(first.p_lapse-.2)>1e-12)throw new Error('Halton candidate 1 drift');
          if(Math.abs(second.sigma-4)>1e-12||Math.abs(second.kappa-32/3)>1e-12||Math.abs(second.p_lapse-.4)>1e-12)throw new Error('Halton candidate 2 drift');
          if(p.search_protocol.candidate_budget_per_fold_total!==1000||p.search_protocol.nested_no_lapse_benchmark_panel.candidate_budget_per_fold_total!==1000)throw new Error('candidate budget drift');
          if(p.cross_validation_and_survival.canonical_null_survival_guard.minimum_heldout_fold_wins!==5||p.cross_validation_and_survival.structural_increment_survival_guard.minimum_heldout_fold_wins_vs_selected_no_lapse_benchmark!==5)throw new Error('dual survival drift');
          if(p.search_protocol.root_fit_seed!==4210000||p.search_protocol.root_evaluation_seed!==4810000||p.final_all_data_fit.fit_seed!==5210000||p.final_all_data_fit.final_check_seed!==5610000)throw new Error('seed drift');
          if(p.estimator_implementation_gate.estimator_status!=='not_implemented_at_policy_freeze'||p.estimator_implementation_gate.response_target_semantic_access_authorized!==false||p.estimator_implementation_gate.high_resolution_response_search_authorized!==false)throw new Error('estimator gate drift');
          if(Object.values(p.global_firewalls).some(v=>v!==false))throw new Error('global firewall drift');
          const out={status:'passed',first,second,p2_candidates:1000,no_lapse_candidates:1000,dual_survival:true,fit_seed:p.search_protocol.root_fit_seed,eval_seed:p.search_protocol.root_evaluation_seed,estimator_exists:false,target_semantics_authorized:false,ymaze:false};
          fs.writeFileSync('/tmp/p2-v033l-audit/policy.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          NODE
      - name: Real Chromium policy/firewall check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/p2-v033l-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/p2-v033l-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p2-v033l-chrome --remote-debugging-port=9222 about:blank >/tmp/p2-v033l-chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep .2; done
          cat >/tmp/p2-v033l-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabIntegrity"))break;await new Promise(r=>setTimeout(r,50));}
          const state=await evalv("(async()=>{const p=await(await fetch('./hypotheses/p2_response_estimation_v1.json')).json();return{id:p.id,status:p.status,params:p.response_parameter_surface.estimated_parameter_names_exact,candidates:p.search_protocol.candidate_budget_per_fold_total,noLapse:p.search_protocol.nested_no_lapse_benchmark_panel.candidate_budget_per_fold_total,nullWins:p.cross_validation_and_survival.canonical_null_survival_guard.minimum_heldout_fold_wins,structuralWins:p.cross_validation_and_survival.structural_increment_survival_guard.minimum_heldout_fold_wins_vs_selected_no_lapse_benchmark,fitSeed:p.search_protocol.root_fit_seed,evalSeed:p.search_protocol.root_evaluation_seed,target:p.estimator_implementation_gate.response_target_semantic_access_authorized,highres:p.estimator_implementation_gate.high_resolution_response_search_authorized,ymaze:p.global_firewalls.Y_maze_access};})()");
          if(state.id!=='P2_response_estimation_v1'||state.status!=='development_response_estimation_policy_frozen_before_estimator_implementation_or_response_target_semantic_access')throw new Error('browser policy drift');
          if(JSON.stringify(state.params)!==JSON.stringify(['sigma_field_mm','kappa_trail_per_s','p_lapse'])||state.candidates!==1000||state.noLapse!==1000||state.nullWins!==5||state.structuralWins!==5)throw new Error('browser policy surface drift');
          if(state.fitSeed!==4210000||state.evalSeed!==4810000||state.target!==false||state.highres!==false||state.ymaze!==false)throw new Error('browser policy firewall drift');
          const targetReq=requests.filter(u=>u.includes('poissonnier2026_pheromone_response_targets.json'));
          const yreq=requests.filter(u=>/y[_-]?maze/i.test(u));
          const estimatorReq=requests.filter(u=>/run-p2-estimation|p2_highres_authorization/.test(u));
          if(exceptions.length||consoleErrors.length||targetReq.length||yreq.length||estimatorReq.length)throw new Error('browser policy network firewall failure');
          const out={status:'passed',exceptions:exceptions.length,console_errors:consoleErrors.length,response_target_requests:targetReq.length,ymaze_requests:yreq.length,p2_estimator_surface_requests:estimatorReq.length,p2_candidates:state.candidates,no_lapse_candidates:state.noLapse,dual_survival:true,estimator_exists:false,target_semantics_authorized:false};
          fs.writeFileSync('/tmp/p2-v033l-audit/browser.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));ws.close();
          NODE
          node /tmp/p2-v033l-browser.mjs
      - name: Upload P2 response-estimation policy audit
        uses: actions/upload-artifact@v4
        with:
          name: p2-v033l-response-estimation-policy-audit
          path: /tmp/p2-v033l-audit
          retention-days: 30
