name: P4 v0.3.4i corrected validation-source design audit

on:
  push:
    branches: [v0.3.4i-p4-validation-source-design]
    paths:
      - '.github/workflows/p4-v034i-validation-source-design-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify corrected source-design scope and frozen P4 lineage
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p4_cross_apparatus_validation_source_design_v1.json)" = "740bedc5d552036c2d8adcac7529b64b2da6de0c"
          test "$(git hash-object hypotheses/p4_response_estimation_result_freeze_v1.json)" = "73f802be9dd9f21819649ab25323a9b3a92cff04"
          test "$(git hash-object hypotheses/p4_response_estimation_v1.json)" = "2d0bdfaba74ad08f8424870f37a48399428ae8b7"
          test "$(git hash-object src/p4.js)" = "bf7d5781bd69ec4568450ebbd3bdc284897b6f61"
          test "$(git hash-object models/lasius_niger_painted_trail_p4_v1.json)" = "3d8460b6916a90d06e70768f696ee3f0d48fccf4"
          test "$(git hash-object tools/p4-estimation-core.js)" = "4d985cd7258fc26eb06be75f09bdac4b92325ff0"
          test "$(git hash-object tools/run-p4-estimation.js)" = "e57b554c0ad56a0034f4f79ec8090d3e863e3d11"
          test "$(git hash-object reference/poissonnier2026_published_targets.json)" = "5836b5011d765043f94683fa761f3016e86643dc"
          test "$(git hash-object reference/poissonnier2026_inventory.json)" = "2ff7d9dcd27cf7609ce77b0f655a6520597c2432"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('reference/poissonnier2026_published_targets.json','utf8'));
          const i=JSON.parse(fs.readFileSync('reference/poissonnier2026_inventory.json','utf8'));
          if(!p.y_maze || Object.keys(p.y_maze.condition_results||{}).length!==4) throw new Error('published target Y-maze outcome surface not acknowledged');
          if(!i.experiment_2 || Object.keys(i.experiment_2.condition_counts||{}).length!==4 || !i.experiment_2.pheromone_side_counts || !i.experiment_2.overall) throw new Error('inventory Experiment 2 outcome surface not acknowledged');
          NODE
          test ! -e tools/run-p4-ymaze-consistency.js
          test ! -e reports/p4_ymaze_consistency_v1.json
          test ! -e hypotheses/p4_cross_apparatus_Y_maze_consistency_protocol_v1.json
          git diff --name-only 91d4a585a2ac96815cb5fcd6c177932b2a715652...HEAD | grep -Ev '^(.github/workflows/p4-v034i-validation-source-design-audit.yml|hypotheses/p4_cross_apparatus_validation_source_design_v1.json|tests/p4-cross-apparatus-validation-source-design.test.js|tests/run-tests.sh|docs/P4_VALIDATION.md)$' && { echo 'unexpected corrected source-design diff'; exit 1; } || true
      - name: Run corrected P4 source-design regression directly
        run: node tests/p4-cross-apparatus-validation-source-design.test.js
      - name: Run complete permanent regression suite
        run: ./tests/run-tests.sh
      - name: Confirm no Y-maze simulation or parameter change occurred
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          echo 'Corrected P4 source-design audit acknowledged pre-existing Y-maze summaries but performed no Y-maze simulation, fitting, or parameter change'
