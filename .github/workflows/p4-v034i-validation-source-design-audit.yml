# rerun after wording-robust direct regression fix
name: P4 v0.3.4i validation-source design audit

on:
  push:
    branches: [v0.3.4i-p4-validation-source-design]
    paths:
      - '.github/workflows/p4-v034i-validation-source-design-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-design scope and frozen P4 lineage
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p4_cross_apparatus_validation_source_design_v1.json)" = "c0a81bace8070d3266d8c50bd4d21e35ebd127d8"
          test "$(git hash-object hypotheses/p4_response_estimation_result_freeze_v1.json)" = "73f802be9dd9f21819649ab25323a9b3a92cff04"
          test "$(git hash-object src/p4.js)" = "bf7d5781bd69ec4568450ebbd3bdc284897b6f61"
          test "$(git hash-object models/lasius_niger_painted_trail_p4_v1.json)" = "3d8460b6916a90d06e70768f696ee3f0d48fccf4"
          test "$(git hash-object tools/p4-estimation-core.js)" = "4d985cd7258fc26eb06be75f09bdac4b92325ff0"
          test "$(git hash-object tools/run-p4-estimation.js)" = "e57b554c0ad56a0034f4f79ec8090d3e863e3d11"
          test "$(git hash-object apparatus/poissonnier2026_y_maze.json)" = "eca7a0e66aed9546e5fc26c08f7abaa37bb3cbc8"
          test "$(git hash-object experiments/neutral_y_maze.json)" = "e61793266a7716587ef11fc96e0959f86103931c"
          test "$(git hash-object scoring/y_maze_endpoint_engineering_v1.json)" = "8235e511b8ef4159671f670b944129c82f7358cb"
          test ! -e tools/run-p4-ymaze-validation.js
          test ! -e tools/run-p4-y-maze-validation.js
          test ! -e reports/p4_ymaze_validation_v1.json
          test ! -e reports/p4_y_maze_validation_v1.json
          test ! -e hypotheses/p4_cross_apparatus_Y_maze_protocol_v1.json
          node - <<'NODE'
          const fs=require('fs');
          const names=fs.readdirSync('reference');
          const y=names.filter(n=>/y[_-]?maze|maze.*target|target.*maze/i.test(n));
          if(y.length) throw new Error('Y-maze biological target unexpectedly materialized: '+y.join(','));
          NODE
          git diff --name-only 91d4a585a2ac96815cb5fcd6c177932b2a715652...HEAD | grep -Ev '^(.github/workflows/p4-v034i-validation-source-design-audit.yml|hypotheses/p4_cross_apparatus_validation_source_design_v1.json|tests/p4-cross-apparatus-validation-source-design.test.js|tests/run-tests.sh|docs/P4_VALIDATION.md)$' && { echo 'unexpected validation-design diff'; exit 1; } || true
      - name: Run P4 validation-source design regression directly
        run: node tests/p4-cross-apparatus-validation-source-design.test.js
      - name: Run complete permanent regression suite
        run: ./tests/run-tests.sh
      - name: Confirm no validation execution or outcome materialization occurred
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          echo 'P4 validation-source design audit performed no Y-maze biological access or simulation'
