name: P2 v0.3.3m estimator qualification audit
on:
  push:
    branches: [v0.3.3m-p2-estimator-qualification]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact P2 estimator chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object hypotheses/p2_response_estimation_v1.json)" = "eaa74df19f3fdc1a59dec5f0b3b2efefba3f89ce"
          test "$(git hash-object tools/run-p2-estimation.js)" = "38d66d28e94d2f532e9c8a20bd6553d6d11be8a6"
          test "$(git hash-object src/p2.js)" = "f91a2f7ede1b8119acc1fd57ac94a9718d074e15"
          test "$(git hash-object models/lasius_niger_painted_trail_p2_v1.json)" = "7d3eecc44cb2eaf727249083a6fcfa21986fd475"
          test "$(git hash-object hypotheses/p2_reachability_result_freeze_v1.json)" = "8dddaf083d4af046051fc1b7412b9f22cda8618a"
          test "$(git hash-object reports/p2_reference_free_reachability_v1.json)" = "78a5e0ac4a3dd536a0e2d06ece2e9e37cdb2aefa"
          test "$(git hash-object reference/poissonnier2026_pheromone_response_targets.json)" = "81910c5bd3ec7b1f7728c2c9f100b0e8a6db29ed"
          test ! -e hypotheses/p2_highres_authorization_v1.json
      - name: Run full H0-H5 plus P1/P2 suite
        run: ./tests/run-tests.sh
      - name: Run standalone reference-free estimator qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p2-v033m-audit
          node tools/run-p2-estimation.js --mode qualification --trials 2 --out /tmp/p2-v033m-audit/qualification.json
          node - <<'NODE'
          const q=require('/tmp/p2-v033m-audit/qualification.json');
          if(q.status!=='passed'||q.scientific_evidence!==false||q.reference_outcomes_accessed!==false||q.response_target_semantics_loaded!==false||q.response_target_hash_verified_only!==true||q.P1_official_result_semantics_loaded!==false||q.ymaze_accessed!==false)throw new Error('P2 qualification firewall/status failed');
          if(q.policy_git_blob_sha!=='eaa74df19f3fdc1a59dec5f0b3b2efefba3f89ce'||q.estimator_git_blob_sha!=='38d66d28e94d2f532e9c8a20bd6553d6d11be8a6')throw new Error('P2 qualification provenance drift');
          for(const [k,v] of Object.entries(q.checks))if(v!==true)throw new Error('P2 qualification check failed: '+k);
          console.log(JSON.stringify({status:q.status,checks:Object.keys(q.checks).length,target_semantics:q.response_target_semantics_loaded,P1_result_semantics:q.P1_official_result_semantics_loaded,ymaze:q.ymaze_accessed}));
          NODE
      - name: Prove highres rejects before semantic target access
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/p2-v033m-audit/unauthorized.json
          set +e
          node tools/run-p2-estimation.js --mode highres --out /tmp/p2-v033m-audit/unauthorized.json >/tmp/p2-v033m-highres.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "missing post-qualification authorization artifact" /tmp/p2-v033m-highres.log
          test ! -e /tmp/p2-v033m-audit/unauthorized.json
          node - <<'NODE'
          const fs=require('fs'),est=require('./tools/run-p2-estimation.js');
          const root=process.cwd(),policy=require('./hypotheses/p2_response_estimation_v1.json');
          let blocked=false;
          try{est.loadReferenceTarget(root,policy,{branchName:'main'});}catch(e){blocked=/missing post-qualification authorization artifact/.test(String(e));}
          if(!blocked)throw new Error('semantic target loader was not authorization-blocked');
          NODE
      - name: Build Node estimator-wiring parity panel
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),est=require('./tools/run-p2-estimation.js'),p2=require('./src/p2.js');
          const {loadBundle}=require('./tools/load-bundle.js'),policy=require('./hypotheses/p2_response_estimation_v1.json');
          const base=require('./models/lasius_niger_painted_trail_p2_v1.json');
          const candidates=[
            est.nullAnchor(policy),
            est.projectedNoLapseCandidate(0,policy),
            est.p2Candidate(0,policy),
            est.p2Candidate(1,policy),
            {sigma_field_mm:8,kappa_trail_per_s:4,p_lapse:1,candidate_index:9001,source:'all_lapse_endpoint'}
          ];
          const out=[];
          let seed=991100;
          for(const c of candidates){
            for(const treatment of ['dcm_control','pheromone']){
              const b=loadBundle(est.conditionExperiment(treatment),{modelId:base.id});
              b.model=est.configuredModel(base,c);b.observation.record_trajectories=false;
              const sim=new p2.Simulation(b,seed++);
              for(let i=0;i<120&&!sim.allFinished();i++)sim.step(.02);
              const a=sim.ants[0];
              out.push({candidate:c,treatment,seed:seed-1,result:{x:a.x,y:a.y,heading:a.heading,rng_state:a.rng.state,finished:a.finished,outcome:a.outcome,engaged:a.p2Engaged,response_seed:a.p2ResponseSeed,response_u:a.p2ResponseU,response_draws:a.p2ResponseDraws,steering_samples:a.p2SteeringSamples,last_omega:a.p2LastOmega}});
            }
          }
          fs.writeFileSync('/tmp/p2-v033m-audit/node-parity.json',JSON.stringify(out,null,2));
          NODE
      - name: Real Chromium estimator-wiring parity and firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/p2-v033m-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p /tmp/p2-v033m-chrome
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --user-data-dir=/tmp/p2-v033m-chrome --remote-debugging-port=9222 about:blank >/tmp/p2-v033m-chrome.log 2>&1 &
          for i in {1..100}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep .2; done
          cat >/tmp/p2-v033m-browser.mjs <<'NODE'
          import fs from 'node:fs';
          const refs=JSON.parse(fs.readFileSync('/tmp/p2-v033m-audit/node-parity.json','utf8'));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json(),target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<120;i++){if(await evalv("document.readyState==='complete'&&!!globalThis.AntLabIntegrity"))break;await new Promise(r=>setTimeout(r,50));}
          for(const src of ['./src/p1.js','./src/p2.js']){
            const expression="new Promise((resolve,reject)=>{const s=document.createElement('script');s.src="+JSON.stringify(src)+";s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})";
            await evalv(expression);
          }
          const expression="(async()=>{const refs="+JSON.stringify(refs)+",cache={};async function j(p){if(!cache[p])cache[p]=await(await fetch(p)).json();return JSON.parse(JSON.stringify(cache[p]));}async function bundle(r){const expName=r.treatment==='dcm_control'?'open_arena_p2_zero_dose_reachability.json':'open_arena_p2_nominal_dose_reachability.json';const experiment=await j('./experiments/'+expName),model=await j('./models/lasius_niger_painted_trail_p2_v1.json'),apparatus=await j('./apparatus/'+experiment.apparatus+'.json'),state=await j('./states/'+experiment.state+'.json'),observation=await j('./observations/'+experiment.observation+'.json'),scoring=await j('./scoring/'+experiment.scoring+'.json');model.painted_trail_response.field.sigma_field_mm=r.candidate.sigma_field_mm;model.painted_trail_response.steering.kappa_trail_per_s=r.candidate.kappa_trail_per_s;model.painted_trail_response.engagement.p_lapse=r.candidate.p_lapse;observation.record_trajectories=false;return{experiment,model,apparatus,state,observation,scoring};}const out=[];for(const r of refs){const b=await bundle(r),sim=new AntLabP2.Simulation(b,r.seed);for(let i=0;i<120&&!sim.allFinished();i++)sim.step(.02);const a=sim.ants[0];out.push({...r,result:{x:a.x,y:a.y,heading:a.heading,rng_state:a.rng.state,finished:a.finished,outcome:a.outcome,engaged:a.p2Engaged,response_seed:a.p2ResponseSeed,response_u:a.p2ResponseU,response_draws:a.p2ResponseDraws,steering_samples:a.p2SteeringSamples,last_omega:a.p2LastOmega}});}return out;})()";
          const browser=await evalv(expression),numeric=['x','y','heading','response_u','last_omega'],near=(a,b,t=1e-12)=>a===b||(Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<=t);
          let matched=0;
          for(let i=0;i<refs.length;i++){const a=refs[i],b=browser[i];for(const k of numeric){const x=a.result[k],y=b.result[k];if(x==null||y==null){if(x!==y)throw new Error('null mismatch '+i+' '+k);}else if(!near(x,y))throw new Error('numeric mismatch '+i+' '+k);}for(const k of ['rng_state','finished','outcome','engaged','response_seed','response_draws','steering_samples'])if(a.result[k]!==b.result[k])throw new Error('exact mismatch '+i+' '+k);matched++;}
          const targetReq=requests.filter(u=>u.includes('poissonnier2026_pheromone_response_targets.json')),yreq=requests.filter(u=>/y[_-]?maze/i.test(u)),authReq=requests.filter(u=>/p2_highres_authorization/.test(u));
          if(exceptions.length||consoleErrors.length||targetReq.length||yreq.length||authReq.length)throw new Error('browser estimator firewall failure');
          const out={status:'passed',parity_cases:matched,exceptions:exceptions.length,console_errors:consoleErrors.length,response_target_requests:targetReq.length,ymaze_requests:yreq.length,p2_authorization_requests:authReq.length};
          fs.writeFileSync('/tmp/p2-v033m-audit/browser.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));ws.close();
          NODE
          node /tmp/p2-v033m-browser.mjs
      - name: Upload P2 estimator qualification audit
        uses: actions/upload-artifact@v4
        with:
          name: p2-v033m-estimator-qualification-audit
          path: /tmp/p2-v033m-audit
          retention-days: 30
