name: H5 circular formulation stress
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  circular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm no H5 runtime implementation
        run: |
          set -euo pipefail
          if grep -R -n -E 'origin_referenced_search|rho_search|lambda_search|r_search_mm' src models experiments states apparatus scoring observations; then exit 1; fi
          node -e "const d=require('./hypotheses/h5_origin_referenced_search_v1.draft.json'); if(d.firewall.implementation_allowed_before_freeze!==false||d.firewall.parameter_search_allowed!==false) process.exit(1)"
      - name: Start local Chromium
        run: |
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..80}; do if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then break; fi; sleep .2; done
          curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json
      - name: Compare circular formulations in Chromium
        run: |
          cat >/tmp/circular.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target=tabs.find(t=>t.type==='page')||tabs[0];
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<100;i++){if(await evalv("document.readyState==='complete'&&!!AntLabCore&&!!AntLabH3&&!!AntLabIntegrity"))break;await sleep(100);}
          const report=await evalv(`(()=>{
            const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
            const drive=(L,l)=>Math.exp(-Math.max(0,L)/l);
            const radial=(r,s)=>r/(r+s);
            const weight=(L,r,l,s,rho)=>rho*drive(L,l)*radial(r,s);
            const vmKernel=(x,mu,k)=>Math.exp(k*Math.cos(x-mu));
            const mixtureDensity=(newHeading,theta,phi,w,kBase,kSearch)=>(1-w)*vmKernel(newHeading,theta,kBase)+w*vmKernel(newHeading,phi,kSearch);
            const vectorMean=(theta,phi,w)=>Math.atan2((1-w)*Math.sin(theta)+w*Math.sin(phi),(1-w)*Math.cos(theta)+w*Math.cos(phi));
            const signedShift=(theta,phi,w)=>wrap(theta+w*wrap(phi-theta));
            const approx=(a,b,t=1e-10)=>Math.abs(a-b)<=t*Math.max(1,Math.abs(a),Math.abs(b));
            const lambda=500,scale=50,rho=.75,Ls=200,Ll=1000,r=100;
            const ws=weight(Ls,r,lambda,scale,rho),wl=weight(Ll,r,lambda,scale,rho);
            if(!(ws>wl&&ws>0&&ws<1&&wl>0&&wl<1))throw new Error('weight ordering/range');
            const theta=0,phi=Math.PI,eps=1e-9;
            const signedPlus=signedShift(theta+eps,phi,ws),signedMinus=signedShift(theta-eps,phi,ws);
            const signedJump=Math.abs(wrap(signedPlus-signedMinus));
            const vectorBelow=vectorMean(theta,phi,.5-1e-9),vectorAt=vectorMean(theta,phi,.5),vectorAbove=vectorMean(theta,phi,.5+1e-9);
            const vectorJump=Math.abs(wrap(vectorAbove-vectorBelow));
            const kBase=2,kSearch=2;
            let maxReflectionError=0,maxBranchError=0,maxRotationError=0;
            for(let i=0;i<=720;i++){
              const h=-Math.PI+i*(2*Math.PI/720);
              const f1=mixtureDensity(h,theta,phi,ws,kBase,kSearch);
              const f2=mixtureDensity(-h,theta,phi,ws,kBase,kSearch);
              maxReflectionError=Math.max(maxReflectionError,Math.abs(f1-f2));
              const phiA=Math.PI-1e-10,phiB=-Math.PI+1e-10;
              const a=mixtureDensity(h,theta,phiA,ws,kBase,kSearch),b=mixtureDensity(h,theta,phiB,ws,kBase,kSearch);
              maxBranchError=Math.max(maxBranchError,Math.abs(a-b));
              const rot=.731;
              const c=mixtureDensity(wrap(h+rot),wrap(theta+rot),wrap(phi+rot),ws,kBase,kSearch);
              maxRotationError=Math.max(maxRotationError,Math.abs(f1-c));
            }
            if(maxReflectionError>1e-10)throw new Error('mixture reflection symmetry failure '+maxReflectionError);
            if(maxBranchError>1e-8)throw new Error('mixture branch continuity failure '+maxBranchError);
            if(maxRotationError>1e-10)throw new Error('mixture rotation failure '+maxRotationError);
            let maxNullError=0;
            for(let i=0;i<=360;i++){const h=-Math.PI+i*(2*Math.PI/360);maxNullError=Math.max(maxNullError,Math.abs(mixtureDensity(h,.42,-2.1,0,2,5)-vmKernel(h,.42,2)));}
            if(maxNullError!==0)throw new Error('mixture null not exact');
            const origin={x:80,y:60},p={x:130,y:80};
            const geometry=(O,P)=>{const dx=O.x-P.x,dy=O.y-P.y;return {r:Math.hypot(dx,dy),phi:Math.atan2(dy,dx)};};
            const g=geometry(origin,p),gt=geometry({x:180,y:10},{x:230,y:30});
            if(!approx(g.r,gt.r)||!approx(g.phi,gt.phi))throw new Error('translation geometry failure');
            const atOriginW=weight(200,0,lambda,scale,rho);if(atOriginW!==0)throw new Error('origin gate failure');
            const coreRng=new AntLabCore.RNG(AntLabIntegrity.streamSeed(424242,'biology_h3_turn_angle:0'));
            const stateBefore=coreRng.state;
            const baselineDraws=[];for(let i=0;i<20;i++)baselineDraws.push(AntLabH3.sampleVonMises(coreRng,2));const stateAfterBaseline=coreRng.state;
            const coreRng2=new AntLabCore.RNG(AntLabIntegrity.streamSeed(424242,'biology_h3_turn_angle:0'));
            const h5Choice=new AntLabCore.RNG(AntLabIntegrity.streamSeed(424242,'biology_h5_search_choice:0'));
            const h5Angle=new AntLabCore.RNG(AntLabIntegrity.streamSeed(424242,'biology_h5_search_angle:0'));
            const baselineDrawsWithH5=[];for(let i=0;i<20;i++){baselineDrawsWithH5.push(AntLabH3.sampleVonMises(coreRng2,2));h5Choice.next();AntLabH3.sampleVonMises(h5Angle,2);}
            if(JSON.stringify(baselineDraws)!==JSON.stringify(baselineDrawsWithH5)||coreRng2.state!==stateAfterBaseline)throw new Error('dedicated H5 streams perturb H3 angle stream');
            const choiceNull=new AntLabCore.RNG(AntLabIntegrity.streamSeed(9988,'biology_h5_search_choice:0'));
            const choiceCtx=new AntLabCore.RNG(AntLabIntegrity.streamSeed(9988,'biology_h5_search_choice:0'));
            const choices=[];for(let i=0;i<30;i++){const u0=choiceNull.next(),u1=choiceCtx.next();if(u0!==u1)throw new Error('choice CRN mismatch');choices.push(u0);}
            return {status:'passed',weights:{short:ws,long:wl,ratio:ws/wl},signed_mean_shift:{antipodal_jump_rad:signedJump,problem:true},vector_blend:{below_half:vectorBelow,at_half:vectorAt,above_half:vectorAbove,jump_rad:vectorJump,near_cancellation_problem:true},mixture:{reflection_error:maxReflectionError,branch_cut_error:maxBranchError,rotation_error:maxRotationError,null_error:maxNullError,translation_invariant:true,origin_gate_zero:true,antipodal_distribution_symmetric:true},rng_design:{h3_angle_state_before:stateBefore,h3_angle_state_after:stateAfterBaseline,dedicated_h5_streams_do_not_perturb_h3:true,matched_choice_stream:true,choice_preview:choices.slice(0,5)}};
          })()`);
          const yreq=requests.filter(u=>/y[_-]?maze|ymaze/i.test(u));if(exceptions.length)throw new Error('browser exceptions');if(consoleErrors.length)throw new Error('console errors');if(yreq.length)throw new Error('Y-maze requests');report.browser={exceptions:0,console_errors:0,ymaze_requests:0};
          fs.writeFileSync('/tmp/h5-circular-stress.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/circular.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: h5-circular-formulation-stress
          path: |
            /tmp/h5-circular-stress.json
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
