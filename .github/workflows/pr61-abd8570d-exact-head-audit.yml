name: PR61 exact-head audit abd8570d
on:
  push:
    branches:
      - audit/pr61-abd8570d-exact-head
permissions:
  contents: read
jobs:
  exact-head-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: abd8570d327cb8ef96ab9135b16b94e16e00db18
          fetch-depth: 0
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "abd8570d327cb8ef96ab9135b16b94e16e00db18"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full ANTLAB suite
        run: bash tests/run-tests.sh
