name: H5 synthetic qualification
on:
  push:
    branches: [h5-origin-referenced-search-v1]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression gate
        run: |
          set -euo pipefail
          node --check src/h3.js
          node --check src/h5.js
          node --check src/integrity.js
          node --check tools/run-h5-estimation.js
          node --check tools/run-h5-synthetic-qualification.js
          node tests/h5-origin-search.test.js
          node tests/h5-estimator-contract.test.js
          for f in tests/boundary-timing.test.js tests/determinism.test.js tests/experiment-definition.test.js tests/h3-reorientation.test.js tests/integrity-firewall.test.js tests/measurement-geometry-policy.test.js tests/measurement.test.js tests/open-arena-protocol.test.js tests/rng-streams.test.js tests/state-integrity.test.js; do node "$f"; done
      - name: Node synthetic qualification
        run: |
          set -euo pipefail
          node tools/run-h5-synthetic-qualification.js --out=/tmp/h5-synthetic-node.json
          node - <<'NODE'
          const q=require('/tmp/h5-synthetic-node.json');
          if(q.reference_outcomes_used!==false||q.reference_target_file_loaded!==false||q.ymaze_accessed!==false)throw new Error('qualification firewall');
          if(!(q.active_search_selections>0))throw new Error('H5 persistent branch not reached');
          if(!(q.event_prefix_comparisons>0))throw new Error('event invariance not exercised');
          NODE
      - name: Reference search remains blocked
        run: |
          set -euo pipefail
          if node tools/run-h5-estimation.js --mode=loco >/tmp/h5-blocked.out 2>/tmp/h5-blocked.err; then
            echo "Reference LOCO search unexpectedly authorized before permanent qualification record" >&2
            exit 1
          fi
          grep -q "synthetic qualification record is missing" /tmp/h5-blocked.err
      - name: Start Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..100}; do if curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null; then exit 0; fi; sleep .2; done
          cat /tmp/chrome.log || true
          exit 1
      - name: Chromium H5 synthetic qualification
        run: |
          set -euo pipefail
          cat >/tmp/h5-browser-qualification.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target=tabs.find(t=>t.type==='page')||tabs[0],ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej;});
          let id=0;const pending=new Map(),exceptions=[],consoleErrors=[],requests=[];
          ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);}if(m.method==='Runtime.exceptionThrown')exceptions.push(m.params);if(m.method==='Runtime.consoleAPICalled'&&m.params.type==='error')consoleErrors.push(m.params);if(m.method==='Network.requestWillBeSent')requests.push(m.params.request.url);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evalv=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'eval failed');return r.result.value;};
          await send('Runtime.enable');await send('Network.enable');await send('Page.enable');await send('Page.navigate',{url:'http://127.0.0.1:8080/'});
          for(let i=0;i<160;i++){if(await evalv("document.readyState==='complete'&&!!AntLabIntegrity&&!!AntLabH5&&!!AntLabH3&&!!AntLabCore"))break;await sleep(100);}
          const report=await evalv(`(async()=>{
            const j=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json();},clone=x=>JSON.parse(JSON.stringify(x));
            const model0=await j('./models/lasius_niger_locomotion_h5_v1.json');
            const app0=await j('./apparatus/poissonnier2026_open_arena.json');
            const short0=await j('./experiments/open_arena_short_control.json');
            const long0=await j('./experiments/open_arena_long_control.json');
            const state0=await j('./states/naive_outbound_v1.json');
            const obs0=await j('./observations/poissonnier2026_tracking_25fps.json');
            const scoring0=await j('./scoring/open_arena_first_border_v1.json');
            const geometry=await j('./reference/poissonnier2026_open_arena_measurement_geometry_v1.json');
            const policy=await j('./hypotheses/h5_parameter_estimation_v1.json');
            const halton=(index,base)=>{let f=1,r=0,i=index;while(i>0){f/=base;r+=f*(i%base);i=Math.floor(i/base);}return r;};
            let mappingBad=0,minK=Infinity,maxK=-Infinity;
            for(let i=1;i<=500;i++){const k=halton(i,3)*20;minK=Math.min(minK,k);maxK=Math.max(maxK,k);if(i<=498){const a=halton(i,7),b=halton(i,11);if(Math.min(a,b)>Math.max(a,b))mappingBad++;}}
            if(mappingBad||minK!==policy.search_protocol.safe_kappa_support.frozen_500_point_halton_min||maxK!==policy.search_protocol.safe_kappa_support.frozen_500_point_halton_max)throw new Error('Halton mapping mismatch');

            const make=(exp0,row,a200,a1000,seed)=>{
              const exp=clone(exp0),app=clone(app0),obs=clone(obs0),model=clone(model0),state=clone(state0),scoring=clone(scoring0);
              exp.model=model.id;model.origin_search.history_response.alpha_search_200=a200;model.origin_search.history_response.alpha_search_1000=a1000;
              app.world.width=row.arena_width_mm;app.world.height=row.arena_height_mm;const rect=app.geometry.primitives.find(p=>p.type==='rect');rect.x=0;rect.y=0;rect.width=row.arena_width_mm;rect.height=row.arena_height_mm;
              app.entry_points.default={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};app.entry_points.center={x:row.first_track_x_mm,y:row.first_track_y_mm,heading_rad:0};
              exp.protocol.entry_state={heading_rad:0,position_jitter_mm:0,heading_jitter_rad:0};obs.metric_definitions.central_zone_fraction.center_y_mm=row.entry_reference_y_mm;obs.metric_definitions.central_zone_fraction.half_width_mm=10;
              return new AntLabIntegrity.Simulation({experiment:exp,model,apparatus:app,state,observation:obs,scoring},seed);
            };
            const sig=sim=>JSON.stringify({x:sim.ants[0].x,y:sim.ants[0].y,heading:sim.ants[0].heading,d:sim.ants[0].distanceTravelled,events:sim.events.filter(e=>e.type==='h3_reorientation').map(e=>[e.time,e.angle_rad,e.x,e.y])});
            const colonies=[0,7,16,20,21,27];let anchorPairs=0,anchorMismatch=0,commonNeutralMismatch=0,heldoutLeaks=0,eventComparisons=0,activeSelections=0,cadenceMismatch=0;
            for(let fi=0;fi<colonies.length;fi++){
              const held=colonies[fi],pool=geometry.rows.filter(r=>r.colony!==held).sort((a,b)=>a.ant_id-b.ant_id);if(pool.some(r=>r.colony===held))heldoutLeaks++;
              for(let t=0;t<3;t++){
                const seed=760000+fi*1000+t,gr=new AntLabCore.RNG(AntLabIntegrity.streamSeed(seed,'poissonnier2026_measurement_geometry_v1')),row=pool[Math.min(pool.length-1,Math.floor(gr.next()*pool.length))];
                const n=make(short0,row,0,0,seed),cn=make(short0,row,0,0,seed);n.runFor(5,.02);cn.runFor(5,.02);anchorPairs++;if(sig(n)!==sig(cn))anchorMismatch++;
                const cs=make(short0,row,.45,.45,seed),cl=make(long0,row,.45,.45,seed);cs.runFor(5,.02);cl.runFor(5,.02);if(sig(cs)!==sig(cl))commonNeutralMismatch++;
                if(cs.ants[0].h5ChoiceDrawCount!==cs.ants[0].h3TurnCount||cs.ants[0].h5AngleDrawCount!==cs.ants[0].h3TurnCount)cadenceMismatch++;
              }
            }
            // Reachability/event timing in a large synthetic arena with R=0.5.
            for(let s=0;s<20;s++){
              const seed=900000+s,exp=clone(short0),app=clone(app0),obs=clone(obs0),state=clone(state0),scoring=clone(scoring0),ma=clone(model0),mn=clone(model0);
              exp.model=ma.id;exp.duration_s=6;exp.protocol.state_facts.recent_constrained_travel_mm=200;exp.protocol.entry_state={heading_rad:0,position_jitter_mm:0,heading_jitter_rad:0};
              app.world={width:100000,height:100000};app.geometry={primitives:[{type:'rect',name:'a4_arena',x:0,y:0,width:100000,height:100000}]};app.entry_points={default:{x:75000,y:50000,heading_rad:0},center:{x:75000,y:50000,heading_rad:0}};
              ma.origin_search.history_response.alpha_search_200=1;ma.origin_search.history_response.alpha_search_1000=1;mn.origin_search.history_response.alpha_search_200=0;mn.origin_search.history_response.alpha_search_1000=0;ma.reorientation_gate.baseline.mean_free_path_mm=18;mn.reorientation_gate.baseline.mean_free_path_mm=18;
              Object.assign(ma.movement,{base_speed_mm_s:20,speed_sd_mm_s:0,speed_reversion_rate_s:0,speed_noise_sigma_sqrt_s:0,pause_rate_s:0});mn.movement=clone(ma.movement);
              const a=new AntLabIntegrity.Simulation({experiment:clone(exp),model:ma,apparatus:clone(app),state:clone(state),observation:clone(obs),scoring:clone(scoring)},seed);
              const n=new AntLabIntegrity.Simulation({experiment:clone(exp),model:mn,apparatus:clone(app),state:clone(state),observation:clone(obs),scoring:clone(scoring)},seed);
              a.runFor(6,.02);n.runFor(6,.02);const ae=a.events.filter(e=>e.type==='h3_reorientation'),ne=n.events.filter(e=>e.type==='h3_reorientation');if(ae.length!==ne.length)throw new Error('event count mismatch');
              for(let i=0;i<ae.length;i++){eventComparisons++;if(Math.abs(ae[i].time-ne[i].time)>1e-10||Math.abs(ae[i].angle_rad-ne[i].angle_rad)>1e-12)throw new Error('event/baseline angle changed');}
              activeSelections+=a.ants[0].h5SearchSelections;if(a.ants[0].h5ChoiceDrawCount!==a.ants[0].h3TurnCount||a.ants[0].h5AngleDrawCount!==a.ants[0].h3TurnCount)cadenceMismatch++;
            }
            if(anchorMismatch||commonNeutralMismatch||heldoutLeaks||cadenceMismatch||!(activeSelections>0))throw new Error('H5 browser qualification contract failure');
            let unsupported=false;try{AntLabH5.historyAmplitude(600,AntLabH5.originSearchConfig(model0));}catch(e){unsupported=true;}if(!unsupported)throw new Error('unsupported history accepted');
            return{status:'passed',halton:{min_kappa:minK,max_kappa:maxK,history_points:498},anchor_pairs:anchorPairs,anchor_mismatches:anchorMismatch,common_neutral_mismatches:commonNeutralMismatch,heldout_geometry_leaks:heldoutLeaks,event_prefix_comparisons:eventComparisons,active_search_selections:activeSelections,cadence_mismatches:cadenceMismatch,unsupported_L600_rejected:unsupported};
          })()`);
          const forbidden=requests.filter(u=>/neutral_y_maze|\/y_maze|\/y-maze/i.test(u));
          if(exceptions.length||consoleErrors.length||forbidden.length)throw new Error('browser firewall failure');
          report.browser={exceptions:0,console_errors:0,ymaze_requests:0};
          fs.writeFileSync('/tmp/h5-synthetic-browser.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));ws.close();
          NODE
          node /tmp/h5-browser-qualification.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: h5-synthetic-qualification
          path: |
            /tmp/h5-synthetic-node.json
            /tmp/h5-synthetic-browser.json
            /tmp/h5-blocked.err
            /tmp/chrome-version.json
            /tmp/chrome.log
          retention-days: 14
