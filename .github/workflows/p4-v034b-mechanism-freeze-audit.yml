name: P4 v0.3.4b mechanism-freeze audit

on:
  push:
    branches:
      - v0.3.4b-p4-mechanism-freeze
    paths:
      - .github/workflows/p4-v034b-mechanism-freeze-audit.yml

permissions:
  contents: read

concurrency:
  group: p4-v034b-mechanism-freeze-audit
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact mechanism freeze and pre-implementation scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4a0a007b080039848dc2d3453afb033921460de5 HEAD
          test "$(git hash-object hypotheses/p4_painted_trail_candidate_class_evidence_v1.json)" = "262f332062f271bbf111d0572f83b2faaf2cfd74"
          test "$(git hash-object hypotheses/p4_painted_trail_candidate_class_decision_v1.json)" = "ad7295ba6d466549c60c8ecac37e39d30006ec1c"
          test "$(git hash-object hypotheses/p4_painted_trail_mechanism_v1.json)" = "609551836e540c341365db9cc987d2ca340cc053"
          test "$(git hash-object hypotheses/p1_response_estimation_result_freeze_v1.json)" = "1d99ebfaa378aeb1b98963f63b3a513a616a6617"
          test "$(git hash-object hypotheses/p2_response_estimation_result_freeze_v1.json)" = "088316e1746594f9b3f700cb277a83eb53fdd9f6"
          test "$(git hash-object hypotheses/p3_response_estimation_result_freeze_v1.json)" = "aa69afda6d80cc9d4ea0b563470cffdf0762b941"

          git diff --name-only 4a0a007b080039848dc2d3453afb033921460de5...HEAD | tee /tmp/p4-mechanism-changed.txt
          test "$(grep -Ec '^(src/|models/|experiments/|apparatus/|reference/|reports/|tools/)' /tmp/p4-mechanism-changed.txt || true)" = "0"
          test "$(grep -Ec '^hypotheses/(p1_|p2_|p3_)' /tmp/p4-mechanism-changed.txt || true)" = "0"

          test ! -e src/p4.js
          test ! -e models/lasius_niger_painted_trail_p4_v1.json
          test ! -e hypotheses/p4_response_estimation_v1.json
          test ! -e hypotheses/p4_implementation_authorization_v1.json
          test ! -e hypotheses/p4_reachability_execution_v1.json
          test ! -e tools/run-p4-reachability.js
          test ! -e tools/run-p4-estimation.js

      - name: Verify frozen mechanism algebra and engineering panel
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('hypotheses/p4_painted_trail_mechanism_v1.json','utf8'));
          const W=(L,R,t)=>L+R<=t?0:(R-L)/(R+L);
          if(W(.10,.15,.25)!==0) throw new Error('threshold equality drift');
          if(!(W(.10,.16,.25)>0)) throw new Error('above-threshold rightward sign drift');
          if(W(.4,.4,.25)!==0) throw new Error('equal signal drift');
          if(Math.abs(W(.1,.4,.25)+W(.4,.1,.25))>1e-15) throw new Error('antisymmetry drift');
          if(Math.abs(W(.2,.6,.25)-W(.4,1.2,.25))>1e-15) throw new Error('conditional scale invariance drift');
          if(W(.02,.08,.25)!==0 || W(.08,.32,.25)===0) throw new Error('threshold crossing drift');
          if(!(2*.10<m.engineering_only_reachability_values.theta_detect)) throw new Error('global low-dose guarantee lost');
          if(m.mechanism.directional_transduction.global_positive_scale_invariance!==false) throw new Error('P3 scale invariance accidentally restored');
          if(m.mechanism.stochastic_structure.response_rng_present!==false) throw new Error('response RNG added');
          if(m.implementation_gate.implementation_authorized_by_this_record!==false) throw new Error('implementation prematurely authorized');
          if(m.estimation_firewall.response_target_semantic_access_authorized!==false) throw new Error('target prematurely unlocked');
          if(m.global_firewall.reserved_Y_maze_access!==false) throw new Error('Y-maze prematurely unlocked');
          console.log(JSON.stringify({status:'passed',subclass:m.selection_rule.selected_subclass,theta_engineering:m.engineering_only_reachability_values.theta_detect,global_scale_invariance:false,response_rng:false,implementation_authorized:false}));
          NODE

      - name: Run P4 mechanism-freeze regression directly
        run: node tests/p4-mechanism-selection.test.js

      - name: Run permanent regression suite
        run: ./tests/run-tests.sh
